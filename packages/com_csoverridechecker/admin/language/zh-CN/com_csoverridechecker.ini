COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="本站没有任何已启用的模板拥有 <code>html/</code> 覆盖文件夹，因此没有可重置的内容。请添加一个覆盖（或启用一个含有覆盖的模板）后再打开此对话框。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SELECT_ALL="全选模板"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_OVERRIDE_COUNT="当前已跟踪 %d 行"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SUBMIT="重置所选"
COM_CSOVERRIDECHECKER_RESCAN_NO_VALID_TEMPLATES="未能识别所选的任何模板。请重新打开对话框并从列表中选择一个模板。"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_TITLE="将此备份还原到 %s 上"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="将保存的备份还原到位于 %s 的实时文件上？当前文件内容会先被保存为一份新备份，因此本次还原本身也是可逆的。"
COM_CSOVERRIDECHECKER_FILTER_OPTIONS="筛选选项"
COM_CSOVERRIDECHECKER_FILTER_NO_MATCHES="没有结果符合这些筛选条件。使用&ldquo;清除&rdquo;查看全部内容。"
COM_CSOVERRIDECHECKER_FILTER_ANY_ACTION="— 任意操作 —"
COM_CSOVERRIDECHECKER_FILTER_ANY_SESSION="— 任意会话 —"
COM_CSOVERRIDECHECKER_FILTER_SESSION_PLACEHOLDER="会话 id（或 'none'）"
COM_CSOVERRIDECHECKER_TOOLBAR_DASHBOARD="仪表板"
COM_CSOVERRIDECHECKER_TOOLBAR_SETUPGUIDE="设置指南"
COM_CSOVERRIDECHECKER_TOOLBAR_SUPPORT="获取帮助"
COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — 设置指南"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="使用您已有的任意 AI"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="本扩展不绑定任何一家 AI。它暴露的一切都是由标准 Joomla API 令牌保护的普通 REST API，因此任何能够发起网络请求的助手都可以运行审查 &mdash; 您自己编写的脚本同样可以。本页介绍各种选项之间的实际差异，方便您挑选其一并着手使用。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="您的助手实际需要具备哪些能力"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="与其罗列哪些产品可用 &mdash; 套餐和功能一直在变 &mdash; 不如说明真正的要求。您的助手必须能够："
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>向本站点发起出站 HTTPS 请求</strong>，并发送一个自定义请求头（<code>X-Joomla-Token</code>）。这是唯一的硬性要求。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>发送带 JSON 主体的 POST 请求</strong>，前提是您希望它应用修复而不仅仅是报告。只读审查只需要 GET。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>进行相当长的对话</strong>，因为它在得出结论之前会为每个被标记的覆盖获取两个文件。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="不确定您的助手是否合格？直接粘贴提示词试一试即可。无法访问您站点的助手会立刻说明情况，而不会悄无声息地失败。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="尚未保存 Joomla API 令牌。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="无论您选择哪个助手，它都需要一个 Joomla API 令牌才能读取您的覆盖文件。请在<em>系统 &rarr; 管理 &rarr; 用户 &rarr; 您的用户 &rarr; Joomla API 令牌</em>处生成一个，然后每次将它粘贴到提示词中，或保存在这里让提示词自动填入。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="推荐"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="最常见"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="多站点首选"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="可用，但有注意事项"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="进阶"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="终端与编辑器代理"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="例如：Claude Code、Codex CLI、Cursor、GitHub Copilot 代理模式、Aider、Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="最顺畅的选择，如果您手头有的话，我们会推荐这种方式。它们运行在您自己的机器上，拥有不受限制的出站网络访问、没有沙箱允许列表、也没有浏览器请求超时，因此一次长时间的审查可以从头跑到尾而无需照看。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="从仪表板复制扫描提示词。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="将其粘贴到您的代理中并发送。无需任何配置。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="报告出现后，在同一个会话中回复，指明您希望修复的发现项编号。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="浏览器聊天助手"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="例如：ChatGPT、Claude.ai、Google Gemini、Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="只要您使用的账户和模式确实能够访问互联网，这些都可以使用。这是最常见的配置，对于普通站点完全够用。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="确认该对话已开启联网访问或浏览功能。某些套餐和某些模式只会凭记忆作答。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="从仪表板粘贴扫描提示词并发送。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="如果您的站点有大量覆盖，请让它分批处理，以免单次回复超出浏览器的请求超时。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>当心自信的臆测。</strong>如果助手在从未引用过真实文件内容的情况下就开始给出发现项，说明它无法访问您的站点，那些内容是编造的。请停下来检查它的连通性，而不要相信这份报告。<strong>Claude.ai 用户特别注意：</strong>如果它回复&ldquo;Host not in allowlist&rdquo;，请在<em>设置 &rarr; 功能 &rarr; 代码执行 &rarr; 网络访问</em>下添加本站点的域名，然后开启一个新对话 &mdash; 正在进行的对话仍使用旧的允许列表。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="自定义 GPT、Gem 及其他可配置助手"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="例如：带 Actions 的自定义 GPT、Gemini Gem，或任何允许您注册自有 API 的助手"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="如果您的平台允许您定义带有自有 API 操作的助手，只需注册一次下方的端点，即可完全省去复制粘贴这一步。如果您要照看多个 Joomla 站点，这是最整洁的选择，因为助手会在多次对话之间记住这套配置。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="创建一个新的自定义助手，并添加一个指向本页下方所示端点 URL 的 API 操作。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="将身份验证请求头名称设为 <code>X-Joomla-Token</code>，并将您的 Joomla API 令牌粘贴为它的值。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="把仪表板上的扫描提示词粘贴到助手的指令中，让它了解分类规则和报告格式。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="本地与自托管模型"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="例如：Ollama、LM Studio、llama.cpp，或任何支持工具调用的自托管模型"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="任何具备工具调用和网络访问能力的方案在机制上都能工作，而且没有任何内容离开您自己的基础设施，某些站点会更偏好这一点。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="启用工具或函数调用，并确认模型能通过 HTTPS 访问本站点。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="将扫描提示词粘贴为系统提示词，然后让它开始。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>请正视模型规模。</strong>审查一个覆盖是判断任务，而不是查表。小型本地模型很乐意产出一份报告，但它更有可能漏掉真正的安全退化，或者凭空造出一个并不存在的问题。请把小模型给出的发现项当作初筛，而不是定论。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP 客户端"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="任何支持 Model Context Protocol 的助手"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="如果您的助手支持 MCP，请安装 <strong>MCP for J</strong> 及其免费附加组件 <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>。助手随后会使用自己的工具检查和修复覆盖文件，无需复制粘贴。对于支持 MCP 连接器的浏览器聊天，这也是更好的方式，因为它可以避开浏览器请求超时。两者都是独立的免费扩展。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="方法 2 是唯一的例外"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="仪表板上的<em>运行自动扫描</em>按钮会在服务器端完成整个审查，无需复制粘贴。在<em>选项</em>中选择您的提供商并保存该提供商的 API 密钥 &mdash; <strong>Anthropic、OpenAI 和 Google Gemini 都可以运行扫描</strong>。目前唯一仍仅支持 Anthropic 的是会话上的后续聊天，也就是您让它应用修复、它通过工具调用编辑文件的地方；那个循环是针对 Anthropic 的工具调用协议编写的。选择 OpenAI 或 Gemini 时，您仍能获得完整报告，并可使用方法 1 中适用于任何 AI 的复制粘贴提示词自行应用修复。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="已保存 %s 密钥 &mdash; 方法 2 可用"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="未保存 AI 提供商的 API 密钥 &mdash; 方法 1 仍然可用"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="端点与身份验证"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="管理界面所做的一切都可以在这个基础 URL 上使用。注册自定义助手时，或编写您自己的脚本或代理时，都可以使用它。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla 在这些路由上不接受 <code>Authorization: Bearer</code>。</strong>您必须在 <code>X-Joomla-Token</code> 请求头中发送令牌。Bearer 格式的请求头会返回 401 Forbidden。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="完整文档"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="完整的端点参考、报告格式、故障排查与常见问题。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="阅读文档"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — 获取帮助"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="本扩展是免费的，而且会一直免费"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="没有 Pro 版本，没有许可证密钥，也没有被保留的功能。本扩展能做的一切都摆在您面前。我们仍然非常希望听到您的声音 &mdash; 来自真实站点的反馈塑造了至今为止的每一个版本。"
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="可以期待什么。"
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt 是一家小公司，本扩展是免费赠送的，因此免费支持只能在客户工作之余视时间情况提供。这是实实在在的限制，而不是敷衍 &mdash; 我们宁愿直说，也不愿让您苦等一个我们无法兑现的承诺。Bug 报告我们会看；开放式的配置咨询则未必顾得上。"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="该发到哪里"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Bug 报告、令人困惑的措辞、AI 判断错误的发现项、本扩展不适配的工作流程，或行为异常的助手 &mdash; 这些都很有用。"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="在 GitHub 上报告问题"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="阅读文档"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues 是提交任何可复现问题的最佳去处，因为它是公开的 &mdash; 下一个遇到同样问题的人可以直接找到答案，而不必再问一遍。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="需要提供哪些信息"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="如果您帮我们省去诊断这一步，就能更快得到答复："
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="本页的<strong>诊断信息块</strong>（它把您的 Joomla、PHP 和扩展版本集中在一次粘贴中）。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="您使用的是<strong>哪种方法</strong> &mdash; 复制粘贴提示词、自动扫描，还是您自己的代码 &mdash; 以及<strong>哪个 AI 助手</strong>。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="您<strong>预期</strong>发生什么，以及<strong>实际</strong>发生了什么。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="如果 AI 判断错了某个发现项，请附上<strong>已保存的会话报告</strong> &mdash; 在会话页面使用<em>下载报告</em>。这能让我们看到确切的发现项和推理过程。"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="也欢迎提出想法"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="如果本扩展差一点就能满足您的需求，请告诉我们。有好几项功能之所以能发布，正是因为有人描述了我们此前没想到的工作流程。"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="诊断"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="请把这些内容复制到您的报告中，省得我们再来询问。"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="复制诊断信息"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="此信息块不包含任何机密内容。它只记录密钥或令牌是否已保存，绝不记录其值。"
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="{seconds} 秒后显示"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="按住显示的延迟（秒）"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="本扩展中显示的密钥和令牌默认是模糊的，以免屏幕共享、录屏或旁人瞥见时泄露。将指针在模糊的值上悬停这么多秒，它就会显示出来；倒计时会提示您计时器正在运行。移开指针则取消。默认 <strong>3</strong>。设为 <strong>0</strong> 表示悬停即刻显示，这会失去防止指针仅仅划过该值时暴露内容的保护。"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="显示后自动隐藏（秒）"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="值一旦显示出来，即使指针仍停留其上，也会在这么多秒后重新模糊。这可以应对您瞥了一眼密钥随后被打断、导致它暴露在无人看管的屏幕上的情况。默认 <strong>8</strong>。设为 <strong>0</strong> 表示在您移开指针之前一直保持可见。"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="AI 提供商"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="内置的<em>运行自动扫描</em>按钮调用哪个 AI 服务。无论您选择哪一个，都要提供您自己的密钥，且它仅从本站点使用。此设置<strong>不会</strong>影响复制粘贴提示词的工作流 &mdash; 那种方式适用于任何 AI，完全不需要密钥。"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic（Claude）"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI（GPT）"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google（Gemini）"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>三家提供商都可以运行扫描。</strong>会话上的后续聊天 &mdash; 也就是您让它应用修复、它通过工具调用编辑文件的地方 &mdash; 目前<strong>仅支持 Anthropic</strong>，因为那个循环是针对 Anthropic 的工具调用协议编写的。选择 OpenAI 或 Gemini 时，您仍然能获得完整报告；若想让它替您应用修复，请把此项切换为 Anthropic，或使用适用于任何 AI 的复制粘贴提示词工作流。"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="OpenAI API 密钥"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="您的个人 OpenAI API 密钥（以 <code>sk-</code> 开头）。可在 <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a> 获取。该密钥存储在本服务器上，仅用于代您调用 api.openai.com。"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Google Gemini API 密钥"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="您的个人 Google AI Studio API 密钥。可在 <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a> 获取。该密钥存储在本服务器上，仅用于代您调用 Gemini API。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — 最强大，默认。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — 更快更便宜。适用于低风险扫描。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — 最强大，默认。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — 更快更便宜。适用于低风险扫描。"
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="未为 %s 保存 API 密钥。请在&ldquo;选项&rdquo;中添加一个，或切换提供商。"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="您没有获取 API 令牌的权限。此操作需要 Override Checker 的写入权限。"
