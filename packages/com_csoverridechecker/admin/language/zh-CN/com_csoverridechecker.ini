COM_CSOVERRIDECHECKER="Override Checker"
COM_CSOVERRIDECHECKER_CONFIGURATION="Override Checker：选项"
COM_CSOVERRIDECHECKER_XML_DESCRIPTION="模板感知的 Joomla 完整性监控工具。通过 Joomla Web Services API 暴露原生的 #__template_overrides 跟踪器，让任何 AI 助手（或其他持有 Joomla API 令牌的客户端）都可以审查每个被标记的覆盖，将其分类为警报 / 审查 / 信息，并就地应用补丁——自动备份，可在管理后台撤销。"

COM_CSOVERRIDECHECKER_DISCLAIMER_TITLE="开始之前"
COM_CSOVERRIDECHECKER_DISCLAIMER_BODY="<p><strong>请确保您拥有近期的网站备份</strong>，再让本扩展进行任何更改。我们强烈推荐 Akeeba Backup 或您的主机自带的备份功能。</p><p><strong>本扩展的功能：</strong>它将您的 Joomla 站点与您选择的 AI 助手配对，审查每个被标记的模板覆盖，将其分类为安全警报、外观差异或合理的自定义，并应用您确认的补丁。每个补丁在应用前都会自动备份到数据库，因此单项更改是可还原的——但完整站点备份仍是您应对其他情况的安全网。</p><p><strong>AI 也会出错。</strong>AI 可能会错误分类，或提出会破坏功能的补丁。在说&ldquo;是的，应用它&rdquo;之前，请务必阅读它提议的内容，并在修复后测试站点。</p><p><strong>不确定？</strong>如果您对使用本工具不放心，请通过 <a href=\"mailto:tim@cybersalt.com\">tim@cybersalt.com</a> 给 Tim 发邮件——我们可以指导您操作，或代您完成审查。</p>"
COM_CSOVERRIDECHECKER_DISCLAIMER_DONT_SHOW_AGAIN="不再显示"
COM_CSOVERRIDECHECKER_DISCLAIMER_CONFIRM_BUTTON="我明白了——继续"

COM_CSOVERRIDECHECKER_RUN_SCAN_RATE_LIMITED="过去一小时内的自动扫描次数过多（上限：%d）。请稍候几分钟后重试，或在仪表板上使用复制粘贴提示词（方法 1）。"

COM_CSOVERRIDECHECKER_FIELD_APIKEY_REVEAL="显示"
COM_CSOVERRIDECHECKER_FIELD_APIKEY_HIDE="隐藏"
COM_CSOVERRIDECHECKER_FIELD_APIKEY_CLEAR="清除"
COM_CSOVERRIDECHECKER_FIELD_APIKEY_CLEAR_TITLE="清空此字段。在您点击工具栏中的&ldquo;保存&rdquo;之前，更改不会被保存。"
COM_CSOVERRIDECHECKER_FIELD_APIKEY_HELP_DEFAULT="帮助"
COM_CSOVERRIDECHECKER_FIELD_GET_JOOMLA_TOKEN="获取令牌"

COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="方法 1：使用您的 AI 助手"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="复制现成的提示词，粘贴到您使用的任何 AI 助手中——ChatGPT、Claude、Gemini、Copilot、Cursor 或本地模型。无需 API 密钥即可使用。跳转到下方的提示词。"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="方法 2：运行自动扫描"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="使用您保存的 %s API 密钥在本服务器上运行覆盖审查。报告会保存为会话。跳转到下方的运行按钮。"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="请先在&ldquo;选项&rdquo;面板中选择 AI 提供商并保存其 API 密钥，以启用自动扫描。在此之前，请使用方法 1。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="重新遍历每个已启用的模板并重建覆盖跟踪器。在 Joomla 之外编辑模板文件后，或当 Joomla 的跟踪器过期时使用。"

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="密钥 &amp; 令牌"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="可选。在此选择 AI 提供商并保存其 API 密钥后，本扩展即可自动运行扫描，无需复制粘贴提示词。留空则可继续使用仪表板上的复制粘贴提示词，搭配您已在使用的任何 AI。"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API 密钥"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="您的个人 Anthropic API 密钥（以 <code>sk-ant-…</code> 开头）。可在 <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a> 获取。该密钥存储在本服务器上，仅用于代您调用 api.anthropic.com。保存密钥后，仪表板会显示&ldquo;<em>运行自动扫描</em>&rdquo;按钮，将覆盖审查交给 Claude 在服务器端处理，并将报告保存回会话——无需复制粘贴。"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="每次自动扫描都会向您选择的提供商发起一次 API 调用，按该提供商对所选模型的价格计费。覆盖数量非常多的站点每次运行会有数量上限（见下方的<em>每次扫描的覆盖数</em>）；其余请重新运行，或使用仪表板上的复制粘贴提示词来获得无限制的处理量。"

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="扫描模型"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="用于仪表板上一次性<em>运行自动扫描</em>调用的模型。扫描属于分类任务（每个发现项分为警报 / 审查 / 信息）。<strong>默认使用能力最强的模型</strong> &mdash; 最全面的审查，也是对需要细微判断的发现项最安全的分类器。较小的模型能以一小部分成本很好地处理常规扫描，适用于小型站点的低风险扫描。"

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="聊天模型"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="用于会话详情页&ldquo;与 Claude 对话&rdquo;后续交流（您让 Claude 应用修复或忽略发现项的地方）的 Claude 模型。工具使用比分类要求更高。<strong>Opus 是默认选择</strong> &mdash; 最可靠的工具使用行为，也是错误应用修复风险最低的选择。Sonnet 对于有许多低风险后续操作的站点是一个不错的折中方案；Haiku 在多步骤工具序列方面可能遇到困难，除非成本是首要考虑因素，否则不建议作为聊天模型。"

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API 令牌（用于仪表板提示词）"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="可选。在<em>系统 &rarr; 用户 &rarr; 我的资料 &rarr; Joomla API 令牌</em>处生成 Joomla API 令牌并粘贴到这里。仪表板的扫描 / 修复提示词随后会自动用此令牌替换&ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;占位符，您即可直接复制 &amp; 粘贴到您的 AI 助手，无需编辑。<br><br><strong>多管理员注意事项：</strong>Joomla API 令牌以<em>生成它的用户身份</em>进行身份验证。如果多位管理员使用此仪表板，提示词将使用此处保存的任一令牌 &mdash; 也就是说 AI 调用 API 时将以那一位用户的身份验证。留空可让每位管理员在使用时各自粘贴自己的令牌。"

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="每次扫描的覆盖数"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="<em>运行自动扫描</em>按钮在单次 API 调用中审查多少个被标记的模板覆盖。默认 <strong>10</strong>。范围 1&ndash;100。<strong>数值越低，对后续聊天越安全：</strong>扫描报告会随着发现项数量增长，而聊天工具使用循环会将该报告作为对话历史保留。在较低的速率限制等级上（Anthropic 的 Tier 1 允许每分钟 10K 输入令牌），60 个覆盖的扫描加上同一分钟内的即时聊天会返回 <em>HTTP 429：超出速率限制</em>。每次运行 10 个覆盖时，您扫描后的聊天交流会舒适地保持在限制之下。覆盖数超过此值的站点只需多运行几次即可覆盖全部 &mdash; 每次运行的报告都会保存为独立会话，因此您可以逐个分别处理。"

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — 最快、最便宜。适用于小型站点的低风险扫描。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — 均衡。能以 Opus 一小部分的成本很好地处理常规扫描。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — 能力最强，默认。对需要细微判断的发现项最安全的分类器。"

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>关于成本差异。</strong><strong>在撰写本文时</strong>，对一个有 50 个覆盖的站点进行典型扫描会使用约 60K 输入令牌并产生约 5K 输出令牌。每次扫描的大致成本：<strong>Haiku 约 $0.08，Sonnet 约 $0.23，Opus 约 $1.13</strong>。聊天交流要小得多（每轮 5K&ndash;10K 输入令牌），因此每轮成本大约是扫描的 10&times; 之一。Anthropic 公布的定价为准，请参阅 <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; 上述数字为约值，可能会随时间变化。在决定是否从默认的 Opus 降至更便宜的层级之前，请在 <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> 上观察几次运行的用量。"

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="组件导航"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="方法 2：运行自动扫描（使用您保存的 %s API 密钥）"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="未保存 %s API 密钥。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API 密钥已保存。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="本扩展将使用您保存的 API 密钥在服务器上运行覆盖审查，无需复制粘贴。报告将自动保存为新会话。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="点击下方开始扫描。本扩展将获取本站所有被标记的覆盖，使用您保存的 API 密钥发送给您的 AI 提供商，并将生成的报告保存为新会话。完成后您将被重定向到该报告。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="每次扫描进行一次 API 调用。覆盖数超过 %d 的站点每次运行被限制为前 %d 个（可在<em>选项 &rarr; 密钥 &amp; 令牌 &rarr; 每次扫描的覆盖数</em>中配置）；下一批请重新运行，或使用方法 1 中的复制粘贴提示词来获得无限制的处理量。在 AI 响应期间，页面可能会暂停 30&ndash;90 秒 &mdash; 这是正常的，请勿离开。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="这将使用您保存的密钥调用 %s API，可能需要 30 到 90 秒。是否继续？"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="立即运行自动扫描"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="此方法在服务器端运行整个审核 &mdash; 无需复制粘贴，无需第二个窗口。点击下面的<em>选项</em>按钮，在<em>密钥 &amp; 令牌</em>选项卡下选择您的 AI 提供商，粘贴其 API 密钥并保存。密钥保留在您站点的数据库中；只有此站点可以使用它。如果您更喜欢复制粘贴的工作流，上方的方法 1 无需 API 密钥仍然可以使用。"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="正在运行自动扫描…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="正在调用 %s API 并分析您的覆盖。这通常需要 30 到 90 秒。请勿关闭此窗口。"

