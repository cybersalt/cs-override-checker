COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="端点 URL"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="关于"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API 暴露原生的 #__template_overrides 跟踪器，让任何 AI 助手——或任何持有 Joomla API 令牌的客户端——都可以审查每个被标记的覆盖、对其进行分类，并就地应用补丁。每个补丁在应用前都会自动备份到数据库，并可在&ldquo;文件备份&rdquo;视图中撤销。"
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="版本"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="从这里开始。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="对于一次常规审查，您只需要这一张卡。运行提示词、获取报告，然后在同一个对话里告诉您的助手要修复哪些发现项。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="方法 1：使用任何 AI 助手进行审查"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="本扩展通过标准 REST API 暴露您的覆盖数据，因此<strong>任何</strong>能够发出 HTTPS 请求的 AI 助手都可以运行审查——此方法不依赖任何特定厂商。将下方提示词复制到您已在使用的助手中，它就会对本站每个被标记的覆盖进行安全审查，然后应用您确认的修复。不确定您的助手是否可用？请查看本页顶部的<em>设置指南</em>按钮。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="生成 Joomla API 令牌（一次性）。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="在 Joomla 管理后台：<em>系统 → 用户 → 我的资料 → Joomla API 令牌</em>选项卡。点击眼睛图标显示令牌，然后将其复制。<strong>如果想永久保存它</strong>，请进入本组件的<em>选项 → 密钥与令牌</em>，将其粘贴到 <em>Joomla API 令牌</em>字段并保存——下方的提示将随后自动填入该令牌，您就不必每次扫描都粘贴一次了。否则，请将令牌备好并在步骤 2 中将其粘贴到提示中。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="打开您的 AI 助手并粘贴下方提示词。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="使用您喜欢的任何助手——终端或编辑器代理（Claude Code、Codex CLI、Cursor、Copilot）、浏览器聊天（ChatGPT、Claude.ai、Gemini）、自定义 GPT 或 Gem，或本地模型。唯一的要求是它能够发出带自定义请求头的出站 HTTPS 请求。<strong>如果您在步骤 1 中没有把令牌保存到选项中</strong>，请将尖括号中的占位符文本（<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>）替换为您复制的令牌。本站的站点 URL 和端点已为您填好。各助手的使用提示请见<em>设置指南</em>页面。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="发送。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="您的助手将拉取覆盖列表，为每个覆盖获取覆盖文件和核心源代码，并产出一份按发现项的表格以及一段可转发的通俗摘要。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="告诉它要修复什么——在同一个对话里。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="报告发布后，它会询问您希望修复哪些发现项。回复您确认的项（例如 <em>&ldquo;修复 #1 和 #3，保持 #2 不变，第三方那个我会去问开发者&rdquo;</em>）。打补丁前每个文件都会备份，所以一切都可以回滚。<strong>仅当您关闭对话后想稍后再回来继续时，才需要下方的第二张卡。</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="提示词（复制并粘贴到您的 AI 助手中）："
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="复制扫描提示词"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="已复制！"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="多数用户不需要这张卡。"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="仅当您要开<em>新对话</em>来应用之前一次审查的修复时使用——例如您在隔夜后关闭了原对话、把审查交接给同事，或您在浏览器聊天中运行了扫描而想在终端代理中执行修复。如果您的扫描对话仍开着，请向上滚动——直接在那个对话中继续即可。"

