; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="インストールが不完全です: %2$d 個中 %1$d 個のファイルが見つからないか破損しています。"
CS_INTEGRITY_PROBLEMS_BODY="%s が完全にインストールされていないため、一部が動作しない可能性があります。修復するには同じパッケージをもう一度インストールしてください。それでもインストールに失敗する場合は、サーバーのセキュリティソフト (例: Imunify360 Proactive Defense) が Joomla のインストーラーをブロックしている可能性があります。そのインシデントログを確認してください。"
CS_INTEGRITY_CHANGED_TITLE="%2$d 個中 %1$d 個のファイルがリリース版と異なります。"
CS_INTEGRITY_CHANGED_BODY="更新が失敗した後や、誰かが %s のファイルを直接編集した場合に起こります。元に戻すには同じパッケージをもう一度インストールしてください。"
CS_INTEGRITY_OK="%1$d 個のファイルはすべてリリース版と一致しています。"
CS_INTEGRITY_NOLIST="このビルドにはファイル一覧がないため、ファイルチェックは利用できません。"
CS_INTEGRITY_SHOW_FILES="ファイルを表示"
CS_INTEGRITY_UNREADABLE="ファイル一覧を読み取れません"
CS_INTEGRITY_MISSING="欠落"
CS_INTEGRITY_EMPTY="空 (0 バイト)"
CS_INTEGRITY_CHANGED="変更あり"
CS_INTEGRITY_MORE="ほか %d 件"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="何も書き込まれませんでした。新しい内容には、修正でオーバーライドに追加することが許可されていないコードが含まれています: %s。これは注入されたコードに典型的なものであるため、依頼が妥当に見えても拒否されます。変更が正しいと確信できる場合は、内容を確認してご自身でファイルを編集してください。"
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="復元されませんでした。このバックアップには現在のファイルにないコードが含まれています: %s。修正で削除されたバックドアの可能性があるため、AI や API 呼び出しでは元に戻せません。このバージョンに戻したい場合は、バックアップの内容を確認し、ファイルバックアップ画面から復元してください。"
