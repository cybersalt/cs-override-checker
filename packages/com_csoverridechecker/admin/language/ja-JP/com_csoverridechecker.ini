COM_CSOVERRIDECHECKER_SESSION_CHAT_INTRO="次に何をするか Claude に伝えてください。上記のレポートで確認した所見については、<em>&ldquo;#1 と #3 を修正、残りは却下&rdquo;</em> のように伝えてください。Claude はサーバー側で作業を実行し、行った内容でこのスレッドを更新します。修正を適用するたびに元のファイルが自動的にバックアップされるので、ファイルバックアップビューから何でも元に戻せます。"
COM_CSOVERRIDECHECKER_SESSION_CHAT_PLACEHOLDER="修正または却下する内容を Claude に伝えてください…"
