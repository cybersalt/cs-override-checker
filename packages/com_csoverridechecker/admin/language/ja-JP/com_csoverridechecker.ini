COM_CSOVERRIDECHECKER_BACKUP_RESTORE_TITLE="このバックアップを復元"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_INTRO="上記のパスのライブファイルをバックアップされた内容で上書きします。書き込み前に、そのパスの現在の内容が新しいバックアップとして保存されるので、この復元自体も元に戻せます &mdash; うまくいかない場合は、復元前の新しいバックアップを復元することで取り消せます。"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="ファイルはこの管理ページから PHP 経由で書き込まれます。FTP は不要です。Web ユーザーは対象パスへの書き込み権限が必要です。Joomla サイトのルートが境界です &mdash; 復元はその外への書き込みを拒否します。"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_BUTTON="今すぐ復元…"

COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_TITLE="確認: バックアップを復元"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_BODY="復元すると、%s のライブファイルが上記のバックアップ内容で上書きされます。現在の内容は最初に新しいバックアップとして保存されるため、この操作は元に戻すことができます。"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="理解しました: 今すぐ復元するとライブファイルが上書きされます。復元前のコピーは新しいバックアップとして自動保存されます。"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_CONFIRM="はい — 復元する"

COM_CSOVERRIDECHECKER_BACKUP_MANUAL_TITLE="手動で復元（FTP / エディター）"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_INTRO="拡張機能にディスクへ書き込ませたくない場合:"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="上の <em>バックアップをダウンロード</em> をクリック（またはバックアップ内容ブロックをコピー）してください。"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="FTP クライアント、SFTP クライアント、またはホスティングのファイルマネージャーを開いてください。"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="以下の宛先パスのファイルをダウンロードしたコピーで置き換えてください。"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_DESTINATION="サーバー上の宛先パス"

COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="このバックアップの保存場所"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="バックアップ内容はディスクではなくデータベースに保存されます。具体的には <code>#__csoverridechecker_backups</code> テーブルです &mdash; <code>contents_b64</code> カラムにファイル内容が base64 エンコードで保持されています。"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="つまり、データベースバックアップにもこれらが含まれます。コンポーネントをアンインストールすると、テーブルが保存されたすべてのバックアップとともに削除されます。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Anthropic API のティアについて:</strong> 自動スキャンとチャット機能はどちらも Anthropic の毎分トークン制限の対象になります。Anthropic のデフォルトの Tier 1（毎分 10,000 入力トークン）は、小規模サイトのワンショットスキャンには十分ですが、複数ターンのチャットで修正を行うとレート制限にかかります。Tier 2（毎分 50,000 トークン、有料）であれば、実際の修正セッションのほとんどに余裕があります。現在のティアは <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a> で確認できます。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="オーバーライドをレビュー対象としてリセット"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="オーバーライドトラッカーを再構築するテンプレートを選択してください。ディスク上に <code>html/</code> オーバーライドフォルダーを持つ有効なテンプレートのみが一覧表示されます。従来の &ldquo;すべてのテンプレートをリセットする&rdquo; 動作にするには <em>すべてのテンプレートを選択</em> にチェックを入れてください。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="このサイトの有効なテンプレートには <code>html/</code> オーバーライドフォルダーが 1 つもないため、リセットする対象がありません。オーバーライドを追加してから（またはオーバーライドを持つテンプレートを有効にしてから）、このダイアログを開き直してください。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SELECT_ALL="すべてのテンプレートを選択"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_OVERRIDE_COUNT="現在 %d 件の行を追跡中"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SUBMIT="選択項目をリセット"
COM_CSOVERRIDECHECKER_RESCAN_NO_VALID_TEMPLATES="選択されたテンプレートはいずれも認識できませんでした。ダイアログを開き直し、リストからテンプレートを選択してください。"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_TITLE="このバックアップを %s に復元"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="保存されたバックアップを %s のライブファイルに復元しますか？ 現在のファイル内容が先に新しいバックアップとして保存されるため、この復元自体も元に戻せます。"
COM_CSOVERRIDECHECKER_FILTER_OPTIONS="フィルターオプション"
COM_CSOVERRIDECHECKER_FILTER_NO_MATCHES="これらのフィルターに一致する結果はありません。すべてを表示するにはクリアを使用してください。"
COM_CSOVERRIDECHECKER_FILTER_ANY_ACTION="— すべてのアクション —"
COM_CSOVERRIDECHECKER_FILTER_ANY_SESSION="— すべてのセッション —"
COM_CSOVERRIDECHECKER_FILTER_SESSION_PLACEHOLDER="セッション ID（または 'none'）"
COM_CSOVERRIDECHECKER_TOOLBAR_DASHBOARD="ダッシュボード"
COM_CSOVERRIDECHECKER_TOOLBAR_SETUPGUIDE="セットアップガイド"
COM_CSOVERRIDECHECKER_TOOLBAR_SUPPORT="サポート"
COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — セットアップガイド"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="すでにお使いの AI をそのまま利用できます"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="この拡張機能は特定の AI に縛られていません。公開しているのはすべて、標準の Joomla API トークンで保護されたシンプルな REST API です。そのため、ウェブリクエストを送信できるアシスタントであればどれでもレビューを実行できますし、お客様ご自身が書いたスクリプトでも実行できます &mdash; このページでは、選択肢ごとの実務上の違いを説明しますので、いずれか 1 つを選んで始めてください。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="アシスタントに実際に必要な能力"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="どの製品が動作するかを列挙するのではなく &mdash; プランや機能は絶えず変わります &mdash; 実際の要件をお伝えします。お使いのアシスタントには次のことができる必要があります:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="このサイトへ<strong>外向きの HTTPS リクエストを送信できる</strong>こと。カスタムリクエストヘッダー（<code>X-Joomla-Token</code>）を付けて送信します。必須要件はこれだけです。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>JSON ボディ付きの POST リクエストを送信できる</strong>こと。レポートだけでなく修正の適用まで任せたい場合に必要です。読み取り専用のレビューであれば GET だけで足ります。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>ある程度長い会話を維持できる</strong>こと。フラグ付きのオーバーライドごとに 2 つのファイルを取得してから判断を下すためです。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="お使いのものが条件を満たすか分からない場合は、とにかくプロンプトを貼り付けて試してください。サイトに到達できないアシスタントは、黙って失敗するのではなく、その場でそう伝えてきます。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Joomla API トークンがまだ保存されていません。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="どのアシスタントを選ぶ場合でも、オーバーライドファイルを読み取るには Joomla API トークンが必要です。<em>システム &rarr; 管理 &rarr; ユーザー &rarr; ご自身のユーザー &rarr; Joomla API トークン</em> で生成し、毎回プロンプトに貼り付けるか、ここに保存してプロンプトへ自動入力されるようにしてください。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="おすすめ"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="最も一般的"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="複数サイトに最適"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="動作しますが注意点あり"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="上級者向け"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="ターミナル / エディター系エージェント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="例: Claude Code、Codex CLI、Cursor、GitHub Copilot のエージェントモード、Aider、Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="最もスムーズな選択肢で、利用できるならこれをおすすめします。お客様ご自身のマシン上で動作し、外向きのネットワークアクセスに制限がなく、サンドボックスの許可リストもブラウザのリクエストタイムアウトもありません。そのため、長いレビューでも付きっきりにならずに最後まで実行できます。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="ダッシュボードからスキャンプロンプトをコピーします。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="エージェントに貼り付けて送信します。設定は不要です。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="レポートが表示されたら、同じセッション内で修正したい所見の番号を伝えて返信します。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="ブラウザのチャットアシスタント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="例: ChatGPT、Claude.ai、Google Gemini、Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="お使いのアカウントとモードが実際にインターネットへアクセスできるのであれば、いずれも動作します。最も一般的な構成であり、通常のサイトには十分です。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="その会話でウェブアクセス（ブラウジング）が有効になっていることを確認してください。ティアやモードによっては、記憶だけで回答してしまうものがあります。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="ダッシュボードのスキャンプロンプトを貼り付けて送信します。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="サイトのオーバーライドが多い場合は、1 回の返答がブラウザのリクエストタイムアウトを超えないよう、バッチに分けて処理するよう指示してください。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>自信ありげな推測にご注意ください。</strong> 実際のファイル内容を一度も引用しないまま所見を並べ始めた場合、そのアシスタントはサイトに到達できておらず、内容を作り出しています。レポートを信用せず、いったん止めて接続状況を確認してください。<strong>Claude.ai の場合:</strong> &ldquo;Host not in allowlist&rdquo; と返答されたら、<em>設定 &rarr; 機能 &rarr; コード実行 &rarr; ネットワークアクセス</em> でこのサイトのドメインを追加し、新しいチャットを開始してください &mdash; 実行中のチャットは古い許可リストを使い続けます。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="カスタム GPT、Gem、その他の設定可能なアシスタント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="例: Actions を設定したカスタム GPT、Gemini の Gem、または独自の API を登録できる任意のアシスタント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="お使いのプラットフォームで独自の API アクションを持つアシスタントを定義できる場合は、下記のエンドポイントを一度登録すれば、コピー＆ペーストの手順を完全に省略できます。アシスタントが会話をまたいで設定を記憶するため、複数の Joomla サイトを管理している場合はこれが最もすっきりした選択肢です。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="新しいカスタムアシスタントを作成し、このページの下に表示されているエンドポイント URL を指す API アクションを追加します。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="認証ヘッダー名を <code>X-Joomla-Token</code> に設定し、その値として Joomla API トークンを貼り付けます。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="分類ルールとレポート形式を把握させるため、ダッシュボードのスキャンプロンプトをアシスタントの指示に貼り付けます。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="ローカル / セルフホストのモデル"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="例: Ollama、LM Studio、llama.cpp、またはツール呼び出しに対応した任意のセルフホストモデル"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="ツール呼び出しとネットワークアクセスがあれば仕組みとしては動作しますし、データが自社インフラの外に出ることもないため、こちらを好むサイトもあります。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="ツール呼び出し（関数呼び出し）を有効にし、モデルが HTTPS でこのサイトに到達できることを確認します。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="スキャンプロンプトをシステムプロンプトとして貼り付け、開始するよう指示します。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>モデルのサイズについては現実的にお考えください。</strong> オーバーライドのレビューは単純な参照作業ではなく、判断を要するタスクです。小さなローカルモデルでも平気でレポートを出しますが、本物のセキュリティ上の劣化を見逃したり、存在しない問題をでっち上げたりする可能性がはるかに高くなります。小さなモデルの所見は最終的な判断ではなく、一次チェックとして扱ってください。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP クライアント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Model Context Protocol に対応した任意のアシスタント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="アシスタントが MCP に対応している場合は、<strong>MCP for J</strong> と無料のアドオン <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a> をインストールしてください。アシスタントが自身のツールでオーバーライドを確認して修正するため、コピー＆ペーストは不要です。MCP コネクタに対応したブラウザチャットでも、ブラウザのリクエストタイムアウトを避けられるのでこちらをおすすめします。どちらも無料の別個の拡張機能です。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="方法 2 だけは例外です"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="ダッシュボードの <em>自動スキャンを実行</em> ボタンは、コピー＆ペーストなしでレビュー全体をサーバー側で実行します。<em>オプション</em> でプロバイダーを選択し、そのプロバイダーの API キーを保存してください &mdash; <strong>Anthropic、OpenAI、Google Gemini のいずれでもスキャンを実行できます</strong>。現在も Anthropic のみに対応しているのは、セッション上でのフォローアップチャット（修正の適用を依頼し、ツール呼び出しでファイルを編集させる部分）だけです。そのループが Anthropic のツール呼び出しプロトコルに合わせて書かれているためです。OpenAI や Gemini を選択した場合でも完全なレポートが得られ、どの AI でも動作する方法 1 のコピー＆ペーストのプロンプトを使って、ご自身で修正を適用できます。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s キーが保存されています &mdash; 方法 2 が利用できます"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="AI プロバイダーの API キーが保存されていません &mdash; 方法 1 は引き続き利用できます"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="エンドポイントと認証"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="管理画面が行うことはすべて、このベース URL から利用できます。カスタムアシスタントを登録するときや、独自のスクリプトやエージェントを書くときにご利用ください。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla はこれらのルートで <code>Authorization: Bearer</code> を受け付けません。</strong> トークンは <code>X-Joomla-Token</code> ヘッダーで送信する必要があります。Bearer 形式のヘッダーは 401 Forbidden を返します。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="完全なドキュメント"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="エンドポイントの完全なリファレンス、レポート形式、トラブルシューティング、FAQ。"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="ドキュメントを読む"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — サポート"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="この拡張機能は無料であり、これからも無料です"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Pro 版もライセンスキーもなく、機能を出し惜しみすることもありません。この拡張機能にできることはすべて目の前にあります。それでも、ぜひご意見をお聞かせください &mdash; これまでのすべてのリリースは、実際のサイトからのフィードバックによって形づくられてきました。"
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="あらかじめご了承いただきたいこと。"
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt は小さな会社であり、この拡張機能は無償で提供しています。そのため無料サポートは、クライアント業務の合間に時間の許す範囲で対応しています。これは体よくお断りするための言い訳ではなく、実際の制約です &mdash; 守れない約束でお待たせするより、はっきりお伝えしたいと考えています。バグ報告は必ず確認しますが、範囲の定まらない設定のご相談には対応できないことがあります。"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="お送りいただく先"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="バグ報告、分かりにくい文言、AI が誤った所見、この拡張機能が合わないワークフロー、想定外の動作をしたアシスタント &mdash; そのすべてが役に立ちます。"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="GitHub で問題を報告"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="ドキュメントを読む"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="再現できる問題には GitHub Issues が最適です。公開されているため &mdash; 同じ問題に出会った次の方が、改めて質問しなくても答えを見つけられます。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="ご記載いただきたい内容"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="診断の手間を省いていただけると、より早く回答できます:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="このページの <strong>診断ブロック</strong>（Joomla、PHP、拡張機能のバージョンが 1 回の貼り付けにまとまっています）。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="使用した<strong>方法</strong> &mdash; コピー＆ペーストのプロンプト、自動スキャン、ご自身のコードのいずれか &mdash; と、<strong>どの AI アシスタント</strong>を使ったか。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="<strong>期待した</strong>動作と、<strong>実際に</strong>起きた動作。"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="AI が所見を誤った場合は、<strong>保存されたセッションレポート</strong> &mdash; セッションページの <em>レポートをダウンロード</em> をご利用ください。正確な所見と推論を確認できます。"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="アイデアも歓迎します"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="この拡張機能があと一歩でご要望に届かないという場合は、ぜひお知らせください。私たちが思いつかなかったワークフローを 1 人の方が説明してくださったおかげで、いくつもの機能がリリースされてきました。"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="診断"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="改めてお尋ねしなくて済むよう、これをご報告に貼り付けてください。"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="診断をコピー"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="このブロックに秘密情報は含まれません。キーやトークンが保存されているかどうかだけを記録し、その値は一切記録しません。"
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="{seconds} 秒後に表示"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="長押しで表示するまでの遅延（秒）"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="この拡張機能に表示されるキーやトークンは、画面共有や録画、背後からの覗き見で漏れないよう、デフォルトでぼかされています。ぼかされた値の上にポインターをこの秒数だけ乗せたままにすると表示され、カウントダウンでタイマーが動作していることが分かります。ポインターを離すとキャンセルされます。デフォルトは <strong>3</strong>。<strong>0</strong> に設定するとホバーした瞬間に表示されますが、ポインターが値の上を通り過ぎただけで表示されてしまうため、その保護がなくなります。"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="表示後に自動的に隠すまでの時間（秒）"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="値が一度表示された後、ポインターが乗ったままでもこの秒数が経過すると再びぼかします。キーに目をやった直後に中断され、無人の画面に表示されたままになる事態に備えるものです。デフォルトは <strong>8</strong>。<strong>0</strong> に設定すると、ポインターを離すまで表示されたままになります。"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="AI プロバイダー"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="組み込みの <em>自動スキャンを実行</em> ボタンが呼び出す AI サービスです。選択したサービスのキーはお客様ご自身でご用意いただき、このサイトからのみ使用されます。この設定はコピー＆ペーストのプロンプトワークフローには <strong>影響しません</strong> &mdash; そちらはどの AI でも動作し、キーは一切不要です。"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>3 つのプロバイダーはいずれもスキャンを実行できます。</strong> セッション上でのフォローアップチャット &mdash; 修正の適用を依頼し、ツール呼び出しでファイルを編集させる部分 &mdash; は現在 <strong>Anthropic のみ</strong>に対応しています。そのループが Anthropic のツール呼び出しプロトコルに合わせて書かれているためです。OpenAI や Gemini を選択した場合でも完全なレポートは得られます。修正の適用まで任せたい場合は、この設定を Anthropic に切り替えるか、どの AI でも動作するコピー＆ペーストのプロンプトワークフローをご利用ください。"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="OpenAI API キー"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="お客様個人の OpenAI API キー（<code>sk-</code> で始まります）。<a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a> から取得できます。キーはこのサーバーに保存され、お客様に代わって api.openai.com を呼び出すためだけに使用されます。"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Google Gemini API キー"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="お客様個人の Google AI Studio API キー。<a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a> から取得できます。キーはこのサーバーに保存され、お客様に代わって Gemini API を呼び出すためだけに使用されます。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — 最高性能、デフォルト。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — より高速かつ低コスト。リスクの低いスキャンには十分です。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — 最高性能、デフォルト。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — より高速かつ低コスト。リスクの低いスキャンには十分です。"
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="%s の API キーが保存されていません。オプションで追加するか、プロバイダーを切り替えてください。"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="API トークンを取得する権限がありません。この操作には Override Checker の書き込み権限が必要です。"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="ログイン中のユーザーを特定できなかったため、取得するトークンがありません。"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="<strong>ユーザー - Joomla API トークン</strong> プラグインが無効になっているため、Joomla はまだ API トークンを発行できません。有効にしてから再試行してください。"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="トークンは発行されましたが、<strong>API認証 - Joomla API トークン</strong> プラグインが無効になっています。そのプラグインも有効にするまで、Joomla は受信 API リクエストでこのトークンを拒否します。"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="お客様のユーザーグループが ユーザー - Joomla API トークン プラグインの許可リストに含まれていないため、Joomla はトークンを発行しません。いずれかのグループを、そのプラグインの「許可するユーザーグループ」設定に追加してください。"
