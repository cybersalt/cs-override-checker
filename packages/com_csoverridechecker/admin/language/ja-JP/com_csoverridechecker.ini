COM_CSOVERRIDECHECKER_ACTIONS_VS_SESSIONS="<strong>セッション</strong> は AI のレビューレポートを保存します。<strong>アクションログ</strong> は <em>変更</em> の監査証跡です &mdash; オーバーライドがリセットまたはクリアされた時、セッションが作成された時、修正前にバックアップが保存された時。後でこのサイトに何か問題が発生した場合、ここで何がいつ行われたかを確認できます。"
