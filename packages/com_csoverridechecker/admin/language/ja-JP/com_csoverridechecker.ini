COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Override Checker データの表示"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="一致するグループのユーザーが、オーバーライド、セッション、アクションログ、バックアップ内容を読み取れるようにします（管理ビューおよび読み取り側 API エンドポイント）。"
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Override Checker データおよびオーバーライドファイルの変更"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="一致するグループのユーザーが、修正の適用、バックアップの復元、オーバーライドフラグの却下、セッションの作成または削除を行えるようにします。表示権限を含みます。"

