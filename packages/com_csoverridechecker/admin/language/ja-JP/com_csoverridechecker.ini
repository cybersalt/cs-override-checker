COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="API エンドポイントは有効です"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="このコンポーネントに対する有効な Joomla API トークンと core.manage 権限を持つユーザーは、このサイトの現在のテンプレートオーバーライドデータを読み取ることができます。"

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="エンドポイント URL"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="概要"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="ネイティブの #__template_overrides トラッカーを公開する Web Services API です。任意の AI アシスタント（または Joomla API トークンを持つ任意のクライアント）がフラグ付きオーバーライドをすべてレビューし、分類し、その場でパッチを適用できます。すべてのパッチは事前にデータベースへ自動バックアップされ、ファイルバックアップビューから元に戻すことができます。"
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="バージョン"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="ここから始めてください。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="通常のレビューに必要なのはこのカードだけです。プロンプトを実行してレポートを取得し、同じチャット内でアシスタントにどの所見を修正するか伝えてください。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="方法 1: 任意の AI アシスタントを使用してレビュー"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="拡張機能はオーバーライドデータを標準の REST API で公開するため、HTTPS リクエストを送信できる AI アシスタントであれば<strong>どれでも</strong>レビューを実行できます — この方法には特定のベンダーに依存する部分はありません。下のプロンプトを普段お使いのアシスタントにコピーすると、このサイトのフラグ付きオーバーライドすべてのセキュリティレビューを作成し、確認した修正を適用します。お使いのアシスタントで動作するかわからない場合は、このページ上部の <em>セットアップガイド</em> ボタンをご覧ください。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Joomla API トークンを生成する（一度きり）。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="Joomla 管理画面で: <em>システム → ユーザー → マイプロフィール → Joomla API トークン</em> タブ。目のアイコンをクリックしてトークンを表示し、コピーしてください。<strong>恒久的に保存したい場合</strong>、このコンポーネントの <em>オプション → キーとトークン</em> に進み、<em>Joomla API トークン</em> フィールドに貼り付けて保存してください &mdash; 下のプロンプトがトークンで自動入力されるため、スキャンのたびに貼り付ける必要がなくなります。そうでない場合は、トークンを手元に置いて、ステップ 2 でプロンプトに貼り付けてください。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="AI アシスタントを開いて以下のプロンプトを貼り付ける。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="お好みのアシスタントをご利用ください — ターミナルやエディターのエージェント（Claude Code、Codex CLI、Cursor、Copilot）、ブラウザのチャット（ChatGPT、Claude.ai、Gemini）、カスタム GPT や Gem、またはローカルモデル。唯一の要件は、カスタムヘッダー付きの外向き HTTPS リクエストを送信できることです。<strong>ステップ 1 でオプションにトークンを保存していない場合</strong>、山かっこ内のプレースホルダーテキスト（<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>）をコピーしたトークンで置き換えてください。サイト URL とエンドポイントはこのサイト用に既に入力済みです。アシスタントごとのヒントは <em>セットアップガイド</em> ページにあります。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="送信。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="アシスタントはオーバーライドのリストを取得し、各オーバーライドのオーバーライド版とコア版のソースを取得し、所見ごとの表と転送可能な平易な言葉のサマリーを作成します。"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="同じチャット内で、修正対象を伝える。"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="レポートが投稿されると、どの所見を修正したいか尋ねられます。確認したものを返答してください（例: <em>「#1 と #3 を修正、#2 はそのまま、サードパーティのものは開発者に確認します」</em>）。パッチ適用前に各ファイルがバックアップされるので、何でもロールバック可能です。<strong>以下の 2 つ目のカードは、チャットを閉じて後で戻ってきたい場合にのみ必要です。</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="プロンプト（コピーして AI アシスタントに貼り付け）:"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="スキャンプロンプトをコピー"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="コピーしました!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="ほとんどのユーザーにこのカードは必要ありません。"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="これは、以前のレビューからの修正を適用するために <em>新しいチャット</em> を開始する場合にのみ使用してください — 例えば、元のチャットを夜間に閉じた、レビューをチームメイトに引き継ぐ、ブラウザのチャットでスキャンを実行してターミナルエージェントで修正を行いたい、などです。スキャンチャットがまだ開いている場合は、上にスクロールして — そのチャットでそのまま続けてください。"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="新しいチャットで以前のレビューを継続"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="このプロンプトを新しいチャットに貼り付けて、以前のレビューのコンテキストを与えます。スキャンを実行したアシスタントでなくても、どのアシスタントでも構いません。前のセッションレポートを取得し、所見を一覧表示し、どれを修正するか尋ねます。各ファイルはパッチ適用前にバックアップされるので、何でも元に戻せます。"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="修正プロンプトをコピー"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="セッションログ"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="AI アシスタントが送信した（または手動で貼り付けた）レポートはセッションとしてここに保存されます。セッションをクリックすると完全なレポートを表示できます。"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="セッションはまだありません。上記のプロンプトを実行し、アシスタントにレポートを自動的に POST させるか、「新しいセッション」をクリックして貼り付けてください。"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="新しいセッション"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="すべてのセッションを表示"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="レビュー後"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="レビューの推奨事項への対応が完了したら、Joomla がテンプレートに表示する「変更が見つかりました」バッジをクリアして、すでに対応済みのオーバーライドが引き続きフラグ付けされないようにしましょう。"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="推奨 — テンプレート単位のレビュー"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="サイトテンプレートのリストを開きます。「変更が見つかりました」バッジが付いた各テンプレートを個別に開いて、対応した特定のオーバーライド行を却下できます。遅いですが、行ごとの監査証跡を維持できます。"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="サイトテンプレート管理を開く"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="一括 — すべてのオーバーライドをレビュー済みとしてマーク"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="より速い方法: オーバーライドトラッカーのすべての行を一度にクリアします。各所見を実際にレビューした後にのみ実行してください。Joomla 自体の「すべて却下」をすべてのテンプレートに対して一度に使用するのと同等です。"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="すべてレビュー済みとしてマーク…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="確認: すべてのオーバーライドをレビュー済みとしてマーク"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="これにより、Joomla が現在オーバーライドトラッカーで追跡しているすべての行がクリアされます。テンプレートの「変更が見つかりました」バッジは消え、このサイトの API エンドポイントは Joomla の次のコア更新で再投入されるまで 0 行を返します。このアクションは、以下の「オーバーライドトラッカーを再構築」をクリックして再スキャンする以外には元に戻すことができません。"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="フラグ付きの全オーバーライドをレビュー済みであり、未対応の問題に対する責任を受け入れることを確認します。"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="はい — すべてレビュー済みとしてマーク"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="%d 件のオーバーライド行がレビュー済みとしてマークされ、トラッカーからクリアされました。"
COM_CSOVERRIDECHECKER_MARK_REVIEWED_NONE="クリアするオーバーライド行はありませんでした。"
COM_CSOVERRIDECHECKER_MARK_REVIEWED_ERROR="オーバーライドトラッカーをクリアできませんでした: %s"

COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="オーバーライドをレビュー対象としてリセット"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="お客様（または以前の開発者）が過去に十分に確認せずにオーバーライドを承認したことはありませんか？ ここをクリックして、すべてのオーバーライドファイルをトラッカーに戻し、お使いの AI アシスタントで各ファイルを適切にレビューできるようにします。このツールがインストールされる前に行われた「すべて却下」の後に有用です。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="有効なすべてのテンプレートの <code>html/</code> フォルダーを走査し、まだ追跡されていないオーバーライドファイルについて <code>#__template_overrides</code> に行を挿入します。既存の行はそのまま残します。リセットされた行はテンプレート管理画面で「変更が見つかりました」バッジとして再表示されるので、上記のレビューワークフローを実行できます。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_BUTTON="すべてのオーバーライドをレビュー対象としてリセット"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="すべてのオーバーライドをレビュー対象としてリセットしますか？ このサイト上のすべてのオーバーライドファイルが再評価できるようテンプレートの「変更が見つかりました」バッジに再表示されます。"

COM_CSOVERRIDECHECKER_RESCAN_SUCCESS="オーバーライドトラッカーが再構築されました: %3$d 個のテンプレートにわたって %1$d 件の行を挿入（%2$d 個のファイルをスキャン）。"
COM_CSOVERRIDECHECKER_RESCAN_ERROR="オーバーライドトラッカーの再構築に失敗しました: %s"

