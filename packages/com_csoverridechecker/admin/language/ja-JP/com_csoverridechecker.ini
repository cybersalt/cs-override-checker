COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>ブラウザのチャットユーザー向けの手動貼り付け。</strong> ChatGPT、claude.ai、Gemini などのブラウザのチャットでスキャンプロンプトを実行した場合は、AI の返答をコピーしてここに貼り付け、セッションとして保存してください。ターミナルやエディターのエージェント（Claude Code、Codex、Cursor など）を使用した場合は、通常このフォームは不要です &mdash; エージェントがレポートをサイトに自分で投稿します。セッションはデフォルトで今日のタイムスタンプで命名されます。必要に応じて変更してください。"
