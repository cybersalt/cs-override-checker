COM_CSOVERRIDECHECKER_FIELD_APIKEY_CLEAR_TITLE="このフィールドを空にします。ツールバーの保存をクリックするまで変更は保存されません。"
COM_CSOVERRIDECHECKER_FIELD_APIKEY_HELP_DEFAULT="ヘルプ"
COM_CSOVERRIDECHECKER_FIELD_GET_JOOMLA_TOKEN="トークンを取得"

COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="方法 1: お使いの AI アシスタントを使用"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="あらかじめ用意されたプロンプトをコピーして、お使いの AI アシスタント（ChatGPT、Claude、Gemini、Copilot、Cursor、ローカルモデルなど）に貼り付けます。API キーがなくても動作します。下のプロンプトに移動します。"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="方法 2: 自動スキャンを実行"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="保存された %s API キーを使用して、このサーバー上でオーバーライドのレビューを実行します。レポートはセッションとして保存されます。下の実行ボタンに移動します。"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="自動スキャンを有効にするには、まずオプションパネルで AI プロバイダーを選択し、その API キーを保存してください。それまでは方法 1 をご利用ください。"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="有効なすべてのテンプレートを再走査し、オーバーライドトラッカーを再構築します。Joomla の外でテンプレートファイルを編集した後、または Joomla のトラッカーが古い場合に使用してください。"

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="キー &amp; トークン"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="任意。ここで AI プロバイダーを選択して API キーを保存すると、拡張機能がスキャンを自動実行できるようになり、コピー＆ペーストのプロンプトは不要になります。空欄のままにすると、ダッシュボードのコピー＆ペーストのプロンプトを、すでにお使いの AI で引き続き利用できます。"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API キー"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="お客様個人の Anthropic API キー（<code>sk-ant-…</code> で始まります）。<a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a> から取得できます。キーはこのサーバーに保存され、お客様に代わって api.anthropic.com を呼び出すためだけに使用されます。キーが保存されていると、ダッシュボードに <em>自動スキャンを実行</em> ボタンが表示され、オーバーライドのレビューをサーバー側の Claude に任せ、レポートをセッションとして保存し直します — コピー&ペーストは不要です。"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="自動スキャンごとに、選択したプロバイダーへの API 呼び出しが 1 回行われ、選択したモデルに対するそのプロバイダーの料金で請求されます。オーバーライドの数が非常に多いサイトでは、1 回の実行あたりの件数が制限されます（下の <em>スキャンごとのオーバーライド数</em> を参照）。残りは再実行するか、サイズ無制限で使えるダッシュボードのコピー＆ペーストのプロンプトをご利用ください。"

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="スキャンモデル"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="ダッシュボード上のワンショット <em>自動スキャンを実行</em> 呼び出しに使用されるモデルです。スキャンは分類タスク（所見ごとにアラート / レビュー / 情報）です。<strong>最も高性能なモデルがデフォルトです</strong> &mdash; 最も徹底的なレビューと、微妙な判断が必要な所見に対する最も安全な分類器です。より小さなモデルは通常のスキャンをコストのごく一部で十分に処理でき、小規模サイトの低リスクスキャンにも適しています。"

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="チャットモデル"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="セッション詳細ページ（Claude に修正の適用や所見の却下を依頼する場所）での Claude とのチャットによるフォローアップに使用される Claude モデルです。ツール使用は分類よりも要求が高くなります。<strong>Opus がデフォルトです</strong> &mdash; 最も信頼性の高いツール使用動作と、誤って適用される修正のリスクが最も低い選択です。Sonnet は低リスクのフォローアップが多いサイトに適した中間オプションです。Haiku は複数ステップのツールシーケンスに苦戦することがあり、コストが最優先でない限りチャットモデルには推奨されません。"

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API トークン（ダッシュボードプロンプト用）"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="任意。<em>システム &rarr; ユーザー &rarr; マイプロフィール &rarr; Joomla API トークン</em> で Joomla API トークンを生成し、ここに貼り付けてください。ダッシュボードのスキャン / 修正プロンプトは、&ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo; プレースホルダーの代わりにトークンを自動的に埋め込むので、編集なしでお使いの AI アシスタントに直接コピー &amp; ペーストできます。<br><br><strong>複数管理者に関する注意:</strong> Joomla API トークンは <em>それを生成したユーザー</em> として認証されます。複数の管理者がこのダッシュボードを使用する場合、プロンプトはここに保存されているトークンを使用します &mdash; つまり AI はその 1 人のユーザーとして API を認証して呼び出します。各管理者が使用時に自身のトークンを貼り付けるようにするには、空欄のままにしてください。"

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="スキャンごとのオーバーライド数"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="<em>自動スキャンを実行</em> ボタンが 1 回の API 呼び出しでレビューする、フラグ付きテンプレートオーバーライドの数です。デフォルトは <strong>10</strong>。範囲は 1&ndash;100。<strong>低い方がチャットフォローアップに安全です:</strong> スキャンレポートは所見の数に応じて大きくなり、チャットのツール使用ループはそのレポートを会話履歴として保持します。低位のレート制限ティア（Anthropic の Tier 1 は毎分 10K 入力トークンまで）では、60 件のオーバーライドスキャンに加えて同じ分内に即座にチャットターンを行うと <em>HTTP 429: rate limit exceeded</em> が返されます。1 回あたり 10 件のオーバーライドであれば、スキャン後のチャットターンは制限内に余裕を持って収まります。これより多くのオーバーライドがあるサイトでも、すべてをカバーするには数回再実行するだけで済みます &mdash; 各実行のレポートはそれぞれ独自のセッションとして保存されるため、一つずつ個別に対応できます。"

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — 最速かつ最安。小規模サイトの低リスクスキャンに適しています。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — バランス型。通常のスキャンを Opus のごく一部のコストで十分に処理します。"
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — 最高性能、デフォルト。微妙な判断が必要な所見に対して最も安全な分類器です。"

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>コスト差について。</strong> <strong>本ドキュメント執筆時点</strong>では、50 件のオーバーライドがあるサイトでの典型的なスキャンは、約 60K の入力トークンを使用し、約 5K の出力トークンを生成します。スキャンあたりの概算コスト: <strong>Haiku で約 $0.08、Sonnet で約 $0.23、Opus で約 $1.13</strong>。チャットターンははるかに小さく（各 5K&ndash;10K 入力トークン）、ターンあたりのコストはスキャンの約 10 分の 1 です。Anthropic の公開価格が信頼できる情報源です: <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; 上記の数値は概算であり、時間の経過とともに変動する可能性があります。デフォルトの Opus からより安価なティアに切り替えるかどうかを決定する前に、数回の実行について <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> で使用量を確認してください。"

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="コンポーネントナビゲーション"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="方法 2: 自動スキャンを実行（保存された %s API キーを使用）"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="%s API キーが保存されていません。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API キーが保存されています。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="拡張機能は保存された API キーを使用してサーバー上でオーバーライドレビューを実行します。コピー&ペーストは不要です。レポートは新しいセッションとして自動的に保存されます。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="下をクリックしてスキャンを開始します。拡張機能はこのサイト上のフラグ付きオーバーライドをすべて取得し、保存された API キーでお使いの AI プロバイダーに送信し、結果のレポートを新しいセッションとして保存します。完了するとレポートにリダイレクトされます。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="スキャンごとに 1 回の API 呼び出しが行われます。オーバーライドが %d 件を超えるサイトでは、1 回の実行につき先頭 %d 件までに制限されます（<em>オプション &rarr; キー &amp; トークン &rarr; スキャンごとのオーバーライド数</em> で設定可能）。次のバッチについては再実行するか、サイズ無制限で使える方法 1 のコピー＆ペーストのプロンプトをご利用ください。AI が応答する間、ページが 30&ndash;90 秒一時停止する場合があります &mdash; これは正常です、移動しないでください。"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="これは保存されたキーで %s API を呼び出し、30 秒から 90 秒かかる場合があります。続行しますか？"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="今すぐ自動スキャンを実行"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="この方法はレビュー全体をサーバー側で実行します &mdash; コピー＆ペーストも、二つ目のウィンドウも不要です。すぐ下の <em>オプション</em> ボタンをクリックし、<em>キー &amp; トークン</em> タブで AI プロバイダーを選択して、その API キーを貼り付けて保存してください。キーはサイトのデータベースに保存され、このサイトでのみ使用できます。コピー＆ペーストのワークフローを好む場合は、API キーがなくても上の方法 1 は引き続き動作します。"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="自動スキャンを実行中…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="%s API を呼び出してオーバーライドを分析しています。通常 30 秒から 90 秒かかります。このウィンドウを閉じないでください。"

