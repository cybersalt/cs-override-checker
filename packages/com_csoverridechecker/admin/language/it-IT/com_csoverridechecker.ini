COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST_INTRO="Invia una piccola richiesta di test a %s con la chiave salvata. Costa quasi nulla — verifica che la chiave sia valida e raggiungibile da questo server."
