COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Metodo 1: usa il tuo assistente IA"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Copia un prompt pronto e incollalo nell'assistente IA che usi — ChatGPT, Claude, Gemini, Copilot, Cursor o un modello locale. Funziona senza chiave API. Salta al prompt qui sotto."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Metodo 2: esegui scan automatico"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Esegue la revisione degli override su questo server con la tua chiave API %s salvata. Salva il report come sessione. Salta al pulsante di esecuzione qui sotto."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Scegli prima un fornitore IA e salva la sua chiave API nel pannello Opzioni per attivare gli scan automatici. Nel frattempo, usa il Metodo 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Riscandagliare ogni template attivato e ricostruire il tracker degli override. Usalo dopo aver modificato i file di template fuori da Joomla, o se il tracker di Joomla è obsoleto."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Chiavi &amp; token"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Opzionale. Scegli un fornitore IA e salva qui la sua chiave API perché l'estensione possa eseguire gli scan automaticamente, senza prompt da copia-incolla. Lascia vuoto per continuare a usare il prompt da copia-incolla della dashboard con l'IA che usi già."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Chiave API Anthropic"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="La tua chiave API Anthropic personale (inizia con <code>sk-ant-…</code>). Ottienine una su <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. La chiave è memorizzata su questo server e usata solo per chiamare api.anthropic.com per tuo conto. Con una chiave salvata, la dashboard espone un pulsante <em>Esegui scan automatico</em> che affida la revisione degli override a Claude lato server e salva il report come sessione — niente copia-incolla."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Ogni scan automatico effettua una chiamata API al fornitore scelto, fatturata alle tariffe di quel fornitore per il modello selezionato. I siti con un numero molto elevato di override sono limitati per esecuzione (vedi <em>Override per scan</em> qui sotto); rilancia per il resto, oppure usa il prompt da copia-incolla della dashboard per dimensione illimitata."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Modello di scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Modello usato per la chiamata singola <em>Esegui scan automatico</em> dalla dashboard. Lo scan è un'attività di classificazione (alert / review / info per scoperta). <strong>Il modello più capace è la scelta predefinita</strong> &mdash; la revisione più approfondita e il classificatore più sicuro per scoperte che richiedono giudizio sottile. I modelli più piccoli gestiscono bene gli scan di routine a una frazione del costo e vanno bene per scan a basso rischio su siti piccoli."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Modello di chat"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Modello Claude usato per il chat-con-Claude di follow-up sulla pagina di dettaglio della sessione (dove chiedi a Claude di applicare correzioni o respingere scoperte). L'uso degli strumenti è più impegnativo della classificazione. <strong>Opus è la scelta predefinita</strong> &mdash; il comportamento più affidabile nell'uso degli strumenti e il rischio più basso di una correzione applicata male. Sonnet è una buona via di mezzo per siti con molti follow-up a basso rischio; Haiku può avere difficoltà con sequenze di strumenti in più passi e non è raccomandato per il modello di chat se il costo non è la preoccupazione principale."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Token API Joomla (per il prompt della dashboard)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Opzionale. Genera un token API Joomla in <em>Sistema &rarr; Utenti &rarr; Mio profilo &rarr; Token API Joomla</em> e incollalo qui. I prompt di scan/correzione della dashboard riempiranno automaticamente il token al posto del segnaposto &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, così puoi copia &amp; incolla direttamente nel tuo assistente IA senza modifiche.<br><br><strong>Avviso multi-admin:</strong> i token API Joomla autenticano come <em>l'utente che li ha generati</em>. Se più admin usano questa dashboard, il prompt userà il token salvato qui &mdash; il che significa che l'IA chiamerà l'API autenticandosi come quel singolo utente. Lascia vuoto perché ogni admin incolli il proprio token al momento dell'uso."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Override per scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Quanti override di template segnalati il pulsante <em>Esegui scan automatico</em> esamina in una singola chiamata API. Predefinito <strong>10</strong>. Range 1&ndash;100. <strong>Più basso è più sicuro per il chat di follow-up:</strong> il report dello scan cresce con il numero di scoperte, e il loop di uso degli strumenti del chat conserva quel report come cronologia di conversazione. Sui livelli bassi di limite di velocità (il Tier 1 di Anthropic consente 10K token di input al minuto), uno scan di 60 override più un turno di chat immediato nello stesso minuto restituirà <em>HTTP 429: rate limit exceeded</em>. Con 10 override per esecuzione, i tuoi turni di chat post-scan restano comodamente sotto il limite. I siti con più override di così hanno solo bisogno di alcune esecuzioni in più per coprire tutto &mdash; il report di ogni esecuzione è salvato come sessione propria, quindi puoi lavorare su ognuna in modo indipendente."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — il più veloce ed economico. Va bene per scan a basso rischio su siti piccoli."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — bilanciato. Gestisce bene gli scan di routine a una frazione del costo di Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — il più capace, predefinito. Il classificatore più sicuro per scoperte che richiedono giudizio sottile."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Sulla differenza di costo.</strong> <strong>Al momento della stesura</strong>, uno scan tipico su un sito con 50 override usa circa 60K token di input e produce circa 5K token di output. Costo approssimativo per scan: <strong>~0,08$ con Haiku, ~0,23$ con Sonnet, ~1,13$ con Opus</strong>. I turni di chat sono molto più piccoli (5K&ndash;10K token di input ciascuno), quindi il costo per turno è circa 10&times; inferiore a uno scan. I prezzi pubblicati da Anthropic sono la fonte di verità su <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; i numeri sopra sono approssimativi e possono variare nel tempo. Tieni d'occhio l'uso su <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> per qualche esecuzione prima di decidere se scendere dalla scelta predefinita Opus a un livello più economico."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Navigazione del componente"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Metodo 2: esegui scan automatico (con la tua chiave API %s salvata)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Nessuna chiave API %s salvata."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Chiave API salvata."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="L'estensione eseguirà la revisione degli override sul server usando la tua chiave API salvata, senza copia-incolla. Il report è salvato automaticamente come nuova sessione."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Clicca qui sotto per avviare uno scan. L'estensione recupera ogni override segnalato su questo sito, lo invia al tuo fornitore IA con la tua chiave API salvata, e salva il report risultante come nuova sessione. Sarai reindirizzato al report quando finisce."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Una chiamata API per scan. I siti con più di %d override sono limitati ai primi %d per esecuzione (configurabile in <em>Opzioni &rarr; Chiavi &amp; token &rarr; Override per scan</em>); rilancia per il prossimo lotto, oppure usa il prompt da copia-incolla del Metodo 1 per dimensione illimitata. La pagina può fare pausa per 30&ndash;90 secondi mentre l'IA risponde &mdash; è normale, non navigare via."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Questo chiamerà l'API %s con la tua chiave salvata e può richiedere da 30 a 90 secondi. Continuare?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Esegui scan automatico ora"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Questo metodo esegue l'intera revisione lato server &mdash; nessun copia-incolla, nessuna seconda finestra. Clicca il pulsante <em>Opzioni</em> proprio sotto, scegli il tuo fornitore IA nella scheda <em>Chiavi &amp; token</em>, incolla la sua chiave API e Salva. La chiave resta nel database del tuo sito; solo questo sito può usarla. Il Metodo 1 sopra funziona ancora senza chiave API se preferisci il flusso copia-incolla."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Scan automatico in corso…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Chiamata all'API %s e analisi dei tuoi override. Di solito richiede 30-90 secondi. Per favore non chiudere questa finestra."

