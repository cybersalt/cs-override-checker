COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Dove vive questo backup"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="I contenuti dei backup sono memorizzati nel database, non su disco. Specificamente, nella tabella <code>#__csoverridechecker_backups</code> — la colonna <code>contents_b64</code> contiene il contenuto del file codificato in base64."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Significa che un backup del database li cattura anche. Disinstallare il componente cancella la tabella insieme a tutti i backup memorizzati."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Sul tuo livello dell'API Anthropic:</strong> sia lo scan automatico sia le funzioni di chat contano sul limite di token al minuto di Anthropic. Il Tier 1 predefinito di Anthropic (10.000 token di input al minuto) basta per uno scan singolo su un sito piccolo, ma farà scattare il rate limit durante le correzioni via chat a più turni. Il Tier 2 (50.000 token al minuto, a pagamento) è comodo per la maggior parte delle sessioni di correzione reali. Vedi il tuo livello attuale su <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Reimposta override per revisione"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Scegli per quale/i template ricostruire il tracker degli override. Sono elencati solo i template attivati che hanno una cartella di override <code>html/</code> su disco. Spunta <em>Seleziona tutti</em> per il comportamento originale &ldquo;reimposta ogni template&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Nessun template attivato su questo sito ha una cartella di override <code>html/</code>, quindi non c'è nulla da reimpostare. Aggiungi un override (o attiva un template che ne ha) e riapri questa finestra."
