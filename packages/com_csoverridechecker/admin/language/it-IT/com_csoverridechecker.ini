COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Guida alla configurazione"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Usa l'IA che hai già"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Questa estensione non è legata a una sola IA. Tutto ciò che espone è una semplice API REST protetta da un normale token API Joomla, quindi qualsiasi assistente in grado di fare una richiesta web può eseguire una revisione &mdash; e lo può fare anche uno script scritto da te. Questa pagina spiega le differenze pratiche tra le opzioni così puoi sceglierne una e partire."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Cosa deve saper fare davvero il tuo assistente"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Invece di elencare quali prodotti funzionano &mdash; piani e funzionalità cambiano di continuo &mdash; ecco il requisito reale. Il tuo assistente deve poter:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Effettuare richieste HTTPS in uscita</strong> verso questo sito, inviando un header di richiesta personalizzato (<code>X-Joomla-Token</code>). Questo è l'unico requisito irrinunciabile."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Inviare richieste POST con un corpo JSON</strong>, se vuoi che applichi le correzioni e non si limiti a segnalare. Una revisione in sola lettura richiede solo GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Sostenere una conversazione ragionevolmente lunga</strong>, dato che recupera due file per ogni override segnalato prima di arrivare a un verdetto."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Non sei sicuro che il tuo sia adatto? Incolla il prompt e provalo. Un assistente che non riesce a raggiungere il tuo sito lo dirà subito, invece di fallire in silenzio."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Nessun token API Joomla salvato per ora."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Qualunque assistente tu scelga, gli serve un token API Joomla per leggere i tuoi file di override. Generane uno in <em>Sistema &rarr; Gestione &rarr; Utenti &rarr; il tuo utente &rarr; Token API Joomla</em>, poi incollalo nel prompt ogni volta oppure salvalo qui così il prompt si auto-compila."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Consigliato"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Il più comune"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Il migliore per più siti"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Funziona, con riserve"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Avanzato"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Agenti da terminale ed editor"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Per esempio: Claude Code, Codex CLI, Cursor, la modalità agente di GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="L'opzione più fluida, e quella che consigliamo se ne hai una a disposizione. Girano sulla tua macchina con accesso di rete in uscita senza restrizioni, nessuna allowlist di sandbox e nessun timeout di richiesta del browser, quindi una revisione lunga va dall'inizio alla fine senza doverla sorvegliare."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Copia il prompt di scan dalla Dashboard."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Incollalo nel tuo agente e invia. Non serve alcuna configurazione."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Quando compare il report, rispondi nella stessa sessione indicando i numeri delle scoperte che vuoi correggere."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Assistenti di chat nel browser"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Per esempio: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Funzionano tutti, purché l'account e la modalità che stai usando raggiungano davvero internet. È la configurazione più comune ed è perfettamente adeguata per un sito normale."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Assicurati che l'accesso web o la navigazione siano attivi per la conversazione. Alcuni livelli e alcune modalità rispondono solo a memoria."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Incolla il prompt di scan dalla Dashboard e invia."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Se il tuo sito ha molti override, chiedigli di lavorarli a lotti così che una singola risposta non superi il timeout di richiesta del browser."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Attenzione alle ipotesi dette con sicurezza.</strong> Se l'assistente inizia a produrre scoperte senza mai citare contenuti reali dei file, non riesce a raggiungere il tuo sito e se le sta inventando. Fermati e controlla la sua connettività invece di fidarti del report. <strong>Nello specifico per Claude.ai:</strong> se risponde &ldquo;Host not in allowlist&rdquo;, aggiungi il dominio di questo sito in <em>Impostazioni &rarr; Capacità &rarr; Esecuzione codice &rarr; Accesso rete</em>, poi avvia un nuovo chat &mdash; quello in corso continua a usare la vecchia allowlist."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="GPT personalizzati, Gems e altri assistenti configurabili"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Per esempio: un GPT personalizzato con le Actions, un Gem di Gemini, o qualsiasi assistente che ti permetta di registrare una tua API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Se la tua piattaforma ti permette di definire un assistente con proprie azioni API, registra una volta sola gli endpoint qui sotto e salta del tutto il passo del copia-incolla. È l'opzione più ordinata se gestisci diversi siti Joomla, perché l'assistente ricorda la configurazione tra una conversazione e l'altra."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Crea un nuovo assistente personalizzato e aggiungi un'azione API che punti all'URL dell'endpoint mostrato più in basso in questa pagina."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Imposta il nome dell'header di autenticazione su <code>X-Joomla-Token</code> e incolla il tuo token API Joomla come valore."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Incolla il prompt di scan della Dashboard nelle istruzioni dell'assistente così che conosca le regole di classificazione e il formato del report."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Modelli locali e self-hosted"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Per esempio: Ollama, LM Studio, llama.cpp, o qualsiasi modello self-hosted con uso degli strumenti"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Qualsiasi cosa con uso degli strumenti e accesso di rete funzionerà a livello meccanico, e nulla esce dalla tua infrastruttura, cosa che alcuni siti preferiranno."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Abilita l'uso di strumenti o funzioni e verifica che il modello raggiunga questo sito via HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Incolla il prompt di scan come prompt di sistema, poi chiedigli di iniziare."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Sii realistico sulla dimensione del modello.</strong> Revisionare un override è un'attività di giudizio, non una semplice ricerca. Un modello locale piccolo produrrà volentieri un report, ma è molto più probabile che si lasci sfuggire una vera regressione di sicurezza o ne inventi una che non esiste. Considera le scoperte di un modello piccolo come una prima passata, non come un verdetto."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Client MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Qualsiasi assistente che parla il Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Se il tuo assistente supporta MCP, installa <strong>MCP for J</strong> e il suo componente aggiuntivo gratuito <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. L'assistente controlla e corregge gli override con i propri strumenti, senza copia e incolla. È anche la strada migliore per le chat nel browser che supportano i connettori MCP, perché evita il timeout delle richieste del browser. Sono due estensioni separate e gratuite."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Il Metodo 2 è l'unica eccezione"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Il pulsante <em>Esegui scan automatico</em> della Dashboard esegue l'intera revisione lato server senza copia-incolla. Scegli il tuo fornitore in <em>Opzioni</em> e salva la chiave API di quel fornitore &mdash; <strong>Anthropic, OpenAI e Google Gemini eseguono tutti gli scan</strong>. L'unica cosa ancora solo Anthropic è il chat di follow-up su una sessione, dove gli chiedi di applicare correzioni e lui modifica i file tramite chiamate agli strumenti; quel loop è scritto sul protocollo di uso degli strumenti di Anthropic. Con OpenAI o Gemini selezionato ottieni il report completo, e puoi applicare le correzioni da solo con il prompt da copia-incolla del Metodo 1, che funziona con qualsiasi IA."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Chiave %s salvata &mdash; Metodo 2 disponibile"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Nessuna chiave API salvata per il tuo fornitore IA &mdash; il Metodo 1 funziona comunque"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpoint e autenticazione"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Tutto ciò che fa l'interfaccia di amministrazione è disponibile su questo URL base. Usalo quando registri un assistente personalizzato, o quando scrivi un tuo script o agente."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla non accetta <code>Authorization: Bearer</code> su queste rotte.</strong> Devi inviare il token nell'header <code>X-Joomla-Token</code>. Un header in formato Bearer restituisce 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Documentazione completa"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Riferimento completo degli endpoint, formato del report, risoluzione dei problemi e FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Leggi la documentazione"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Assistenza"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Questa estensione è gratuita, e resta gratuita"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Non esiste una versione Pro, né una chiave di licenza, né funzionalità tenute da parte. Tutto ciò che l'estensione sa fare è davanti a te. Ci farebbe comunque molto piacere sentirti &mdash; è il feedback dai siti reali ad aver plasmato ogni release finora."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Cosa aspettarsi."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt è una piccola azienda e questa estensione è regalata, quindi il supporto gratuito è offerto quando il lavoro per i clienti lo permette. È un vincolo reale, non un modo per liquidarti &mdash; preferiamo dirlo chiaramente piuttosto che lasciarti in attesa di una promessa che non possiamo mantenere. Le segnalazioni di bug vengono esaminate; l'aiuto aperto sulla configurazione potrebbe non esserlo."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Dove inviarlo"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Segnalazioni di bug, formulazioni poco chiare, una scoperta che l'IA ha sbagliato, un flusso di lavoro in cui l'estensione non si incastra, o un assistente che si è comportato in modo inatteso &mdash; tutto è utile."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Segnala un problema su GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Leggi la documentazione"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues è il posto migliore per tutto ciò che è riproducibile, perché è pubblico &mdash; la prossima persona con lo stesso problema trova la risposta invece di doverla richiedere."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Cosa includere"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Otterrai una risposta più rapida se ci aiuti a saltare la diagnosi:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="Il <strong>blocco di diagnostica</strong> di questa pagina (contiene le versioni di Joomla, PHP e dell'estensione in un solo incolla)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Quale metodo</strong> hai usato &mdash; il prompt da copia-incolla, lo scan automatico, o codice tuo &mdash; e <strong>quale assistente IA</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Cosa ti <strong>aspettavi</strong> che accadesse, e cosa è <strong>effettivamente</strong> accaduto."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Se l'IA ha sbagliato una scoperta, il <strong>report della sessione salvata</strong> &mdash; usa <em>Scarica report</em> nella pagina della sessione. Ci dà le scoperte esatte e il ragionamento da esaminare."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Anche le idee sono benvenute"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Se l'estensione fa quasi ciò che ti serve ma non del tutto, diccelo. Diverse funzionalità sono nate perché una persona ha descritto un flusso di lavoro a cui non avevamo pensato."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnostica"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Copia questo nella tua segnalazione così non dovremo chiedertelo."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Copia diagnostica"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Questo blocco non contiene segreti. Registra solo se una chiave o un token è salvato, mai il valore."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Rivelazione tra {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Ritardo di rivelazione al passaggio (secondi)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Le chiavi e i token mostrati in questa estensione sono sfocati per impostazione predefinita, così una condivisione dello schermo, uno screencast o un'occhiata alle tue spalle non li rivelano. Tieni il puntatore su un valore sfocato per questo numero di secondi e verrà rivelato; un conto alla rovescia ti dice che il timer è partito. Spostando il puntatore si annulla. Predefinito <strong>3</strong>. Imposta <strong>0</strong> per rivelare subito al passaggio del puntatore, il che elimina la protezione contro un puntatore che passa semplicemente sopra al valore."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Nascondi automaticamente dopo la rivelazione (secondi)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Una volta che un valore è stato rivelato, sfocalo di nuovo dopo questo numero di secondi anche se il puntatore è ancora sopra. Copre il caso in cui dai un'occhiata a una chiave e vieni interrotto, lasciandola esposta su uno schermo incustodito. Predefinito <strong>8</strong>. Imposta <strong>0</strong> per tenerlo visibile finché non sposti il puntatore."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Fornitore IA"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Quale servizio IA chiama il pulsante integrato <em>Esegui scan automatico</em>. Fornisci tu la chiave per quello che scegli, ed è usata solo da questo sito. Questa impostazione <strong>non</strong> influisce sul flusso del prompt da copia-incolla &mdash; quello funziona con qualsiasi IA e non richiede alcuna chiave."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Tutti e tre i fornitori possono eseguire uno scan.</strong> Il chat di follow-up su una sessione &mdash; dove gli chiedi di applicare correzioni e lui modifica i file tramite chiamate agli strumenti &mdash; è attualmente <strong>solo Anthropic</strong>, perché quel loop è scritto sul protocollo di uso degli strumenti di Anthropic. Con OpenAI o Gemini selezionati ottieni comunque il report completo; per farti applicare le correzioni, passa ad Anthropic oppure usa il flusso del prompt da copia-incolla, che funziona con qualsiasi IA."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Chiave API OpenAI"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="La tua chiave API OpenAI personale (inizia con <code>sk-</code>). Ottienine una su <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. È memorizzata su questo server e usata solo per chiamare api.openai.com per tuo conto."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Chiave API Google Gemini"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="La tua chiave API Google AI Studio personale. Ottienine una su <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. È memorizzata su questo server e usata solo per chiamare l'API Gemini per tuo conto."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — il più capace, predefinito."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — più veloce ed economico. Va bene per scan a basso rischio."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — il più capace, predefinito."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — più veloce ed economico. Va bene per scan a basso rischio."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Nessuna chiave API salvata per %s. Aggiungine una in Opzioni, oppure cambia fornitore."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="Non hai il permesso di recuperare un token API. Questa azione richiede il permesso di scrittura di Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Non è stato possibile determinare un utente connesso, quindi non c'è alcun token da recuperare."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="Il plugin <strong>Utente - Token API Joomla</strong> è disattivato, quindi Joomla non può ancora emettere un token API. Attivalo e riprova."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Il tuo token è stato emesso, ma il plugin <strong>Autenticazione API - Token API Joomla</strong> è disattivato, quindi Joomla rifiuterà il token sulle richieste API in entrata finché non attivi anche quel plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="I tuoi gruppi utente non sono nell'allowlist del plugin Utente - Token API Joomla, quindi Joomla non ti emetterà un token. Aggiungi uno dei tuoi gruppi all'impostazione Gruppi utente consentiti di quel plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Questo sito non ha un secret impostato in configuration.php, quindi non è possibile derivare un token API."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ERROR="Impossibile recuperare il tuo token API Joomla: %s"
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_NOT_FOUND="Il plugin Utente - Token API Joomla non è installato su questo sito."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ALREADY="Il plugin Utente - Token API Joomla era già attivato."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_SUCCESS="Il plugin Utente - Token API Joomla è stato attivato."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ERROR="Impossibile attivare il plugin Utente - Token API Joomla: %s"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON="Recupera il mio token API Joomla"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Recupero in corso..."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="Attiva il plugin del token"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_CREATED_NOTICE="È stato generato un nuovo token API Joomla per il tuo account."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_EXISTING_NOTICE="Questo è il token API Joomla già esistente per il tuo account."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Tratta questo token come una password. Autentica come te su tutta l'API Web Services di Joomla. Invialo solo nell'header X-Joomla-Token, mai in un URL."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_WORKING="Recupero del tuo token API Joomla in corso..."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE="Attivalo ora"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE_AUTH="Il tuo token è stato inserito, ma il plugin <strong>Autenticazione API - Token API Joomla</strong> è disattivato, quindi Joomla lo rifiuterà sulle richieste API in entrata finché non attivi anche quel plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_SAVE_REMINDER="Il tuo token API Joomla è stato inserito. Fai clic su Salva per conservarlo."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_NOT_FOUND="Il plugin Autenticazione API - Token API Joomla non è installato su questo sito."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ALREADY="Il plugin Autenticazione API - Token API Joomla era già attivato."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_SUCCESS="Il plugin Autenticazione API - Token API Joomla è stato attivato. Il tuo token API sarà ora accettato sulle richieste in entrata."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ERROR="Impossibile attivare il plugin Autenticazione API - Token API Joomla: %s"
COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="Attivare un plugin di Joomla è una modifica che riguarda tutto il sito, quindi richiede l'autorizzazione di Joomla per la gestione dei plugin oltre all'accesso a questo componente. Chiedi a un Super Utente di attivare il plugin o di concedere al tuo gruppo i diritti di Gestione sui Plugin."

; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Installazione incompleta: %1$d file su %2$d mancano o sono danneggiati."
CS_INTEGRITY_PROBLEMS_BODY="%s non è stato installato completamente, quindi alcune parti potrebbero non funzionare. Installa di nuovo lo stesso pacchetto per ripararlo. Se l'installazione fallisce ancora, un software di sicurezza sul server (ad esempio Imunify360 Proactive Defense) potrebbe bloccare l'installer di Joomla: controlla il suo registro degli incidenti."
CS_INTEGRITY_CHANGED_TITLE="%1$d file su %2$d differiscono dalla versione rilasciata."
CS_INTEGRITY_CHANGED_BODY="Succede dopo un aggiornamento non riuscito, o quando qualcuno modifica direttamente i file di %s. Installa di nuovo lo stesso pacchetto per ripristinarli."
CS_INTEGRITY_OK="Tutti i %1$d file corrispondono alla versione rilasciata."
CS_INTEGRITY_NOLIST="Questa build non contiene un elenco dei file, quindi il controllo dei file non è disponibile."
CS_INTEGRITY_SHOW_FILES="Mostra file"
CS_INTEGRITY_UNREADABLE="Elenco file illeggibile"
CS_INTEGRITY_MISSING="Mancante"
CS_INTEGRITY_EMPTY="Vuoto (0 byte)"
CS_INTEGRITY_CHANGED="Modificato"
CS_INTEGRITY_MORE="e altri %d"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Non è stato scritto nulla. Il nuovo contenuto aggiunge codice che una correzione non può aggiungere a un override: %s. Il codice iniettato ha questo aspetto, quindi viene rifiutato anche se la richiesta sembrava ragionevole. Se sei sicuro che la modifica sia corretta, controllala e apportala tu stesso nel file."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Non ripristinato. Questo backup contiene codice che il file attuale non ha: %s. Potrebbe essere una backdoor rimossa da una correzione, quindi un'IA o una chiamata API non può rimetterla. Se vuoi riavere questa versione, leggi il backup e ripristinalo dalla schermata Backup file."
