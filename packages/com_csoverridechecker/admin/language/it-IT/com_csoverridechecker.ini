COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Modifica dati Override Checker e file di override"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Permette agli utenti dei gruppi corrispondenti di applicare correzioni, ripristinare backup, respingere segnalazioni di override, e creare o eliminare sessioni. Implica Visualizza."

COM_CSOVERRIDECHECKER_DASHBOARD="Dashboard"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="Endpoint API attivo"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Qualsiasi utente con un token API Joomla valido e l'autorizzazione core.manage su questo componente può leggere i dati attuali di override dei template di questo sito."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL dell'endpoint"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Informazioni"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="API Web Services che espone il tracker nativo #__template_overrides perché qualsiasi assistente IA — o qualsiasi client con un token API Joomla — possa esaminare ogni override segnalato, classificarlo e applicare patch sul posto. Ogni patch viene prima salvata automaticamente nel database ed è reversibile dalla vista Backup file."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Versione"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Inizia qui."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Questa è l'unica scheda che ti serve per una revisione normale. Esegui il prompt, ottieni il report, poi di' al tuo assistente nello stesso chat quali scoperte correggere."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Metodo 1: revisione con qualsiasi assistente IA"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="L'estensione espone i tuoi dati di override tramite un'API REST standard, quindi <strong>qualsiasi</strong> assistente IA in grado di fare una richiesta HTTPS può eseguire la revisione — questo metodo non ha nulla di specifico di un fornitore. Copia il prompt qui sotto nell'assistente che usi già: produrrà una revisione di sicurezza di ogni override segnalato su questo sito, poi applicherà le correzioni che confermi. Non sai se il tuo funzionerà? Guarda il pulsante <em>Guida alla configurazione</em> in cima a questa pagina."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Genera un token API Joomla (una volta sola)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="Nell'admin Joomla: <em>Sistema → Utenti → Mio profilo → scheda Token API Joomla</em>. Clicca l'icona dell'occhio per rivelare il token, poi copialo. <strong>Se vuoi salvarlo in modo permanente</strong>, vai su <em>Opzioni → Chiavi e token</em> in questo componente, incollalo nel campo <em>Token API Joomla</em> e Salva &mdash; il prompt sotto si auto-compilerà con il token, così non dovrai incollarlo a ogni scansione. Altrimenti, tieni il token a portata di mano e incollalo nel prompt nel passo 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Apri il tuo assistente IA e incolla il prompt qui sotto."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Usa l'assistente che preferisci — un agente da terminale o editor (Claude Code, Codex CLI, Cursor, Copilot), un chat nel browser (ChatGPT, Claude.ai, Gemini), un GPT personalizzato o un Gem, oppure un modello locale. L'unico requisito è che possa fare richieste HTTPS in uscita con un header personalizzato. <strong>Se NON hai salvato il token in Opzioni al passo 1</strong>, sostituisci il testo segnaposto tra parentesi angolari (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) con il token che hai copiato. L'URL del sito e gli endpoint sono già compilati per questo sito. Trovi consigli per ogni assistente nella pagina <em>Guida alla configurazione</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Invia."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Il tuo assistente scaricherà la lista degli override, recupererà override e sorgente del core per ciascuno, e produrrà una tabella per scoperta più un riassunto in linguaggio semplice che puoi inoltrare."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Digli cosa correggere — nello stesso chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Una volta pubblicato il report, ti chiederà quali scoperte vuoi correggere. Rispondi con quelle che confermi (es. <em>«correggi #1 e #3, lascia stare #2, quella di terze parti la chiedo allo sviluppatore»</em>). Ogni file viene salvato prima della patch, quindi tutto può essere annullato. <strong>La seconda scheda qui sotto ti serve solo se hai chiuso il chat e vuoi tornarci più tardi.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (copia e incolla nel tuo assistente IA):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Copia prompt di scan"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Copiato!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="La maggior parte degli utenti NON ha bisogno di questa scheda."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Usalo solo se stai avviando un <em>nuovo chat</em> per applicare correzioni di una revisione precedente — per esempio hai chiuso il chat originale durante la notte, stai passando la revisione a un compagno di squadra, o hai eseguito lo scan in un chat nel browser e vuoi fare le correzioni in un agente da terminale. Se il tuo chat di scan è ancora aperto, scorri verso l'alto — continua semplicemente in quel chat."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Continua una revisione precedente in un nuovo chat"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Incolla questo prompt in un nuovo chat — in qualsiasi assistente, non per forza quello che ha eseguito lo scan — per dargli il contesto della tua revisione precedente. Recupererà il report della sessione precedente, elencherà le scoperte e ti chiederà quali correggere. Ogni file è salvato prima di qualsiasi patch, quindi tutto è reversibile."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Copia prompt di correzione"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Registro sessioni"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="I report inviati dal tuo assistente IA (o incollati a mano) sono salvati qui come sessioni. Clicca una sessione per vedere il report completo."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Ancora nessuna sessione. Esegui il prompt sopra e lascia che il tuo assistente invii il report automaticamente (POST), oppure clicca 'Nuova sessione' per incollarlo."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nuova sessione"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Vedi tutte le sessioni"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Dopo la revisione"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Quando hai finito di agire sulle raccomandazioni della revisione, vorrai cancellare i badge 'Modifiche trovate' che Joomla mostra in Template, così non continueranno a segnalare gli override che hai già gestito."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Raccomandato — revisione per template"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Apri la lista dei template del sito. Ogni template con un badge 'Modifiche trovate' può essere aperto individualmente perché tu possa respingere le righe di override specifiche che hai gestito. Più lento, ma mantieni una traccia di audit per riga."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Apri gestione template del sito"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="In massa — segna tutti gli override come revisionati"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Strada più veloce: cancellare ogni riga nel tracker degli override in un solo passo. Fallo solo dopo aver effettivamente revisionato ogni scoperta. Equivale a usare il 'Respingi tutto' di Joomla su ogni template insieme."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Segna tutti come revisionati…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Conferma: segna tutti gli override come revisionati"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Questo cancella ogni riga che Joomla sta attualmente tracciando nel tracker degli override. I badge 'Modifiche trovate' in Template scompariranno, e l'endpoint API di questo sito restituirà zero righe finché il prossimo aggiornamento del core di Joomla non le ripopolerà. L'azione non può essere annullata se non cliccando 'Ricostruisci tracker override' qui sotto per ri-scandagliare."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Confermo di aver revisionato ogni override segnalato e accetto la responsabilità per qualsiasi problema non affrontato."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="Sì — segna tutti come revisionati"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="%d riga/righe di override segnata/e come revisionata/e e cancellata/e dal tracker."
