COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Il file è scritto via PHP da questa pagina admin; nessun FTP necessario. L'utente web deve avere permessi di scrittura sul percorso target. La root del sito Joomla è il limite — il ripristino rifiuta di scrivere fuori da essa."
