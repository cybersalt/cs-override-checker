COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Behandel dit token als een wachtwoord. Het authenticeert als u in de hele Joomla Web Services API. Stuur het alleen mee in de X-Joomla-Token-header, nooit in een URL."
