; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Installatie onvolledig: %1$d van %2$d bestanden ontbreken of zijn beschadigd."
CS_INTEGRITY_PROBLEMS_BODY="%s is niet volledig geïnstalleerd, dus onderdelen werken mogelijk niet. Installeer hetzelfde pakket opnieuw om het te herstellen. Mislukt de installatie opnieuw, dan blokkeert beveiligingssoftware op de server (bijvoorbeeld Imunify360 Proactive Defense) mogelijk het installatieprogramma van Joomla: controleer het incidentlogboek daarvan."
CS_INTEGRITY_CHANGED_TITLE="%1$d van %2$d bestanden wijken af van de uitgebrachte versie."
CS_INTEGRITY_CHANGED_BODY="Dit gebeurt na een mislukte update, of wanneer iemand de bestanden van %s rechtstreeks bewerkt. Installeer hetzelfde pakket opnieuw om ze te herstellen."
CS_INTEGRITY_OK="Alle %1$d bestanden komen overeen met de uitgebrachte versie."
CS_INTEGRITY_NOLIST="Deze build bevat geen bestandslijst, dus de bestandscontrole is niet beschikbaar."
