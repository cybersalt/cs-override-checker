COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="API-endpoint actief"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Elke gebruiker met een geldig Joomla API-token en core.manage-permissie op deze component kan de huidige template-override-gegevens van deze site lezen."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="Endpoint-URL"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Over"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API die de native #__template_overrides-tracker beschikbaar stelt zodat elke AI-assistent — of elke client met een Joomla API-token — elke gemarkeerde override kan beoordelen, classificeren en patches direct kan toepassen. Elke patch wordt eerst automatisch geback-upt naar de database en is omkeerbaar vanuit de weergave Bestandsback-ups."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Versie"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Begin hier."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Dit is de enige kaart die u nodig hebt voor een normale beoordeling. Voer de prompt uit, ontvang het rapport en vertel uw assistent dan in dezelfde chat welke bevindingen gerepareerd moeten worden."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Methode 1: beoordeling met een willekeurige AI-assistent"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="De extensie stelt uw override-gegevens beschikbaar via een standaard REST API, dus <strong>elke</strong> AI-assistent die een HTTPS-verzoek kan doen, kan de beoordeling uitvoeren — er is niets leverancierspecifieks aan deze methode. Kopieer de prompt hieronder naar de assistent die u al gebruikt; die maakt dan een beveiligingsbeoordeling van elke gemarkeerde override op deze site en past daarna de fixes toe die u bevestigt. Twijfelt u of de uwe werkt? Zie de knop <em>Installatiegids</em> bovenaan deze pagina."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Een Joomla API-token genereren (eenmalig)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="In de Joomla-admin: <em>Systeem → Gebruikers → Mijn profiel → tabblad Joomla API-token</em>. Klik op het oogpictogram om het token te onthullen en kopieer het. <strong>Als u het permanent wilt opslaan</strong>, ga naar <em>Opties → Sleutels en tokens</em> in deze component, plak het in het veld <em>Joomla API-token</em> en sla op &mdash; de prompt hieronder wordt dan automatisch gevuld met het token, zodat u het niet bij elke scan hoeft te plakken. Houd het token anders bij de hand en plak het in de prompt in stap 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Open uw AI-assistent en plak de prompt hieronder."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Gebruik de assistent die u verkiest — een terminal- of editoragent (Claude Code, Codex CLI, Cursor, Copilot), een browserchat (ChatGPT, Claude.ai, Gemini), een eigen GPT of Gem, of een lokaal model. De enige vereiste is dat hij uitgaande HTTPS-verzoeken met een aangepaste header kan doen. <strong>Als u het token NIET in Opties in stap 1 hebt opgeslagen</strong>, vervang dan de plaatshouder-tekst tussen punthaken (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) door het token dat u hebt gekopieerd. Site-URL en endpoints zijn al ingevuld voor deze site. Tips per assistent staan op de pagina <em>Installatiegids</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Verzenden."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Uw assistent haalt de lijst met overrides op, haalt voor elk de override- en core-bron op, en produceert een tabel per bevinding plus een eenvoudige samenvatting die u kunt doorsturen."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Vertel wat er gerepareerd moet worden — in dezelfde chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Zodra het rapport is geplaatst, vraagt de assistent welke bevindingen u gerepareerd wilt hebben. Antwoord met degene die u bevestigt (bijv. <em>«repareer #1 en #3, laat #2 met rust, de derde-partij vraag ik aan de ontwikkelaar»</em>). Van elk bestand wordt vóór het patchen een back-up gemaakt, dus alles kan worden teruggedraaid. <strong>U hebt de tweede kaart hieronder alleen nodig als u de chat hebt gesloten en er later op wilt terugkomen.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (kopiëren en plakken in uw AI-assistent):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Scan-prompt kopiëren"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Gekopieerd!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="De meeste gebruikers hebben deze kaart NIET nodig."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Gebruik dit alleen als u een <em>nieuwe chat</em> start om fixes van een eerdere beoordeling toe te passen — bijvoorbeeld u hebt de oorspronkelijke chat 's nachts gesloten, u geeft de beoordeling door aan een teamgenoot, of u hebt de scan in een browserchat uitgevoerd en wilt de fixes in een terminalagent doen. Als uw scan-chat nog open is, scrol omhoog — ga gewoon verder in die chat."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Een eerdere beoordeling voortzetten in een nieuwe chat"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Plak deze prompt in een nieuwe chat — in elke assistent, niet per se degene die de scan uitvoerde — om hem de context van uw eerdere beoordeling te geven. Hij haalt het rapport van de eerdere sessie op, somt de bevindingen op en vraagt welke u wilt repareren. Elk bestand wordt geback-upt voor elke patch, dus alles is omkeerbaar."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Fix-prompt kopiëren"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Sessielogboek"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Rapporten ingediend door uw AI-assistent (of handmatig geplakt) worden hier opgeslagen als sessies. Klik op een sessie om het volledige rapport te bekijken."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Nog geen sessies. Voer de prompt hierboven uit en laat uw assistent het rapport automatisch terug-POSTen, of klik op 'Nieuwe sessie' om het te plakken."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nieuwe sessie"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Alle sessies bekijken"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Na de beoordeling"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Wanneer u klaar bent met handelen op de aanbevelingen uit de beoordeling, wilt u de 'Wijzigingen gevonden'-badges wissen die Joomla in Templates toont, zodat ze niet langer de overrides markeren die u al hebt afgehandeld."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Aanbevolen — beoordeling per template"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Open de site-templatelijst. Elke template met een 'Wijzigingen gevonden'-badge kan afzonderlijk worden geopend zodat u de specifieke override-rijen die u hebt afgehandeld kunt afwijzen. Langzamer, maar u behoudt een audittrail per rij."
