COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Installatiegids"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Gebruik de AI die u al hebt"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Deze extensie is niet gebonden aan één bepaalde AI. Alles wat ze beschikbaar stelt is een gewone REST-API, beveiligd met een standaard Joomla API-token, dus elke assistent die een webverzoek kan doen kan een beoordeling uitvoeren &mdash; en een script dat u zelf schrijft ook. Deze pagina behandelt de praktische verschillen tussen de opties zodat u er een kunt kiezen en aan de slag kunt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Wat uw assistent daadwerkelijk moet kunnen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="In plaats van op te sommen welke producten werken &mdash; abonnementen en functies veranderen voortdurend &mdash; hier is de echte vereiste. Uw assistent moet het volgende kunnen:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Uitgaande HTTPS-verzoeken doen</strong> naar deze site, met een aangepaste request-header (<code>X-Joomla-Token</code>). Dit is de enige harde vereiste."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>POST-verzoeken met een JSON-body versturen</strong>, als u wilt dat hij fixes toepast in plaats van alleen rapporteert. Een alleen-lezen beoordeling heeft genoeg aan GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Een redelijk lang gesprek volhouden</strong>, want hij haalt voor elke gemarkeerde override twee bestanden op voordat hij tot een oordeel komt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Niet zeker of de uwe voldoet? Plak gewoon de prompt en kijk wat er gebeurt. Een assistent die uw site niet kan bereiken, zegt dat meteen in plaats van stilletjes te falen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Nog geen Joomla API-token opgeslagen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Welke assistent u ook kiest, hij heeft een Joomla API-token nodig om uw override-bestanden te lezen. Genereer er een bij <em>Systeem &rarr; Beheren &rarr; Gebruikers &rarr; uw gebruiker &rarr; Joomla API-token</em>, en plak het daarna telkens in de prompt of sla het hier op zodat de prompt automatisch wordt ingevuld."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Aanbevolen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Meest voorkomend"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Beste voor meerdere sites"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Werkt, met kanttekeningen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Geavanceerd"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Terminal- en editor-agents"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Bijvoorbeeld: Claude Code, Codex CLI, Cursor, GitHub Copilot agent mode, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="De soepelste optie, en wat wij zouden aanraden als u er een tot uw beschikking hebt. Deze draaien op uw eigen machine met onbeperkte uitgaande netwerktoegang, zonder sandbox-allowlist en zonder request-timeout van de browser, dus een lange beoordeling loopt van begin tot eind zonder dat u erbij hoeft te blijven."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Kopieer de scan-prompt van het Dashboard."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Plak hem in uw agent en verstuur. Er is geen configuratie nodig."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Wanneer het rapport verschijnt, antwoord dan in dezelfde sessie met de nummers van de bevindingen die u gerepareerd wilt hebben."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Chat-assistenten in de browser"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Bijvoorbeeld: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Deze werken allemaal, mits het account en de modus die u gebruikt daadwerkelijk het internet kunnen bereiken. Dit is de meest voorkomende opzet en prima geschikt voor een normale site."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Zorg dat webtoegang of browsen is ingeschakeld voor het gesprek. Sommige tiers en sommige modi antwoorden alleen uit het geheugen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Plak de scan-prompt van het Dashboard en verstuur."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Als uw site veel overrides heeft, vraag hem dan om ze in batches af te werken zodat één antwoord niet voorbij de request-timeout van de browser loopt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Let op zelfverzekerd giswerk.</strong> Als de assistent bevindingen begint te produceren zonder ooit echte bestandsinhoud te citeren, kan hij uw site niet bereiken en verzint hij ze. Stop en controleer zijn connectiviteit in plaats van het rapport te vertrouwen. <strong>Specifiek voor Claude.ai:</strong> als het antwoordt met &ldquo;Host not in allowlist&rdquo;, voeg dan het domein van deze site toe onder <em>Instellingen &rarr; Mogelijkheden &rarr; Code-uitvoering &rarr; Netwerktoegang</em> en start daarna een nieuwe chat &mdash; de lopende chat blijft de oude allowlist gebruiken."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Custom GPTs, Gems en andere configureerbare assistenten"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Bijvoorbeeld: een custom GPT met Actions, een Gemini Gem, of elke assistent waarmee u uw eigen API kunt registreren"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Als uw platform u toelaat een assistent met eigen API-acties te definiëren, registreer dan de onderstaande endpoints één keer en sla de kopieer-en-plakstap helemaal over. Dit is de netste optie als u meerdere Joomla-sites beheert, omdat de assistent de opzet onthoudt tussen gesprekken door."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Maak een nieuwe aangepaste assistent en voeg een API-actie toe die verwijst naar de endpoint-URL verderop op deze pagina."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Stel de naam van de authenticatie-header in op <code>X-Joomla-Token</code> en plak uw Joomla API-token als waarde."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Plak de scan-prompt van het Dashboard in de instructies van de assistent zodat hij de classificatieregels en het rapportformaat kent."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Lokale en zelfgehoste modellen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Bijvoorbeeld: Ollama, LM Studio, llama.cpp, of elk zelfgehost model met tool calling"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Alles met tool calling en netwerktoegang werkt technisch gezien, en niets verlaat uw eigen infrastructuur, wat sommige sites zullen verkiezen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Schakel tool- of function calling in en controleer dat het model deze site via HTTPS kan bereiken."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Plak de scan-prompt als systeemprompt en vraag het model vervolgens te beginnen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Wees realistisch over de modelgrootte.</strong> Een override beoordelen is een oordeelstaak, geen opzoekklus. Een klein lokaal model produceert probleemloos een rapport, maar de kans is veel groter dat het een echte beveiligingsregressie mist of er een verzint die er niet is. Behandel bevindingen van een klein model als een eerste doorloop, niet als een oordeel."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP-clients"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Elke assistent die het Model Context Protocol spreekt"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Ondersteunt uw assistent MCP, installeer dan <strong>MCP for J</strong> en de gratis add-on <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Uw assistent controleert en corrigeert overrides dan met eigen tools, zonder kopiëren en plakken. Het is ook de betere route voor browserchats met MCP-connectors, omdat het de time-out van browserverzoeken vermijdt. Beide zijn afzonderlijke, gratis extensies."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Methode 2 is de enige uitzondering"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="De knop <em>Automatische scan uitvoeren</em> op het Dashboard voert de hele beoordeling aan de serverkant uit, zonder kopiëren en plakken. Kies uw aanbieder onder <em>Opties</em> en sla de API-sleutel van die aanbieder op &mdash; <strong>Anthropic, OpenAI en Google Gemini kunnen allemaal scans uitvoeren</strong>. Het enige dat nog alleen met Anthropic werkt, is de vervolgchat op een sessie, waarin u vraagt om fixes toe te passen en er bestanden worden bewerkt via tool calls; die loop is geschreven tegen het tool-calling-protocol van Anthropic. Met OpenAI of Gemini geselecteerd krijgt u het volledige rapport, en kunt u de fixes zelf toepassen met de kopieer-en-plak-prompt uit Methode 1, die met elke AI werkt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s-sleutel opgeslagen &mdash; Methode 2 beschikbaar"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Geen API-sleutel opgeslagen voor uw AI-aanbieder &mdash; Methode 1 werkt nog steeds"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpoint en authenticatie"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Alles wat de beheerinterface doet is beschikbaar op deze basis-URL. Gebruik hem bij het registreren van een aangepaste assistent, of bij het schrijven van uw eigen script of agent."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla accepteert <code>Authorization: Bearer</code> niet op deze routes.</strong> U moet het token meesturen in de <code>X-Joomla-Token</code>-header. Een header in Bearer-formaat geeft 401 Forbidden terug."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Volledige documentatie"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Volledige endpoint-referentie, rapportformaat, probleemoplossing en FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Lees de documentatie"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Hulp krijgen"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Deze extensie is gratis, en blijft gratis"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Er is geen Pro-versie, geen licentiesleutel en geen achtergehouden functie. Alles wat de extensie kan, ligt voor u. We horen toch heel graag van u &mdash; feedback van echte sites heeft tot nu toe elke release gevormd."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Wat u kunt verwachten."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt is een klein bedrijf en deze extensie wordt gratis weggegeven, dus gratis ondersteuning wordt geboden voor zover de tijd het toelaat naast het klantenwerk. Dat is een echte beperking en geen afwimpeling &mdash; we zeggen het liever ronduit dan u te laten wachten op een belofte die we niet kunnen nakomen. Bugmeldingen worden bekeken; open vragen over configuratie mogelijk niet."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Waar u het naartoe stuurt"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Bugmeldingen, verwarrende formuleringen, een bevinding die de AI verkeerd had, een workflow waar de extensie niet op past, of een assistent die zich onverwacht gedroeg &mdash; het is allemaal nuttig."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Een probleem melden op GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Lees de documentatie"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues is de beste plek voor alles wat reproduceerbaar is, omdat het openbaar is &mdash; de volgende persoon met hetzelfde probleem vindt het antwoord in plaats van het opnieuw te vragen."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Wat u moet meesturen"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="U krijgt sneller antwoord als u ons helpt de diagnose over te slaan:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="Het <strong>diagnoseblok</strong> van deze pagina (het bevat uw Joomla-, PHP- en extensieversies in één keer plakken)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Welke methode</strong> u hebt gebruikt &mdash; de kopieer-en-plak-prompt, de automatische scan, of uw eigen code &mdash; en <strong>welke AI-assistent</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Wat u <strong>verwachtte</strong> dat er zou gebeuren, en wat er <strong>daadwerkelijk</strong> gebeurde."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Als de AI een bevinding verkeerd had, het <strong>opgeslagen sessierapport</strong> &mdash; gebruik <em>Rapport downloaden</em> op de sessiepagina. Dat geeft ons de exacte bevindingen en redenering om naar te kijken."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Ideeën zijn ook welkom"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Als de extensie bijna doet wat u nodig hebt maar net niet, laat het ons weten. Verschillende functies zijn er gekomen omdat één persoon een workflow beschreef waar wij niet aan hadden gedacht."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnose"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Kopieer dit in uw melding zodat we er niet naar hoeven te vragen."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Diagnose kopiëren"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Dit blok bevat geen geheimen. Het legt alleen vast of een sleutel of token is opgeslagen, nooit de waarde."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Wordt getoond over {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Vertraging voor vasthouden-om-te-tonen (seconden)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Sleutels en tokens die in deze extensie worden getoond, zijn standaard vervaagd zodat een schermdeling, screencast of blik over de schouder ze niet laat uitlekken. Houd uw muisaanwijzer zoveel seconden boven een vervaagde waarde en hij wordt getoond; een aftelling laat zien dat de timer loopt. Wegbewegen annuleert het. Standaard <strong>3</strong>. Zet op <strong>0</strong> om direct bij hover te tonen, wat de bescherming wegneemt tegen een muisaanwijzer die louter over de waarde beweegt."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automatisch verbergen na tonen (seconden)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Zodra een waarde is getoond, wordt hij na zoveel seconden weer vervaagd, zelfs als de muisaanwijzer er nog boven staat. Dekt het geval waarin u een blik op een sleutel werpt en dan wordt gestoord, waardoor hij zichtbaar blijft op een onbeheerd scherm. Standaard <strong>8</strong>. Zet op <strong>0</strong> om hem zichtbaar te houden totdat u wegbeweegt."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="AI-aanbieder"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Welke AI-dienst de ingebouwde knop <em>Automatische scan uitvoeren</em> aanroept. U levert uw eigen sleutel voor welke u ook kiest, en die wordt alleen vanaf deze site gebruikt. Deze instelling heeft <strong>geen</strong> invloed op de kopieer-en-plak-promptworkflow &mdash; die werkt met elke AI en heeft helemaal geen sleutel nodig."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Alle drie de aanbieders kunnen een scan uitvoeren.</strong> De vervolgchat op een sessie &mdash; waarin u vraagt om fixes toe te passen en er bestanden worden bewerkt via tool calls &mdash; werkt momenteel <strong>alleen met Anthropic</strong>, omdat die loop is geschreven tegen het tool-calling-protocol van Anthropic. Met OpenAI of Gemini geselecteerd krijgt u nog steeds het volledige rapport; om fixes voor u te laten toepassen, zet u dit op Anthropic of gebruikt u de kopieer-en-plak-promptworkflow, die met elke AI werkt."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="OpenAI API-sleutel"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Uw persoonlijke OpenAI API-sleutel (begint met <code>sk-</code>). Verkrijg er een op <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. De sleutel wordt op deze server opgeslagen en alleen gebruikt om api.openai.com namens u aan te roepen."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Google Gemini API-sleutel"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Uw persoonlijke Google AI Studio API-sleutel. Verkrijg er een op <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. De sleutel wordt op deze server opgeslagen en alleen gebruikt om de Gemini API namens u aan te roepen."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — meest capabele, standaard."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — sneller en goedkoper. Prima voor risicoarme scans."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — meest capabele, standaard."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — sneller en goedkoper. Prima voor risicoarme scans."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Geen API-sleutel opgeslagen voor %s. Voeg er een toe onder Opties, of wissel van aanbieder."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="U hebt geen toestemming om een API-token op te halen. Deze actie vereist de schrijfpermissie van Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Er kon geen ingelogde gebruiker worden bepaald, dus er is geen token om op te halen."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="De plugin <strong>Gebruiker - Joomla API-token</strong> is uitgeschakeld, dus Joomla kan nog geen API-token uitgeven. Schakel hem in en probeer het opnieuw."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Uw token is uitgegeven, maar de plugin <strong>API-authenticatie - Joomla API-token</strong> is uitgeschakeld, dus Joomla zal het token weigeren bij binnenkomende API-verzoeken totdat u die plugin ook inschakelt."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Uw gebruikersgroepen staan niet op de allowlist in de plugin Gebruiker - Joomla API-token, dus Joomla geeft u geen token. Voeg een van uw groepen toe aan de instelling Toegestane gebruikersgroepen van die plugin."
