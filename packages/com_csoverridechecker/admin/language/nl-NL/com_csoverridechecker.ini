CS_INTEGRITY_UNREADABLE="Bestandslijst onleesbaar"
CS_INTEGRITY_MISSING="Ontbreekt"
CS_INTEGRITY_EMPTY="Leeg (0 bytes)"
CS_INTEGRITY_CHANGED="Gewijzigd"
CS_INTEGRITY_MORE="en nog %d"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Er is niets weggeschreven. De nieuwe inhoud voegt code toe die een correctie niet aan een override mag toevoegen: %s. Zo ziet geïnjecteerde code eruit, dus het wordt geweigerd, ook als het verzoek redelijk leek. Weet u zeker dat de wijziging klopt, controleer die dan en breng hem zelf aan in het bestand."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Niet hersteld. Deze back-up bevat code die het huidige bestand niet heeft: %s. Het kan een achterdeur zijn die een correctie heeft verwijderd, dus een AI of API-aanroep kan die niet terugzetten. Wilt u deze versie terug, lees dan de back-up en herstel hem via het scherm Bestandsback-ups."
