COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Methode 1: uw AI-assistent gebruiken"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Een kant-en-klare prompt kopiëren en plakken in de AI-assistent die u gebruikt — ChatGPT, Claude, Gemini, Copilot, Cursor of een lokaal model. Werkt zonder API-sleutel. Springt naar de prompt hieronder."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Methode 2: automatische scan uitvoeren"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Voert de override-beoordeling uit op deze server met uw opgeslagen %s API-sleutel. Slaat het rapport op als sessie. Springt naar de uitvoerknop hieronder."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Kies eerst een AI-aanbieder en sla de API-sleutel ervan op in het Opties-paneel om automatische scans in te schakelen. Gebruik tot dan Methode 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Loop elke ingeschakelde template opnieuw door en bouw de override-tracker opnieuw op. Gebruik dit nadat u templatebestanden buiten Joomla hebt bewerkt, of als de tracker van Joomla verouderd is."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Sleutels &amp; tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Optioneel. Kies hier een AI-aanbieder en sla de API-sleutel ervan op zodat de extensie scans automatisch kan uitvoeren, zonder kopieer-en-plak-prompt. Laat leeg om de kopieer-en-plak-prompt op het dashboard te blijven gebruiken met de AI die u al gebruikt."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API-sleutel"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Uw persoonlijke Anthropic API-sleutel (begint met <code>sk-ant-…</code>). Verkrijg er een op <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. De sleutel wordt op deze server opgeslagen en alleen gebruikt om api.anthropic.com namens u aan te roepen. Met een opgeslagen sleutel toont het Dashboard een knop <em>Automatische scan uitvoeren</em> die de override-beoordeling aan de serverkant aan Claude doorgeeft en het rapport terug opslaat als sessie — geen kopiëren-en-plakken nodig."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Elke automatische scan doet één API-aanroep naar de door u gekozen aanbieder, gefactureerd tegen de tarieven van die aanbieder voor het geselecteerde model. Sites met zeer veel overrides worden per uitvoering beperkt (zie <em>Overrides per scan</em> hieronder); voer opnieuw uit voor de rest, of gebruik de kopieer-en-plak-prompt op het dashboard voor onbeperkte grootte."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Scan-model"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Model dat wordt gebruikt voor de eenmalige <em>Automatische scan uitvoeren</em>-aanroep op het dashboard. De scan is een classificatietaak (alert / review / info per bevinding). <strong>Het krachtigste model is de standaardkeuze</strong> &mdash; de meest grondige beoordeling en de veiligste classifier voor bevindingen die subtiel oordeel vereisen. De kleinere modellen doen routinescans goed voor een fractie van de kosten en zijn geschikt voor risicoarme scans op kleine sites."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Chat-model"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Claude-model dat wordt gebruikt voor de chat-met-Claude follow-up op de sessiedetailpagina (waar u Claude vraagt fixes toe te passen of bevindingen te negeren). Tool-gebruik is veeleisender dan classificatie. <strong>Opus is de standaardkeuze</strong> &mdash; het meest betrouwbare tool-gebruiksgedrag en het laagste risico op een verkeerd toegepaste fix. Sonnet is een goed compromis voor sites met veel risicoarme follow-ups; Haiku kan moeite hebben met meerstapse tool-sequenties en wordt niet aanbevolen voor het chat-model tenzij kosten de hoogste prioriteit zijn."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API-token (voor de dashboard-prompt)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Optioneel. Genereer een Joomla API-token bij <em>Systeem &rarr; Gebruikers &rarr; Mijn profiel &rarr; Joomla API-token</em> en plak het hier. De scan/fix-prompts van het dashboard vullen het token dan automatisch in op de plaats van de plaatsaanduiding &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, zodat u zonder bewerking rechtstreeks kunt kopiëren &amp; plakken naar uw AI-assistent.<br><br><strong>Multi-admin waarschuwing:</strong> Joomla API-tokens authenticeren als <em>de gebruiker die ze heeft gegenereerd</em>. Als meerdere admins dit dashboard gebruiken, gebruikt de prompt het hier opgeslagen token &mdash; wat betekent dat de AI de API zal aanroepen geauthenticeerd als die ene gebruiker. Laat leeg zodat elke admin zijn eigen token plakt op gebruiksmoment."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Overrides per scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Hoeveel gemarkeerde template-overrides de knop <em>Automatische scan uitvoeren</em> beoordeelt in één enkele API-aanroep. Standaard <strong>10</strong>. Bereik 1&ndash;100. <strong>Lager is veiliger voor de chat-follow-up:</strong> het scanrapport groeit met het aantal bevindingen, en de tool-use-loop van de chat behoudt dat rapport als gespreksgeschiedenis. Op lage rate-limit-tiers (Tier 1 van Anthropic staat 10K input-tokens per minuut toe) zal een scan van 60 overrides plus een onmiddellijke chat-beurt binnen dezelfde minuut <em>HTTP 429: rate limit exceeded</em> teruggeven. Met 10 overrides per uitvoering blijven uw chat-beurten na de scan comfortabel onder de limiet. Sites met meer overrides dan dat hebben gewoon enkele extra uitvoeringen nodig om alles te dekken &mdash; het rapport van elke uitvoering wordt opgeslagen als zijn eigen sessie, dus u kunt elke sessie afzonderlijk doorwerken."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — snelst en goedkoopst. Geschikt voor risicoarme scans op kleine sites."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — gebalanceerd. Doet routinescans goed voor een fractie van de kosten van Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — meest capabel, standaard. De veiligste classifier voor bevindingen die subtiel oordeel vereisen."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Over het kostenverschil.</strong> <strong>Op het moment van schrijven</strong> gebruikt een typische scan op een site met 50 overrides ongeveer 60K input-tokens en produceert ongeveer 5K output-tokens. Globale kosten per scan: <strong>~$0,08 met Haiku, ~$0,23 met Sonnet, ~$1,13 met Opus</strong>. Chat-beurten zijn veel kleiner (5K&ndash;10K input-tokens elk), dus de kosten per beurt zijn ongeveer 10&times; lager dan een scan. Anthropic's gepubliceerde prijzen zijn de bron van waarheid op <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; de bovenstaande cijfers zijn benaderingen en kunnen in de loop van de tijd afwijken. Houd uw gebruik in de gaten op <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> voor enkele uitvoeringen voordat u beslist of u afstapt van de Opus-standaard naar een goedkopere tier."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Componentnavigatie"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Methode 2: automatische scan uitvoeren (met uw opgeslagen %s API-sleutel)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Geen %s API-sleutel opgeslagen."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API-sleutel opgeslagen."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="De extensie voert de override-beoordeling uit op de server met uw opgeslagen API-sleutel, zonder kopiëren-en-plakken. Het rapport wordt automatisch opgeslagen als nieuwe sessie."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Klik hieronder om een scan te starten. De extensie haalt elke gemarkeerde override op deze site op, stuurt deze met uw opgeslagen API-sleutel naar uw AI-aanbieder, en slaat het resulterende rapport op als nieuwe sessie. U wordt doorgestuurd naar het rapport wanneer het klaar is."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Eén API-aanroep per scan. Sites met meer dan %d overrides worden beperkt tot de eerste %d per uitvoering (configureerbaar in <em>Opties &rarr; Sleutels &amp; tokens &rarr; Overrides per scan</em>); voer opnieuw uit voor de volgende batch, of gebruik de kopieer-en-plak-prompt uit Methode 1 voor onbeperkte grootte. De pagina kan 30&ndash;90 seconden pauzeren terwijl de AI antwoordt &mdash; dat is normaal, navigeer niet weg."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Dit roept de %s API aan met uw opgeslagen sleutel en kan 30 tot 90 seconden duren. Doorgaan?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Automatische scan nu uitvoeren"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Deze methode voert de hele review server-side uit &mdash; geen kopiëren en plakken, geen tweede venster. Klik op de knop <em>Opties</em> net hieronder, kies uw AI-aanbieder onder het tabblad <em>Sleutels &amp; tokens</em>, plak de API-sleutel ervan en sla op. De sleutel blijft in de database van uw site; alleen deze site kan hem gebruiken. Methode 1 hierboven werkt nog steeds zonder API-sleutel als u de kopieer-en-plakworkflow verkiest."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Automatische scan loopt…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="De %s API wordt aangeroepen en uw overrides worden geanalyseerd. Dit duurt meestal 30 tot 90 seconden. Sluit dit venster niet."

