COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Dat betekent dat een database-back-up deze ook vastlegt. De-installatie van de component verwijdert de tabel samen met alle opgeslagen back-ups."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Over uw Anthropic API-tier:</strong> zowel de automatische scan als de chatfuncties tellen mee voor Anthropic's tokenlimiet per minuut. Anthropic's standaard Tier 1 (10.000 input-tokens per minuut) volstaat voor een eenmalige scan op een kleine site, maar loopt tegen de rate-limit aan tijdens fixes over meerdere chat-beurten. Tier 2 (50.000 tokens per minuut, betaald) is comfortabel voor de meeste echte fix-sessies. Bekijk uw huidige tier op <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Overrides resetten voor beoordeling"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Kies voor welke template(s) u de override-tracker opnieuw wilt opbouwen. Alleen ingeschakelde templates met een <code>html/</code>-override-map op schijf worden getoond. Vink <em>Alle templates selecteren</em> aan voor het oorspronkelijke gedrag &ldquo;elke template resetten&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Geen enkele ingeschakelde template op deze site heeft een <code>html/</code>-override-map, dus er is niets te resetten. Voeg een override toe (of schakel een template met overrides in) en open dit venster opnieuw."
