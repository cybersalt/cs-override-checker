COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON="Mijn Joomla API-token ophalen"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Ophalen…"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="De token-plugin inschakelen"
