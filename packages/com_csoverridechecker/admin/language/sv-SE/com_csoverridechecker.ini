COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Var denna säkerhetskopia bor"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Säkerhetskopians innehåll lagras i databasen, inte på disk. Specifikt i tabellen <code>#__csoverridechecker_backups</code> — kolumnen <code>contents_b64</code> innehåller filinnehållet base64-kodat."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Det betyder att en databassäkerhetskopiering också fångar dessa. Avinstallation av komponenten tar bort tabellen tillsammans med alla lagrade säkerhetskopior."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Om din Anthropic API-nivå:</strong> både den automatiska skanningen och chattfunktionerna räknas mot Anthropics tokengräns per minut. Anthropics standardnivå Tier 1 (10 000 input-tokens per minut) räcker för en engångsskanning på en liten webbplats men kommer att rate-limita under chattkorrigeringar i flera omgångar. Tier 2 (50 000 tokens per minut, fakturerad) är bekväm för de flesta verkliga korrigeringssessioner. Se din nuvarande nivå på <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Återställ åsidosättningar för granskning"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Välj vilken eller vilka mallar åsidosättningsspåraren ska byggas om för. Endast aktiverade mallar som har en <code>html/</code>-åsidosättningsmapp på disk listas. Kryssa i <em>Markera alla</em> för det ursprungliga beteendet &ldquo;återställ varje mall&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Ingen aktiverad mall på denna webbplats har en <code>html/</code>-åsidosättningsmapp, så det finns inget att återställa. Lägg till en åsidosättning (eller aktivera en mall som har åsidosättningar) och öppna denna dialog igen."
