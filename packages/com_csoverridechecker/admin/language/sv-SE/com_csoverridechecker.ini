COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Detta rensar varje rad som Joomla för närvarande spårar i åsidosättningsspåraren. 'Ändringar funna'-märkena i Mallar kommer att försvinna, och denna webbplats API-slutpunkt returnerar noll rader tills Joomlas nästa kärnuppdatering återfyller dem. Åtgärden kan inte ångras förutom genom att klicka på 'Bygg om åsidosättningsspårare' nedan för att skanna om."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Jag bekräftar att jag har granskat varje flaggad åsidosättning och accepterar ansvaret för eventuella ej åtgärdade problem."
