COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="Återställa alla åsidosättningar för granskning? Varje åsidosättningsfil på denna webbplats kommer att dyka upp igen i 'Ändringar funna'-märkena i Mallar så att den kan utvärderas på nytt."

