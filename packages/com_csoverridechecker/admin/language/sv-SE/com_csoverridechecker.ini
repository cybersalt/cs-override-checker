CS_INTEGRITY_PROBLEMS_TITLE="Installationen är ofullständig: %1$d av %2$d filer saknas eller är skadade."
CS_INTEGRITY_PROBLEMS_BODY="%s installerades inte fullständigt, så delar av det kanske inte fungerar. Installera samma paket igen för att reparera det. Om installationen misslyckas igen kan säkerhetsprogramvara på servern (till exempel Imunify360 Proactive Defense) blockera Joomlas installationsprogram: kontrollera dess incidentlogg."
