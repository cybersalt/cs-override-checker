COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Visa Override Checker-data"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Tillåter användare i de matchande grupperna att läsa åsidosättningar, sessioner, åtgärdsloggen och säkerhetskopieinnehåll (admin-vyer och läs-API-slutpunkter)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Modifiera Override Checker-data och åsidosättningsfiler"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Tillåter användare i de matchande grupperna att tillämpa korrigeringar, återställa säkerhetskopior, avvisa åsidosättningsflaggor och skapa eller ta bort sessioner. Innefattar Visa."

COM_CSOVERRIDECHECKER_DASHBOARD="Översikt"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="API-slutpunkt aktiv"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Vilken användare som helst med en giltig Joomla API-token och core.manage-behörighet på denna komponent kan läsa denna webbplats nuvarande mall-åsidosättningsdata."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="Slutpunkts-URL"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Om"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API som exponerar den inbyggda #__template_overrides-spåraren så att vilken AI-assistent som helst — eller någon klient med en Joomla API-token — kan granska varje flaggad åsidosättning, klassificera den och tillämpa patchar direkt. Varje patch säkerhetskopieras först automatiskt till databasen och är reversibel från Filsäkerhetskopior-vyn."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Version"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Börja här."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Detta är det enda kortet du behöver för en normal granskning. Kör prompten, få rapporten, och säg sedan till din assistent i samma chatt vilka upptäckter som ska korrigeras."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Metod 1: granskning med valfri AI-assistent"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Tillägget exponerar dina åsidosättningsdata via ett standard-REST-API, så <strong>vilken</strong> AI-assistent som helst som kan göra en HTTPS-förfrågan kan köra granskningen — det finns inget leverantörsspecifikt med denna metod. Kopiera prompten nedan till den assistent du redan använder så tar den fram en säkerhetsgranskning av varje flaggad åsidosättning på denna webbplats och tillämpar sedan de korrigeringar du bekräftar. Osäker på om din fungerar? Se knappen <em>Kom igång-guide</em> högst upp på denna sida."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Generera en Joomla API-token (en gång)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="I Joomla-admin: <em>System → Användare → Min profil → flik Joomla API-token</em>. Klicka på ögon-ikonen för att avslöja token, kopiera den sedan. <strong>Om du vill spara den permanent</strong>, gå till <em>Alternativ → Nycklar och tokens</em> i denna komponent, klistra in den i fältet <em>Joomla API-token</em> och Spara &mdash; prompten nedan fylls då automatiskt i med token, så du behöver inte klistra in den vid varje skanning. Annars, ha token till hands och klistra in den i prompten i steg 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Öppna din AI-assistent och klistra in prompten nedan."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Använd den assistent du föredrar — en terminal- eller redigeraragent (Claude Code, Codex CLI, Cursor, Copilot), en webbläsarchatt (ChatGPT, Claude.ai, Gemini), en egen GPT eller Gem, eller en lokal modell. Det enda kravet är att den kan göra utgående HTTPS-förfrågningar med en anpassad header. <strong>Om du INTE sparade token i Alternativ i steg 1</strong>, ersätt platshållartexten inom vinkelhakar (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) med token du kopierade. Webbplatsens URL och slutpunkter är redan ifyllda för denna webbplats. Tips för respektive assistent finns på sidan <em>Kom igång-guide</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Skicka."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Din assistent hämtar listan över åsidosättningar, hämtar åsidosättnings- och kärnkällan för varje, och producerar en tabell per upptäckt plus en sammanfattning på vanligt språk som du kan vidarebefordra."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Säg vad som ska korrigeras — i samma chatt."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="När rapporten har postats frågar assistenten vilka upptäckter du vill ha korrigerade. Svara med dem du bekräftar (t.ex. <em>«korrigera #1 och #3, lämna #2 ifred, den från tredje part frågar jag utvecklaren om»</em>). Varje fil säkerhetskopieras innan patchning, så allt kan rullas tillbaka. <strong>Du behöver bara det andra kortet nedan om du stängde chatten och vill komma tillbaka till den senare.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (kopiera och klistra in i din AI-assistent):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Kopiera skanningsprompt"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Kopierat!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="De flesta användare behöver INTE detta kort."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Använd detta endast om du startar en <em>ny chatt</em> för att tillämpa korrigeringar från en tidigare granskning — till exempel stängde du den ursprungliga chatten över natten, du lämnar över granskningen till en lagkamrat, eller du körde skanningen i en webbläsarchatt och vill göra korrigeringarna i en terminalagent. Om din skanningschatt fortfarande är öppen, scrolla upp — fortsätt bara i den chatten."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Fortsätt en tidigare granskning i en ny chatt"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Klistra in denna prompt i en ny chatt — i vilken assistent som helst, inte nödvändigtvis den som körde skanningen — för att ge den kontexten från din tidigare granskning. Den hämtar rapporten från den föregående sessionen, listar upptäckterna och frågar vilka som ska korrigeras. Varje fil säkerhetskopieras innan någon patch landar, så allt är reversibelt."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Kopiera korrigeringsprompt"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Sessionslogg"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Rapporter som skickas in av din AI-assistent (eller klistras in för hand) sparas här som sessioner. Klicka på en session för att se den fullständiga rapporten."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Inga sessioner ännu. Kör prompten ovan och låt antingen din assistent POSTa rapporten automatiskt, eller klicka på 'Ny session' för att klistra in den."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Ny session"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Visa alla sessioner"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Efter granskning"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="När du är klar med att agera på granskningens rekommendationer vill du rensa 'Ändringar funna'-märkena som Joomla visar i Mallar så att de inte fortsätter att flagga åsidosättningar du redan hanterat."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Rekommenderat — granskning per mall"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Öppna webbplatsens malllista. Varje mall med ett 'Ändringar funna'-märke kan öppnas individuellt så att du kan avvisa de specifika åsidosättningsraderna du har hanterat. Långsammare, men du behåller en granskningsspår per rad."
