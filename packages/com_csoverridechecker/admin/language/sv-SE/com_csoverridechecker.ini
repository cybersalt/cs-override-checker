COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Kom igång-guide"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Använd den AI du redan har"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Detta tillägg är inte bundet till någon enskild AI. Allt det exponerar är ett vanligt REST-API som skyddas av en standardmässig Joomla API-token, så vilken assistent som helst som kan göra en webbförfrågan kan köra en granskning &mdash; och det kan även ett skript du skriver själv. Denna sida går igenom de praktiska skillnaderna mellan alternativen så att du kan välja ett och komma igång."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Vad din assistent faktiskt behöver kunna göra"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="I stället för att lista vilka produkter som fungerar &mdash; abonnemang och funktioner ändras hela tiden &mdash; här är det verkliga kravet. Din assistent måste kunna:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Göra utgående HTTPS-förfrågningar</strong> till denna webbplats och skicka med en egen förfrågningsrubrik (<code>X-Joomla-Token</code>). Detta är det enda absoluta kravet."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Skicka POST-förfrågningar med en JSON-kropp</strong>, om du vill att den ska tillämpa korrigeringar och inte bara rapportera. En skrivskyddad granskning klarar sig med enbart GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Hålla en någorlunda lång konversation</strong>, eftersom den hämtar två filer för varje flaggad åsidosättning innan den kommer fram till ett omdöme."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Osäker på om din duger? Klistra bara in prompten och se. En assistent som inte kan nå din webbplats säger det direkt i stället för att misslyckas tyst."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Ingen Joomla API-token sparad ännu."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Vilken assistent du än väljer behöver den en Joomla API-token för att läsa dina åsidosättningsfiler. Generera en vid <em>System &rarr; Hantera &rarr; Användare &rarr; din användare &rarr; Joomla API-token</em>, klistra sedan antingen in den i prompten varje gång eller spara den här så att prompten fylls i automatiskt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Rekommenderat"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Vanligast"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Bäst för flera webbplatser"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Fungerar, med reservationer"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Avancerat"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Terminal- och editoragenter"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Till exempel: Claude Code, Codex CLI, Cursor, GitHub Copilot agent mode, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="Det smidigaste alternativet, och det vi skulle föreslå om du har ett tillgängligt. Dessa körs på din egen dator med obegränsad utgående nätverksåtkomst, ingen sandlåde-tillåtelselista och ingen begäran-timeout i webbläsaren, så en lång granskning körs från början till slut utan passning."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Kopiera skanningsprompten från instrumentpanelen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Klistra in den i din agent och skicka. Ingen konfiguration behövs."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="När rapporten dyker upp, svara i samma session och ange numren på de upptäckter du vill ha korrigerade."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Chattassistenter i webbläsaren"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Till exempel: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Alla dessa fungerar, förutsatt att det konto och det läge du använder verkligen kan nå internet. Detta är den vanligaste uppsättningen och fullt tillräcklig för en normal webbplats."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Se till att webbåtkomst eller webbsurfning är påslaget för konversationen. Vissa nivåer och vissa lägen svarar enbart ur minnet."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Klistra in skanningsprompten från instrumentpanelen och skicka."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Om din webbplats har många åsidosättningar, be den arbeta igenom dem i omgångar så att ett enskilt svar inte överskrider webbläsarens begäran-timeout."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Se upp för självsäkra gissningar.</strong> Om assistenten börjar producera upptäckter utan att någonsin citera verkligt filinnehåll kan den inte nå din webbplats och hittar på dem. Stanna upp och kontrollera dess anslutning i stället för att lita på rapporten. <strong>Specifikt för Claude.ai:</strong> om den svarar &ldquo;Host not in allowlist&rdquo;, lägg till denna webbplats domän under <em>Inställningar &rarr; Funktioner &rarr; Kodexekvering &rarr; Nätverksåtkomst</em> och starta sedan en ny chatt &mdash; den pågående behåller den gamla tillåtelselistan."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Anpassade GPT:er, Gems och andra konfigurerbara assistenter"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Till exempel: en anpassad GPT med Actions, en Gemini Gem, eller vilken assistent som helst där du kan registrera ditt eget API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Om din plattform låter dig definiera en assistent med egna API-åtgärder, registrera slutpunkterna nedan en gång och hoppa över kopiera-klistra-steget helt. Detta är det snyggaste alternativet om du sköter flera Joomla-webbplatser, eftersom assistenten kommer ihåg uppsättningen mellan konversationerna."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Skapa en ny anpassad assistent och lägg till en API-åtgärd som pekar på den slutpunkts-URL som visas längre ner på denna sida."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Ange autentiseringsrubrikens namn till <code>X-Joomla-Token</code> och klistra in din Joomla API-token som värde."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Klistra in skanningsprompten från instrumentpanelen i assistentens instruktioner så att den känner till klassificeringsreglerna och rapportformatet."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Lokala och egenhostade modeller"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Till exempel: Ollama, LM Studio, llama.cpp, eller vilken egenhostad modell som helst med verktygsanrop"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Allt med verktygsanrop och nätverksåtkomst fungerar rent tekniskt, och ingenting lämnar din egen infrastruktur, vilket vissa webbplatser föredrar."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Aktivera verktygs- eller funktionsanrop och bekräfta att modellen kan nå denna webbplats över HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Klistra in skanningsprompten som systemprompt och be den sedan börja."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Var realistisk om modellstorleken.</strong> Att granska en åsidosättning är en bedömningsuppgift, inte en uppslagning. En liten lokal modell producerar gärna en rapport, men det är betydligt mer sannolikt att den missar en verklig säkerhetsregression eller hittar på en som inte finns. Behandla upptäckter från en liten modell som en första genomgång, inte som ett slutgiltigt omdöme."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP-klienter"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Vilken assistent som helst som talar Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Om din assistent stöder MCP installerar du <strong>MCP for J</strong> och dess kostnadsfria tillägg <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Assistenten granskar och åtgärdar då åsidosättningar med sina egna verktyg, utan att du behöver kopiera och klistra in. Det är också den bättre vägen för webbläsarchattar med stöd för MCP-kopplingar, eftersom den undviker tidsgränsen för webbläsarförfrågningar. Båda är separata, kostnadsfria tillägg."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Metod 2 är det enda undantaget"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Instrumentpanelens knapp <em>Kör automatisk skanning</em> kör hela granskningen på serversidan utan kopiera-klistra. Välj din leverantör under <em>Alternativ</em> och spara den leverantörens API-nyckel &mdash; <strong>Anthropic, OpenAI och Google Gemini kan alla köra skanningar</strong>. Det enda som fortfarande endast fungerar med Anthropic är uppföljningschatten på en session, där du ber den tillämpa korrigeringar och den redigerar filer via verktygsanrop; den slingan är skriven mot Anthropics protokoll för verktygsanrop. Med OpenAI eller Gemini valt får du den fullständiga rapporten, och du kan själv tillämpa korrigeringarna med kopiera-klistra-prompten i Metod 1, som fungerar med vilken AI som helst."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s-nyckel sparad &mdash; Metod 2 tillgänglig"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Ingen API-nyckel sparad för din AI-leverantör &mdash; Metod 1 fungerar ändå"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Slutpunkt och autentisering"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Allt som admingränssnittet gör är tillgängligt på denna bas-URL. Använd den när du registrerar en anpassad assistent, eller när du skriver ditt eget skript eller din egen agent."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla accepterar inte <code>Authorization: Bearer</code> på dessa rutter.</strong> Du måste skicka token i rubriken <code>X-Joomla-Token</code>. En Bearer-formaterad rubrik returnerar 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Fullständig dokumentation"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Komplett slutpunktsreferens, rapportformat, felsökning och vanliga frågor."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Läs dokumentationen"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Få hjälp"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Detta tillägg är gratis, och förblir gratis"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Det finns ingen Pro-version, ingen licensnyckel och ingen funktion som hålls tillbaka. Allt tillägget kan göra ligger framför dig. Vi vill ändå väldigt gärna höra från dig &mdash; återkoppling från verkliga webbplatser är det som har format varje utgåva hittills."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Vad du kan förvänta dig."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt är ett litet företag och detta tillägg ges bort utan kostnad, så gratis support erbjuds i mån av tid vid sidan av kunduppdragen. Det är en verklig begränsning snarare än en undanflykt &mdash; vi säger hellre det rakt ut än låter dig vänta på ett löfte vi inte kan hålla. Buggrapporter tittar vi på; öppen konfigurationshjälp hinner vi kanske inte med."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Vart du skickar det"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Buggrapporter, förvirrande formuleringar, en upptäckt som AI:n fick fel, ett arbetsflöde som tillägget inte passar, eller en assistent som betedde sig oväntat &mdash; allt är användbart."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Rapportera ett problem på GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Läs dokumentationen"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues är det bästa stället för allt som går att återskapa, eftersom det är offentligt &mdash; nästa person med samma problem hittar svaret i stället för att fråga igen."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Vad du bör ta med"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Du får svar snabbare om du hjälper oss att hoppa över diagnosen:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="<strong>Diagnostikblocket</strong> från denna sida (det innehåller dina Joomla-, PHP- och tilläggsversioner i en enda inklistring)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Vilken metod</strong> du använde &mdash; kopiera-klistra-prompten, den automatiska skanningen, eller din egen kod &mdash; och <strong>vilken AI-assistent</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Vad du <strong>förväntade</strong> dig skulle hända, och vad som <strong>faktiskt</strong> hände."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Om AI:n fick en upptäckt fel, den <strong>sparade sessionsrapporten</strong> &mdash; använd <em>Ladda ner rapport</em> på sessionssidan. Det ger oss exakt de upptäckter och det resonemang vi behöver titta på."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Idéer är också välkomna"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Om tillägget nästan gör det du behöver men inte riktigt, säg till. Flera funktioner blev av för att en enda person beskrev ett arbetsflöde vi inte hade tänkt på."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnostik"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Kopiera in detta i din rapport så att vi slipper fråga."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Kopiera diagnostik"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Detta block innehåller inga hemligheter. Det registrerar endast om en nyckel eller token är sparad, aldrig själva värdet."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Visas om {seconds} s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Fördröjning för håll-för-att-visa (sekunder)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Nycklar och tokens som visas i detta tillägg är suddade som standard, så att en skärmdelning, skärminspelning eller blick över axeln inte läcker dem. Håll pekaren över ett suddat värde i så här många sekunder så visas det; en nedräkning talar om att timern går. Flyttar du bort pekaren avbryts den. Standard <strong>3</strong>. Sätt till <strong>0</strong> för att visa direkt vid hovring, vilket tar bort skyddet mot att pekaren bara råkar passera över värdet."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Dölj automatiskt efter visning (sekunder)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="När ett värde har visats, sudda det igen efter så här många sekunder även om pekaren fortfarande är över det. Täcker fallet där du kastar en blick på en nyckel och sedan blir avbruten, så att den ligger exponerad på en obevakad skärm. Standard <strong>8</strong>. Sätt till <strong>0</strong> för att behålla det synligt tills du flyttar bort pekaren."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="AI-leverantör"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Vilken AI-tjänst den inbyggda knappen <em>Kör automatisk skanning</em> anropar. Du tillhandahåller din egen nyckel för den du väljer, och den används endast från denna webbplats. Denna inställning påverkar <strong>inte</strong> arbetsflödet med kopiera-och-klistra-prompten &mdash; det fungerar med vilken AI som helst och behöver ingen nyckel alls."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Alla tre leverantörer kan köra en skanning.</strong> Uppföljningschatten på en session &mdash; där du ber den tillämpa korrigeringar och den redigerar filer via verktygsanrop &mdash; är för närvarande <strong>endast Anthropic</strong>, eftersom den slingan är skriven mot Anthropics protokoll för verktygsanrop. Med OpenAI eller Gemini valt får du fortfarande den fullständiga rapporten; för att få korrigeringar tillämpade åt dig, byt antingen detta till Anthropic eller använd arbetsflödet med kopiera-och-klistra-prompten, som fungerar med vilken AI som helst."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="OpenAI API-nyckel"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Din personliga OpenAI API-nyckel (börjar med <code>sk-</code>). Skaffa en på <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Lagras på denna server och används endast för att anropa api.openai.com å dina vägnar."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Google Gemini API-nyckel"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Din personliga Google AI Studio API-nyckel. Skaffa en på <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Lagras på denna server och används endast för att anropa Gemini-API:et å dina vägnar."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — mest kapabel, standard."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — snabbare och billigare. Lämplig för lågriskskanningar."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — mest kapabel, standard."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — snabbare och billigare. Lämplig för lågriskskanningar."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Ingen API-nyckel sparad för %s. Lägg till en under Alternativ, eller byt leverantör."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="Du har inte behörighet att hämta en API-token. Denna åtgärd kräver skrivbehörighet i Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Ingen inloggad användare kunde fastställas, så det finns ingen token att hämta."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="Insticksmodulen <strong>Användare - Joomla API-token</strong> är inaktiverad, så Joomla kan inte utfärda någon API-token ännu. Aktivera den och försök igen."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Din token utfärdades, men insticksmodulen <strong>API-autentisering - Joomla API-token</strong> är inaktiverad, så Joomla kommer att avvisa token vid inkommande API-förfrågningar tills du aktiverar även den insticksmodulen."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Dina användargrupper finns inte på tillåtelselistan i insticksmodulen Användare - Joomla API-token, så Joomla utfärdar ingen token till dig. Lägg till en av dina grupper i den insticksmodulens inställning för tillåtna användargrupper."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Denna webbplats har ingen secret angiven i configuration.php, så ingen API-token kan härledas."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ERROR="Kunde inte hämta din Joomla API-token: %s"
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_NOT_FOUND="Insticksmodulen Användare - Joomla API-token är inte installerad på denna webbplats."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ALREADY="Insticksmodulen Användare - Joomla API-token var redan aktiverad."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_SUCCESS="Insticksmodulen Användare - Joomla API-token har aktiverats."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ERROR="Kunde inte aktivera insticksmodulen Användare - Joomla API-token: %s"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON="Hämta min Joomla API-token"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Hämtar…"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="Aktivera token-insticksmodulen"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_CREATED_NOTICE="En ny Joomla API-token genererades för ditt konto."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_EXISTING_NOTICE="Detta är den befintliga Joomla API-token för ditt konto."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Behandla denna token som ett lösenord. Den autentiserar som dig i hela Joomla Web Services-API:et. Skicka den endast i rubriken X-Joomla-Token, aldrig i en URL."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_WORKING="Hämtar din Joomla API-token…"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE="Aktivera nu"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE_AUTH="Din token har fyllts i, men insticksmodulen <strong>API-autentisering - Joomla API-token</strong> är inaktiverad, så Joomla kommer att avvisa den vid inkommande API-förfrågningar tills även den insticksmodulen aktiveras."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_SAVE_REMINDER="Din Joomla API-token har fyllts i. Klicka på Spara för att behålla den."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_NOT_FOUND="Insticksmodulen API-autentisering - Joomla API-token är inte installerad på denna webbplats."
