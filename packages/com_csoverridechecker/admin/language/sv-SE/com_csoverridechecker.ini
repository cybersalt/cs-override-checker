COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ERROR="Kunde inte aktivera insticksmodulen API-autentisering - Joomla API-token: %s"
COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="Att aktivera en Joomla-insticksmodul är en ändring som påverkar hela webbplatsen och kräver därför Joomla-behörigheten för insticksmodulhantering utöver åtkomst till denna komponent. Be en Superanvändare att aktivera insticksmodulen, eller att ge din grupp Hantera-rättigheter för Insticksmoduler."

