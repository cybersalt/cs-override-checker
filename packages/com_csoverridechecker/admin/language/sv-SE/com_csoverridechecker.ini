COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Metod 1: använd din AI-assistent"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Kopiera en färdig prompt och klistra in den i den AI-assistent du använder — ChatGPT, Claude, Gemini, Copilot, Cursor eller en lokal modell. Fungerar utan API-nyckel. Hoppar till prompten nedan."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Metod 2: kör automatisk skanning"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Kör granskningen av åsidosättningar på denna server med din sparade %s API-nyckel. Sparar rapporten som en session. Hoppar till körknappen nedan."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Välj först en AI-leverantör och spara dess API-nyckel i Alternativ-panelen för att aktivera automatiska skanningar. Använd Metod 1 tills dess."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Gå igenom varje aktiverad mall igen och bygg upp åsidosättningsspåraren på nytt. Använd detta efter att du redigerat mallfiler utanför Joomla, eller om Joomlas spårare är inaktuell."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Nycklar &amp; tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Valfritt. Välj en AI-leverantör och spara dess API-nyckel här så att tillägget kan köra skanningar automatiskt, utan kopiera-klistra-prompt. Lämna tomt för att fortsätta använda kopiera-klistra-prompten på instrumentpanelen med den AI du redan använder."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API-nyckel"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Din personliga Anthropic API-nyckel (börjar med <code>sk-ant-…</code>). Skaffa en på <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. Nyckeln lagras på denna server och används endast för att anropa api.anthropic.com å dina vägnar. Med en sparad nyckel exponerar instrumentpanelen en knapp <em>Kör automatisk skanning</em> som lämnar över granskningen av åsidosättningar till Claude på serversidan och sparar rapporten tillbaka som en session — ingen kopiera-och-klistra behövs."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Varje automatisk skanning gör ett API-anrop till den leverantör du valt, debiterat enligt den leverantörens priser för den valda modellen. Webbplatser med mycket stort antal åsidosättningar begränsas per körning (se <em>Åsidosättningar per skanning</em> nedan); kör igen för resten, eller använd kopiera-klistra-prompten på instrumentpanelen för obegränsad storlek."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Skanningsmodell"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Modell som används för engångsanropet <em>Kör automatisk skanning</em> på instrumentpanelen. Skanningen är en klassificeringsuppgift (alert / review / info per upptäckt). <strong>Den mest kapabla modellen är standardvalet</strong> &mdash; den mest grundliga granskningen och den säkraste klassificeraren för upptäckter som kräver subtilt omdöme. De mindre modellerna hanterar rutinskanningar väl till en bråkdel av kostnaden och räcker gott för lågriskskanningar på små webbplatser."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Chatt-modell"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Claude-modell som används för chatten-med-Claude-uppföljningen på sessionsdetaljsidan (där du ber Claude tillämpa korrigeringar eller avvisa upptäckter). Verktygsanvändning är mer krävande än klassificering. <strong>Opus är standardvalet</strong> &mdash; det mest tillförlitliga verktygsanvändningsbeteendet och den lägsta risken för en felaktigt tillämpad korrigering. Sonnet är en bra medelväg för webbplatser med många lågriskuppföljningar; Haiku kan ha svårt med flerstegsverktygssekvenser och rekommenderas inte för chattmodellen om inte kostnaden är den högsta prioriteten."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API-token (för instrumentpanelens prompt)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Valfritt. Generera en Joomla API-token vid <em>System &rarr; Användare &rarr; Min profil &rarr; Joomla API-token</em> och klistra in den här. Instrumentpanelens skannings/korrigerings-prompts fyller då automatiskt i token i stället för platshållaren &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, så att du kan kopiera &amp; klistra direkt in i din AI-assistent utan redigering.<br><br><strong>Multi-admin-varning:</strong> Joomla API-tokens autentiserar som <em>användaren som genererade dem</em>. Om flera admins använder denna instrumentpanel kommer prompten att använda den token som sparas här &mdash; vilket betyder att AI:n kommer att anropa API:et autentiserat som den enda användaren. Lämna tomt så att varje admin klistrar in sin egen token vid användningstillfället."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Åsidosättningar per skanning"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Hur många flaggade mall-åsidosättningar knappen <em>Kör automatisk skanning</em> granskar i ett enda API-anrop. Standard <strong>10</strong>. Intervall 1&ndash;100. <strong>Lägre är säkrare för chatt-uppföljning:</strong> skanningsrapporten växer med antalet upptäckter, och chattens verktygsanvändningsslinga bevarar den rapporten som konversationshistorik. På låga rate-limit-nivåer (Anthropics Tier 1 tillåter 10K input-tokens per minut) kommer en skanning av 60 åsidosättningar plus en omedelbar chattomgång inom samma minut att returnera <em>HTTP 429: rate limit exceeded</em>. Med 10 åsidosättningar per körning håller sig dina chattomgångar efter skanning bekvämt under gränsen. Webbplatser med fler åsidosättningar än så behöver bara några extra körningar för att täcka allt &mdash; rapporten från varje körning sparas som sin egen session, så du kan arbeta igenom var och en oberoende."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — snabbast och billigast. Räcker för lågriskskanningar på små webbplatser."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — balanserad. Hanterar rutinskanningar väl till en bråkdel av Opus-kostnaden."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — mest kapabel, standard. Den säkraste klassificeraren för upptäckter som kräver subtilt omdöme."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Om kostnadsskillnaden.</strong> <strong>I skrivande stund</strong> använder en typisk skanning på en webbplats med 50 åsidosättningar ungefär 60K input-tokens och producerar ungefär 5K output-tokens. Ungefärlig kostnad per skanning: <strong>~0,08$ med Haiku, ~0,23$ med Sonnet, ~1,13$ med Opus</strong>. Chattomgångar är mycket mindre (5K&ndash;10K input-tokens vardera), så kostnaden per omgång är ungefär 10&times; lägre än en skanning. Anthropics publicerade priser är sanningskällan på <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; siffrorna ovan är ungefärliga och kan variera över tid. Håll koll på din användning på <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> för några körningar innan du bestämmer dig för att gå ner från Opus-standarden till en billigare nivå."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Komponentnavigering"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Metod 2: kör automatisk skanning (med din sparade %s API-nyckel)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Ingen %s API-nyckel sparad."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API-nyckel sparad."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Tillägget kommer att köra granskningen av åsidosättningar på servern med din sparade API-nyckel, ingen kopiera-och-klistra krävs. Rapporten sparas automatiskt som en ny session."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Klicka nedan för att starta en skanning. Tillägget hämtar varje flaggad åsidosättning på denna webbplats, skickar den till din AI-leverantör med din sparade API-nyckel, och sparar den resulterande rapporten som en ny session. Du omdirigeras till rapporten när den är klar."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Ett API-anrop per skanning. Webbplatser med mer än %d åsidosättningar är begränsade till de första %d per körning (konfigurerbart i <em>Alternativ &rarr; Nycklar &amp; tokens &rarr; Åsidosättningar per skanning</em>); kör igen för nästa omgång, eller använd kopiera-klistra-prompten i Metod 1 för obegränsad storlek. Sidan kan pausa i 30&ndash;90 sekunder medan AI:n svarar &mdash; det är normalt, navigera inte bort."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Detta kommer att anropa %s API:et med din sparade nyckel och kan ta 30 till 90 sekunder. Fortsätta?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Kör automatisk skanning nu"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Denna metod kör hela granskningen på serversidan &mdash; ingen kopiera-klistra, inget andra fönster. Klicka på knappen <em>Alternativ</em> precis nedanför, välj din AI-leverantör under fliken <em>Nycklar &amp; tokens</em>, klistra in dess API-nyckel och Spara. Nyckeln stannar i din webbplats databas; endast denna webbplats kan använda den. Metod 1 ovan fungerar fortfarande utan API-nyckel om du föredrar kopiera-klistra-flödet."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Automatisk skanning pågår…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Anropar %s API:et och analyserar dina åsidosättningar. Detta tar vanligtvis 30 till 90 sekunder. Stäng inte detta fönster."

