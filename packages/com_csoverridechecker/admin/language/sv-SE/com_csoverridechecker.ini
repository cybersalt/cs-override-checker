COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="Återställ åsidosättningar för granskning"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Har du (eller en tidigare utvecklare) godkänt åsidosättningar tidigare utan att verkligen kontrollera dem? Klicka här för att ta tillbaka varje åsidosättningsfil till spåraren så att du kan granska var och en korrekt med din AI-assistent. Användbart efter ett 'Avvisa alla' som hände innan detta verktyg installerades."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Går igenom <code>html/</code>-mappen i varje aktiverad mall och infogar en rad i <code>#__template_overrides</code> för varje åsidosättningsfil som inte redan spåras. Befintliga rader lämnas ifred. Återställda rader dyker upp igen som 'Ändringar funna'-märken i Mallar-admin så att du kan köra granskningsarbetsflödet ovan mot dem."
