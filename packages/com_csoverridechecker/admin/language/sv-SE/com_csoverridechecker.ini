COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Manuell inklistring för användare av webbläsarchatt.</strong> Om du körde skanningsprompten i en webbläsarchatt som ChatGPT, claude.ai eller Gemini, kopiera AI:ns svar och klistra in det här för att spara det som en session. Om du använde en terminal- eller redigeraragent (Claude Code, Codex, Cursor och liknande) behöver du oftast inte detta formulär — agenten skickar själv tillbaka rapporten till webbplatsen. Sessionen får som standard dagens tidsstämpel som namn; ändra det om du vill."
