COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST="Проверка соединения"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST_INTRO="Отправляет крошечный тестовый запрос в %s с использованием сохранённого ключа. Стоит почти ничего — проверяет, что ключ действителен и доступен с этого сервера."
