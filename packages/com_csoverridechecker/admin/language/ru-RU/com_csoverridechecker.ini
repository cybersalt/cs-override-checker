; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Установка не завершена: %1$d из %2$d файлов отсутствуют или повреждены."
CS_INTEGRITY_PROBLEMS_BODY="%s установлен не полностью, поэтому часть функций может не работать. Чтобы исправить это, установите тот же пакет ещё раз. Если установка снова не удастся, установщик Joomla, возможно, блокирует защитное ПО на сервере (например, Imunify360 Proactive Defense): проверьте его журнал инцидентов."
CS_INTEGRITY_CHANGED_TITLE="%1$d из %2$d файлов отличаются от выпущенной версии."
CS_INTEGRITY_CHANGED_BODY="Так бывает после неудачного обновления или если кто-то напрямую редактирует файлы %s. Чтобы восстановить их, установите тот же пакет ещё раз."
CS_INTEGRITY_OK="Все файлы (%1$d) совпадают с выпущенной версией."
CS_INTEGRITY_NOLIST="В этой сборке нет списка файлов, поэтому проверка файлов недоступна."
CS_INTEGRITY_SHOW_FILES="Показать файлы"
CS_INTEGRITY_UNREADABLE="Список файлов не читается"
CS_INTEGRITY_MISSING="Отсутствует"
CS_INTEGRITY_EMPTY="Пустой (0 байт)"
CS_INTEGRITY_CHANGED="Изменён"
CS_INTEGRITY_MORE="и ещё %d"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Ничего не записано. Новое содержимое добавляет код, который исправление не может добавлять в переопределение: %s. Так выглядит внедрённый код, поэтому он отклоняется, даже если запрос казался разумным. Если вы уверены, что изменение правильное, проверьте его и внесите в файл самостоятельно."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Не восстановлено. Эта резервная копия содержит код, которого нет в текущем файле: %s. Это может быть бэкдор, удалённый исправлением, поэтому ИИ или вызов API не может его вернуть. Если вам нужна эта версия, прочитайте копию и восстановите её на экране «Резервные копии файлов»."
