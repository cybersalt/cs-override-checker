COM_CSOVERRIDECHECKER_BACKUP_RESTORE_TITLE="Восстановить эту резервную копию"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_INTRO="Перезаписать текущий файл по указанному выше пути содержимым резервной копии. Перед записью текущее содержимое по этому пути сохраняется как новая резервная копия, поэтому это восстановление само обратимо — если что-то пойдёт не так, отмените, восстановив новую резервную копию, созданную перед восстановлением."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Файл записывается через PHP с этой административной страницы; FTP не нужен. У веб-пользователя должны быть права записи на целевой путь. Корень сайта Joomla — это граница: восстановление отказывается записывать за её пределами."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_BUTTON="Восстановить сейчас…"

COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_TITLE="Подтверждение: восстановить резервную копию"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_BODY="Восстановление перезапишет текущий файл по пути %s содержимым резервной копии, показанным выше. Сначала текущее содержимое будет сохранено как новая резервная копия, чтобы это можно было откатить."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="Я понимаю: восстановление сейчас перезапишет текущий файл. Копия перед восстановлением будет автоматически сохранена как новая резервная копия."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_CONFIRM="Да — восстановить"

COM_CSOVERRIDECHECKER_BACKUP_MANUAL_TITLE="Восстановить вручную (FTP / Ваш редактор)"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_INTRO="Если Вы предпочитаете не позволять расширению писать на диск:"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="Нажмите <em>Скачать резервную копию</em> выше (или скопируйте блок «Содержимое резервной копии»)."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="Откройте Ваш FTP-клиент, SFTP-клиент или файловый менеджер хостинга."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="Замените файл по указанному ниже пути назначения скачанной копией."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_DESTINATION="Путь назначения на сервере"

COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Где хранится эта резервная копия"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Содержимое резервных копий хранится в базе данных, а не на диске. В частности, в таблице <code>#__csoverridechecker_backups</code> — столбец <code>contents_b64</code> содержит содержимое файла, закодированное в base64."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Это означает, что резервная копия базы данных также захватывает их. Удаление компонента удаляет таблицу вместе со всеми сохранёнными резервными копиями."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>О Вашем уровне API Anthropic:</strong> автоматическое сканирование и функции чата вместе учитываются в поминутном лимите токенов Anthropic. Уровня Tier 1 по умолчанию (10 000 входных токенов в минуту) достаточно для одноразового сканирования небольшого сайта, но при многоходовых исправлениях в чате он приведёт к ограничению скорости. Tier 2 (50 000 токенов в минуту, платный) комфортен для большинства реальных сессий исправлений. Ваш текущий уровень указан на <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Сбросить переопределения для проверки"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Выберите шаблон(ы), для которых нужно перестроить трекер переопределений. В списке только включённые шаблоны, у которых на диске есть папка переопределений <code>html/</code>. Отметьте <em>Выбрать все</em> для исходного поведения &ldquo;сбросить каждый шаблон&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Ни у одного включённого шаблона на этом сайте нет папки переопределений <code>html/</code>, поэтому сбрасывать нечего. Добавьте переопределение (или включите шаблон, в котором есть переопределения) и откройте это окно снова."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SELECT_ALL="Выбрать все шаблоны"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_OVERRIDE_COUNT="Сейчас отслеживается строк: %d"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SUBMIT="Сбросить выбранные"
COM_CSOVERRIDECHECKER_RESCAN_NO_VALID_TEMPLATES="Ни один из выбранных шаблонов не распознан. Откройте окно снова и выберите шаблон из списка."
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_TITLE="Восстановить эту резервную копию поверх %s"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="Восстановить сохранённую резервную копию поверх текущего файла по пути %s? Текущее содержимое файла сначала будет сохранено как новая резервная копия, поэтому это восстановление само обратимо."
COM_CSOVERRIDECHECKER_FILTER_OPTIONS="Параметры фильтра"
