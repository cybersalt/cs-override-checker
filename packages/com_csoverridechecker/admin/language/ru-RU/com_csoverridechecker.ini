COM_CSOVERRIDECHECKER_TOOLBAR_DASHBOARD="Панель управления"
COM_CSOVERRIDECHECKER_TOOLBAR_SETUPGUIDE="Руководство по настройке"
COM_CSOVERRIDECHECKER_TOOLBAR_SUPPORT="Получить помощь"
COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — руководство по настройке"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Используйте тот ИИ, который у Вас уже есть"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Это расширение не привязано к какому-то одному ИИ. Всё, что оно открывает, — это обычный REST API, защищённый стандартным токеном API Joomla, поэтому проверку может выполнить любой помощник, способный сделать веб-запрос &mdash; равно как и сценарий, который Вы напишете сами. На этой странице описаны практические различия между вариантами, чтобы Вы могли выбрать один и начать работу."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Что на самом деле должен уметь Ваш помощник"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Вместо перечисления продуктов, которые подходят &mdash; тарифы и возможности постоянно меняются &mdash; вот реальное требование. Ваш помощник должен уметь:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Отправлять исходящие HTTPS-запросы</strong> на этот сайт, передавая пользовательский заголовок запроса (<code>X-Joomla-Token</code>). Это единственное жёсткое требование."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Отправлять POST-запросы с телом JSON</strong>, если Вы хотите, чтобы он применял исправления, а не только сообщал о них. Для проверки только на чтение достаточно одного GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Вести достаточно длинную беседу</strong>, поскольку для каждого отмеченного переопределения он получает два файла, прежде чем вынести вердикт."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Не уверены, подходит ли Ваш? Просто вставьте запрос и проверьте. Помощник, который не может достучаться до Вашего сайта, скажет об этом сразу, а не откажет молча."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Токен API Joomla ещё не сохранён."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Какого бы помощника Вы ни выбрали, ему нужен токен API Joomla для чтения Ваших файлов переопределений. Создайте его в <em>Система &rarr; Управление &rarr; Пользователи &rarr; Ваш пользователь &rarr; Токен API Joomla</em>, затем либо вставляйте его в запрос каждый раз, либо сохраните здесь, чтобы запрос заполнялся автоматически."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Рекомендуется"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Самый распространённый"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Лучше всего для нескольких сайтов"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Работает, с оговорками"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Для продвинутых"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Агенты в терминале и редакторе"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Например: Claude Code, Codex CLI, Cursor, режим агента GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="Самый гладкий вариант, и именно его мы посоветуем, если он у Вас есть. Такие агенты работают на Вашей собственной машине с неограниченным исходящим сетевым доступом, без списка разрешений песочницы и без таймаута запроса браузера, поэтому долгая проверка проходит от начала до конца без присмотра."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Скопируйте запрос сканирования с панели управления."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Вставьте его в Вашего агента и отправьте. Никакой настройки не требуется."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Когда появится отчёт, ответьте в той же сессии, назвав номера находок, которые Вы хотите исправить."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Чат-помощники в браузере"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Например: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Все они работают при условии, что используемая Вами учётная запись и режим действительно имеют доступ в интернет. Это самая распространённая конфигурация, и её вполне достаточно для обычного сайта."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Убедитесь, что для беседы включён веб-доступ или просмотр веб-страниц. Некоторые тарифы и некоторые режимы отвечают только по памяти."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Вставьте запрос сканирования с панели управления и отправьте."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Если на Вашем сайте много переопределений, попросите обрабатывать их партиями, чтобы один ответ не вышел за таймаут запроса браузера."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Остерегайтесь уверенных догадок.</strong> Если помощник начинает выдавать находки, ни разу не процитировав реальное содержимое файлов, значит он не может достучаться до Вашего сайта и выдумывает их. Остановитесь и проверьте его соединение, а не доверяйте отчёту. <strong>Отдельно про Claude.ai:</strong> если он отвечает &ldquo;Host not in allowlist&rdquo;, добавьте домен этого сайта в <em>Настройки &rarr; Возможности &rarr; Исполнение кода &rarr; Сетевой доступ</em>, затем начните новый чат &mdash; текущий продолжает использовать старый список разрешений."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Пользовательские GPT, Gems и другие настраиваемые помощники"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Например: пользовательский GPT с Actions, Gem в Gemini или любой помощник, которому можно зарегистрировать собственный API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Если Ваша платформа позволяет описать помощника с собственными действиями API, зарегистрируйте конечные точки ниже один раз и полностью пропустите шаг с копированием и вставкой. Это самый аккуратный вариант, если Вы обслуживаете несколько сайтов Joomla, потому что помощник запоминает настройку между беседами."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Создайте нового пользовательского помощника и добавьте действие API, указывающее на URL конечной точки, показанный ниже на этой странице."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Задайте имя заголовка аутентификации <code>X-Joomla-Token</code> и вставьте свой токен API Joomla в качестве значения."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Вставьте запрос сканирования с панели управления в инструкции помощника, чтобы он знал правила классификации и формат отчёта."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Локальные и самостоятельно размещённые модели"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Например: Ollama, LM Studio, llama.cpp или любая самостоятельно размещённая модель с вызовом инструментов"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Всё, что поддерживает вызов инструментов и имеет сетевой доступ, технически будет работать, и ничто не покидает Вашу собственную инфраструктуру, что для некоторых сайтов предпочтительнее."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Включите вызов инструментов или функций и убедитесь, что модель может достучаться до этого сайта по HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Вставьте запрос сканирования в качестве системного запроса, затем попросите модель начать."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Трезво оценивайте размер модели.</strong> Проверка переопределения — задача на суждение, а не на поиск по справочнику. Небольшая локальная модель охотно выдаст отчёт, но гораздо вероятнее пропустит настоящую регрессию безопасности или выдумает несуществующую. Считайте находки небольшой модели первым проходом, а не вердиктом."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Клиенты MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Любой помощник, который понимает Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Если ваш ассистент поддерживает MCP, установите <strong>MCP for J</strong> и бесплатное дополнение <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Тогда ассистент проверяет и исправляет переопределения собственными инструментами, без копирования и вставки. Это также лучший путь для чатов в браузере с поддержкой коннекторов MCP, потому что он обходит тайм-аут запросов браузера. Оба расширения отдельные и бесплатные."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Способ 2 — единственное исключение"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Кнопка <em>Запустить автоматическое сканирование</em> на панели управления выполняет всю проверку на стороне сервера без копирования и вставки. Выберите поставщика в разделе <em>Параметры</em> и сохраните ключ API этого поставщика &mdash; <strong>сканирование могут выполнять Anthropic, OpenAI и Google Gemini</strong>. Единственное, что по-прежнему работает только с Anthropic, — это последующий чат по сессии, где Вы просите применить исправления, а ИИ редактирует файлы через вызовы инструментов; этот цикл написан под протокол вызова инструментов Anthropic. При выбранных OpenAI или Gemini Вы получаете полный отчёт и можете применить исправления сами с помощью запроса с копированием и вставкой из Способа 1, который работает с любым ИИ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Ключ %s сохранён &mdash; Способ 2 доступен"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Ключ API для Вашего поставщика ИИ не сохранён &mdash; Способ 1 всё равно работает"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Конечная точка и аутентификация"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Всё, что делает административный интерфейс, доступно по этому базовому URL. Используйте его при регистрации пользовательского помощника или при написании собственного сценария либо агента."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla не принимает <code>Authorization: Bearer</code> на этих маршрутах.</strong> Токен нужно передавать в заголовке <code>X-Joomla-Token</code>. Заголовок в формате Bearer возвращает 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Полная документация"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Полный справочник по конечным точкам, формат отчёта, устранение неполадок и FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Читать документацию"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — получить помощь"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Это расширение бесплатное и останется бесплатным"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Нет ни Pro-версии, ни лицензионного ключа, ни придержанных функций. Всё, что умеет расширение, у Вас перед глазами. Тем не менее мы очень хотели бы услышать Ваше мнение &mdash; именно отзывы с реальных сайтов формировали каждый выпуск до сих пор."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Чего ожидать."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt — небольшая компания, и это расширение раздаётся бесплатно, поэтому бесплатная поддержка оказывается по мере наличия времени между работой с клиентами. Это реальное ограничение, а не отговорка &mdash; мы предпочитаем сказать об этом прямо, чем оставить Вас ждать обещания, которое не сможем выполнить. Сообщения об ошибках мы рассматриваем; помощь с настройкой без чётких рамок — возможно, нет."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Куда это отправлять"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Сообщения об ошибках, непонятные формулировки, находка, в которой ИИ ошибся, рабочий процесс, под который расширение не подходит, или помощник, который повёл себя неожиданно &mdash; всё это полезно."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Сообщить о проблеме на GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Читать документацию"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues — лучшее место для всего воспроизводимого, потому что это публично &mdash; следующий человек с той же проблемой найдёт ответ, а не спросит снова."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Что приложить"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Вы получите ответ быстрее, если поможете нам пропустить этап диагностики:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="<strong>Блок диагностики</strong> с этой страницы (в нём одним куском собраны версии Joomla, PHP и расширения)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Какой способ</strong> Вы использовали &mdash; запрос с копированием и вставкой, автоматическое сканирование или собственный код &mdash; и <strong>какой ИИ-помощник</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Чего Вы <strong>ожидали</strong> и что <strong>на самом деле</strong> произошло."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Если ИИ ошибся в находке — <strong>сохранённый отчёт сессии</strong> &mdash; используйте <em>Скачать отчёт</em> на странице сессии. Это даст нам точные находки и рассуждения для разбора."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Идеи тоже приветствуются"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Если расширение почти делает то, что Вам нужно, но не совсем — скажите нам. Несколько функций появились потому, что один человек описал рабочий процесс, о котором мы не подумали."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Диагностика"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Скопируйте это в своё сообщение, чтобы нам не пришлось спрашивать."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Копировать диагностику"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Этот блок не содержит секретов. В нём фиксируется только то, сохранён ли ключ или токен, но никогда само значение."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Показ через {seconds} с"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Задержка показа при наведении (секунды)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Ключи и токены, показываемые в этом расширении, по умолчанию размыты, чтобы демонстрация экрана, запись экрана или взгляд через плечо их не раскрыли. Задержите указатель над размытым значением на указанное число секунд, и оно откроется; обратный отсчёт покажет, что таймер идёт. Если увести указатель, отсчёт отменяется. По умолчанию <strong>3</strong>. Установите <strong>0</strong>, чтобы значение открывалось сразу при наведении — это убирает защиту от указателя, просто проходящего над значением."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Автоскрытие после показа (секунды)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="После того как значение было показано, снова размыть его через указанное число секунд, даже если указатель всё ещё над ним. Это покрывает случай, когда Вы взглянули на ключ и Вас отвлекли, оставив его открытым на экране без присмотра. По умолчанию <strong>8</strong>. Установите <strong>0</strong>, чтобы значение оставалось видимым, пока Вы не уведёте указатель."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Поставщик ИИ"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Какую службу ИИ вызывает встроенная кнопка <em>Запустить автоматическое сканирование</em>. Для выбранного варианта Вы предоставляете собственный ключ, и он используется только с этого сайта. Эта настройка <strong>не</strong> влияет на рабочий процесс с копированием и вставкой запроса &mdash; он работает с любым ИИ и вообще не требует ключа."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Сканирование могут выполнять все три поставщика.</strong> Последующий чат по сессии &mdash; где Вы просите применить исправления, а ИИ редактирует файлы через вызовы инструментов &mdash; пока работает <strong>только с Anthropic</strong>, потому что этот цикл написан под протокол вызова инструментов Anthropic. При выбранном OpenAI или Gemini Вы всё равно получаете полный отчёт; чтобы исправления применялись за Вас, либо переключите этот параметр на Anthropic, либо используйте рабочий процесс с копированием и вставкой запроса, который работает с любым ИИ."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Ключ API OpenAI"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Ваш личный ключ API OpenAI (начинается с <code>sk-</code>). Получите его на <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Хранится на этом сервере и используется только для вызова api.openai.com от Вашего имени."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Ключ API Google Gemini"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Ваш личный ключ API Google AI Studio. Получите его на <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Хранится на этом сервере и используется только для вызова API Gemini от Вашего имени."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — наиболее способная, по умолчанию."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — быстрее и дешевле. Подходит для малорисковых сканирований."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — наиболее способная, по умолчанию."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — быстрее и дешевле. Подходит для малорисковых сканирований."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Ключ API для %s не сохранён. Добавьте его в разделе «Параметры» или смените поставщика."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="У Вас нет разрешения на получение токена API. Для этого действия требуется разрешение на изменение данных Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Не удалось определить вошедшего пользователя, поэтому получать токен не для кого."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="Плагин <strong>Пользователь - Токен API Joomla</strong> отключён, поэтому Joomla пока не может выдать токен API. Включите его и попробуйте снова."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Ваш токен выдан, но плагин <strong>Аутентификация API - Токен API Joomla</strong> отключён, поэтому Joomla будет отклонять токен во входящих запросах API, пока Вы не включите и этот плагин."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Ваши группы пользователей отсутствуют в списке разрешённых в плагине Пользователь - Токен API Joomla, поэтому Joomla не выдаст Вам токен. Добавьте одну из Ваших групп в настройку «Разрешённые группы пользователей» этого плагина."
