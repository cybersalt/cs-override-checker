COM_CSOVERRIDECHECKER_SESSION_CHAT_NOKEY="Чтобы общаться с Claude из этой административной панели и поручить ему применять исправления за Вас, сохраните ключ API Anthropic под кнопкой <em>Параметры</em> панели управления (вкладка Ключи &amp; токены). Этот чат работает только с Anthropic, какого бы поставщика Вы ни использовали для сканирований. В противном случае используйте запрос с копированием и вставкой на панели управления с любым ИИ, чтобы выполнить действия по этому отчёту."
COM_CSOVERRIDECHECKER_SESSION_CHAT_LOADING_TITLE="Запрос к Claude…"
