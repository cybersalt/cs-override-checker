COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Способ 1: использовать Вашего ИИ-помощника"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Скопируйте готовый запрос и вставьте его в того ИИ-помощника, которым Вы пользуетесь, — ChatGPT, Claude, Gemini, Copilot, Cursor или локальную модель. Работает без ключа API. Переход к запросу ниже."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Способ 2: запустить автоматическое сканирование"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Запустить проверку переопределений на этом сервере с Вашим сохранённым ключом API %s. Сохраняет отчёт как сессию. Переход к кнопке запуска ниже."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Сначала выберите поставщика ИИ и сохраните его ключ API в панели «Параметры», чтобы включить автоматические сканирования. До этого используйте Способ 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Заново обойти все включённые шаблоны и перестроить трекер переопределений. Используйте после редактирования файлов шаблонов вне Joomla или если трекер Joomla устарел."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Ключи &amp; токены"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Необязательно. Выберите поставщика ИИ и сохраните здесь его ключ API, чтобы расширение могло запускать сканирования автоматически, без запроса с копированием и вставкой. Оставьте пустым, чтобы продолжать использовать запрос с копированием и вставкой на панели управления с тем ИИ, которым Вы уже пользуетесь."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Ключ API Anthropic"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Ваш личный ключ API Anthropic (начинается с <code>sk-ant-…</code>). Получите его на <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. Ключ хранится на этом сервере и используется только для вызова api.anthropic.com от Вашего имени. При сохранённом ключе на панели управления появляется кнопка <em>Запустить автоматическое сканирование</em>, которая передаёт проверку переопределений Claude на стороне сервера и сохраняет отчёт как сессию — копирование и вставка не требуются."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Каждое автоматическое сканирование делает один вызов API к выбранному Вами поставщику и оплачивается по тарифам этого поставщика для выбранной модели. Сайты с очень большим количеством переопределений ограничены за один запуск (см. <em>Переопределений за сканирование</em> ниже); запустите ещё раз для остальных или используйте запрос с копированием и вставкой на панели управления для неограниченного объёма."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Модель сканирования"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Модель, используемая для одноразового вызова <em>Запустить автоматическое сканирование</em> на панели управления. Сканирование — это задача классификации (тревога / на проверку / информация для каждой находки). <strong>По умолчанию выбрана самая мощная модель</strong> &mdash; наиболее тщательная проверка и наиболее безопасный классификатор для находок, требующих тонкого суждения. Модели поменьше хорошо справляются с рутинными сканированиями за малую долю стоимости и подходят для малорисковых сканирований небольших сайтов."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Модель чата"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Модель Claude, используемая для последующего чата с Claude на странице сессии (где Вы просите Claude применить исправления или отклонить находки). Использование инструментов более требовательно, чем классификация. <strong>Opus — выбор по умолчанию</strong> &mdash; наиболее надёжное поведение при использовании инструментов и наименьший риск некорректно применённого исправления. Sonnet — хороший компромисс для сайтов с большим количеством малорисковых последующих действий; Haiku может испытывать трудности с многошаговыми последовательностями инструментов и не рекомендуется для модели чата, если только стоимость не является главным критерием."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Токен API Joomla (для запроса панели управления)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Необязательно. Создайте токен API Joomla в <em>Система &rarr; Пользователи &rarr; Мой профиль &rarr; Токен API Joomla</em> и вставьте его сюда. Запросы сканирования / исправления панели управления автоматически подставят токен вместо заполнителя &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, чтобы Вы могли скопировать &amp; вставить прямо в Вашего ИИ-помощника без редактирования.<br><br><strong>Предупреждение для нескольких администраторов:</strong> токены API Joomla аутентифицируют как <em>пользователя, который их создал</em>. Если этой панелью пользуются несколько администраторов, запрос будет использовать тот токен, который сохранён здесь &mdash; то есть ИИ будет вызывать API, аутентифицируясь как этот один пользователь. Оставьте пустым, чтобы каждый администратор вставлял свой токен при использовании."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Переопределений за сканирование"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Сколько отмеченных переопределений шаблонов проверяет кнопка <em>Запустить автоматическое сканирование</em> за один вызов API. По умолчанию <strong>10</strong>. Диапазон 1&ndash;100. <strong>Меньшее значение безопаснее для последующего чата:</strong> отчёт сканирования растёт с количеством находок, и цикл использования инструментов в чате сохраняет этот отчёт как историю беседы. На низких уровнях лимита (Tier 1 у Anthropic допускает 10K входных токенов в минуту) сканирование 60 переопределений плюс немедленный ход чата в течение той же минуты вернёт <em>HTTP 429: rate limit exceeded</em>. При 10 переопределениях за запуск Ваши ходы чата после сканирования останутся комфортно ниже лимита. Сайтам с большим количеством переопределений просто нужно несколько повторных запусков, чтобы охватить всё &mdash; отчёт каждого запуска сохраняется как отдельная сессия, поэтому Вы можете разбирать каждую независимо."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — самая быстрая и дешёвая. Подходит для малорисковых сканирований небольших сайтов."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — сбалансированная. Хорошо справляется с рутинными сканированиями за малую долю стоимости Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — наиболее способная, по умолчанию. Самый безопасный классификатор для находок, требующих тонкого суждения."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>О разнице в стоимости.</strong> <strong>На момент написания</strong> типичное сканирование сайта с 50 переопределениями использует около 60K входных токенов и производит около 5K выходных токенов. Примерная стоимость одного сканирования: <strong>~$0.08 на Haiku, ~$0.23 на Sonnet, ~$1.13 на Opus</strong>. Ходы чата значительно меньше (5K&ndash;10K входных токенов каждый), поэтому стоимость одного хода примерно в 10&times; меньше, чем у сканирования. Опубликованные цены Anthropic — источник истины на <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; цифры выше приблизительны и могут со временем меняться. Понаблюдайте за использованием на <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> в течение нескольких запусков, прежде чем решать, стоит ли перейти с Opus по умолчанию на более дешёвый уровень."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Навигация по компоненту"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Способ 2: запустить автоматическое сканирование (используя сохранённый ключ API %s)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Ключ API %s не сохранён."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Ключ API сохранён."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Расширение запустит проверку переопределений на сервере, используя Ваш сохранённый ключ API, копирование и вставка не требуются. Отчёт автоматически сохраняется как новая сессия."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Нажмите ниже, чтобы начать сканирование. Расширение получит каждое отмеченное переопределение на этом сайте, отправит его Вашему поставщику ИИ с Вашим сохранённым ключом API и сохранит итоговый отчёт как новую сессию. По завершении Вы будете перенаправлены к отчёту."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Один вызов API за сканирование. Сайты с количеством переопределений более %d ограничены первыми %d за запуск (настраивается в <em>Параметры &rarr; Ключи &amp; токены &rarr; Переопределений за сканирование</em>); запустите ещё раз для следующей партии или используйте запрос с копированием и вставкой из Способа 1 для неограниченного объёма. Страница может приостановиться на 30&ndash;90 секунд, пока ИИ отвечает &mdash; это нормально, не уходите со страницы."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Это вызовет API %s с Вашим сохранённым ключом и может занять от 30 до 90 секунд. Продолжить?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Запустить автоматическое сканирование сейчас"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Этот способ выполняет всю проверку на стороне сервера &mdash; без копирования-вставки, без второго окна. Нажмите кнопку <em>Параметры</em> прямо ниже, выберите своего поставщика ИИ на вкладке <em>Ключи и токены</em>, вставьте его ключ API и Сохраните. Ключ остаётся в базе данных Вашего сайта; использовать его может только этот сайт. Способ 1 выше по-прежнему работает без ключа API, если Вы предпочитаете рабочий процесс с копированием-вставкой."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Выполняется автоматическое сканирование…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Вызов API %s и анализ Ваших переопределений. Обычно это занимает от 30 до 90 секунд. Пожалуйста, не закрывайте это окно."

