COM_CSOVERRIDECHECKER_RUN_SCAN_SUCCESS="Автоматическое сканирование завершено: проверено %1$d переопределений и сохранено как сессия #%2$d."
COM_CSOVERRIDECHECKER_RUN_SCAN_TRUNCATED="На этом сайте более %d переопределений; для остальных потребуется повторный запуск. Используйте запрос с копированием и вставкой (Способ 1) для одноразовых проверок неограниченного объёма."
COM_CSOVERRIDECHECKER_RUN_SCAN_ERROR="Автоматическое сканирование не удалось: %s"

COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Просмотр данных Override Checker"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Позволяет пользователям из соответствующих групп читать переопределения, сессии, журнал действий и содержимое резервных копий (административные виды и конечные точки API на чтение)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Изменение данных Override Checker и файлов переопределений"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Позволяет пользователям из соответствующих групп применять исправления, восстанавливать резервные копии, отклонять отметки переопределений, а также создавать или удалять сессии. Подразумевает «Просмотр»."

COM_CSOVERRIDECHECKER_DASHBOARD="Панель управления"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="Конечная точка API активна"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Любой пользователь с действительным токеном API Joomla и разрешением core.manage на этот компонент может прочитать текущие данные о переопределениях шаблонов этого сайта."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL конечной точки"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="О компоненте"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API, открывающий доступ к встроенному трекеру #__template_overrides, чтобы любой ИИ-помощник — или любой клиент с токеном API Joomla — мог проверить каждое отмеченное переопределение, классифицировать его и применить исправления на месте. Перед каждым исправлением автоматически создаётся резервная копия в базе данных, и его можно откатить из вида «Резервные копии файлов»."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Версия"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Начните здесь."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Это единственная карточка, которая Вам нужна для обычной проверки. Запустите запрос, получите отчёт, затем скажите помощнику в том же чате, какие находки исправить."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Способ 1: проверка с помощью любого ИИ-помощника"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Расширение открывает доступ к данным переопределений через стандартный REST API, поэтому проверку может выполнить <strong>любой</strong> ИИ-помощник, способный сделать HTTPS-запрос, — в этом способе нет ничего привязанного к конкретному поставщику. Скопируйте запрос ниже в помощника, которым Вы уже пользуетесь, и он подготовит проверку безопасности каждого отмеченного переопределения на этом сайте, а затем применит подтверждённые Вами исправления. Не уверены, подойдёт ли Ваш? См. кнопку <em>Руководство по настройке</em> вверху этой страницы."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Создайте токен API Joomla (один раз)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="В административной панели Joomla: вкладка <em>Система → Пользователи → Мой профиль → Токен API Joomla</em>. Нажмите значок глаза, чтобы показать токен, и скопируйте его. <strong>Если Вы хотите сохранить его постоянно</strong>, перейдите в <em>Параметры → Ключи и токены</em> этого компонента, вставьте его в поле <em>Токен API Joomla</em> и Сохраните &mdash; подсказка ниже автоматически заполнится токеном, поэтому Вам не нужно будет вставлять его при каждом сканировании. В противном случае держите токен под рукой и вставьте его в подсказку на шаге 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Откройте Вашего ИИ-помощника и вставьте запрос ниже."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Используйте любого помощника на Ваш выбор — агента в терминале или редакторе (Claude Code, Codex CLI, Cursor, Copilot), чат в браузере (ChatGPT, Claude.ai, Gemini), пользовательский GPT или Gem либо локальную модель. Единственное требование — он должен уметь отправлять исходящие HTTPS-запросы с пользовательским заголовком. <strong>Если Вы НЕ сохранили токен в Параметрах на шаге 1</strong>, замените текст-заполнитель в угловых скобках (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) скопированным токеном. URL сайта и конечные точки уже подставлены для этого сайта. Советы для отдельных помощников — на странице <em>Руководство по настройке</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Отправьте."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Ваш помощник получит список переопределений, извлечёт исходный код переопределения и ядра для каждого из них и составит таблицу по находкам плюс резюме на простом языке, которое Вы сможете переслать."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Скажите ему, что исправить — в том же чате."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="После публикации отчёта помощник спросит, какие находки Вы хотите исправить. Ответьте теми, которые Вы подтверждаете (например, <em>«исправьте #1 и #3, #2 оставьте как есть, по сторонней спрошу разработчика»</em>). Перед изменением создаётся резервная копия каждого файла, поэтому всё можно откатить. <strong>Вторая карточка ниже нужна Вам только если Вы закрыли чат и хотите вернуться к нему позже.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Запрос (скопируйте и вставьте в Вашего ИИ-помощника):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Копировать запрос сканирования"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Скопировано!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Большинству пользователей эта карточка НЕ нужна."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Используйте её только если Вы начинаете <em>новый чат</em>, чтобы применить исправления из предыдущей проверки — например, Вы закрыли исходный чат на ночь, передаёте проверку коллеге или запустили сканирование в чате в браузере и хотите выполнить исправления в агенте в терминале. Если чат сканирования всё ещё открыт, прокрутите вверх — просто продолжайте в том чате."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Продолжить предыдущую проверку в новом чате"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Вставьте этот запрос в новый чат — в любом помощнике, не обязательно в том, который выполнял сканирование, — чтобы дать ему контекст из Вашей предыдущей проверки. Он получит отчёт предыдущей сессии, перечислит находки и спросит, какие из них исправить. Перед применением каждого исправления делается резервная копия файла, поэтому всё обратимо."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Копировать запрос исправления"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Журнал сессий"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Отчёты, отправленные Вашим ИИ-помощником (или вставленные вручную), сохраняются здесь как сессии. Нажмите на сессию, чтобы просмотреть полный отчёт."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Сессий пока нет. Запустите запрос выше и либо позвольте помощнику автоматически отправить отчёт обратно (POST), либо нажмите «Новая сессия», чтобы вставить его."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Новая сессия"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Просмотреть все сессии"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="После проверки"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Когда Вы закончите выполнять рекомендации проверки, Вы захотите убрать значки «Найдены изменения», которые Joomla показывает в шаблонах, чтобы они больше не отмечали уже обработанные Вами переопределения."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Рекомендуется — проверка по каждому шаблону"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Откройте список шаблонов сайта. Каждый шаблон со значком «Найдены изменения» можно открыть отдельно, чтобы отклонить конкретные строки переопределений, которые Вы обработали. Медленнее, но Вы сохраняете аудит по каждой строке."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Открыть управление шаблонами сайта"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Массово — отметить все переопределения как проверенные"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Более быстрый путь: очистить все строки в трекере переопределений за один шаг. Делайте это, только когда Вы действительно проверили каждую находку. Эквивалент использования собственной кнопки «Отклонить все» Joomla на каждом шаблоне сразу."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Отметить все как проверенные…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Подтверждение: отметить все переопределения как проверенные"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Это очистит каждую строку, которую Joomla сейчас отслеживает в трекере переопределений. Значки «Найдены изменения» в шаблонах исчезнут, и конечная точка API этого сайта будет возвращать ноль строк до следующего обновления ядра Joomla, которое снова заполнит их. Действие нельзя отменить, кроме как нажав «Перестроить трекер переопределений» ниже для повторного сканирования."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Я подтверждаю, что проверил каждое отмеченное переопределение, и принимаю ответственность за любые необработанные проблемы."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="Да — отметить все проверенными"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="Отмечено как проверенные и очищено из трекера: %d строк переопределений."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_NONE="Не было строк переопределений для очистки."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_ERROR="Не удалось очистить трекер переопределений: %s"

COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="Сбросить переопределения для проверки"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Вы (или предыдущий разработчик) одобряли переопределения в прошлом, не проверяя их по-настоящему? Нажмите здесь, чтобы вернуть каждый файл переопределения в трекер, чтобы Вы могли как следует проверить каждый из них с Вашим ИИ-помощником. Полезно после «Отклонить все», которое произошло до установки этого инструмента."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Обходит папку <code>html/</code> каждого включённого шаблона и вставляет строку в <code>#__template_overrides</code> для любого файла переопределения, который ещё не отслеживается. Существующие строки остаются нетронутыми. Сброшенные строки появляются как значки «Найдены изменения» в администрировании шаблонов, чтобы Вы могли запустить против них процесс проверки выше."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_BUTTON="Сбросить все переопределения для проверки"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="Сбросить все переопределения для проверки? Каждый файл переопределения на этом сайте снова появится в значках «Найдены изменения» шаблонов, чтобы его можно было повторно оценить."

COM_CSOVERRIDECHECKER_RESCAN_SUCCESS="Трекер переопределений перестроен: вставлено %1$d строк по %3$d шаблонам (просканировано %2$d файлов)."
COM_CSOVERRIDECHECKER_RESCAN_ERROR="Перестроение трекера переопределений не удалось: %s"

