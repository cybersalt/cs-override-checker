COM_CSOVERRIDECHECKER_ACTIONS_TITLE="Cybersalt Override Checker — Журнал действий"
COM_CSOVERRIDECHECKER_ACTIONS_DESCRIPTION="Здесь записывается каждое административное событие, затронувшее трекер переопределений, журнал сессий или резервные копии файлов. Только для чтения."
COM_CSOVERRIDECHECKER_ACTIONS_VS_SESSIONS="<strong>Сессии</strong> хранят отчёты проверок ИИ. <strong>Журнал действий</strong> — это аудит <em>изменений</em>: когда переопределения сбрасывались или очищались, когда создавалась сессия, когда сохранялась резервная копия перед исправлением. Если что-то пойдёт не так на этом сайте позже, здесь Вы увидите, что и когда было сделано."
