COM_CSOVERRIDECHECKER_BACKUPS_STORAGE_NOTE="Резервные копии хранятся в базе данных (таблица <code>#__csoverridechecker_backups</code>) как закодированные в base64 копии файла на момент создания. Каждая строка содержит исходный путь, sha256, размер и полное содержимое. Они не записываются на диск; нажмите на строку резервной копии для вариантов восстановления или загрузки содержимого."

