COM_CSOVERRIDECHECKER_SESSIONFORM_TITLE="Новая сессия"
COM_CSOVERRIDECHECKER_SESSIONFORM_HEADING="Вставьте отчёт проверки ИИ"
COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Ручная вставка для пользователей чатов в браузере.</strong> Если Вы запускали запрос сканирования в чате в браузере, например ChatGPT, claude.ai или Gemini, скопируйте ответ ИИ и вставьте его сюда, чтобы сохранить как сессию. Если Вы использовали агента в терминале или редакторе (Claude Code, Codex, Cursor и подобные), эта форма Вам обычно не нужна — агент сам отправляет отчёт обратно на сайт. Сессия по умолчанию называется по сегодняшней метке времени; измените, если хотите."
