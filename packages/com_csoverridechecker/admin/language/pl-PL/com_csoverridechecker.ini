COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Nic nie zostało zapisane. Nowa zawartość dodaje kod, którego poprawka nie może dodać do nadpisania: %s. Tak wygląda wstrzyknięty kod, dlatego jest odrzucany, nawet jeśli prośba wydawała się rozsądna. Jeśli masz pewność, że zmiana jest prawidłowa, sprawdź ją i wprowadź samodzielnie w pliku."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Nie przywrócono. Ta kopia zawiera kod, którego nie ma bieżący plik: %s. Może to być tylne wejście usunięte przez poprawkę, dlatego AI ani wywołanie API nie może go przywrócić. Jeśli chcesz odzyskać tę wersję, przeczytaj kopię i przywróć ją na ekranie Kopie zapasowe plików."
