COM_CSOVERRIDECHECKER_SESSIONFORM_TITLE="Nowa sesja"
COM_CSOVERRIDECHECKER_SESSIONFORM_HEADING="Wklej raport z przeglądu AI"
COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Ręczne wklejenie dla użytkowników czatu w przeglądarce.</strong> Jeśli uruchomili Państwo prompt skanowania w czacie w przeglądarce, takim jak ChatGPT, claude.ai czy Gemini, prosimy skopiować odpowiedź AI i wkleić ją tutaj, aby zapisać jako sesję. Jeśli używali Państwo agenta terminalowego lub działającego w edytorze (Claude Code, Codex, Cursor i podobne), ten formularz zwykle nie jest potrzebny — agent sam odsyła raport do witryny. Sesja jest domyślnie nazywana znacznikiem czasu z dzisiejszej daty; można to zmienić."
COM_CSOVERRIDECHECKER_SESSIONFORM_NAME="Nazwa sesji"
COM_CSOVERRIDECHECKER_SESSIONFORM_NAME_HELP="Domyślnie ustawiana na bieżący znacznik czasu YYYY-MM-DD-HHMMSS. Używana jako widoczna etykieta w dzienniku sesji."
COM_CSOVERRIDECHECKER_SESSIONFORM_SUMMARY="Jednowierszowe podsumowanie"
COM_CSOVERRIDECHECKER_SESSIONFORM_SUMMARY_PLACEHOLDER="np. 1 ustalenie XSS, 14 elementów dryfu motywu, 1 błąd kosmetyczny"
COM_CSOVERRIDECHECKER_SESSIONFORM_REPORT="Raport (Markdown)"
COM_CSOVERRIDECHECKER_SESSIONFORM_REPORT_PLACEHOLDER="Należy wkleić tu pełny raport wytworzony przez AI. Zostanie zapisany dosłownie i pokazany po otwarciu sesji."
