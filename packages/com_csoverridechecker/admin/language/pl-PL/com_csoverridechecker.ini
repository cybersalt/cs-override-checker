COM_CSOVERRIDECHECKER_BACKUP_RESTORE_TITLE="Przywróć tę kopię zapasową"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_INTRO="Nadpisuje plik na żywo pod powyższą ścieżką zawartością kopii zapasowej. Przed zapisem aktualna zawartość tej ścieżki jest zapisywana jako świeża kopia zapasowa, dzięki czemu samo to przywrócenie również jest odwracalne — w razie problemu można je cofnąć, przywracając nową kopię zapasową utworzoną przed przywróceniem."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Plik jest zapisywany przez PHP z tej strony administracyjnej; nie jest potrzebne FTP. Użytkownik webowy musi mieć uprawnienie zapisu do ścieżki docelowej. Korzeń witryny Joomla jest granicą — przywracanie odmawia zapisu poza nim."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_BUTTON="Przywróć teraz…"

COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_TITLE="Potwierdź: przywróć kopię zapasową"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_BODY="Przywrócenie nadpisze plik na żywo pod ścieżką %s zawartością kopii zapasowej pokazaną powyżej. Aktualna zawartość zostanie najpierw zapisana jako świeża kopia zapasowa, dzięki czemu można to cofnąć."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="Rozumiem: przywrócenie teraz nadpisze plik na żywo. Kopia sprzed przywrócenia zostanie automatycznie zapisana jako nowa kopia zapasowa."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_CONFIRM="Tak — przywróć"

COM_CSOVERRIDECHECKER_BACKUP_MANUAL_TITLE="Przywróć ręcznie (FTP / Państwa edytor)"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_INTRO="Jeśli wolą Państwo, aby rozszerzenie nie zapisywało na dysku:"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="Należy kliknąć <em>Pobierz kopię zapasową</em> powyżej (lub skopiować blok Zawartość kopii zapasowej)."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="Należy otworzyć klienta FTP, klienta SFTP lub menedżera plików hostingu."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="Należy zastąpić plik pod ścieżką docelową poniżej pobraną kopią."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_DESTINATION="Ścieżka docelowa na serwerze"

COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Gdzie znajduje się ta kopia zapasowa"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Zawartość kopii zapasowych jest przechowywana w bazie danych, nie na dysku. Konkretnie w tabeli <code>#__csoverridechecker_backups</code> &mdash; kolumna <code>contents_b64</code> przechowuje zawartość pliku zakodowaną w base64."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Oznacza to, że kopia zapasowa bazy danych obejmuje również te dane. Odinstalowanie komponentu usuwa tabelę wraz ze wszystkimi przechowywanymi kopiami zapasowymi."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>O Państwa poziomie Anthropic API:</strong> zarówno skan automatyczny, jak i funkcje czatu wliczają się do limitu tokenów na minutę u Anthropic. Domyślny poziom Anthropic Tier 1 (10 000 tokenów wejściowych na minutę) wystarcza na jednorazowy skan małej witryny, ale spowoduje ograniczenie tempa podczas poprawek w czacie obejmujących wiele tur. Tier 2 (50 000 tokenów na minutę, płatny) jest komfortowy dla większości rzeczywistych sesji poprawek. Aktualny poziom można sprawdzić na <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Zresetuj nadpisania do przeglądu"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Należy wybrać szablon(y), dla których ma zostać odbudowany tracker nadpisań. Wymienione są tylko włączone szablony, które mają na dysku folder nadpisań <code>html/</code>. Zaznaczenie opcji <em>Zaznacz wszystkie</em> przywraca pierwotne zachowanie &ldquo;resetuj każdy szablon&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Żaden włączony szablon na tej witrynie nie ma folderu nadpisań <code>html/</code>, więc nie ma czego resetować. Należy dodać nadpisanie (lub włączyć szablon, który je posiada) i ponownie otworzyć to okno."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SELECT_ALL="Zaznacz wszystkie szablony"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_OVERRIDE_COUNT="Aktualnie śledzonych wierszy: %d"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SUBMIT="Zresetuj wybrane"
COM_CSOVERRIDECHECKER_RESCAN_NO_VALID_TEMPLATES="Nie rozpoznano żadnego z wybranych szablonów. Należy ponownie otworzyć okno i wybrać szablon z listy."
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_TITLE="Przywróć tę kopię zapasową na %s"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="Przywrócić zapisaną kopię zapasową na plik na żywo pod ścieżką %s? Aktualna zawartość pliku zostanie najpierw zapisana jako świeża kopia zapasowa, dzięki czemu samo to przywrócenie również jest odwracalne."
COM_CSOVERRIDECHECKER_FILTER_OPTIONS="Opcje filtrowania"
COM_CSOVERRIDECHECKER_FILTER_NO_MATCHES="Żaden wynik nie pasuje do tych filtrów. Należy kliknąć Wyczyść, aby zobaczyć wszystko."
COM_CSOVERRIDECHECKER_FILTER_ANY_ACTION="— Dowolna akcja —"
COM_CSOVERRIDECHECKER_FILTER_ANY_SESSION="— Dowolna sesja —"
COM_CSOVERRIDECHECKER_FILTER_SESSION_PLACEHOLDER="Identyfikator sesji (lub „none”)"
COM_CSOVERRIDECHECKER_TOOLBAR_DASHBOARD="Panel"
COM_CSOVERRIDECHECKER_TOOLBAR_SETUPGUIDE="Przewodnik konfiguracji"
COM_CSOVERRIDECHECKER_TOOLBAR_SUPPORT="Uzyskaj pomoc"
COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Przewodnik konfiguracji"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Można użyć dowolnej sztucznej inteligencji, którą już Państwo mają"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="To rozszerzenie nie jest przywiązane do jednej sztucznej inteligencji. Wszystko, co udostępnia, to zwykłe API REST zabezpieczone standardowym tokenem API Joomla, więc przegląd może wykonać dowolny asystent potrafiący wysłać żądanie sieciowe &mdash; a także skrypt napisany przez Państwa samodzielnie. Ta strona omawia praktyczne różnice między dostępnymi opcjami, aby mogli Państwo wybrać jedną i zacząć."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Co Państwa asystent musi faktycznie potrafić"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Zamiast wymieniać, które produkty działają &mdash; plany i funkcje zmieniają się nieustannie &mdash; podajemy rzeczywisty wymóg. Państwa asystent musi potrafić:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Wysyłać wychodzące żądania HTTPS</strong> do tej witryny, przesyłając własny nagłówek żądania (<code>X-Joomla-Token</code>). To jedyny bezwzględny wymóg."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Wysyłać żądania POST z treścią JSON</strong>, jeśli ma nie tylko raportować, ale też stosować poprawki. Przegląd tylko do odczytu wymaga samego GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Prowadzić odpowiednio długą rozmowę</strong>, ponieważ dla każdego oznaczonego nadpisania pobiera dwa pliki, zanim wyda werdykt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Nie mają Państwo pewności, czy Państwa asystent się nadaje? Wystarczy wkleić prompt i sprawdzić. Asystent, który nie może połączyć się z Państwa witryną, powie to od razu, zamiast zawieść po cichu."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Nie zapisano jeszcze tokenu API Joomla."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Niezależnie od wybranego asystenta potrzebuje on tokenu API Joomla, aby odczytać Państwa pliki nadpisań. Należy wygenerować go w <em>System &rarr; Zarządzaj &rarr; Użytkownicy &rarr; Państwa użytkownik &rarr; Token Joomla API</em>, a następnie albo wklejać go do promptu za każdym razem, albo zapisać tutaj, aby prompt wypełniał się automatycznie."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Zalecane"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Najczęstsze"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Najlepsze dla wielu witryn"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Działa, z zastrzeżeniami"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Zaawansowane"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Agenci terminala i edytora"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Na przykład: Claude Code, Codex CLI, Cursor, tryb agenta GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="Najwygodniejsza opcja i to, co proponujemy, jeśli mają Państwo taką do dyspozycji. Działają na Państwa własnym komputerze z nieograniczonym wychodzącym dostępem do sieci, bez listy dozwolonych hostów w piaskownicy i bez limitu czasu żądania przeglądarki, więc długi przegląd wykonuje się od początku do końca bez nadzoru."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Należy skopiować prompt skanowania z Panelu."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Należy wkleić go do swojego agenta i wysłać. Żadna konfiguracja nie jest potrzebna."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Gdy pojawi się raport, należy odpowiedzieć w tej samej sesji, podając numery ustaleń, które mają zostać naprawione."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Asystenci czatu w przeglądarce"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Na przykład: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Wszystkie działają, o ile używane konto i tryb faktycznie mają dostęp do internetu. To najczęstsza konfiguracja i całkowicie wystarczająca dla zwykłej witryny."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Należy upewnić się, że dla danej rozmowy włączony jest dostęp do sieci lub przeglądanie. Niektóre poziomy planów i niektóre tryby odpowiadają wyłącznie z pamięci."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Należy wkleić prompt skanowania z Panelu i wysłać."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Jeśli Państwa witryna ma dużo nadpisań, należy poprosić asystenta o przerobienie ich partiami, aby pojedyncza odpowiedź nie przekroczyła limitu czasu żądania przeglądarki."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Należy uważać na pewne siebie zgadywanie.</strong> Jeśli asystent zaczyna wytwarzać ustalenia, nigdy nie cytując rzeczywistej zawartości plików, oznacza to, że nie może połączyć się z Państwa witryną i je zmyśla. Należy przerwać i sprawdzić jego łączność, zamiast ufać raportowi. <strong>Konkretnie dla Claude.ai:</strong> jeśli odpowiada &ldquo;Host not in allowlist&rdquo;, należy dodać domenę tej witryny w <em>Settings &rarr; Capabilities &rarr; Code execution &rarr; Network access</em>, a następnie rozpocząć nowy czat &mdash; działający czat zachowuje starą listę dozwolonych."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Własne GPT, Gems i inni konfigurowalni asystenci"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Na przykład: własny GPT z Actions, Gem w Gemini lub dowolny asystent, który pozwala zarejestrować własne API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Jeśli Państwa platforma pozwala zdefiniować asystenta z własnymi akcjami API, wystarczy raz zarejestrować poniższe punkty końcowe i całkowicie pominąć krok kopiuj-wklej. To najporządniejsza opcja, jeśli opiekują się Państwo kilkoma witrynami Joomla, ponieważ asystent zapamiętuje konfigurację między rozmowami."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Należy utworzyć nowego własnego asystenta i dodać akcję API wskazującą na adres URL punktu końcowego pokazany dalej na tej stronie."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Należy ustawić nazwę nagłówka uwierzytelniania na <code>X-Joomla-Token</code> i wkleić swój token API Joomla jako wartość."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Należy wkleić prompt skanowania z Panelu do instrukcji asystenta, aby znał zasady klasyfikacji i format raportu."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Modele lokalne i samodzielnie hostowane"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Na przykład: Ollama, LM Studio, llama.cpp lub dowolny samodzielnie hostowany model z wywoływaniem narzędzi"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Wszystko, co ma wywoływanie narzędzi i dostęp do sieci, zadziała od strony technicznej, a nic nie opuszcza Państwa własnej infrastruktury, co część witryn uzna za zaletę."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Należy włączyć wywoływanie narzędzi lub funkcji i potwierdzić, że model może połączyć się z tą witryną przez HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Należy wkleić prompt skanowania jako prompt systemowy, a następnie poprosić model o rozpoczęcie."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Należy realistycznie podchodzić do wielkości modelu.</strong> Przegląd nadpisania to zadanie wymagające osądu, a nie proste wyszukiwanie. Mały model lokalny bez trudu wytworzy raport, ale znacznie łatwiej przeoczy prawdziwą regresję bezpieczeństwa albo wymyśli taką, której nie ma. Ustalenia z małego modelu należy traktować jako pierwsze podejście, a nie werdykt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Klienci MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Dowolny asystent, który posługuje się Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Jeśli Twój asystent obsługuje MCP, zainstaluj <strong>MCP for J</strong> i jego bezpłatny dodatek <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Asystent sprawdza i poprawia wtedy nadpisania własnymi narzędziami, bez kopiowania i wklejania. To także lepsza droga dla czatów w przeglądarce obsługujących konektory MCP, ponieważ omija limit czasu żądań przeglądarki. Oba są osobnymi, bezpłatnymi rozszerzeniami."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Metoda 2 jest jedynym wyjątkiem"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Przycisk <em>Uruchom skan automatyczny</em> w Panelu wykonuje cały przegląd po stronie serwera, bez kopiowania i wklejania. Należy wybrać dostawcę w <em>Opcjach</em> i zapisać klucz API tego dostawcy &mdash; <strong>skany mogą wykonywać Anthropic, OpenAI i Google Gemini</strong>. Jedynym elementem nadal dostępnym wyłącznie z Anthropic jest czat kontynuacyjny w sesji, w którym proszą Państwo o zastosowanie poprawek, a model edytuje pliki przez wywołania narzędzi; ta pętla jest napisana pod protokół wywoływania narzędzi Anthropic. Przy wybranym OpenAI lub Gemini otrzymują Państwo pełny raport, a poprawki mogą Państwo zastosować samodzielnie za pomocą promptu kopiuj-wklej z Metody 1, który działa z dowolną sztuczną inteligencją."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Klucz %s zapisany &mdash; Metoda 2 dostępna"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Brak zapisanego klucza API dla dostawcy AI &mdash; Metoda 1 nadal działa"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Punkt końcowy i uwierzytelnianie"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Wszystko, co robi interfejs administracyjny, jest dostępne pod tym bazowym adresem URL. Należy go użyć przy rejestrowaniu własnego asystenta albo przy pisaniu własnego skryptu lub agenta."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla nie akceptuje <code>Authorization: Bearer</code> na tych trasach.</strong> Token należy przesyłać w nagłówku <code>X-Joomla-Token</code>. Nagłówek w formacie Bearer zwraca 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Pełna dokumentacja"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Kompletny opis punktów końcowych, format raportu, rozwiązywanie problemów i FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Przeczytaj dokumentację"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Uzyskaj pomoc"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="To rozszerzenie jest bezpłatne i takie pozostanie"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Nie ma wersji Pro, klucza licencyjnego ani żadnej wstrzymanej funkcji. Wszystko, co rozszerzenie potrafi, mają Państwo przed sobą. Mimo to bardzo chcielibyśmy poznać Państwa opinię &mdash; to informacje zwrotne z rzeczywistych witryn ukształtowały każde dotychczasowe wydanie."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Czego się spodziewać."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt to mała firma, a to rozszerzenie jest rozdawane za darmo, więc bezpłatne wsparcie oferujemy w miarę czasu pozostałego po pracy dla klientów. To rzeczywiste ograniczenie, a nie zbywanie &mdash; wolimy powiedzieć to wprost, niż kazać Państwu czekać na obietnicę, której nie możemy dotrzymać. Zgłoszenia błędów zostaną przejrzane; otwarta pomoc przy konfiguracji już niekoniecznie."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Gdzie to wysłać"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Zgłoszenia błędów, mylące sformułowania, ustalenie, które sztuczna inteligencja oceniła błędnie, sposób pracy, do którego rozszerzenie nie pasuje, albo asystent, który zachował się nieoczekiwanie &mdash; wszystko to jest przydatne."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Zgłoś problem na GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Przeczytaj dokumentację"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues to najlepsze miejsce na wszystko, co da się odtworzyć, ponieważ jest publiczne &mdash; następna osoba z tym samym problemem znajdzie odpowiedź, zamiast pytać ponownie."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Co dołączyć"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Otrzymają Państwo szybszą odpowiedź, jeśli pomogą nam pominąć etap diagnozy:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="<strong>Blok diagnostyczny</strong> z tej strony (zawiera wersje Joomla, PHP i rozszerzenia w jednym wklejeniu)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Której metody</strong> Państwo użyli &mdash; promptu kopiuj-wklej, skanu automatycznego czy własnego kodu &mdash; oraz <strong>którego asystenta AI</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Czego się Państwo <strong>spodziewali</strong> i co <strong>faktycznie</strong> się wydarzyło."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Jeśli sztuczna inteligencja błędnie oceniła ustalenie &mdash; <strong>zapisany raport sesji</strong>; należy użyć przycisku <em>Pobierz raport</em> na stronie sesji. Daje nam to dokładne ustalenia i tok rozumowania do przeanalizowania."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Pomysły również są mile widziane"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Jeśli rozszerzenie robi prawie to, czego Państwo potrzebują, ale nie do końca, prosimy dać nam znać. Kilka funkcji powstało dlatego, że jedna osoba opisała sposób pracy, o którym nie pomyśleliśmy."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnostyka"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Należy skopiować to do swojego zgłoszenia, abyśmy nie musieli o to pytać."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Kopiuj diagnostykę"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Ten blok nie zawiera żadnych sekretów. Odnotowuje wyłącznie to, czy klucz lub token jest zapisany, nigdy jego wartość."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Odsłonięcie za {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Opóźnienie przytrzymania do odsłonięcia (sekundy)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Klucze i tokeny pokazywane w tym rozszerzeniu są domyślnie rozmyte, aby udostępnianie ekranu, nagranie ekranu lub spojrzenie przez ramię ich nie ujawniło. Przytrzymanie wskaźnika nad rozmytą wartością przez tyle sekund odsłania ją; odliczanie informuje, że zegar działa. Odsunięcie wskaźnika anuluje odsłonięcie. Domyślnie <strong>3</strong>. Ustawienie <strong>0</strong> odsłania wartość natychmiast po najechaniu, co usuwa ochronę przed samym przesunięciem wskaźnika nad wartością."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automatyczne ukrycie po odsłonięciu (sekundy)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Po odsłonięciu wartości należy rozmyć ją ponownie po tylu sekundach, nawet jeśli wskaźnik nadal nad nią pozostaje. Obejmuje to sytuację, w której zerkają Państwo na klucz, a następnie coś Państwa odrywa, pozostawiając go odsłoniętym na ekranie bez nadzoru. Domyślnie <strong>8</strong>. Ustawienie <strong>0</strong> pozostawia wartość widoczną do momentu odsunięcia wskaźnika."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Dostawca AI"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Którą usługę AI wywołuje wbudowany przycisk <em>Uruchom skan automatyczny</em>. Dla wybranego dostawcy podają Państwo własny klucz, używany wyłącznie z tej witryny. To ustawienie <strong>nie</strong> wpływa na proces z promptem kopiuj-wklej &mdash; ten działa z dowolną sztuczną inteligencją i w ogóle nie wymaga klucza."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Skan mogą wykonać wszyscy trzej dostawcy.</strong> Czat kontynuacyjny w sesji &mdash; w którym proszą Państwo o zastosowanie poprawek, a model edytuje pliki przez wywołania narzędzi &mdash; działa obecnie <strong>wyłącznie z Anthropic</strong>, ponieważ ta pętla jest napisana pod protokół wywoływania narzędzi Anthropic. Przy wybranym OpenAI lub Gemini nadal otrzymują Państwo pełny raport; aby poprawki były stosowane za Państwa, należy przełączyć to ustawienie na Anthropic albo skorzystać z procesu z promptem kopiuj-wklej, który działa z dowolną sztuczną inteligencją."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Klucz OpenAI API"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Państwa osobisty klucz OpenAI API (zaczyna się od <code>sk-</code>). Można go uzyskać pod adresem <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Klucz jest przechowywany na tym serwerze i używany wyłącznie do wywołań api.openai.com w Państwa imieniu."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Klucz Google Gemini API"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Państwa osobisty klucz API Google AI Studio. Można go uzyskać pod adresem <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Klucz jest przechowywany na tym serwerze i używany wyłącznie do wywołań Gemini API w Państwa imieniu."
