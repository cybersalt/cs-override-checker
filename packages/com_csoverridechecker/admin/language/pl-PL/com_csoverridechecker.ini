COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Metoda 1: Użyj asystenta AI"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Gotowy prompt do skopiowania i wklejenia do asystenta AI, z którego Państwo korzystają — ChatGPT, Claude, Gemini, Copilot, Cursor lub modelu lokalnego. Działa bez klucza API. Przejście do promptu poniżej."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Metoda 2: Uruchom skan automatyczny"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Uruchamia przegląd nadpisań na tym serwerze z użyciem zapisanego klucza API %s. Zapisuje raport jako sesję. Przejście do przycisku uruchomienia poniżej."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Najpierw należy wybrać dostawcę AI i zapisać jego klucz API w panelu Opcji, aby włączyć skany automatyczne. Do tego czasu prosimy korzystać z Metody 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Ponowne przejście przez każdy włączony szablon i odbudowanie trackera nadpisań. Należy użyć po edycji plików szablonu poza Joomla lub gdy tracker Joomla jest nieaktualny."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Klucze i tokeny"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Opcjonalnie. Należy tutaj wybrać dostawcę AI i zapisać jego klucz API, aby rozszerzenie mogło uruchamiać skany automatycznie, bez promptu kopiuj-wklej. Pozostawić puste, aby nadal korzystać z promptu kopiuj-wklej w panelu z dowolną sztuczną inteligencją, której Państwo już używają."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Klucz Anthropic API"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Państwa osobisty klucz Anthropic API (zaczyna się od <code>sk-ant-…</code>). Można go uzyskać pod adresem <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. Klucz jest przechowywany na tym serwerze i używany wyłącznie do wywołań api.anthropic.com w Państwa imieniu. Po zapisaniu klucza panel udostępnia przycisk <em>Uruchom skan automatyczny</em>, który przekazuje przegląd nadpisań do Claude po stronie serwera i zapisuje raport jako sesję — bez kopiowania i wklejania."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Każdy automatyczny skan wykonuje jedno wywołanie API u wybranego dostawcy, rozliczane według stawek tego dostawcy za wybrany model. Witryny z bardzo dużą liczbą nadpisań są ograniczane na jedno uruchomienie (zob. <em>Nadpisań na skan</em> poniżej); należy uruchomić ponownie dla pozostałych lub skorzystać z promptu kopiuj-wklej w panelu, aby uzyskać nieograniczony rozmiar."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Model skanowania"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Model używany do jednorazowego wywołania <em>Uruchom skan automatyczny</em> w panelu. Skan to zadanie klasyfikacyjne (alert / przegląd / informacja dla każdego ustalenia). <strong>Domyślnie wybrany jest najbardziej zaawansowany model</strong> &mdash; najbardziej dokładny przegląd i najbezpieczniejszy klasyfikator dla ustaleń wymagających subtelnego osądu. Mniejsze modele dobrze radzą sobie z rutynowymi skanami za ułamek kosztu i wystarczą do skanów o niskim ryzyku na małych witrynach."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Model czatu"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Model Claude używany do rozmowy z Claude na stronie szczegółów sesji (gdzie proszą Państwo Claude o zastosowanie poprawek lub odrzucenie ustaleń). Użycie narzędzi jest bardziej wymagające niż klasyfikacja. <strong>Opus jest ustawieniem domyślnym</strong> &mdash; najbardziej niezawodne zachowanie przy użyciu narzędzi i najniższe ryzyko nieprawidłowo zastosowanej poprawki. Sonnet to dobry kompromis dla witryn z wieloma działaniami następczymi o niskim ryzyku; Haiku może mieć trudności z wieloetapowymi sekwencjami narzędzi i nie jest zalecany dla modelu czatu, chyba że koszt jest najwyższym priorytetem."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Token API Joomla (do promptu w panelu)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Opcjonalnie. Należy wygenerować token API Joomla w <em>System &rarr; Użytkownicy &rarr; Mój profil &rarr; Token Joomla API</em> i wkleić go tutaj. Prompty skanowania / poprawek w panelu automatycznie wypełnią token w miejsce zastępcy &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, więc można skopiować i wkleić bezpośrednio do Państwa asystenta AI bez edycji.<br><br><strong>Uwaga przy wielu administratorach:</strong> tokeny API Joomla uwierzytelniają jako <em>użytkownik, który je wygenerował</em>. Jeśli z tego panelu korzysta wielu administratorów, prompt użyje tego tokenu, który jest tutaj zapisany &mdash; co oznacza, że AI będzie wywoływać API, uwierzytelniając się jako ten jeden użytkownik. Pozostawić puste, aby każdy administrator wklejał własny token w momencie użycia."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Nadpisań na skan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Ile oznaczonych nadpisań szablonu przegląda przycisk <em>Uruchom skan automatyczny</em> w pojedynczym wywołaniu API. Domyślnie <strong>10</strong>. Zakres 1&ndash;100. <strong>Niższa wartość jest bezpieczniejsza dla późniejszego czatu:</strong> raport ze skanu rośnie wraz z liczbą ustaleń, a pętla użycia narzędzi w czacie zachowuje ten raport jako historię konwersacji. Na niskich poziomach limitów (Tier 1 w Anthropic pozwala na 10 tys. tokenów wejściowych na minutę) skan 60 nadpisań plus natychmiastowa tura czatu w tej samej minucie zwróci <em>HTTP 429: rate limit exceeded</em>. Przy 10 nadpisaniach na uruchomienie tury czatu po skanie pozostają komfortowo poniżej limitu. Witryny z większą liczbą nadpisań wymagają tylko kilku ponownych uruchomień, aby objąć wszystko &mdash; raport z każdego uruchomienia zapisuje się jako odrębna sesja, więc można zająć się każdą z nich niezależnie."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — najszybszy i najtańszy. Wystarczy do skanów o niskim ryzyku na małych witrynach."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — zrównoważony. Dobrze radzi sobie z rutynowymi skanami za ułamek kosztu Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — najbardziej zaawansowany, domyślny. Najbezpieczniejszy klasyfikator dla ustaleń wymagających subtelnego osądu."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>O różnicy w cenie.</strong> <strong>W chwili pisania tych słów</strong> typowy skan na witrynie z 50 nadpisaniami zużywa około 60 tys. tokenów wejściowych i wytwarza około 5 tys. tokenów wyjściowych. Przybliżony koszt skanu: <strong>~0,08 USD na Haiku, ~0,23 USD na Sonnet, ~1,13 USD na Opus</strong>. Tury czatu są znacznie mniejsze (5&ndash;10 tys. tokenów wejściowych każda), więc koszt na turę jest mniej więcej 10&times; mniejszy niż koszt skanu. Opublikowany cennik Anthropic jest źródłem prawdy pod adresem <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; powyższe liczby są przybliżone i mogą się zmieniać w czasie. Prosimy obserwować zużycie na <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> przez kilka uruchomień przed decyzją o przejściu z domyślnego Opus na tańszy poziom."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Nawigacja komponentu"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Metoda 2: Uruchom skan automatyczny (z użyciem zapisanego klucza API %s)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Brak zapisanego klucza API %s."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Klucz API zapisany."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Rozszerzenie wykona przegląd nadpisań na serwerze, używając zapisanego klucza API, bez konieczności kopiowania i wklejania. Raport zostanie automatycznie zapisany jako nowa sesja."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Kliknięcie poniżej rozpoczyna skan. Rozszerzenie pobiera każde oznaczone nadpisanie z tej witryny, wysyła je do Państwa dostawcy AI z zapisanym kluczem API i zapisuje powstały raport jako nową sesję. Po zakończeniu nastąpi przekierowanie do raportu."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Jedno wywołanie API na skan. Witryny z więcej niż %d nadpisaniami są ograniczone do pierwszych %d na uruchomienie (konfigurowalne w <em>Opcje &rarr; Klucze i tokeny &rarr; Nadpisań na skan</em>); należy uruchomić ponownie dla kolejnej partii lub skorzystać z promptu kopiuj-wklej z Metody 1, aby uzyskać nieograniczony rozmiar. Strona może wstrzymać się na 30&ndash;90 sekund, gdy AI odpowiada &mdash; to normalne, prosimy nie odchodzić od strony."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Spowoduje to wywołanie API %s z zapisanym kluczem i może potrwać od 30 do 90 sekund. Kontynuować?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Uruchom teraz skan automatyczny"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Ta metoda wykonuje cały przegląd po stronie serwera &mdash; bez kopiowania i wklejania, bez drugiego okna. Należy kliknąć przycisk <em>Opcje</em> tuż poniżej, wybrać dostawcę AI w zakładce <em>Klucze i tokeny</em>, wkleić jego klucz API i zapisać. Klucz pozostaje w bazie danych Państwa witryny; tylko ta witryna może go używać. Metoda 1 powyżej nadal działa bez klucza API, jeśli wolą Państwo przepływ kopiuj-wklej."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Trwa skan automatyczny…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Wywoływanie API %s i analiza nadpisań. Zwykle trwa to od 30 do 90 sekund. Prosimy nie zamykać tego okna."

