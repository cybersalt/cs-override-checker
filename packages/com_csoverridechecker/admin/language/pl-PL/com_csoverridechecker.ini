CS_INTEGRITY_PROBLEMS_TITLE="Instalacja niekompletna: brakuje %1$d z %2$d plików lub są one uszkodzone."
CS_INTEGRITY_PROBLEMS_BODY="Rozszerzenie %s nie zostało zainstalowane w całości, więc jego części mogą nie działać. Aby je naprawić, proszę zainstalować ten sam pakiet ponownie. Jeśli instalacja znów się nie powiedzie, instalator Joomla może być blokowany przez oprogramowanie zabezpieczające na serwerze (na przykład Imunify360 Proactive Defense): proszę sprawdzić jego dziennik incydentów."
CS_INTEGRITY_CHANGED_TITLE="%1$d z %2$d plików różni się od wydanej wersji."
