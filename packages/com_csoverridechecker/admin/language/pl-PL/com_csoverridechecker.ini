COM_CSOVERRIDECHECKER_SESSION_CHAT_SUCCESS="Claude odpowiedział — zob. najnowszą turę poniżej."
COM_CSOVERRIDECHECKER_SESSION_CHAT_ERROR="Czat nie powiódł się: %s"
