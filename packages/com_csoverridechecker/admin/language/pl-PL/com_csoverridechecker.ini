COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Wyświetlanie danych Override Checker"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Pozwala użytkownikom z dopasowanych grup odczytywać nadpisania, sesje, dziennik akcji oraz zawartość kopii zapasowych (widoki administracyjne i odczytowe punkty końcowe API)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Modyfikowanie danych Override Checker i plików nadpisań"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Pozwala użytkownikom z dopasowanych grup stosować poprawki, przywracać kopie zapasowe, odrzucać oznaczenia nadpisań oraz tworzyć i usuwać sesje. Implikuje uprawnienie Wyświetlanie."

COM_CSOVERRIDECHECKER_DASHBOARD="Panel"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="Punkt końcowy API aktywny"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Każdy użytkownik z prawidłowym tokenem API Joomla i uprawnieniem core.manage do tego komponentu może odczytać aktualne dane o nadpisaniach szablonu tej witryny."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="Adres URL punktu końcowego"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Informacje"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API udostępniające natywny tracker #__template_overrides, dzięki czemu dowolny asystent AI — lub dowolny klient z tokenem API Joomla — może przeglądać każde oznaczone nadpisanie, klasyfikować je i stosować poprawki na miejscu. Każda poprawka jest najpierw automatycznie kopiowana do bazy danych i można ją cofnąć z widoku Kopie zapasowe plików."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Wersja"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Zacznij tutaj."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="To jedyna karta potrzebna do zwykłego przeglądu. Należy uruchomić prompt, otrzymać raport, a następnie powiedzieć asystentowi w tym samym czacie, które ustalenia naprawić."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Metoda 1: Przegląd przy użyciu dowolnego asystenta AI"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Rozszerzenie udostępnia dane o nadpisaniach przez standardowe REST API, więc przegląd może wykonać <strong>dowolny</strong> asystent AI, który potrafi wysłać żądanie HTTPS — ta metoda nie jest powiązana z żadnym dostawcą. Wystarczy skopiować poniższy prompt do asystenta, z którego Państwo już korzystają, a przygotuje on przegląd bezpieczeństwa każdego oznaczonego nadpisania na tej witrynie, po czym zastosuje potwierdzone przez Państwa poprawki. Nie mają Państwo pewności, czy Państwa asystent się sprawdzi? Prosimy skorzystać z przycisku <em>Przewodnik konfiguracji</em> u góry tej strony."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Wygeneruj token API Joomla (jednorazowo)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="W panelu administracyjnym Joomla: zakładka <em>System → Użytkownicy → Mój profil → Token Joomla API</em>. Należy kliknąć ikonę oka, aby ujawnić token, a następnie go skopiować. <strong>Aby zapisać go na stałe</strong>, należy przejść do <em>Opcje → Klucze i tokeny</em> w tym komponencie, wkleić go do pola <em>Token Joomla API</em> i zapisać &mdash; podpowiedź poniżej zostanie wtedy automatycznie wypełniona tokenem, więc nie trzeba go wklejać przy każdym skanowaniu. W przeciwnym razie należy mieć token pod ręką i wkleić go do podpowiedzi w kroku 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Otwórz asystenta AI i wklej prompt poniżej."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Można użyć dowolnego asystenta — agenta terminalowego lub działającego w edytorze (Claude Code, Codex CLI, Cursor, Copilot), czatu w przeglądarce (ChatGPT, Claude.ai, Gemini), własnego GPT lub Gema albo modelu lokalnego. Jedynym wymaganiem jest możliwość wysyłania wychodzących żądań HTTPS z niestandardowym nagłówkiem. <strong>Jeśli token NIE został zapisany w Opcjach w kroku 1</strong>, należy zastąpić tekst zastępczy w nawiasach trójkątnych (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) skopiowanym tokenem. Adres URL witryny i punkty końcowe są już wypełnione dla tej witryny. Wskazówki dla poszczególnych asystentów znajdują się na stronie <em>Przewodnik konfiguracji</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Wyślij."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Asystent pobierze listę nadpisań, sprowadzi źródła nadpisania i pliku rdzenia dla każdego z nich oraz wytworzy tabelę dla każdego ustalenia plus podsumowanie w prostym języku, które można przekazać dalej."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Powiedz asystentowi, co naprawić — w tym samym czacie."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Po opublikowaniu raportu asystent zapyta, które ustalenia chcą Państwo naprawić. Należy odpowiedzieć tymi, które się potwierdza (np. <em>„napraw #1 i #3, zostaw #2 w spokoju, o trzecim porozmawiam z deweloperem”</em>). Przed wprowadzeniem poprawek tworzona jest kopia zapasowa każdego pliku, więc każdą zmianę można wycofać. <strong>Druga karta poniżej jest potrzebna tylko, jeśli zamknęli Państwo czat i chcą do niego wrócić później.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (skopiuj i wklej do asystenta AI):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Kopiuj prompt skanowania"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Skopiowano!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Większość użytkowników NIE potrzebuje tej karty."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Należy z niej korzystać tylko, jeśli rozpoczynają Państwo <em>nowy czat</em>, aby zastosować poprawki z wcześniejszego przeglądu — na przykład gdy zamknęli Państwo pierwotny czat na noc, przekazują przegląd współpracownikowi lub uruchomili skan w czacie w przeglądarce i chcą wykonać poprawki w agencie terminalowym. Jeśli Państwa czat skanowania jest nadal otwarty, prosimy przewinąć w górę — wystarczy kontynuować w tamtym czacie."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Kontynuuj wcześniejszy przegląd w nowym czacie"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Wklejenie tego promptu do nowego czatu — w dowolnym asystencie, niekoniecznie tym, który wykonał skan — przekaże mu kontekst wcześniejszego przeglądu. Asystent pobierze poprzedni raport sesji, wyświetli ustalenia i zapyta, które naprawić. Każdy plik jest kopiowany przed wprowadzeniem poprawki, więc każdą zmianę można cofnąć."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Kopiuj prompt poprawek"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Dziennik sesji"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Raporty przesłane przez Państwa asystenta AI (lub wklejone ręcznie) są tu zapisywane jako sesje. Kliknięcie sesji pozwala wyświetlić pełny raport."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Brak sesji. Należy uruchomić prompt powyżej i albo pozwolić asystentowi automatycznie odesłać raport metodą POST, albo kliknąć „Nowa sesja”, aby go wkleić."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nowa sesja"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Wyświetl wszystkie sesje"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Po przeglądzie"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Po zakończeniu działań na podstawie zaleceń z przeglądu warto wyczyścić plakietki „Wykryto zmiany”, które Joomla pokazuje w Szablonach, aby nie oznaczały dalej nadpisań, którymi już się Państwo zajęli."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Zalecane — przegląd dla każdego szablonu"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Otwiera listę Szablonów witryny. Każdy szablon z plakietką „Wykryto zmiany” można otworzyć osobno, aby odrzucić konkretne wiersze nadpisań, które już zostały obsłużone. Wolniejsze, ale zachowuje ślad audytowy dla każdego wiersza."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Otwórz zarządzanie szablonami witryny"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Zbiorczo — oznacz każde nadpisanie jako przejrzane"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Szybsza droga: czyści wszystkie wiersze w trackerze nadpisań w jednym kroku. Należy użyć tylko, gdy faktycznie przejrzano każde ustalenie. Odpowiednik użycia funkcji „Odrzuć wszystkie” w Joomla na każdym szablonie naraz."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Oznacz wszystkie jako przejrzane…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Potwierdź: oznacz wszystkie nadpisania jako przejrzane"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Czyści to każdy wiersz, który Joomla obecnie śledzi w trackerze nadpisań. Plakietki „Wykryto zmiany” w Szablonach znikną, a punkt końcowy API tej witryny będzie zwracał zero wierszy aż do następnej aktualizacji rdzenia Joomla, która je odtworzy. Akcji nie można cofnąć inaczej niż przez kliknięcie „Odbuduj tracker nadpisań” poniżej, aby ponownie przeskanować."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Potwierdzam, że przejrzałem/przejrzałam każde oznaczone nadpisanie i przyjmuję odpowiedzialność za wszelkie nieobsłużone problemy."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="Tak — oznacz wszystkie jako przejrzane"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="Oznaczono jako przejrzane i wyczyszczono z trackera %d wierszy nadpisań."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_NONE="Nie było wierszy nadpisań do wyczyszczenia."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_ERROR="Nie można było wyczyścić trackera nadpisań: %s"

COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="Zresetuj nadpisania do przeglądu"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Czy Państwo (lub poprzedni deweloper) zatwierdzili w przeszłości nadpisania bez prawdziwego ich sprawdzenia? Kliknięcie tutaj wprowadza ponownie każdy plik nadpisania do trackera, aby można było rzetelnie przejrzeć każdy z nich razem z Państwa asystentem AI. Przydatne po „Odrzuć wszystkie”, które miało miejsce przed instalacją tego narzędzia."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Przechodzi przez folder <code>html/</code> każdego włączonego szablonu i wstawia wiersz w <code>#__template_overrides</code> dla każdego pliku nadpisania, który nie jest jeszcze śledzony. Istniejące wiersze są pozostawiane bez zmian. Zresetowane wiersze pojawiają się ponownie jako plakietki „Wykryto zmiany” w panelu Szablonów, dzięki czemu można uruchomić względem nich proces przeglądu opisany powyżej."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_BUTTON="Zresetuj wszystkie nadpisania do przeglądu"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="Zresetować wszystkie nadpisania do przeglądu? Każdy plik nadpisania na tej witrynie pojawi się ponownie w plakietkach „Wykryto zmiany” w Szablonach, aby można było go ponownie ocenić."

COM_CSOVERRIDECHECKER_RESCAN_SUCCESS="Tracker nadpisań odbudowany: wstawiono %1$d wierszy w %3$d szablonach (zeskanowano %2$d plików)."
COM_CSOVERRIDECHECKER_RESCAN_ERROR="Odbudowa trackera nadpisań nie powiodła się: %s"

