COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Ver dados de Override Checker"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Permite que usuários dos grupos correspondentes leiam sobreposições, sessões, registro de ações e conteúdo de backups (visualizações admin e endpoints API de leitura)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Modificar dados de Override Checker e arquivos de sobreposição"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Permite que usuários dos grupos correspondentes apliquem correções, restaurem backups, descartem sinalizações de sobreposição, e criem ou excluam sessões. Implica Ver."

COM_CSOVERRIDECHECKER_DASHBOARD="Painel"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="Endpoint API ativo"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Qualquer usuário com um token API Joomla válido e permissão core.manage neste componente pode ler os dados atuais de sobreposição de template deste site."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL do endpoint"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Sobre"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="API Web Services expondo o rastreador nativo #__template_overrides para que qualquer assistente de IA — ou qualquer cliente com um token API Joomla — possa revisar cada sobreposição sinalizada, classificá-la e aplicar correções no local. Cada correção é primeiro salva automaticamente no banco de dados e reversível na visualização Backups de arquivos."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Versão"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Comece aqui."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Este é o único cartão que você precisa para uma revisão normal. Execute o prompt, obtenha o relatório, depois diga ao seu assistente no mesmo chat quais descobertas corrigir."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Método 1: revisão usando qualquer assistente de IA"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="A extensão expõe seus dados de sobreposição por meio de uma API REST padrão, então <strong>qualquer</strong> assistente de IA capaz de fazer uma requisição HTTPS pode executar a revisão — não há nada específico de um fornecedor neste método. Copie o prompt abaixo no assistente que você já usa e ele produzirá uma revisão de segurança de cada sobreposição sinalizada neste site, depois aplicará as correções que você confirmar. Não sabe se o seu vai funcionar? Veja o botão <em>Guia de configuração</em> no topo desta página."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Gerar um token API Joomla (uma única vez)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="No admin Joomla: <em>Sistema → Usuários → Meu Perfil → aba Token API Joomla</em>. Clique no ícone de olho para revelar o token, depois copie-o. <strong>Se quiser salvá-lo permanentemente</strong>, vá em <em>Opções → Chaves e tokens</em> neste componente, cole-o no campo <em>Token API Joomla</em> e Salve &mdash; o prompt abaixo será preenchido automaticamente com o token, então você não terá que colá-lo a cada varredura. Caso contrário, mantenha o token à mão e cole-o no prompt no passo 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Abrir seu assistente de IA e colar o prompt abaixo."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Use o assistente que preferir — um agente de terminal ou de editor (Claude Code, Codex CLI, Cursor, Copilot), um chat no navegador (ChatGPT, Claude.ai, Gemini), um GPT personalizado ou Gem, ou um modelo local. O único requisito é que ele consiga fazer requisições HTTPS de saída com um cabeçalho personalizado. <strong>Se você NÃO salvou o token em Opções no passo 1</strong>, substitua o texto de espaço reservado entre colchetes angulares (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) pelo token que você copiou. A URL do site e os endpoints já estão preenchidos para este site. Dicas para cada assistente estão na página <em>Guia de configuração</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Enviar."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Seu assistente buscará a lista de sobreposições, obterá a sobreposição e a fonte do core para cada uma, e produzirá uma tabela por descoberta mais um resumo em linguagem simples que você pode encaminhar."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Diga a ele o que corrigir — no mesmo chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Assim que o relatório for postado, ele perguntará quais descobertas você quer corrigir. Responda com as que confirmar (por ex. <em>«corrige #1 e #3, deixa #2 em paz, a de terceiros eu pergunto ao desenvolvedor»</em>). Cada arquivo recebe backup antes do patch, então tudo pode ser desfeito. <strong>Você só precisa do segundo cartão abaixo se fechou o chat e quer voltar a ele mais tarde.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (copiar e colar no seu assistente de IA):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Copiar prompt de varredura"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Copiado!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="A maioria dos usuários NÃO precisa deste cartão."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Use isto apenas se estiver iniciando um <em>chat novo</em> para aplicar correções de uma revisão anterior — por exemplo você fechou o chat original durante a noite, está passando a revisão para um colega, ou executou a varredura em um chat no navegador e quer fazer as correções em um agente de terminal. Se seu chat de varredura ainda está aberto, role para cima — apenas continue naquele chat."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Continuar uma revisão anterior em um novo chat"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Cole este prompt em um chat novo — em qualquer assistente, não necessariamente o que executou a varredura — para dar a ele o contexto da sua revisão anterior. Ele buscará o relatório da sessão anterior, listará as descobertas e perguntará quais corrigir. Cada arquivo é salvo antes de qualquer patch, então tudo é reversível."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Copiar prompt de correção"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Registro de sessões"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Os relatórios enviados pelo seu assistente de IA (ou colados manualmente) são salvos aqui como sessões. Clique em uma sessão para ver o relatório completo."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Ainda não há sessões. Execute o prompt acima e deixe seu assistente enviar o relatório automaticamente (POST), ou clique em 'Nova sessão' para colar."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nova sessão"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Ver todas as sessões"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Após a revisão"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Quando você terminar de agir nas recomendações da revisão, vai querer limpar os badges 'Alterações encontradas' que o Joomla mostra em Templates para que não continuem sinalizando as sobreposições que você já tratou."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Recomendado — revisão por template"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Abra a lista de templates do site. Cada template com um badge 'Alterações encontradas' pode ser aberto individualmente para que você descarte as linhas de sobreposição específicas que tratou. Mais lento, mas você mantém uma trilha de auditoria por linha."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Abrir gerenciamento de templates do site"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Em massa — marcar todas as sobreposições como revisadas"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Caminho mais rápido: limpar cada linha do rastreador de sobreposições em um único passo. Faça isso apenas após ter de fato revisado cada descoberta. Equivalente a usar o 'Descartar tudo' do Joomla em cada template de uma vez."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Marcar todas como revisadas…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Confirmar: marcar todas as sobreposições como revisadas"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Isto limpa cada linha que o Joomla está atualmente rastreando no rastreador de sobreposições. Os badges 'Alterações encontradas' em Templates desaparecerão, e o endpoint API deste site retornará zero linhas até a próxima atualização do core do Joomla repopulá-los. A ação não pode ser desfeita exceto clicando em 'Reconstruir rastreador de sobreposições' abaixo para varrer novamente."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Confirmo que revisei cada sobreposição sinalizada e aceito a responsabilidade por quaisquer problemas não tratados."
