COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ERROR="Não foi possível ativar o plugin Autenticação API - Token API Joomla: %s"
COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="Ativar um plugin do Joomla é uma alteração que afeta todo o site, então requer a permissão do Joomla para gerenciamento de plugins além do acesso a este componente. Peça a um Super Usuário que ative o plugin ou que conceda ao seu grupo direitos de Gerenciar em Plugins."

; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Instalação incompleta: %1$d de %2$d arquivos estão ausentes ou danificados."
CS_INTEGRITY_PROBLEMS_BODY="%s não foi instalado completamente, então partes dele podem não funcionar. Instale o mesmo pacote novamente para repará-lo. Se a instalação falhar de novo, um software de segurança do servidor (por exemplo, Imunify360 Proactive Defense) pode estar bloqueando o instalador do Joomla: verifique o registro de incidentes dele."
CS_INTEGRITY_CHANGED_TITLE="%1$d de %2$d arquivos diferem da versão publicada."
CS_INTEGRITY_CHANGED_BODY="Isso acontece após uma atualização com falha, ou quando alguém edita diretamente os arquivos de %s. Instale o mesmo pacote novamente para restaurá-los."
CS_INTEGRITY_OK="Todos os %1$d arquivos correspondem à versão publicada."
CS_INTEGRITY_NOLIST="Esta versão não tem lista de arquivos, então a verificação de arquivos não está disponível."
CS_INTEGRITY_SHOW_FILES="Mostrar arquivos"
CS_INTEGRITY_UNREADABLE="Lista de arquivos ilegível"
CS_INTEGRITY_MISSING="Ausente"
CS_INTEGRITY_EMPTY="Vazio (0 bytes)"
CS_INTEGRITY_CHANGED="Alterado"
CS_INTEGRITY_MORE="e mais %d"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Nada foi gravado. O novo conteúdo adiciona código que uma correção não pode adicionar a uma substituição: %s. Código injetado tem esta aparência, por isso é recusado mesmo que o pedido parecesse razoável. Se tiver certeza de que a alteração está correta, revise-a e faça-a você mesmo no arquivo."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Não restaurado. Este backup contém código que o arquivo atual não tem: %s. Pode ser um backdoor removido por uma correção, então uma IA ou chamada de API não pode colocá-lo de volta. Se quiser esta versão de volta, leia o backup e restaure-o na tela Backups de arquivos."
