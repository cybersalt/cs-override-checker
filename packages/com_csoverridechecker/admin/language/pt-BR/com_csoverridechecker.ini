COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Isso significa que um backup do banco de dados também os captura. Desinstalar o componente apaga a tabela junto com todos os backups armazenados."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Sobre o seu nível da API Anthropic:</strong> tanto a varredura automática quanto os recursos de chat contam para o limite de tokens por minuto da Anthropic. O Tier 1 padrão da Anthropic (10.000 tokens de entrada por minuto) é suficiente para uma varredura única em um site pequeno, mas causará limitação de taxa durante correções por chat de múltiplos turnos. O Tier 2 (50.000 tokens por minuto, cobrado) é confortável para a maioria das sessões reais de correção. Veja o seu nível atual em <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
