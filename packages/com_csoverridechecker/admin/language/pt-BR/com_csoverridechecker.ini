COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Agentes de terminal e de editor"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Por exemplo: Claude Code, Codex CLI, Cursor, modo agente do GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="A opção mais tranquila, e a que sugeriríamos se você tiver uma disponível. Eles rodam na sua própria máquina com acesso de rede de saída irrestrito, sem lista de permissões de sandbox e sem tempo limite de requisição do navegador, então uma revisão longa vai do início ao fim sem precisar ser acompanhada."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Copie o prompt de varredura do painel."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Cole-o no seu agente e envie. Nenhuma configuração é necessária."
