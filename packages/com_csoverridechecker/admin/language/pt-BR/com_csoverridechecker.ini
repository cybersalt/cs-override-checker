COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Método 1: usar seu assistente de IA"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Copiar um prompt pronto e colar no assistente de IA que você usa — ChatGPT, Claude, Gemini, Copilot, Cursor ou um modelo local. Funciona sem chave API. Salta para o prompt abaixo."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Método 2: executar varredura automática"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Executa a revisão de sobreposições neste servidor com sua chave API %s salva. Salva o relatório como uma sessão. Salta para o botão de execução abaixo."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Escolha primeiro um provedor de IA e salve a chave API dele no painel Opções para ativar varreduras automáticas. Enquanto isso, use o Método 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Percorrer novamente cada template ativado e reconstruir o rastreador de sobreposições. Use isto após editar arquivos de template fora do Joomla, ou se o rastreador do Joomla estiver desatualizado."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Chaves &amp; tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Opcional. Escolha um provedor de IA e salve aqui a chave API dele para que a extensão possa executar varreduras automaticamente, sem prompt de copiar e colar. Deixe em branco para continuar usando o prompt de copiar e colar do painel com a IA que você já usa."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Chave API Anthropic"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Sua chave API Anthropic pessoal (começa com <code>sk-ant-…</code>). Obtenha uma em <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. A chave é armazenada neste servidor e usada apenas para chamar api.anthropic.com em seu nome. Com uma chave salva, o painel exibe um botão <em>Executar varredura automática</em> que delega a revisão de sobreposições ao Claude do lado do servidor e salva o relatório como sessão — sem copiar e colar."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Cada varredura automática faz uma chamada à API do provedor escolhido, cobrada pelas tarifas desse provedor para o modelo selecionado. Sites com muitas sobreposições são limitados por execução (veja <em>Sobreposições por varredura</em> abaixo); execute novamente para o resto, ou use o prompt de copiar e colar do painel para tamanho ilimitado."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Modelo de varredura"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Modelo usado para a chamada única <em>Executar varredura automática</em> no painel. A varredura é uma tarefa de classificação (alert / review / info por descoberta). <strong>O modelo mais capaz é o padrão</strong> &mdash; a revisão mais minuciosa e o classificador mais seguro para descobertas que requerem julgamento sutil. Os modelos menores lidam bem com varreduras de rotina por uma fração do custo e servem para varreduras de baixo risco em sites pequenos."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Modelo de chat"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Modelo Claude usado para o chat-com-Claude de acompanhamento na página de detalhe da sessão (onde você pede ao Claude para aplicar correções ou descartar descobertas). O uso de ferramentas é mais exigente que classificação. <strong>Opus é o padrão</strong> &mdash; o comportamento mais confiável no uso de ferramentas e o menor risco de uma correção aplicada incorretamente. Sonnet é um bom meio-termo para sites com muitos acompanhamentos de baixo risco; Haiku pode ter dificuldades com sequências de ferramentas de múltiplas etapas e não é recomendado para o modelo de chat a menos que o custo seja a principal preocupação."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Token API Joomla (para o prompt do painel)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Opcional. Gere um token API Joomla em <em>Sistema &rarr; Usuários &rarr; Meu Perfil &rarr; Token API Joomla</em> e cole aqui. Os prompts de varredura/correção do painel preencherão o token automaticamente no lugar do placeholder &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, então você pode copiar &amp; colar diretamente no seu assistente de IA sem editar.<br><br><strong>Aviso multi-admin:</strong> tokens API Joomla autenticam como <em>o usuário que os gerou</em>. Se vários admins usam este painel, o prompt usará o token salvo aqui &mdash; o que significa que a IA chamará a API autenticando-se como aquele único usuário. Deixe em branco para que cada admin cole seu próprio token na hora do uso."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Sobreposições por varredura"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Quantas sobreposições de template sinalizadas o botão <em>Executar varredura automática</em> revisa em uma única chamada à API. Padrão <strong>10</strong>. Faixa 1&ndash;100. <strong>Mais baixo é mais seguro para o chat de acompanhamento:</strong> o relatório de varredura cresce com o número de descobertas, e o loop de uso de ferramentas do chat persiste esse relatório como histórico de conversa. Nos níveis baixos de limite de taxa (o Tier 1 da Anthropic permite 10K tokens de entrada por minuto), uma varredura de 60 sobreposições mais um turno de chat imediato no mesmo minuto retornará <em>HTTP 429: rate limit exceeded</em>. Com 10 sobreposições por execução, seus turnos de chat pós-varredura ficam confortavelmente abaixo do limite. Sites com mais sobreposições do que isso só precisam de algumas execuções a mais para cobrir tudo &mdash; o relatório de cada execução é salvo como sua própria sessão, então você pode trabalhar em cada uma de forma independente."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — o mais rápido e mais barato. Serve para varreduras de baixo risco em sites pequenos."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — equilibrado. Lida bem com varreduras de rotina por uma fração do custo do Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — o mais capaz, padrão. O classificador mais seguro para descobertas que requerem julgamento sutil."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Sobre a diferença de custo.</strong> <strong>No momento desta redação</strong>, uma varredura típica em um site com 50 sobreposições usa cerca de 60K tokens de entrada e produz cerca de 5K tokens de saída. Custo aproximado por varredura: <strong>~US$0,08 com Haiku, ~US$0,23 com Sonnet, ~US$1,13 com Opus</strong>. Turnos de chat são muito menores (5K&ndash;10K tokens de entrada cada), então o custo por turno é cerca de 10&times; menor que uma varredura. Os preços publicados pela Anthropic são a fonte da verdade em <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; os números acima são aproximados e podem variar com o tempo. Fique de olho no seu uso em <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> por algumas execuções antes de decidir se descer do padrão Opus para um nível mais barato."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Navegação do componente"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Método 2: executar varredura automática (com sua chave API %s salva)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Nenhuma chave API %s salva."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Chave API salva."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="A extensão executará a revisão de sobreposições no servidor usando sua chave API salva, sem copiar e colar. O relatório é salvo automaticamente como uma nova sessão."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Clique abaixo para iniciar uma varredura. A extensão busca cada sobreposição sinalizada neste site, envia ao seu provedor de IA com sua chave API salva, e salva o relatório resultante como uma nova sessão. Você será redirecionado ao relatório quando terminar."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Uma chamada à API por varredura. Sites com mais de %d sobreposições são limitados às primeiras %d por execução (configurável em <em>Opções &rarr; Chaves &amp; tokens &rarr; Sobreposições por varredura</em>); execute novamente para o próximo lote, ou use o prompt de copiar e colar do Método 1 para tamanho ilimitado. A página pode pausar por 30&ndash;90 segundos enquanto a IA responde &mdash; é normal, não navegue para fora."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Isto chamará a API %s com sua chave salva e pode levar de 30 a 90 segundos. Continuar?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Executar varredura automática agora"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Este método executa toda a revisão no lado servidor &mdash; sem copia-cola, sem segunda janela. Clique no botão <em>Opções</em> logo abaixo, escolha seu provedor de IA na aba <em>Chaves &amp; tokens</em>, cole a chave API dele e Salve. A chave fica no banco de dados do seu site; somente este site pode usá-la. O Método 1 acima continua funcionando sem uma chave API se você preferir o fluxo copia-cola."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Varredura automática em andamento…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Chamando a API %s e analisando suas sobreposições. Isso geralmente leva de 30 a 90 segundos. Por favor, não feche esta janela."

