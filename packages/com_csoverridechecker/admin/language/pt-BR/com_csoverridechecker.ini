COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Guia de configuração"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Use a IA que você já tem"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Esta extensão não está presa a nenhuma IA específica. Tudo o que ela expõe é uma API REST simples protegida por um token API Joomla padrão, então qualquer assistente capaz de fazer uma requisição web pode executar uma revisão &mdash; e um script que você mesmo escreva também. Esta página cobre as diferenças práticas entre as opções para que você possa escolher uma e começar."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="O que o seu assistente precisa realmente ser capaz de fazer"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Em vez de listar quais produtos funcionam &mdash; planos e recursos mudam constantemente &mdash; aqui está o requisito real. O seu assistente precisa ser capaz de:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Fazer requisições HTTPS de saída</strong> para este site, enviando um cabeçalho de requisição personalizado (<code>X-Joomla-Token</code>). Este é o único requisito obrigatório."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Enviar requisições POST com corpo JSON</strong>, se você quiser que ele aplique correções em vez de apenas relatar. Uma revisão somente leitura precisa apenas de GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Manter uma conversa razoavelmente longa</strong>, já que ele busca dois arquivos para cada sobreposição sinalizada antes de chegar a um veredito."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Não tem certeza se o seu se qualifica? Basta colar o prompt e ver. Um assistente que não consegue alcançar o seu site dirá isso de imediato, em vez de falhar silenciosamente."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Nenhum token API Joomla salvo ainda."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Qualquer que seja o assistente escolhido, ele precisa de um token API Joomla para ler seus arquivos de sobreposição. Gere um em <em>Sistema &rarr; Gerenciar &rarr; Usuários &rarr; seu usuário &rarr; Token API Joomla</em>, depois cole-o no prompt a cada vez ou salve-o aqui para que o prompt seja preenchido automaticamente."
