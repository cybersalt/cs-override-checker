COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Assistentes de chat no navegador"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Por exemplo: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Todos funcionam, desde que a conta e o modo que você está usando consigam realmente acessar a internet. Esta é a configuração mais comum e perfeitamente adequada para um site normal."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Certifique-se de que o acesso à web ou a navegação esteja ativado para a conversa. Alguns planos e alguns modos respondem apenas de memória."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Cole o prompt de varredura do painel e envie."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Se o seu site tem muitas sobreposições, peça que ele as trate em lotes para que uma única resposta não ultrapasse o tempo limite de requisição do navegador."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Cuidado com palpites confiantes.</strong> Se o assistente começar a produzir descobertas sem nunca citar o conteúdo real dos arquivos, ele não consegue alcançar o seu site e está inventando. Pare e verifique a conectividade dele em vez de confiar no relatório. <strong>Especificamente no Claude.ai:</strong> se ele responder &ldquo;Host not in allowlist&rdquo;, adicione o domínio deste site em <em>Configurações &rarr; Recursos &rarr; Execução de código &rarr; Acesso à rede</em>, depois inicie um novo chat &mdash; o que está em andamento continua usando a allowlist antiga."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="GPTs personalizados, Gems e outros assistentes configuráveis"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Por exemplo: um GPT personalizado com Actions, um Gemini Gem, ou qualquer assistente que permita registrar sua própria API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Se a sua plataforma permite definir um assistente com suas próprias ações de API, registre os endpoints abaixo uma única vez e pule totalmente a etapa de copiar e colar. Esta é a opção mais organizada se você cuida de vários sites Joomla, porque o assistente lembra a configuração entre as conversas."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Crie um novo assistente personalizado e adicione uma ação de API apontando para a URL do endpoint mostrada mais abaixo nesta página."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Defina o nome do cabeçalho de autenticação como <code>X-Joomla-Token</code> e cole o seu token API Joomla como valor."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Cole o prompt de varredura do painel nas instruções do assistente para que ele conheça as regras de classificação e o formato do relatório."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Modelos locais e auto-hospedados"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Por exemplo: Ollama, LM Studio, llama.cpp, ou qualquer modelo auto-hospedado com chamada de ferramentas"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Qualquer coisa com chamada de ferramentas e acesso à rede funcionará mecanicamente, e nada sai da sua própria infraestrutura, o que alguns sites vão preferir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Ative a chamada de ferramentas ou de funções e confirme que o modelo consegue alcançar este site por HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Cole o prompt de varredura como prompt de sistema, depois peça que ele comece."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Seja realista quanto ao tamanho do modelo.</strong> Revisar uma sobreposição é uma tarefa de julgamento, não de consulta. Um modelo local pequeno vai produzir um relatório sem hesitar, mas é muito mais provável que ele deixe passar uma regressão de segurança real ou invente uma que não existe. Trate as descobertas de um modelo pequeno como uma primeira passada, não como um veredito."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Clientes MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Qualquer assistente que fale o Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Se o seu assistente oferece suporte a MCP, instale <strong>MCP for J</strong> e o complemento gratuito <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. O assistente passa a revisar e corrigir as substituições com as próprias ferramentas, sem copiar e colar. É também o melhor caminho para chats no navegador compatíveis com conectores MCP, pois evita o tempo limite das requisições do navegador. Ambas são extensões separadas e gratuitas."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="O Método 2 é a única exceção"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="O botão <em>Executar varredura automática</em> do painel executa toda a revisão do lado do servidor, sem copiar e colar. Escolha seu provedor em <em>Opções</em> e salve a chave API desse provedor &mdash; <strong>Anthropic, OpenAI e Google Gemini executam varreduras</strong>. A única coisa que ainda é somente Anthropic é o chat de acompanhamento em uma sessão, onde você pede que ele aplique correções e ele edita arquivos por meio de chamadas de ferramentas; esse loop foi escrito para o protocolo de chamada de ferramentas da Anthropic. Com OpenAI ou Gemini selecionado você recebe o relatório completo, e pode aplicar as correções você mesmo com o prompt de copiar e colar do Método 1, que funciona com qualquer IA."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Chave %s salva &mdash; Método 2 disponível"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Nenhuma chave API salva para seu provedor de IA &mdash; o Método 1 continua funcionando"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpoint e autenticação"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Tudo o que a interface administrativa faz está disponível nesta URL base. Use-a ao registrar um assistente personalizado, ou ao escrever seu próprio script ou agente."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>O Joomla não aceita <code>Authorization: Bearer</code> nestas rotas.</strong> Você precisa enviar o token no cabeçalho <code>X-Joomla-Token</code>. Um cabeçalho no formato Bearer retorna 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Documentação completa"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Referência completa dos endpoints, formato do relatório, solução de problemas e FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Ler a documentação"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Obter ajuda"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Esta extensão é gratuita, e continua gratuita"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Não há versão Pro, nem chave de licença, nem recurso retido. Tudo o que a extensão faz está diante de você. Ainda assim, gostaríamos muito de ouvir você &mdash; o retorno de sites reais é o que moldou cada versão até aqui."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="O que esperar."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="A Cybersalt é uma empresa pequena e esta extensão é distribuída gratuitamente, então o suporte gratuito é oferecido conforme o tempo permite, entre os trabalhos para clientes. Isso é uma limitação real e não uma desculpa &mdash; preferimos dizer isso com franqueza a deixar você esperando por uma promessa que não podemos cumprir. Relatos de bugs são analisados; ajuda aberta com configuração talvez não."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Para onde enviar"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Relatos de bugs, textos confusos, uma descoberta que a IA errou, um fluxo de trabalho ao qual a extensão não se adapta, ou um assistente que se comportou de forma inesperada &mdash; tudo isso é útil."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Relatar um problema no GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Ler a documentação"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="O GitHub Issues é o melhor lugar para qualquer coisa reproduzível, porque é público &mdash; a próxima pessoa com o mesmo problema encontra a resposta em vez de perguntar de novo."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="O que incluir"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Você terá uma resposta mais rápida se nos ajudar a pular o diagnóstico:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="O <strong>bloco de diagnóstico</strong> desta página (ele traz as versões do seu Joomla, do PHP e da extensão em uma única colagem)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Qual método</strong> você usou &mdash; o prompt de copiar e colar, a varredura automática, ou o seu próprio código &mdash; e <strong>qual assistente de IA</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="O que você <strong>esperava</strong> que acontecesse, e o que <strong>de fato</strong> aconteceu."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Se a IA errou uma descoberta, o <strong>relatório da sessão salvo</strong> &mdash; use <em>Baixar relatório</em> na página da sessão. Isso nos dá as descobertas e o raciocínio exatos para analisar."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Ideias também são bem-vindas"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Se a extensão quase faz o que você precisa mas não exatamente, nos conte. Vários recursos existem porque uma pessoa descreveu um fluxo de trabalho em que não tínhamos pensado."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnóstico"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Copie isto no seu relato para que não tenhamos que perguntar."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Copiar diagnóstico"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Este bloco não contém segredos. Ele registra apenas se uma chave ou token está salvo, nunca o valor."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Revelando em {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Atraso do manter-para-revelar (segundos)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Chaves e tokens exibidos nesta extensão ficam desfocados por padrão para que um compartilhamento de tela, uma gravação ou um olhar por cima do ombro não os exponha. Mantenha o ponteiro sobre um valor desfocado por esta quantidade de segundos e ele será revelado; uma contagem regressiva indica que o cronômetro está correndo. Afastar o ponteiro cancela. Padrão <strong>3</strong>. Defina como <strong>0</strong> para revelar imediatamente ao passar o ponteiro, o que remove a proteção contra um ponteiro que apenas passa por cima do valor."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Ocultar automaticamente após revelar (segundos)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Depois que um valor tiver sido revelado, desfoque-o novamente após esta quantidade de segundos, mesmo que o ponteiro ainda esteja sobre ele. Cobre o caso em que você olha uma chave e é interrompido, deixando-a exposta em uma tela sem supervisão. Padrão <strong>8</strong>. Defina como <strong>0</strong> para mantê-la visível até você afastar o ponteiro."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Provedor de IA"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Qual serviço de IA o botão integrado <em>Executar varredura automática</em> chama. Você fornece a sua própria chave para o que escolher, e ela é usada somente a partir deste site. Esta configuração <strong>não</strong> afeta o fluxo do prompt de copiar e colar &mdash; aquele funciona com qualquer IA e não precisa de chave alguma."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Os três provedores podem executar uma varredura.</strong> O chat de acompanhamento em uma sessão &mdash; onde você pede que ele aplique correções e ele edita arquivos por meio de chamadas de ferramentas &mdash; é atualmente <strong>somente Anthropic</strong>, porque esse loop foi escrito para o protocolo de chamada de ferramentas da Anthropic. Com OpenAI ou Gemini selecionado você continua recebendo o relatório completo; para ter as correções aplicadas por você, mude isto para Anthropic ou use o fluxo do prompt de copiar e colar, que funciona com qualquer IA."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Chave API OpenAI"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Sua chave API OpenAI pessoal (começa com <code>sk-</code>). Obtenha uma em <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Armazenada neste servidor e usada apenas para chamar api.openai.com em seu nome."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Chave API Google Gemini"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Sua chave API do Google AI Studio pessoal. Obtenha uma em <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Armazenada neste servidor e usada apenas para chamar a API Gemini em seu nome."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — o mais capaz, padrão."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — mais rápido e mais barato. Adequado para varreduras de baixo risco."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — o mais capaz, padrão."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — mais rápido e mais barato. Adequado para varreduras de baixo risco."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Nenhuma chave API salva para %s. Adicione uma em Opções, ou troque de provedor."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="Você não tem permissão para obter um token API. Esta ação precisa da permissão de escrita do Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Nenhum usuário conectado pôde ser identificado, então não há token a obter."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="O plugin <strong>Usuário - Token API Joomla</strong> está desativado, então o Joomla ainda não pode emitir um token API. Ative-o e tente novamente."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Seu token foi emitido, mas o plugin <strong>Autenticação API - Token API Joomla</strong> está desativado, então o Joomla rejeitará o token nas requisições API recebidas até que você ative esse plugin também."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Seus grupos de usuário não estão na lista de permissões do plugin Usuário - Token API Joomla, então o Joomla não emitirá um token para você. Adicione um dos seus grupos à configuração Grupos de Usuários Permitidos desse plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Este site não tem um segredo definido em configuration.php, então não é possível derivar um token API."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ERROR="Não foi possível obter seu token API Joomla: %s"
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_NOT_FOUND="O plugin Usuário - Token API Joomla não está instalado neste site."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ALREADY="O plugin Usuário - Token API Joomla já estava ativado."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_SUCCESS="O plugin Usuário - Token API Joomla foi ativado."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ERROR="Não foi possível ativar o plugin Usuário - Token API Joomla: %s"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON="Obter meu token API Joomla"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Obtendo..."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="Ativar o plugin de token"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_CREATED_NOTICE="Um novo token API Joomla foi gerado para a sua conta."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_EXISTING_NOTICE="Este é o token API Joomla existente da sua conta."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Trate este token como uma senha. Ele autentica como você em toda a API Web Services do Joomla. Envie-o somente no cabeçalho X-Joomla-Token, nunca em uma URL."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_WORKING="Obtendo seu token API Joomla..."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE="Ativar agora"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE_AUTH="Seu token foi preenchido, mas o plugin <strong>Autenticação API - Token API Joomla</strong> está desativado, então o Joomla o rejeitará nas requisições API recebidas até que esse plugin também seja ativado."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_SAVE_REMINDER="Seu token API Joomla foi preenchido. Clique em Salvar para mantê-lo."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_NOT_FOUND="O plugin Autenticação API - Token API Joomla não está instalado neste site."
