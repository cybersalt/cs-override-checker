COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Die Datei wird per PHP von dieser Admin-Seite aus geschrieben; kein FTP nötig. Der Webbenutzer muss Schreibrechte auf den Zielpfad haben. Das Joomla-Site-Root ist die Grenze — die Wiederherstellung verweigert das Schreiben außerhalb davon."
