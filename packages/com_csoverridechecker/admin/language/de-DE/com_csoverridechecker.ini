COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Haben Sie (oder ein früherer Entwickler) Overrides in der Vergangenheit genehmigt, ohne sie wirklich zu prüfen? Klicken Sie hier, um jede Override-Datei wieder in den Tracker zu bringen, sodass Sie jede einzeln mit Ihrem KI-Assistenten richtig prüfen können. Nützlich nach einem 'Alle ablehnen', das vor der Installation dieses Tools stattfand."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Durchläuft den <code>html/</code>-Ordner jedes aktivierten Templates und fügt eine Zeile in <code>#__template_overrides</code> für jede Override-Datei ein, die noch nicht verfolgt wird. Bestehende Zeilen bleiben unangetastet. Zurückgesetzte Zeilen erscheinen wieder als 'Änderungen gefunden'-Markierungen in der Templates-Verwaltung, sodass Sie den Prüfungsworkflow oben dagegen ausführen können."
