COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Einrichtungsanleitung"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Nutzen Sie die KI, die Sie bereits haben"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Diese Erweiterung ist an keine bestimmte KI gebunden. Alles, was sie bereitstellt, ist eine einfache REST-API, abgesichert durch ein normales Joomla API-Token &mdash; jeder Assistent, der eine Web-Anfrage stellen kann, kann also eine Prüfung durchführen, und ein selbst geschriebenes Skript ebenso. Diese Seite beschreibt die praktischen Unterschiede zwischen den Optionen, damit Sie eine auswählen und loslegen können."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Was Ihr Assistent tatsächlich können muss"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Statt aufzulisten, welche Produkte funktionieren &mdash; Tarife und Funktionen ändern sich ständig &mdash; hier die eigentliche Anforderung. Ihr Assistent muss Folgendes können:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Ausgehende HTTPS-Anfragen</strong> an diese Site stellen und dabei einen eigenen Anfrage-Header (<code>X-Joomla-Token</code>) senden. Das ist die einzige harte Anforderung."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>POST-Anfragen mit einem JSON-Body senden</strong>, wenn er nicht nur berichten, sondern auch Korrekturen anwenden soll. Für eine rein lesende Prüfung genügt GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Eine einigermaßen lange Konversation führen</strong>, da er für jeden markierten Override zwei Dateien abruft, bevor er zu einem Urteil kommt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Nicht sicher, ob Ihrer die Voraussetzungen erfüllt? Fügen Sie einfach den Prompt ein und probieren Sie es aus. Ein Assistent, der Ihre Site nicht erreichen kann, sagt das sofort, statt stillschweigend zu scheitern."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Noch kein Joomla API-Token gespeichert."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Welchen Assistenten Sie auch wählen, er benötigt ein Joomla API-Token, um Ihre Override-Dateien zu lesen. Erzeugen Sie eines unter <em>System &rarr; Verwalten &rarr; Benutzer &rarr; Ihr Benutzer &rarr; Joomla API-Token</em> und fügen Sie es dann entweder jedes Mal in den Prompt ein oder speichern Sie es hier, damit der Prompt automatisch ausgefüllt wird."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Empfohlen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Am häufigsten"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Am besten für mehrere Sites"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Funktioniert, mit Einschränkungen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Fortgeschritten"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Terminal- und Editor-Agenten"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Zum Beispiel: Claude Code, Codex CLI, Cursor, GitHub Copilot Agent-Modus, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="Die reibungsloseste Option und das, was wir vorschlagen würden, wenn Sie eine davon zur Verfügung haben. Diese laufen auf Ihrem eigenen Rechner mit uneingeschränktem ausgehendem Netzwerkzugriff, ohne Sandbox-Allowlist und ohne Anfrage-Timeout des Browsers, sodass eine lange Prüfung von Anfang bis Ende durchläuft, ohne dass Sie danebensitzen müssen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Kopieren Sie den Scan-Prompt aus dem Dashboard."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Fügen Sie ihn in Ihren Agenten ein und senden Sie ihn ab. Es ist keine Konfiguration nötig."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Wenn der Bericht erscheint, antworten Sie in derselben Sitzung und nennen Sie die Nummern der Befunde, die behoben werden sollen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Chat-Assistenten im Browser"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Zum Beispiel: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Alle davon funktionieren, sofern das von Ihnen genutzte Konto und der genutzte Modus tatsächlich ins Internet gelangen. Das ist die häufigste Konstellation und für eine normale Site völlig ausreichend."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Stellen Sie sicher, dass Webzugriff bzw. Browsing für die Konversation eingeschaltet ist. Manche Tarife und manche Modi antworten nur aus dem Gedächtnis."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Fügen Sie den Scan-Prompt aus dem Dashboard ein und senden Sie ihn ab."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Wenn Ihre Site viele Overrides hat, bitten Sie den Assistenten, sie in Stapeln abzuarbeiten, damit eine einzelne Antwort nicht über das Anfrage-Timeout des Browsers hinausläuft."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Achten Sie auf selbstbewusstes Raten.</strong> Wenn der Assistent Befunde produziert, ohne jemals echte Dateiinhalte zu zitieren, kann er Ihre Site nicht erreichen und erfindet sie. Halten Sie an und prüfen Sie seine Verbindung, statt dem Bericht zu vertrauen. <strong>Speziell Claude.ai:</strong> wenn es mit &ldquo;Host not in allowlist&rdquo; antwortet, fügen Sie die Domain dieser Site unter <em>Einstellungen &rarr; Funktionen &rarr; Code-Ausführung &rarr; Netzwerkzugriff</em> hinzu und starten Sie dann einen neuen Chat &mdash; der laufende behält die alte Allowlist."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Custom GPTs, Gems und andere konfigurierbare Assistenten"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Zum Beispiel: ein Custom GPT mit Actions, ein Gemini Gem oder jeder Assistent, bei dem Sie Ihre eigene API registrieren können"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Wenn Ihre Plattform es erlaubt, einen Assistenten mit eigenen API-Aktionen zu definieren, registrieren Sie die untenstehenden Endpunkte einmal und sparen sich das Kopieren und Einfügen vollständig. Das ist die sauberste Option, wenn Sie mehrere Joomla-Sites betreuen, denn der Assistent merkt sich die Einrichtung über Konversationen hinweg."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Erstellen Sie einen neuen benutzerdefinierten Assistenten und fügen Sie eine API-Aktion hinzu, die auf die weiter unten auf dieser Seite angezeigte Endpunkt-URL zeigt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Setzen Sie den Namen des Authentifizierungs-Headers auf <code>X-Joomla-Token</code> und fügen Sie Ihr Joomla API-Token als Wert ein."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Fügen Sie den Scan-Prompt aus dem Dashboard in die Anweisungen des Assistenten ein, damit er die Klassifizierungsregeln und das Berichtsformat kennt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Lokale und selbst gehostete Modelle"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Zum Beispiel: Ollama, LM Studio, llama.cpp oder jedes selbst gehostete Modell mit Tool-Aufrufen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Alles mit Tool-Aufrufen und Netzwerkzugriff funktioniert technisch, und nichts verlässt Ihre eigene Infrastruktur, was manche Sites bevorzugen werden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Aktivieren Sie Tool- bzw. Function-Calling und stellen Sie sicher, dass das Modell diese Site über HTTPS erreichen kann."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Fügen Sie den Scan-Prompt als System-Prompt ein und bitten Sie das Modell dann zu beginnen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Seien Sie realistisch bei der Modellgröße.</strong> Einen Override zu prüfen ist eine Ermessensaufgabe, kein Nachschlagen. Ein kleines lokales Modell erstellt bereitwillig einen Bericht, übersieht aber weit eher eine echte Sicherheitsregression oder erfindet eine, die es gar nicht gibt. Behandeln Sie Befunde eines kleinen Modells als ersten Durchgang, nicht als Urteil."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP-Clients"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Jeder Assistent, der das Model Context Protocol spricht"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Wenn Ihr Assistent MCP unterstützt, installieren Sie <strong>MCP for J</strong> und das kostenlose Add-on <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Ihr Assistent prüft und korrigiert Overrides dann mit eigenen Werkzeugen, ganz ohne Kopieren und Einfügen. Auch für Browser-Chats mit MCP-Connectors ist das der bessere Weg, weil das Zeitlimit für Browser-Anfragen entfällt. Beides sind separate, kostenlose Erweiterungen."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Methode 2 ist die eine Ausnahme"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Die Schaltfläche <em>Automatischen Scan ausführen</em> im Dashboard führt die gesamte Prüfung serverseitig aus, ohne Kopieren und Einfügen. Wählen Sie Ihren Anbieter unter <em>Optionen</em> und speichern Sie den API-Schlüssel dieses Anbieters &mdash; <strong>Anthropic, OpenAI und Google Gemini können alle Scans ausführen</strong>. Nur der Folge-Chat zu einer Sitzung, in dem Sie um das Anwenden von Korrekturen bitten und Dateien über Tool-Aufrufe bearbeitet werden, ist weiterhin auf Anthropic beschränkt; diese Schleife ist gegen Anthropics Tool-Calling-Protokoll geschrieben. Mit ausgewähltem OpenAI oder Gemini erhalten Sie den vollständigen Bericht und können die Korrekturen selbst mit dem Copy-Paste-Prompt aus Methode 1 anwenden, der mit jeder KI funktioniert."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s-Schlüssel gespeichert &mdash; Methode 2 verfügbar"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Kein API-Schlüssel für Ihren KI-Anbieter gespeichert &mdash; Methode 1 funktioniert weiterhin"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpunkt und Authentifizierung"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Alles, was die Admin-Oberfläche tut, ist über diese Basis-URL verfügbar. Verwenden Sie sie, wenn Sie einen benutzerdefinierten Assistenten registrieren oder ein eigenes Skript bzw. einen eigenen Agenten schreiben."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla akzeptiert <code>Authorization: Bearer</code> auf diesen Routen nicht.</strong> Sie müssen das Token im <code>X-Joomla-Token</code>-Header senden. Ein Header im Bearer-Format liefert 401 Forbidden zurück."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Vollständige Dokumentation"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Vollständige Endpunkt-Referenz, Berichtsformat, Fehlerbehebung und FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Dokumentation lesen"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Hilfe erhalten"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Diese Erweiterung ist kostenlos und bleibt kostenlos"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Es gibt keine Pro-Version, keinen Lizenzschlüssel und keine zurückgehaltene Funktion. Alles, was die Erweiterung kann, liegt vor Ihnen. Trotzdem würden wir sehr gerne von Ihnen hören &mdash; Rückmeldungen von echten Sites haben bisher jede Veröffentlichung geprägt."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Was Sie erwarten können."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt ist ein kleines Unternehmen und diese Erweiterung wird kostenlos abgegeben, daher wird kostenloser Support geleistet, wie es die Zeit neben der Kundenarbeit zulässt. Das ist eine echte Einschränkung und keine Abfuhr &mdash; wir sagen es lieber offen, als Sie auf ein Versprechen warten zu lassen, das wir nicht halten können. Fehlerberichte werden angesehen; offene Konfigurationshilfe möglicherweise nicht."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Wohin damit"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Fehlerberichte, verwirrende Formulierungen, ein Befund, den die KI falsch beurteilt hat, ein Arbeitsablauf, zu dem die Erweiterung nicht passt, oder ein Assistent, der sich unerwartet verhalten hat &mdash; alles davon ist nützlich."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Ein Problem auf GitHub melden"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Dokumentation lesen"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues ist der beste Ort für alles Reproduzierbare, weil es öffentlich ist &mdash; die nächste Person mit demselben Problem findet die Antwort, statt erneut zu fragen."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Was Sie beilegen sollten"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Sie bekommen schneller eine Antwort, wenn Sie uns die Diagnose ersparen:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="Den <strong>Diagnose-Block</strong> von dieser Seite (er enthält Ihre Joomla-, PHP- und Erweiterungsversionen in einem einzigen Einfügen)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Welche Methode</strong> Sie verwendet haben &mdash; den Copy-Paste-Prompt, den automatischen Scan oder eigenen Code &mdash; und <strong>welchen KI-Assistenten</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Was Sie <strong>erwartet</strong> haben und was <strong>tatsächlich</strong> passiert ist."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Wenn die KI einen Befund falsch beurteilt hat, den <strong>gespeicherten Sitzungsbericht</strong> &mdash; verwenden Sie <em>Bericht herunterladen</em> auf der Sitzungsseite. Damit haben wir genau die Befunde und die Begründung vor uns."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Ideen sind ebenfalls willkommen"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Wenn die Erweiterung fast das tut, was Sie brauchen, aber eben nicht ganz, sagen Sie uns Bescheid. Mehrere Funktionen sind entstanden, weil eine einzelne Person einen Arbeitsablauf beschrieben hat, an den wir nicht gedacht hatten."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnose"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Kopieren Sie dies in Ihren Bericht, damit wir nicht nachfragen müssen."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Diagnose kopieren"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Dieser Block enthält keine Geheimnisse. Er hält nur fest, ob ein Schlüssel oder Token gespeichert ist, niemals den Wert."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Anzeige in {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Verzögerung beim Halten zum Anzeigen (Sekunden)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Schlüssel und Tokens, die in dieser Erweiterung angezeigt werden, sind standardmäßig unscharf, damit eine Bildschirmfreigabe, ein Screencast oder ein Blick über die Schulter sie nicht preisgibt. Halten Sie den Zeiger so viele Sekunden über einen unscharfen Wert, und er wird sichtbar; ein Countdown zeigt Ihnen, dass der Timer läuft. Wegbewegen bricht ab. Standard <strong>3</strong>. Auf <strong>0</strong> setzen, um sofort beim Überfahren anzuzeigen, was den Schutz davor aufhebt, dass ein Zeiger den Wert lediglich überstreicht."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automatisch ausblenden nach Anzeige (Sekunden)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Sobald ein Wert angezeigt wurde, wird er nach so vielen Sekunden wieder unscharf, selbst wenn der Zeiger noch darüber steht. Deckt den Fall ab, dass Sie auf einen Schlüssel blicken und dann unterbrochen werden, sodass er auf einem unbeaufsichtigten Bildschirm sichtbar bleibt. Standard <strong>8</strong>. Auf <strong>0</strong> setzen, damit er sichtbar bleibt, bis Sie sich wegbewegen."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="KI-Anbieter"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Welchen KI-Dienst die eingebaute Schaltfläche <em>Automatischen Scan ausführen</em> aufruft. Für den von Ihnen gewählten Dienst hinterlegen Sie Ihren eigenen Schlüssel, und er wird ausschließlich von dieser Site aus verwendet. Diese Einstellung betrifft den Copy-Paste-Prompt-Workflow <strong>nicht</strong> &mdash; dieser funktioniert mit jeder KI und benötigt überhaupt keinen Schlüssel."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Alle drei Anbieter können einen Scan ausführen.</strong> Der Folge-Chat zu einer Sitzung &mdash; in dem Sie um das Anwenden von Korrekturen bitten und Dateien über Tool-Aufrufe bearbeitet werden &mdash; ist derzeit <strong>nur mit Anthropic</strong> möglich, weil diese Schleife gegen Anthropics Tool-Calling-Protokoll geschrieben ist. Mit ausgewähltem OpenAI oder Gemini erhalten Sie weiterhin den vollständigen Bericht; damit Korrekturen für Sie angewendet werden, stellen Sie dies entweder auf Anthropic um oder verwenden Sie den Copy-Paste-Prompt-Workflow, der mit jeder KI funktioniert."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="OpenAI API-Schlüssel"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Ihr persönlicher OpenAI API-Schlüssel (beginnt mit <code>sk-</code>). Holen Sie sich einen unter <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Wird auf diesem Server gespeichert und ausschließlich für Aufrufe an api.openai.com in Ihrem Auftrag verwendet."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Google Gemini API-Schlüssel"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Ihr persönlicher Google AI Studio API-Schlüssel. Holen Sie sich einen unter <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Wird auf diesem Server gespeichert und ausschließlich für Aufrufe an die Gemini-API in Ihrem Auftrag verwendet."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — leistungsfähigstes, Standard."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — schneller und günstiger. Für Scans mit geringem Risiko in Ordnung."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — leistungsfähigstes, Standard."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — schneller und günstiger. Für Scans mit geringem Risiko in Ordnung."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Kein API-Schlüssel für %s gespeichert. Fügen Sie einen unter Optionen hinzu oder wechseln Sie den Anbieter."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="Sie haben keine Berechtigung, ein API-Token abzurufen. Diese Aktion benötigt die Schreibberechtigung für Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Es konnte kein angemeldeter Benutzer ermittelt werden, daher gibt es kein Token abzurufen."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="Das Plugin <strong>Benutzer - Joomla API-Token</strong> ist deaktiviert, daher kann Joomla noch kein API-Token ausstellen. Aktivieren Sie es und versuchen Sie es erneut."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Ihr Token wurde ausgestellt, aber das Plugin <strong>API-Authentifizierung - Joomla API-Token</strong> ist deaktiviert, daher wird Joomla das Token bei eingehenden API-Anfragen ablehnen, bis Sie auch dieses Plugin aktivieren."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Ihre Benutzergruppen stehen nicht auf der Allowlist im Plugin Benutzer - Joomla API-Token, daher stellt Joomla Ihnen kein Token aus. Fügen Sie eine Ihrer Gruppen in der Einstellung Erlaubte Benutzergruppen dieses Plugins hinzu."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Diese Site hat kein Secret in der configuration.php gesetzt, daher kann kein API-Token abgeleitet werden."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ERROR="Ihr Joomla API-Token konnte nicht abgerufen werden: %s"
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_NOT_FOUND="Das Plugin Benutzer - Joomla API-Token ist auf dieser Site nicht installiert."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ALREADY="Das Plugin Benutzer - Joomla API-Token war bereits aktiviert."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_SUCCESS="Das Plugin Benutzer - Joomla API-Token wurde aktiviert."
COM_CSOVERRIDECHECKER_ENABLE_TOKEN_PLUGIN_ERROR="Das Plugin Benutzer - Joomla API-Token konnte nicht aktiviert werden: %s"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON="Mein Joomla API-Token abrufen"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Wird abgerufen…"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="Token-Plugin aktivieren"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_CREATED_NOTICE="Für Ihr Konto wurde ein neues Joomla API-Token erzeugt."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_EXISTING_NOTICE="Dies ist das vorhandene Joomla API-Token für Ihr Konto."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Behandeln Sie dieses Token wie ein Passwort. Es authentifiziert sich in der gesamten Joomla Web Services API als Sie. Senden Sie es ausschließlich im X-Joomla-Token-Header, niemals in einer URL."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_WORKING="Ihr Joomla API-Token wird abgerufen…"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE="Jetzt aktivieren"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE_AUTH="Ihr Token wurde eingetragen, aber das Plugin <strong>API-Authentifizierung - Joomla API-Token</strong> ist deaktiviert, daher wird Joomla es bei eingehenden API-Anfragen ablehnen, bis auch dieses Plugin aktiviert ist."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_SAVE_REMINDER="Ihr Joomla API-Token wurde eingetragen. Klicken Sie auf Speichern, um es zu übernehmen."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_NOT_FOUND="Das Plugin API-Authentifizierung - Joomla API-Token ist auf dieser Site nicht installiert."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ALREADY="Das Plugin API-Authentifizierung - Joomla API-Token war bereits aktiviert."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_SUCCESS="Das Plugin API-Authentifizierung - Joomla API-Token wurde aktiviert. Ihr API-Token wird nun bei eingehenden Anfragen akzeptiert."
COM_CSOVERRIDECHECKER_ENABLE_API_AUTH_PLUGIN_ERROR="Das Plugin API-Authentifizierung - Joomla API-Token konnte nicht aktiviert werden: %s"
COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="Das Aktivieren eines Joomla-Plugins ist eine site-weite Änderung und erfordert daher neben dem Zugriff auf diese Komponente auch die Joomla-Berechtigung zur Plugin-Verwaltung. Bitten Sie einen Super-Benutzer, das Plugin zu aktivieren oder Ihrer Gruppe Verwalten-Rechte für Plugins zu gewähren."

; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Installation unvollständig: %1$d von %2$d Dateien fehlen oder sind beschädigt."
CS_INTEGRITY_PROBLEMS_BODY="%s wurde nicht vollständig installiert, daher funktionieren Teile davon möglicherweise nicht. Installieren Sie dasselbe Paket erneut, um es zu reparieren. Schlägt die Installation erneut fehl, blockiert möglicherweise Sicherheitssoftware auf dem Server (zum Beispiel Imunify360 Proactive Defense) den Installer von Joomla: Prüfen Sie deren Vorfallprotokoll."
CS_INTEGRITY_CHANGED_TITLE="%1$d von %2$d Dateien weichen von der veröffentlichten Version ab."
CS_INTEGRITY_CHANGED_BODY="Das passiert nach einem fehlgeschlagenen Update oder wenn jemand die Dateien von %s direkt bearbeitet. Installieren Sie dasselbe Paket erneut, um sie wiederherzustellen."
CS_INTEGRITY_OK="Alle %1$d Dateien stimmen mit der veröffentlichten Version überein."
CS_INTEGRITY_NOLIST="Dieser Build enthält keine Dateiliste, daher ist die Dateiprüfung nicht verfügbar."
CS_INTEGRITY_SHOW_FILES="Dateien anzeigen"
CS_INTEGRITY_UNREADABLE="Dateiliste nicht lesbar"
CS_INTEGRITY_MISSING="Fehlt"
CS_INTEGRITY_EMPTY="Leer (0 Byte)"
CS_INTEGRITY_CHANGED="Geändert"
CS_INTEGRITY_MORE="und %d weitere"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Es wurde nichts geschrieben. Der neue Inhalt fügt Code hinzu, den eine Korrektur einem Override nicht hinzufügen darf: %s. So sieht eingeschleuster Code aus, deshalb wird er abgelehnt, auch wenn die Anfrage vernünftig wirkte. Wenn Sie sicher sind, dass die Änderung richtig ist, prüfen Sie sie und nehmen Sie sie selbst in der Datei vor."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Nicht wiederhergestellt. Diese Sicherung enthält Code, den die aktuelle Datei nicht hat: %s. Es könnte eine Hintertür sein, die eine Korrektur entfernt hat, daher kann eine KI oder ein API-Aufruf sie nicht zurückbringen. Wenn Sie diese Version zurückhaben möchten, lesen Sie die Sicherung und stellen Sie sie im Bildschirm Datei-Backups wieder her."
