COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Schnellerer Weg: jede Zeile im Override-Tracker in einem Schritt löschen. Tun Sie das nur, nachdem Sie tatsächlich jeden Befund geprüft haben. Entspricht Joomlas eigener 'Alle ablehnen'-Funktion gleichzeitig auf jedem Template."
