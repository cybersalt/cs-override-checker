COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Methode 1: Ihren KI-Assistenten verwenden"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Einen vorbereiteten Prompt kopieren und in den KI-Assistenten Ihrer Wahl einfügen — ChatGPT, Claude, Gemini, Copilot, Cursor oder ein lokales Modell. Funktioniert ohne API-Schlüssel. Springt zum Prompt unten."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Methode 2: Automatischen Scan ausführen"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Führt die Override-Prüfung auf diesem Server mit Ihrem gespeicherten %s API-Schlüssel aus. Speichert den Bericht als Sitzung. Springt zur Schaltfläche unten."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Wählen Sie zuerst im Optionen-Bereich einen KI-Anbieter und speichern Sie dessen API-Schlüssel, um automatische Scans zu aktivieren. Verwenden Sie bis dahin Methode 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Jedes aktivierte Template erneut durchlaufen und den Override-Tracker neu aufbauen. Verwenden Sie dies, nachdem Template-Dateien außerhalb von Joomla bearbeitet wurden, oder wenn Joomlas Tracker veraltet ist."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Schlüssel &amp; Tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Optional. Wählen Sie hier einen KI-Anbieter und speichern Sie dessen API-Schlüssel, damit die Erweiterung Scans automatisch ausführen kann, ganz ohne Copy-Paste-Prompt. Lassen Sie das Feld leer, um den Copy-Paste-Prompt im Dashboard weiterhin mit der KI zu verwenden, die Sie bereits nutzen."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API-Schlüssel"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Ihr persönlicher Anthropic API-Schlüssel (beginnt mit <code>sk-ant-…</code>). Holen Sie sich einen unter <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. Der Schlüssel wird auf diesem Server gespeichert und ausschließlich für Aufrufe an api.anthropic.com in Ihrem Auftrag verwendet. Mit gespeichertem Schlüssel zeigt das Dashboard eine Schaltfläche <em>Automatischen Scan ausführen</em>, die die Override-Prüfung serverseitig an Claude übergibt und den Bericht als Sitzung zurückspeichert — kein Kopieren und Einfügen nötig."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Jeder automatische Scan tätigt einen API-Aufruf an den von Ihnen gewählten Anbieter, abgerechnet zu dessen Preisen für das ausgewählte Modell. Sites mit sehr vielen Overrides werden pro Lauf begrenzt (siehe <em>Overrides pro Scan</em> unten); führen Sie für den Rest einen weiteren Lauf durch oder nutzen Sie für unbegrenzte Größe den Copy-Paste-Prompt im Dashboard."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Scan-Modell"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Modell, das für den einmaligen <em>Automatischen Scan</em>-Aufruf im Dashboard verwendet wird. Der Scan ist eine Klassifizierungsaufgabe (alert / review / info pro Befund). <strong>Das leistungsfähigste Modell ist die Standardwahl</strong> &mdash; die gründlichste Überprüfung und der sicherste Klassifikator für Befunde, die ein feines Urteil erfordern. Die kleineren Modelle bewältigen routinemäßige Scans gut zu einem Bruchteil der Kosten und sind für Scans mit geringem Risiko auf kleinen Sites in Ordnung."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Chat-Modell"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Claude-Modell, das für den Chat-mit-Claude-Folgedialog auf der Sitzungsdetailseite verwendet wird (wo Sie Claude bitten, Korrekturen anzuwenden oder Befunde abzulehnen). Tool-Nutzung ist anspruchsvoller als Klassifizierung. <strong>Opus ist die Standardwahl</strong> &mdash; das zuverlässigste Tool-Verhalten und das geringste Risiko einer falsch angewandten Korrektur. Sonnet ist ein guter Mittelweg für Sites mit vielen risikoarmen Folgeaktionen; Haiku kann mit mehrstufigen Tool-Sequenzen Schwierigkeiten haben und ist für das Chat-Modell nicht empfohlen, es sei denn, Kosten sind das oberste Kriterium."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API-Token (für den Dashboard-Prompt)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Optional. Erzeugen Sie ein Joomla API-Token unter <em>System &rarr; Benutzer &rarr; Mein Profil &rarr; Joomla API-Token</em> und fügen Sie es hier ein. Die Scan-/Fix-Prompts des Dashboards füllen das Token dann automatisch anstelle des Platzhalters &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo; ein, sodass Sie ohne Bearbeitung direkt in Ihren KI-Assistenten kopieren &amp; einfügen können.<br><br><strong>Mehrere-Admins-Hinweis:</strong> Joomla API-Tokens authentifizieren sich als <em>der Benutzer, der sie erzeugt hat</em>. Wenn mehrere Admins dieses Dashboard verwenden, nutzt der Prompt das hier gespeicherte Token &mdash; das heißt, die KI ruft die API authentifiziert als dieser eine Benutzer auf. Lassen Sie das Feld leer, damit jeder Admin sein eigenes Token bei der Verwendung einfügt."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Overrides pro Scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Wie viele markierte Template-Overrides die Schaltfläche <em>Automatischen Scan ausführen</em> in einem einzigen API-Aufruf prüft. Standard <strong>10</strong>. Bereich 1&ndash;100. <strong>Niedriger ist sicherer für den anschließenden Chat:</strong> der Scan-Bericht wächst mit der Anzahl der Befunde, und die Tool-Use-Schleife im Chat behält diesen Bericht als Konversationsverlauf. Auf niedrigen Rate-Limit-Stufen (Anthropics Tier 1 erlaubt 10K Eingabe-Tokens pro Minute) gibt ein 60-Override-Scan plus eine sofortige Chat-Runde innerhalb derselben Minute <em>HTTP 429: rate limit exceeded</em> zurück. Mit 10 Overrides pro Lauf bleiben Ihre Chat-Runden nach dem Scan komfortabel unter dem Limit. Sites mit mehr Overrides als das benötigen einfach einige weitere Läufe, um alles abzudecken &mdash; der Bericht jedes Laufs wird als eigene Sitzung gespeichert, sodass Sie jede unabhängig durcharbeiten können."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — am schnellsten und günstigsten. Gut geeignet für Scans mit geringem Risiko auf kleinen Sites."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — ausgewogen. Bewältigt routinemäßige Scans gut zu einem Bruchteil der Opus-Kosten."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — am leistungsfähigsten, Standard. Der sicherste Klassifikator für Befunde, die ein feines Urteil erfordern."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Zu den Kostenunterschieden.</strong> <strong>Zum Zeitpunkt der Erstellung dieses Textes</strong> verbraucht ein typischer Scan auf einer Site mit 50 Overrides etwa 60K Eingabe-Tokens und produziert etwa 5K Ausgabe-Tokens. Grobe Kosten pro Scan: <strong>~$0,08 mit Haiku, ~$0,23 mit Sonnet, ~$1,13 mit Opus</strong>. Chat-Runden sind viel kleiner (jeweils 5K&ndash;10K Eingabe-Tokens), sodass die Kosten pro Runde etwa 10&times; geringer sind als ein Scan. Anthropics veröffentlichte Preise sind die Wahrheitsquelle unter <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; die Zahlen oben sind Annäherungen und können sich im Laufe der Zeit ändern. Beobachten Sie Ihre Nutzung auf <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> für ein paar Läufe, bevor Sie entscheiden, ob Sie von der Opus-Standardwahl auf eine günstigere Stufe wechseln möchten."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Komponentennavigation"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Methode 2: Automatischen Scan ausführen (mit Ihrem gespeicherten %s API-Schlüssel)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Kein %s API-Schlüssel gespeichert."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API-Schlüssel gespeichert."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Die Erweiterung führt die Override-Prüfung auf dem Server mit Ihrem gespeicherten API-Schlüssel durch, ohne Kopieren und Einfügen. Der Bericht wird automatisch als neue Sitzung gespeichert."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Klicken Sie unten, um einen Scan zu starten. Die Erweiterung holt jeden markierten Override auf dieser Site, schickt ihn mit Ihrem gespeicherten API-Schlüssel an Ihren KI-Anbieter und speichert den resultierenden Bericht als neue Sitzung. Sie werden zum Bericht weitergeleitet, sobald er fertig ist."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Ein API-Aufruf pro Scan. Sites mit mehr als %d Overrides werden auf die ersten %d pro Lauf begrenzt (konfigurierbar unter <em>Optionen &rarr; Schlüssel &amp; Tokens &rarr; Overrides pro Scan</em>); führen Sie für den nächsten Stapel einen weiteren Lauf durch oder verwenden Sie für unbegrenzte Größe den Copy-Paste-Prompt aus Methode 1. Die Seite kann 30&ndash;90 Sekunden pausieren, während die KI antwortet &mdash; das ist normal, navigieren Sie nicht weg."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Dies ruft die %s API mit Ihrem gespeicherten Schlüssel auf und kann 30 bis 90 Sekunden dauern. Fortfahren?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Automatischen Scan jetzt ausführen"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Diese Methode führt die gesamte Überprüfung serverseitig durch &mdash; kein Kopieren und Einfügen, kein zweites Fenster. Klicken Sie auf die Schaltfläche <em>Optionen</em> direkt unten, wählen Sie auf der Registerkarte <em>Schlüssel &amp; Tokens</em> Ihren KI-Anbieter, fügen Sie dessen API-Schlüssel ein und speichern Sie. Der Schlüssel verbleibt in der Datenbank Ihrer Site; nur diese Site kann ihn verwenden. Methode 1 oben funktioniert weiterhin auch ohne API-Schlüssel, falls Sie den Copy-Paste-Workflow bevorzugen."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Automatischer Scan läuft…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Die %s API wird aufgerufen und Ihre Overrides werden analysiert. Das dauert üblicherweise 30 bis 90 Sekunden. Bitte schließen Sie dieses Fenster nicht."

