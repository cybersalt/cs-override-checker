COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Override Checker-Daten und Override-Dateien ändern"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Erlaubt Benutzern in den passenden Gruppen, Korrekturen anzuwenden, Backups wiederherzustellen, Override-Markierungen abzulehnen und Sitzungen anzulegen oder zu löschen. Schließt Ansicht ein."

COM_CSOVERRIDECHECKER_DASHBOARD="Dashboard"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="API-Endpunkt aktiv"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Jeder Benutzer mit einem gültigen Joomla API-Token und core.manage-Berechtigung auf dieser Komponente kann die aktuellen Template-Override-Daten dieser Site lesen."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="Endpunkt-URL"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Über"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API, die den nativen #__template_overrides-Tracker bereitstellt, sodass jeder KI-Assistent — oder jeder Client mit einem Joomla API-Token — jeden gemeldeten Override prüfen, klassifizieren und Patches direkt anwenden kann. Jeder Patch wird zuerst automatisch in der Datenbank gesichert und ist über die Ansicht Datei-Backups rückgängig zu machen."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Version"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Hier beginnen."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Dies ist die einzige Karte, die Sie für eine normale Prüfung benötigen. Führen Sie den Prompt aus, holen Sie den Bericht und sagen Sie Ihrem Assistenten dann im selben Chat, welche Befunde behoben werden sollen."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Methode 1: Prüfung mit einem beliebigen KI-Assistenten"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Die Erweiterung stellt Ihre Override-Daten über eine standardmäßige REST API bereit, sodass <strong>jeder</strong> KI-Assistent, der eine HTTPS-Anfrage senden kann, die Prüfung durchführen kann — an dieser Methode ist nichts anbieterspezifisch. Kopieren Sie den Prompt unten in den Assistenten, den Sie bereits nutzen; er erstellt eine Sicherheitsprüfung jedes markierten Overrides auf dieser Site und wendet anschließend die von Ihnen bestätigten Korrekturen an. Nicht sicher, ob Ihrer funktioniert? Siehe die Schaltfläche <em>Einrichtungsanleitung</em> oben auf dieser Seite."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Joomla API-Token erzeugen (einmalig)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="Im Joomla-Admin: <em>System → Benutzer → Mein Profil → Joomla API-Token</em> Registerkarte. Klicken Sie auf das Augensymbol, um das Token anzuzeigen, und kopieren Sie es. <strong>Wenn Sie es dauerhaft speichern möchten</strong>, gehen Sie zu <em>Optionen → Schlüssel &amp; Tokens</em> in dieser Komponente, fügen Sie es im Feld <em>Joomla API-Token</em> ein und speichern Sie &mdash; die Eingabeaufforderung unten wird dann automatisch mit dem Token ausgefüllt, sodass Sie es nicht bei jedem Scan einfügen müssen. Andernfalls halten Sie das Token bereit und fügen es in Schritt 2 in die Eingabeaufforderung ein."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Ihren KI-Assistenten öffnen und den Prompt unten einfügen."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Verwenden Sie den Assistenten, den Sie bevorzugen — einen Terminal- oder Editor-Agenten (Claude Code, Codex CLI, Cursor, Copilot), einen Browser-Chat (ChatGPT, Claude.ai, Gemini), ein eigenes GPT oder Gem oder ein lokales Modell. Einzige Voraussetzung: Er muss ausgehende HTTPS-Anfragen mit einem eigenen Header senden können. <strong>Wenn Sie das Token NICHT in den Optionen in Schritt 1 gespeichert haben</strong>, ersetzen Sie den Platzhaltertext in spitzen Klammern (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) durch das kopierte Token. Site-URL und Endpunkte sind für diese Site bereits eingetragen. Tipps für die einzelnen Assistenten finden Sie auf der Seite <em>Einrichtungsanleitung</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Senden."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Ihr Assistent holt die Liste der Overrides, ruft für jeden Override- und Kernquelle ab und erstellt eine Tabelle pro Befund plus eine in einfacher Sprache verfasste Zusammenfassung, die Sie weiterleiten können."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Sagen Sie, was zu beheben ist — im selben Chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Sobald der Bericht gepostet ist, fragt Ihr Assistent, welche Befunde behoben werden sollen. Antworten Sie mit denen, die Sie bestätigen (z. B. <em>„behebe #1 und #3, lass #2 in Ruhe, den Drittanbieter-Punkt frage ich beim Entwickler nach“</em>). Jede Datei wird vor dem Patchen gesichert, sodass alles rückgängig gemacht werden kann. <strong>Die zweite Karte unten benötigen Sie nur, wenn Sie den Chat geschlossen haben und später darauf zurückkommen möchten.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (kopieren und in Ihren KI-Assistenten einfügen):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Scan-Prompt kopieren"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Kopiert!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Die meisten Benutzer benötigen diese Karte NICHT."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Verwenden Sie dies nur, wenn Sie einen <em>frischen Chat</em> starten, um Korrekturen aus einer früheren Prüfung anzuwenden — etwa weil Sie den ursprünglichen Chat über Nacht geschlossen haben, die Prüfung an einen Kollegen übergeben oder den Scan in einem Browser-Chat durchgeführt haben und die Korrekturen in einem Terminal-Agenten vornehmen möchten. Wenn Ihr Scan-Chat noch geöffnet ist, scrollen Sie nach oben — machen Sie einfach in diesem Chat weiter."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Frühere Prüfung in einem neuen Chat fortsetzen"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Fügen Sie diesen Prompt in einen frischen Chat ein — in einem beliebigen Assistenten, nicht unbedingt dem, der den Scan ausgeführt hat —, um ihm den Kontext Ihrer früheren Prüfung zu geben. Er holt den Bericht der vorherigen Sitzung, listet die Befunde auf und fragt Sie, welche behoben werden sollen. Jede Datei wird vor jedem Patch gesichert, sodass alles rückgängig gemacht werden kann."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Fix-Prompt kopieren"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Sitzungsprotokoll"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Berichte, die von Ihrem KI-Assistenten übermittelt (oder von Hand eingefügt) werden, werden hier als Sitzungen gespeichert. Klicken Sie auf eine Sitzung, um den vollständigen Bericht anzusehen."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Noch keine Sitzungen. Führen Sie den Prompt oben aus und lassen Sie entweder Ihren Assistenten den Bericht automatisch zurück-POSTen oder klicken Sie auf 'Neue Sitzung', um ihn einzufügen."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Neue Sitzung"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Alle Sitzungen ansehen"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Nach der Prüfung"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Wenn Sie mit dem Umsetzen der Empfehlungen aus der Prüfung fertig sind, sollten Sie die 'Änderungen gefunden'-Markierungen löschen, die Joomla in Templates anzeigt, damit sie nicht weiterhin die bereits behandelten Overrides melden."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Empfohlen — Prüfung pro Template"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Öffnen Sie die Liste der Site-Templates. Jedes Template mit einer 'Änderungen gefunden'-Markierung kann einzeln geöffnet werden, sodass Sie die spezifischen Override-Zeilen, die Sie behandelt haben, ablehnen können. Langsamer, aber Sie behalten ein Audit-Protokoll pro Zeile."
