COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="Ich verstehe: jetzt wiederherzustellen überschreibt die Live-Datei. Die Pre-Restore-Kopie wird automatisch als neues Backup gespeichert."
