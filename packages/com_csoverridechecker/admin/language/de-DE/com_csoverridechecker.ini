COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Wo dieses Backup liegt"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Backup-Inhalte werden in der Datenbank gespeichert, nicht auf der Festplatte. Genauer in der Tabelle <code>#__csoverridechecker_backups</code> — die Spalte <code>contents_b64</code> enthält den base64-codierten Dateiinhalt."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Das bedeutet, dass eine Datenbank-Sicherung diese ebenfalls erfasst. Das Deinstallieren der Komponente löscht die Tabelle zusammen mit allen gespeicherten Backups."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Zu Ihrer Anthropic-API-Stufe:</strong> Der automatische Scan und die Chat-Funktionen zählen beide auf Anthropics Token-Limit pro Minute. Anthropics Standard-Stufe Tier 1 (10.000 Eingabe-Tokens pro Minute) reicht für einen einmaligen Scan auf einer kleinen Site, führt aber bei mehrstufigen Chat-Korrekturen zu Rate-Limits. Tier 2 (50.000 Tokens pro Minute, kostenpflichtig) ist für die meisten echten Fix-Sitzungen komfortabel. Ihre aktuelle Stufe sehen Sie unter <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Overrides für die Prüfung zurücksetzen"
