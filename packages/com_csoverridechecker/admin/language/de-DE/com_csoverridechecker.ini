COM_CSOVERRIDECHECKER="Override Checker"
COM_CSOVERRIDECHECKER_CONFIGURATION="Override Checker: Optionen"
COM_CSOVERRIDECHECKER_XML_DESCRIPTION="Template-bewusster Joomla-Integritätsmonitor. Stellt den nativen #__template_overrides-Tracker über eine Joomla Web Services API bereit, sodass jeder KI-Assistent (oder ein anderer Client mit einem Joomla API-Token) jeden gemeldeten Override prüfen, als alert / review / info klassifizieren und Patches direkt anwenden kann — automatisch gesichert und vom Admin aus rückgängig zu machen."

COM_CSOVERRIDECHECKER_DISCLAIMER_TITLE="Bevor Sie beginnen"
COM_CSOVERRIDECHECKER_DISCLAIMER_BODY="<p><strong>Bitte stellen Sie sicher, dass Sie eine aktuelle Sicherung Ihrer Website haben</strong>, bevor Sie diese Erweiterung etwas ändern lassen. Wir empfehlen dringend Akeeba Backup oder die Sicherungsfunktion Ihres Hosters.</p><p><strong>Was diese Erweiterung tut:</strong> Sie verbindet Ihre Joomla-Site mit dem KI-Assistenten Ihrer Wahl, um jeden gemeldeten Template-Override zu prüfen, jeden als Sicherheitswarnung, kosmetischen Unterschied oder legitime Anpassung zu klassifizieren und die von Ihnen bestätigten Patches anzuwenden. Jeder Patch wird zuerst automatisch in der Datenbank gesichert, sodass einzelne Änderungen rückgängig gemacht werden können — eine vollständige Site-Sicherung ist aber dennoch Ihr Sicherheitsnetz für alles andere.</p><p><strong>KI kann Fehler machen.</strong> Die KI kann etwas falsch klassifizieren oder einen Patch vorschlagen, der eine Funktion bricht. Lesen Sie immer, was vorgeschlagen wird, bevor Sie „ja, anwenden“ sagen, und testen Sie die Site nach dem Anwenden der Korrekturen.</p><p><strong>Nicht sicher?</strong> Wenn Sie sich mit diesem Werkzeug nicht wohl fühlen, schreiben Sie Tim eine E-Mail an <a href=\"mailto:tim@cybersalt.com\">tim@cybersalt.com</a> und lassen Sie uns reden — wir können Sie durchführen oder die Prüfung für Sie übernehmen.</p>"
COM_CSOVERRIDECHECKER_DISCLAIMER_DONT_SHOW_AGAIN="Dies nicht mehr anzeigen"
COM_CSOVERRIDECHECKER_DISCLAIMER_CONFIRM_BUTTON="Verstanden — fortfahren"

COM_CSOVERRIDECHECKER_RUN_SCAN_RATE_LIMITED="Zu viele automatische Scans in der letzten Stunde (Grenze: %d). Warten Sie ein paar Minuten, bevor Sie es erneut versuchen, oder verwenden Sie den Copy-Paste-Prompt im Dashboard (Methode 1)."

