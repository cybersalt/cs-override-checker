COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Manuelles Einfügen für Nutzer von Browser-Chats.</strong> Wenn Sie den Scan-Prompt in einem Browser-Chat wie ChatGPT, claude.ai oder Gemini ausgeführt haben, kopieren Sie die Antwort der KI und fügen Sie sie hier ein, um sie als Sitzung zu speichern. Wenn Sie einen Terminal- oder Editor-Agenten (Claude Code, Codex, Cursor und ähnliche) verwendet haben, benötigen Sie dieses Formular in der Regel nicht — der Agent sendet den Bericht selbst an die Site zurück. Die Sitzung wird standardmäßig mit dem heutigen Zeitstempel benannt; ändern Sie es, wenn Sie möchten."
