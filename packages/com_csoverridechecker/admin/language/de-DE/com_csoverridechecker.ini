COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Bestätigen: alle Overrides als geprüft markieren"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Dies löscht jede Zeile, die Joomla derzeit im Override-Tracker führt. Die 'Änderungen gefunden'-Markierungen in Templates verschwinden, und der API-Endpunkt dieser Site liefert null Zeilen, bis Joomlas nächstes Kern-Update sie wieder auffüllt. Die Aktion kann nicht rückgängig gemacht werden, außer durch Klicken auf 'Override-Tracker neu aufbauen' unten."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Ich bestätige, dass ich jeden gemeldeten Override geprüft habe und übernehme die Verantwortung für nicht behandelte Probleme."
