COM_CSOVERRIDECHECKER_SESSION_CHAT_TITLE="Mit Claude fortsetzen"
COM_CSOVERRIDECHECKER_SESSION_CHAT_INTRO="Sagen Sie Claude, was als Nächstes zu tun ist. Für Befunde, die Sie im Bericht oben bestätigt haben, sagen Sie etwas wie <em>&ldquo;behebe #1 und #3, lehne den Rest ab&rdquo;</em>. Claude führt die Arbeit serverseitig aus und aktualisiert diesen Thread mit dem, was es getan hat. Jeder Apply-Fix sichert die Originaldatei zuerst automatisch, sodass alles über die Datei-Backups-Ansicht rückgängig gemacht werden kann."
