COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Guía de configuración"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Use la IA que ya tenga"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Esta extensión no está ligada a ninguna IA concreta. Todo lo que expone es una API REST sencilla protegida por un token API de Joomla estándar, así que cualquier asistente capaz de hacer una petición web puede ejecutar una revisión &mdash; y también un script que escriba usted mismo. Esta página cubre las diferencias prácticas entre las opciones para que pueda elegir una y ponerse en marcha."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Qué tiene que poder hacer realmente su asistente"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="En lugar de enumerar qué productos funcionan &mdash; los planes y las funciones cambian constantemente &mdash; este es el requisito real. Su asistente debe poder:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Hacer peticiones HTTPS salientes</strong> a este sitio, enviando una cabecera de petición personalizada (<code>X-Joomla-Token</code>). Este es el único requisito indispensable."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Enviar peticiones POST con un cuerpo JSON</strong>, si quiere que aplique correcciones en vez de solo informar. Una revisión de solo lectura únicamente necesita GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Mantener una conversación razonablemente larga</strong>, ya que obtiene dos archivos por cada anulación marcada antes de emitir un veredicto."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="¿No sabe si el suyo cumple? Simplemente pegue el prompt y compruébelo. Un asistente que no pueda acceder a su sitio se lo dirá enseguida en lugar de fallar en silencio."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Aún no hay ningún token API de Joomla guardado."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Sea cual sea el asistente que elija, necesita un token API de Joomla para leer sus archivos de anulación. Genere uno en <em>Sistema &rarr; Gestionar &rarr; Usuarios &rarr; su usuario &rarr; Token API de Joomla</em>, y luego péguelo en el prompt cada vez o guárdelo aquí para que el prompt se rellene automáticamente."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Recomendado"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Lo más habitual"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Mejor para varios sitios"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Funciona, con matices"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Avanzado"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Agentes de terminal y de editor"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Por ejemplo: Claude Code, Codex CLI, Cursor, el modo agente de GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="La opción más fluida, y la que sugeriríamos si tiene alguna disponible. Se ejecutan en su propia máquina con acceso de red saliente sin restricciones, sin lista de permitidos de sandbox y sin tiempo de espera de petición del navegador, así que una revisión larga se ejecuta de principio a fin sin necesidad de supervisión."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Copie el prompt de escaneo desde el panel."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Péguelo en su agente y envíe. No hace falta ninguna configuración."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Cuando aparezca el informe, responda en la misma sesión indicando los números de los hallazgos que quiere corregir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Asistentes de chat en navegador"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Por ejemplo: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Todos funcionan, siempre que la cuenta y el modo que esté usando puedan acceder realmente a internet. Es la configuración más habitual y perfectamente adecuada para un sitio normal."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Asegúrese de que el acceso web o la navegación estén activados para la conversación. Algunos niveles y algunos modos responden solo de memoria."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Pegue el prompt de escaneo del panel y envíe."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Si su sitio tiene muchas anulaciones, pídale que las procese por lotes para que una sola respuesta no supere el tiempo de espera de petición del navegador."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Cuidado con las suposiciones dichas con aplomo.</strong> Si el asistente empieza a producir hallazgos sin llegar a citar el contenido real de los archivos, es que no puede acceder a su sitio y se los está inventando. Pare y compruebe su conectividad en lugar de fiarse del informe. <strong>Claude.ai en concreto:</strong> si responde &ldquo;Host not in allowlist&rdquo;, añada el dominio de este sitio en <em>Configuración &rarr; Capacidades &rarr; Ejecución de código &rarr; Acceso a red</em> y luego inicie un chat nuevo &mdash; el que está en marcha conserva la lista de permitidos antigua."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="GPT personalizados, Gems y otros asistentes configurables"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Por ejemplo: un GPT personalizado con Actions, un Gem de Gemini, o cualquier asistente que le permita registrar su propia API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Si su plataforma le permite definir un asistente con sus propias acciones de API, registre una sola vez los endpoints de abajo y sáltese por completo el paso de copiar y pegar. Es la opción más ordenada si se ocupa de varios sitios Joomla, porque el asistente recuerda la configuración entre conversaciones."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Cree un asistente personalizado nuevo y añada una acción de API que apunte a la URL del endpoint que se muestra más abajo en esta página."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Ponga <code>X-Joomla-Token</code> como nombre de la cabecera de autenticación y pegue su token API de Joomla como valor."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Pegue el prompt de escaneo del panel en las instrucciones del asistente para que conozca las reglas de clasificación y el formato del informe."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Modelos locales y autoalojados"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Por ejemplo: Ollama, LM Studio, llama.cpp, o cualquier modelo autoalojado con llamada a herramientas"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Cualquier cosa con llamada a herramientas y acceso a red funcionará mecánicamente, y nada sale de su propia infraestructura, lo que algunos sitios preferirán."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Active la llamada a herramientas o funciones y confirme que el modelo puede acceder a este sitio por HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Pegue el prompt de escaneo como prompt de sistema y luego pídale que empiece."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Sea realista con el tamaño del modelo.</strong> Revisar una anulación es una tarea de juicio, no de consulta. Un modelo local pequeño producirá un informe sin problema, pero es mucho más probable que se le escape una regresión de seguridad real o que invente una que no existe. Trate los hallazgos de un modelo pequeño como una primera pasada, no como un veredicto."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Clientes MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Cualquier asistente que hable el Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Si su asistente admite MCP, instale <strong>MCP for J</strong> y su complemento gratuito <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. El asistente revisará y corregirá las anulaciones con sus propias herramientas, sin copiar y pegar. También es la mejor vía para los chats de navegador compatibles con conectores MCP, porque evita el tiempo de espera de las peticiones del navegador. Ambas son extensiones independientes y gratuitas."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="El Método 2 es la única excepción"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="El botón <em>Ejecutar escaneo automático</em> del panel ejecuta toda la revisión en el servidor sin copiar ni pegar. Elija su proveedor en <em>Opciones</em> y guarde la clave API de ese proveedor &mdash; <strong>Anthropic, OpenAI y Google Gemini pueden ejecutar escaneos</strong>. Lo único que sigue siendo solo de Anthropic es el chat de seguimiento sobre una sesión, donde le pide que aplique correcciones y edita archivos mediante llamadas a herramientas; ese bucle está escrito contra el protocolo de llamada a herramientas de Anthropic. Con OpenAI o Gemini seleccionado obtiene el informe completo, y puede aplicar las correcciones usted mismo con el prompt de copiar y pegar del Método 1, que funciona con cualquier IA."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Clave de %s guardada &mdash; Método 2 disponible"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="No hay clave API guardada para su proveedor de IA &mdash; el Método 1 sigue funcionando"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpoint y autenticación"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Todo lo que hace la interfaz de administración está disponible en esta URL base. Úsela al registrar un asistente personalizado, o al escribir su propio script o agente."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla no acepta <code>Authorization: Bearer</code> en estas rutas.</strong> Debe enviar el token en la cabecera <code>X-Joomla-Token</code>. Una cabecera con formato Bearer devuelve 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Documentación completa"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Referencia completa de endpoints, formato del informe, resolución de problemas y preguntas frecuentes."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Leer la documentación"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Obtener ayuda"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Esta extensión es gratuita, y seguirá siéndolo"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="No hay versión Pro, ni clave de licencia, ni funciones reservadas. Todo lo que la extensión puede hacer lo tiene delante. Aun así, nos gustaría mucho tener noticias suyas &mdash; los comentarios de sitios reales son lo que ha dado forma a cada versión hasta ahora."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Qué puede esperar."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt es una empresa pequeña y esta extensión se regala, así que el soporte gratuito se ofrece según el tiempo disponible entre el trabajo para clientes. Es una limitación real, no una excusa &mdash; preferimos decirlo claramente antes que dejarle esperando una promesa que no podemos cumplir. Los informes de errores se revisan; la ayuda abierta de configuración puede que no."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Dónde enviarlo"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Informes de errores, textos confusos, un hallazgo en el que la IA se equivocó, un flujo de trabajo al que la extensión no se ajusta, o un asistente que se comportó de forma inesperada &mdash; todo es útil."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Informar de un problema en GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Leer la documentación"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues es el mejor sitio para cualquier cosa reproducible, porque es público &mdash; la siguiente persona con el mismo problema encuentra la respuesta en vez de volver a preguntar."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Qué incluir"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Obtendrá una respuesta más rápida si nos ayuda a saltarnos el diagnóstico:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="El <strong>bloque de diagnóstico</strong> de esta página (contiene sus versiones de Joomla, PHP y de la extensión en un solo pegado)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Qué método</strong> utilizó &mdash; el prompt de copiar y pegar, el escaneo automático o su propio código &mdash; y <strong>qué asistente de IA</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Qué <strong>esperaba</strong> que ocurriera, y qué ocurrió <strong>realmente</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Si la IA se equivocó en un hallazgo, el <strong>informe de sesión guardado</strong> &mdash; use <em>Descargar informe</em> en la página de la sesión. Eso nos da los hallazgos y el razonamiento exactos para poder examinarlos."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Las ideas también son bienvenidas"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Si la extensión casi hace lo que necesita pero no del todo, díganoslo. Varias funciones existen porque alguien describió un flujo de trabajo en el que no habíamos pensado."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnóstico"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Copie esto en su informe para que no tengamos que preguntar."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Copiar diagnóstico"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Este bloque no contiene secretos. Solo registra si hay una clave o un token guardado, nunca su valor."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Se mostrará en {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Retardo de mantener para mostrar (segundos)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Las claves y los tokens que se muestran en esta extensión aparecen difuminados por defecto para que una pantalla compartida, una grabación de pantalla o una mirada por encima del hombro no los filtren. Mantenga el puntero sobre un valor difuminado durante estos segundos y se mostrará; una cuenta atrás le indica que el temporizador está en marcha. Al apartarlo se cancela. Por defecto <strong>3</strong>. Póngalo a <strong>0</strong> para mostrarlo de inmediato al pasar el puntero, lo que elimina la protección frente a un puntero que simplemente pase por encima del valor."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Ocultar automáticamente tras mostrar (segundos)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Una vez que un valor se ha mostrado, se vuelve a difuminar pasados estos segundos aunque el puntero siga encima. Cubre el caso en el que echa un vistazo a una clave y le interrumpen, dejándola expuesta en una pantalla desatendida. Por defecto <strong>8</strong>. Póngalo a <strong>0</strong> para mantenerlo visible hasta que aparte el puntero."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Proveedor de IA"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Qué servicio de IA llama el botón integrado <em>Ejecutar escaneo automático</em>. Usted aporta su propia clave para el que elija, y se utiliza únicamente desde este sitio. Esta opción <strong>no</strong> afecta al flujo del prompt de copiar y pegar &mdash; ese funciona con cualquier IA y no necesita ninguna clave."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Los tres proveedores pueden ejecutar un escaneo.</strong> El chat de seguimiento sobre una sesión &mdash; donde le pide que aplique correcciones y edita archivos mediante llamadas a herramientas &mdash; es actualmente <strong>solo de Anthropic</strong>, porque ese bucle está escrito contra el protocolo de llamada a herramientas de Anthropic. Con OpenAI o Gemini seleccionados sigue obteniendo el informe completo; para que se le apliquen las correcciones, cambie esto a Anthropic o use el flujo del prompt de copiar y pegar, que funciona con cualquier IA."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Clave API de OpenAI"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Su clave API personal de OpenAI (empieza con <code>sk-</code>). Obtenga una en <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Se almacena en este servidor y se utiliza únicamente para llamar a api.openai.com en su nombre."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Clave API de Google Gemini"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Su clave API personal de Google AI Studio. Obtenga una en <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Se almacena en este servidor y se utiliza únicamente para llamar a la API de Gemini en su nombre."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — el más capaz, por defecto."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — más rápido y más barato. Adecuado para escaneos de bajo riesgo."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — el más capaz, por defecto."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — más rápido y más barato. Adecuado para escaneos de bajo riesgo."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="No hay ninguna clave API guardada para %s. Añada una en Opciones, o cambie de proveedor."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="No tiene permiso para obtener un token API. Esta acción necesita el permiso de escritura de Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="No se ha podido resolver ningún usuario con la sesión iniciada, así que no hay ningún token que obtener."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="El plugin <strong>Usuario - Token API de Joomla</strong> está desactivado, así que Joomla todavía no puede emitir un token API. Actívelo e inténtelo de nuevo."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Su token se ha emitido, pero el plugin <strong>Autenticación API - Token API de Joomla</strong> está desactivado, así que Joomla rechazará el token en las peticiones API entrantes hasta que active también ese plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Sus grupos de usuario no están en la lista de permitidos del plugin Usuario - Token API de Joomla, así que Joomla no le emitirá un token. Añada uno de sus grupos a la opción Grupos de usuario permitidos de ese plugin."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Este sitio no tiene ningún secreto definido en configuration.php, así que no se puede derivar un token API."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ERROR="No se pudo obtener su token API de Joomla: %s"
