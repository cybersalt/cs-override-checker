COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Método 1: usar su asistente de IA"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Copiar un prompt listo para usar y pegarlo en el asistente de IA que use — ChatGPT, Claude, Gemini, Copilot, Cursor o un modelo local. Funciona sin clave API. Salta al prompt de abajo."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Método 2: ejecutar escaneo automático"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Ejecuta la revisión de anulaciones en este servidor con su clave API de %s guardada. Guarda el informe como una sesión. Salta al botón de ejecución de abajo."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Elija primero un proveedor de IA y guarde su clave API en el panel de Opciones para activar los escaneos automáticos. Mientras tanto, utilice el Método 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Recorrer de nuevo todas las plantillas activadas y reconstruir el rastreador de anulaciones. Utilícelo después de editar archivos de plantilla fuera de Joomla, o si el rastreador de Joomla está desactualizado."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Claves &amp; tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Opcional. Elija un proveedor de IA y guarde aquí su clave API para que la extensión pueda ejecutar escaneos automáticamente, sin prompt de copiar y pegar. Déjelo en blanco para seguir usando el prompt de copiar y pegar del panel con la IA que ya utilice."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Clave API de Anthropic"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Su clave API personal de Anthropic (empieza con <code>sk-ant-…</code>). Obtenga una en <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. La clave se almacena en este servidor y se utiliza únicamente para llamar a api.anthropic.com en su nombre. Con una clave guardada, el panel expone un botón <em>Ejecutar escaneo automático</em> que delega la revisión de anulaciones a Claude desde el servidor y guarda el informe como sesión — sin copiar y pegar."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Cada escaneo automático realiza una llamada a la API del proveedor elegido, facturada según las tarifas de ese proveedor para el modelo seleccionado. Los sitios con un número muy elevado de anulaciones se limitan por ejecución (vea <em>Anulaciones por escaneo</em> más abajo); vuelva a ejecutar para el resto, o use el prompt de copiar y pegar del panel para tamaño ilimitado."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Modelo de escaneo"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Modelo utilizado para la llamada única <em>Ejecutar escaneo automático</em> en el panel. El escaneo es una tarea de clasificación (alert / review / info por hallazgo). <strong>El modelo más capaz es la opción por defecto</strong> &mdash; la revisión más exhaustiva y el clasificador más seguro para hallazgos que requieren juicio sutil. Los modelos más pequeños manejan bien los escaneos rutinarios por una fracción del coste y son adecuados para escaneos de bajo riesgo en sitios pequeños."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Modelo de chat"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Modelo Claude utilizado para el chat-con-Claude de seguimiento en la página de detalle de sesión (donde le pide a Claude que aplique correcciones o descarte hallazgos). El uso de herramientas es más exigente que la clasificación. <strong>Opus es la opción por defecto</strong> &mdash; el comportamiento de uso de herramientas más fiable y el riesgo más bajo de una corrección mal aplicada. Sonnet es un buen término medio para sitios con muchos seguimientos de bajo riesgo; Haiku puede tener problemas con secuencias de herramientas de varios pasos y no se recomienda para el modelo de chat a menos que el coste sea la principal preocupación."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Token API de Joomla (para el prompt del panel)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Opcional. Genere un token API de Joomla en <em>Sistema &rarr; Usuarios &rarr; Mi perfil &rarr; Token API de Joomla</em> y péguelo aquí. Los prompts de escaneo/corrección del panel rellenarán entonces el token automáticamente en lugar del marcador &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, para que pueda copiar &amp; pegar directamente en su asistente de IA sin editar.<br><br><strong>Aviso multi-admin:</strong> los tokens API de Joomla autentican como <em>el usuario que los generó</em>. Si varios admins usan este panel, el prompt usará el token guardado aquí &mdash; lo que significa que la IA llamará a la API autenticándose como ese usuario. Déjelo en blanco para que cada admin pegue su propio token al usarlo."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Anulaciones por escaneo"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Cuántas anulaciones de plantilla marcadas revisa el botón <em>Ejecutar escaneo automático</em> en una sola llamada a la API. Por defecto <strong>10</strong>. Rango 1&ndash;100. <strong>Cuanto más bajo, más seguro para el chat de seguimiento:</strong> el informe del escaneo crece con el número de hallazgos, y el bucle de uso de herramientas del chat conserva ese informe como historial de conversación. En los niveles bajos de límite de tasa (el Tier 1 de Anthropic permite 10K tokens de entrada por minuto), un escaneo de 60 anulaciones más un turno inmediato de chat dentro del mismo minuto devolverá <em>HTTP 429: rate limit exceeded</em>. Con 10 anulaciones por ejecución, sus turnos de chat tras el escaneo se mantienen cómodamente por debajo del límite. Los sitios con más anulaciones que esto solo necesitan unas cuantas ejecuciones más para cubrirlo todo &mdash; el informe de cada ejecución se guarda como su propia sesión, así que puede trabajar con cada una de forma independiente."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — el más rápido y barato. Adecuado para escaneos de bajo riesgo en sitios pequeños."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — equilibrado. Maneja bien los escaneos rutinarios por una fracción del coste de Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — el más capaz, por defecto. El clasificador más seguro para hallazgos que requieren juicio sutil."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Sobre la diferencia de coste.</strong> <strong>En el momento de escribir esto</strong>, un escaneo típico en un sitio con 50 anulaciones usa unos 60K tokens de entrada y produce unos 5K tokens de salida. Coste aproximado por escaneo: <strong>~0,08$ con Haiku, ~0,23$ con Sonnet, ~1,13$ con Opus</strong>. Los turnos de chat son mucho más pequeños (5K&ndash;10K tokens de entrada cada uno), así que el coste por turno es aproximadamente 10&times; menor que un escaneo. Los precios publicados por Anthropic son la fuente de verdad en <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; los números de arriba son aproximados y pueden variar con el tiempo. Vigile su uso en <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> durante unas cuantas ejecuciones antes de decidir si bajar desde la opción por defecto Opus a un nivel más barato."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Navegación del componente"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Método 2: ejecutar escaneo automático (con su clave API de %s guardada)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="No hay clave API de %s guardada."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Clave API guardada."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="La extensión ejecutará la revisión de anulaciones en el servidor utilizando su clave API guardada, sin copiar ni pegar. El informe se guarda automáticamente como una nueva sesión."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Pulse abajo para iniciar un escaneo. La extensión obtiene cada anulación marcada en este sitio, la envía a su proveedor de IA con su clave API guardada, y guarda el informe resultante como una nueva sesión. Será redirigido al informe cuando termine."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Una llamada a la API por escaneo. Los sitios con más de %d anulaciones se limitan a las primeras %d por ejecución (configurable en <em>Opciones &rarr; Claves &amp; tokens &rarr; Anulaciones por escaneo</em>); vuelva a ejecutar para el siguiente lote, o use el prompt de copiar y pegar del Método 1 para tamaño ilimitado. La página puede hacer una pausa de 30&ndash;90 segundos mientras la IA responde &mdash; es normal, no salga de la página."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Esto llamará a la API de %s con su clave guardada y puede tardar de 30 a 90 segundos. ¿Continuar?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Ejecutar escaneo automático ahora"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Este método ejecuta toda la revisión en el servidor &mdash; sin copiar y pegar, sin segunda ventana. Pulse el botón <em>Opciones</em> justo debajo, elija su proveedor de IA en la pestaña <em>Claves &amp; tokens</em>, pegue su clave API y Guarde. La clave permanece en la base de datos de su sitio; solo este sitio puede usarla. El Método 1 de arriba sigue funcionando sin clave API si prefiere el flujo de copiar y pegar."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Escaneo automático en curso…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Llamando a la API de %s y analizando sus anulaciones. Esto suele tardar de 30 a 90 segundos. Por favor, no cierre esta ventana."

