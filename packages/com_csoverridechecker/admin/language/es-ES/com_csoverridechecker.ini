COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="Activar un plugin de Joomla es un cambio que afecta a todo el sitio, así que necesita el permiso de Joomla para la gestión de plugins además del acceso a este componente. Pida a un Super Usuario que active el plugin o que conceda a su grupo derechos de Gestionar sobre los Plugins."

; Shipped-file integrity check (Joomla-Brain tools/integrity)
CS_INTEGRITY_PROBLEMS_TITLE="Instalación incompleta: faltan o están dañados %1$d de %2$d archivos."
CS_INTEGRITY_PROBLEMS_BODY="%s no se instaló por completo, así que es posible que partes no funcionen. Instale de nuevo el mismo paquete para repararlo. Si la instalación vuelve a fallar, puede que un software de seguridad del servidor (por ejemplo Imunify360 Proactive Defense) esté bloqueando el instalador de Joomla: revise su registro de incidentes."
CS_INTEGRITY_CHANGED_TITLE="%1$d de %2$d archivos difieren de la versión publicada."
CS_INTEGRITY_CHANGED_BODY="Esto ocurre tras una actualización fallida, o cuando alguien edita directamente los archivos de %s. Instale de nuevo el mismo paquete para restaurarlos."
CS_INTEGRITY_OK="Los %1$d archivos coinciden con la versión publicada."
CS_INTEGRITY_NOLIST="Esta versión no incluye lista de archivos, así que la comprobación de archivos no está disponible."
CS_INTEGRITY_SHOW_FILES="Mostrar archivos"
CS_INTEGRITY_UNREADABLE="Lista de archivos ilegible"
CS_INTEGRITY_MISSING="Falta"
CS_INTEGRITY_EMPTY="Vacío (0 bytes)"
CS_INTEGRITY_CHANGED="Modificado"
CS_INTEGRITY_MORE="y %d más"
COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="No se ha escrito nada. El contenido nuevo añade código que una corrección no puede añadir a una anulación: %s. Así es el código inyectado, por lo que se rechaza aunque la petición pareciera razonable. Si está seguro de que el cambio es correcto, revíselo y hágalo usted mismo en el archivo."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="No restaurado. Esta copia contiene código que el archivo actual no tiene: %s. Puede ser una puerta trasera que una corrección eliminó, por lo que una IA o una llamada a la API no puede devolverla. Si quiere recuperar esta versión, lea la copia y restáurela desde la pantalla Copias de archivos."
