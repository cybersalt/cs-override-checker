COM_CSOVERRIDECHECKER_FETCH_TOKEN_OFFER_ENABLE_AUTH="Su token se ha rellenado, pero el plugin <strong>Autenticación API - Token API de Joomla</strong> está desactivado, así que Joomla lo rechazará en las peticiones API entrantes hasta que también se active ese plugin."
