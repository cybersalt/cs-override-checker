COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Ninguna plantilla activada de este sitio tiene una carpeta de anulaciones <code>html/</code>, así que no hay nada que restablecer. Añada una anulación (o active una plantilla que tenga anulaciones) y vuelva a abrir este diálogo."
