COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Cualquier usuario con un token API de Joomla válido y permiso core.manage sobre este componente puede leer los datos actuales de anulaciones de plantilla de este sitio."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL del endpoint"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Acerca de"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="API Web Services que expone el rastreador nativo #__template_overrides para que cualquier asistente de IA — o cualquier cliente con un token API de Joomla — pueda revisar cada anulación marcada, clasificarla y aplicar parches sobre la marcha. Cada parche se respalda automáticamente en la base de datos primero y es reversible desde la vista Copias de archivos."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Versión"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Empiece aquí."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Esta es la única tarjeta que necesita para una revisión normal. Ejecute el prompt, obtenga el informe y luego dígale a su asistente en el mismo chat qué hallazgos corregir."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Método 1: revisión usando cualquier asistente de IA"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="La extensión expone los datos de sus anulaciones mediante una API REST estándar, así que <strong>cualquier</strong> asistente de IA que pueda hacer una petición HTTPS puede ejecutar la revisión — este método no depende de ningún proveedor. Copie el prompt de abajo en el asistente que ya utilice y producirá una revisión de seguridad de cada anulación marcada en este sitio, y luego aplicará las correcciones que confirme. ¿No está seguro de si el suyo funcionará? Consulte el botón <em>Guía de configuración</em> en la parte superior de esta página."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Generar un token API de Joomla (una sola vez)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="En el admin de Joomla: <em>Sistema → Usuarios → Mi perfil → pestaña Token API de Joomla</em>. Pulse el icono del ojo para revelar el token, luego cópielo. <strong>Si desea guardarlo de forma permanente</strong>, vaya a <em>Opciones → Claves y tokens</em> en este componente, péguelo en el campo <em>Token API de Joomla</em> y Guarde &mdash; el indicador de abajo se rellenará automáticamente con el token, así no tendrá que pegarlo en cada análisis. De lo contrario, guarde el token a mano y péguelo en el indicador en el paso 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Abrir su asistente de IA y pegar el prompt de abajo."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Use el asistente que prefiera — un agente de terminal o de editor (Claude Code, Codex CLI, Cursor, Copilot), un chat en navegador (ChatGPT, Claude.ai, Gemini), un GPT personalizado o un Gem, o un modelo local. El único requisito es que pueda hacer peticiones HTTPS salientes con una cabecera personalizada. <strong>Si NO guardó el token en Opciones en el paso 1</strong>, sustituya el texto de marcador entre paréntesis angulares (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) por el token que copió. La URL del sitio y los endpoints ya están rellenados para este sitio. Encontrará consejos para cada asistente en la página <em>Guía de configuración</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Enviar."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Su asistente obtendrá la lista de anulaciones, recogerá la fuente de la anulación y del núcleo para cada una, y producirá una tabla por hallazgo más un resumen en lenguaje sencillo que puede reenviar."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Dígale qué corregir — en el mismo chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Una vez publicado el informe, le preguntará qué hallazgos quiere que se corrijan. Responda con los que confirme (por ejemplo <em>«corrige #1 y #3, deja #2 en paz, el de terceros se lo preguntaré al desarrollador»</em>). Cada archivo se respalda antes de parchearlo, así que todo se puede deshacer. <strong>Solo necesita la segunda tarjeta de abajo si cerró el chat y quiere volver a él más tarde.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (copiar y pegar en su asistente de IA):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Copiar prompt de escaneo"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="¡Copiado!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="La mayoría de los usuarios NO necesitan esta tarjeta."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Use esto solo si está iniciando un <em>chat nuevo</em> para aplicar correcciones de una revisión anterior — por ejemplo cerró el chat original durante la noche, está pasando la revisión a un compañero, o ejecutó el escaneo en un chat en navegador y quiere hacer las correcciones en un agente de terminal. Si su chat de escaneo sigue abierto, desplácese hacia arriba — simplemente continúe en ese chat."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Continuar una revisión anterior en un chat nuevo"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Pegue este prompt en un chat nuevo — en cualquier asistente, no necesariamente el que ejecutó el escaneo — para darle el contexto de su revisión anterior. Recogerá el informe de la sesión previa, listará los hallazgos y le preguntará cuáles corregir. Cada archivo se respalda antes de cualquier parche, así que todo es reversible."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Copiar prompt de corrección"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Registro de sesiones"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Los informes enviados por su asistente de IA (o pegados a mano) se guardan aquí como sesiones. Pulse en una sesión para ver el informe completo."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Aún no hay sesiones. Ejecute el prompt de arriba y deje que su asistente envíe el informe automáticamente (POST), o pulse 'Nueva sesión' para pegarlo."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nueva sesión"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Ver todas las sesiones"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Tras la revisión"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Cuando haya terminado de actuar sobre las recomendaciones de la revisión, querrá borrar las insignias 'Cambios encontrados' que Joomla muestra en Plantillas para que no sigan señalando las anulaciones que ya ha tratado."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Recomendado — revisión por plantilla"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Abra la lista de plantillas del sitio. Cada plantilla con una insignia 'Cambios encontrados' puede abrirse individualmente para que descarte las filas de anulación específicas que ha tratado. Más lento, pero mantiene una pista de auditoría por fila."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Abrir gestión de plantillas del sitio"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="En masa — marcar todas las anulaciones como revisadas"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Vía más rápida: borrar cada fila del rastreador de anulaciones en un solo paso. Hágalo solo después de haber revisado realmente cada hallazgo. Equivalente a usar el 'Descartar todo' de Joomla en cada plantilla a la vez."
