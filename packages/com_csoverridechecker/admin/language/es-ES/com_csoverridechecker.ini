COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Dónde vive esta copia"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="El contenido de las copias se almacena en la base de datos, no en disco. En concreto, en la tabla <code>#__csoverridechecker_backups</code> — la columna <code>contents_b64</code> contiene el contenido del archivo codificado en base64."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Eso significa que una copia de seguridad de la base de datos también las captura. Desinstalar el componente borra la tabla junto con todas las copias almacenadas."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Sobre su nivel de API de Anthropic:</strong> tanto el escaneo automático como las funciones de chat cuentan para el límite de tokens por minuto de Anthropic. El Tier 1 por defecto de Anthropic (10.000 tokens de entrada por minuto) basta para un escaneo puntual en un sitio pequeño, pero limitará la tasa durante las correcciones por chat de varios turnos. El Tier 2 (50.000 tokens por minuto, de pago) resulta cómodo para la mayoría de sesiones de corrección reales. Consulte su nivel actual en <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Restablecer anulaciones para revisión"
