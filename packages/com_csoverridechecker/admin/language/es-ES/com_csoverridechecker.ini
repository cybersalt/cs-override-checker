COM_CSOVERRIDECHECKER_FETCH_TOKEN_BUTTON_WORKING="Obteniendo..."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_ENABLE_PLUGIN_BUTTON="Activar el plugin de token"
COM_CSOVERRIDECHECKER_FETCH_TOKEN_CREATED_NOTICE="Se ha generado un token API de Joomla nuevo para su cuenta."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_EXISTING_NOTICE="Este es el token API de Joomla existente de su cuenta."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_HANDLE_WITH_CARE="Trate este token como una contraseña. Autentica como usted en toda la API Web Services de Joomla. Envíelo únicamente en la cabecera X-Joomla-Token, nunca en una URL."
