COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Bu işlem, Joomla'nın geçersiz kılma izleyicisinde şu anda izlediği her satırı temizler. Şablonlar'daki 'Değişiklikler bulundu' rozetleri kaybolur ve Joomla'nın bir sonraki çekirdek güncellemesi onları yeniden doldurana kadar bu sitenin API uç noktası sıfır satır döndürür. Bu eylem, yeniden taramak için aşağıdaki 'Geçersiz kılma izleyicisini yeniden oluştur' düğmesine tıklamak dışında geri alınamaz."
