COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_TITLE="Onayla: yedeği geri yükle"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_BODY="Geri yükleme, %s konumundaki canlı dosyanın üzerine yukarıda gösterilen yedeklenen içerikleri yazacaktır. Mevcut içerikler önce yeni bir yedek olarak kaydedilecek, böylece bu işlem geri alınabilir."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="Anlıyorum: şimdi geri yükleme, canlı dosyanın üzerine yazacaktır. Geri yükleme öncesi kopya, yeni bir yedek olarak otomatik kaydedilecektir."
