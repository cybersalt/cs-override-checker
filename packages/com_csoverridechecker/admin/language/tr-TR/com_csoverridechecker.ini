COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Hakkında"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Yerleşik #__template_overrides izleyicisini sunan Web Services API; herhangi bir yapay zekâ asistanı — veya Joomla API jetonuna sahip herhangi bir istemci — işaretlenen her geçersiz kılmayı inceleyebilir, sınıflandırabilir ve yamaları yerinde uygulayabilir. Her yama önce otomatik olarak veritabanına yedeklenir ve Dosya yedekleri görünümünden geri alınabilir."
