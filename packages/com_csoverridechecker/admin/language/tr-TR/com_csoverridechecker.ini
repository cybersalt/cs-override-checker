COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Tüm oturumları görüntüle"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="İnceleme sonrası"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="İncelemenin önerileri üzerinde işlem yapmayı bitirdiğinizde, Joomla'nın Şablonlar bölümünde gösterdiği 'Değişiklikler bulundu' rozetlerini temizlemek isteyeceksiniz; böylece zaten ele aldığınız geçersiz kılmaları işaretlemeye devam etmezler."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Önerilen — şablon başına inceleme"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Site Şablonları listesini açın. 'Değişiklikler bulundu' rozeti olan her şablon ayrı ayrı açılabilir; böylece işlediğiniz belirli geçersiz kılma satırlarını kapatabilirsiniz. Daha yavaştır, ancak satır başına denetim izi tutarsınız."
