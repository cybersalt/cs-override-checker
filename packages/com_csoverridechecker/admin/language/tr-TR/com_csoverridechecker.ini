COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Göstermek için basılı tutma süresi (saniye)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Bu eklentide gösterilen anahtarlar ve jetonlar, bir ekran paylaşımı, ekran kaydı veya omuz üstünden bir bakış sırasında sızmasınlar diye varsayılan olarak bulanıklaştırılır. İşaretçinizi bulanık bir değerin üzerinde bu kadar saniye tutun; değer görünür olur ve bir geri sayım zamanlayıcının çalıştığını gösterir. Uzaklaşmak bunu iptal eder. Varsayılan <strong>3</strong>. Üzerine gelindiği anda göstermek için <strong>0</strong> yapın; bu, işaretçinin değerin üzerinden yalnızca geçmesine karşı korumayı kaldırır."
