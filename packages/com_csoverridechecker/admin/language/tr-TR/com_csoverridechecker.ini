COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Toplu — her geçersiz kılmayı incelendi olarak işaretle"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Daha hızlı yol: geçersiz kılma izleyicisindeki her satırı tek adımda temizleyin. Bunu yalnızca her bulguyu gerçekten incelediyseniz yapın. Joomla'nın kendi 'Tümünü Yoksay' işlevini her şablonda aynı anda kullanmaya eşdeğerdir."
