COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Geçmişte (siz veya önceki bir geliştirici) geçersiz kılmaları gerçekten kontrol etmeden onayladınız mı? Her geçersiz kılma dosyasını izleyiciye geri getirmek için buraya tıklayın; böylece her birini yapay zekâ asistanınızla düzgün bir şekilde inceleyebilirsiniz. Bu araç kurulmadan önce gerçekleşen bir 'Tümünü Yoksay' işleminden sonra faydalıdır."
