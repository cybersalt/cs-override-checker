COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Kurulum kılavuzu"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Zaten sahip olduğunuz yapay zekâyı kullanın"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Bu eklenti tek bir yapay zekâya bağlı değildir. Sunduğu her şey, standart bir Joomla API jetonuyla korunan sade bir REST API'dir; dolayısıyla web isteği yapabilen herhangi bir asistan bir inceleme çalıştırabilir &mdash; kendi yazacağınız bir betik de. Bu sayfa, birini seçip yola koyulabilmeniz için seçenekler arasındaki pratik farkları anlatır."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Asistanınızın gerçekte neler yapabilmesi gerekir"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Hangi ürünlerin çalıştığını listelemek yerine &mdash; planlar ve özellikler sürekli değişiyor &mdash; asıl gereksinim şudur. Asistanınız şunları yapabilmelidir:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Bu siteye giden HTTPS istekleri yapmak</strong> ve özel bir istek başlığı (<code>X-Joomla-Token</code>) göndermek. Tek zorunlu gereksinim budur."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>JSON gövdeli POST istekleri göndermek</strong> &mdash; yalnızca rapor vermesini değil, düzeltmeleri uygulamasını da istiyorsanız. Salt okunur bir inceleme için tek başına GET yeterlidir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Makul uzunlukta bir konuşma sürdürmek</strong>, çünkü bir karara varmadan önce işaretlenen her geçersiz kılma için iki dosya getirir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Sizinkinin uygun olup olmadığından emin değil misiniz? Komut istemini yapıştırın ve görün. Sitenize erişemeyen bir asistan, sessizce başarısız olmak yerine bunu size hemen söyleyecektir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Henüz kayıtlı bir Joomla API jetonu yok."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Hangi asistanı seçerseniz seçin, geçersiz kılma dosyalarınızı okumak için bir Joomla API jetonuna ihtiyacı olacak. <em>Sistem &rarr; Yönet &rarr; Kullanıcılar &rarr; kullanıcınız &rarr; Joomla API Jetonu</em> bölümünden bir tane oluşturun; ardından ya her seferinde komut istemine yapıştırın ya da komut isteminin otomatik dolması için buraya kaydedin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Önerilen"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="En yaygın"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Birden fazla site için en iyisi"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Çalışır, çekinceleri var"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="İleri düzey"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Terminal ve düzenleyici ajanları"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Örneğin: Claude Code, Codex CLI, Cursor, GitHub Copilot ajan modu, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="En sorunsuz seçenek ve elinizde varsa önereceğimiz yol. Bunlar kendi makinenizde çalışır; kısıtsız giden ağ erişimi vardır, korumalı alan izin listesi ve tarayıcı istek zaman aşımı yoktur. Böylece uzun bir inceleme, başında beklemenize gerek kalmadan baştan sona tamamlanır."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Tarama komut istemini Kontrol Panelinden kopyalayın."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Ajanınıza yapıştırın ve gönderin. Herhangi bir yapılandırma gerekmez."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Rapor göründüğünde, aynı oturumda düzeltilmesini istediğiniz bulgu numaralarını belirterek yanıt verin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Tarayıcı sohbet asistanları"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Örneğin: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Kullandığınız hesap ve mod gerçekten internete erişebildiği sürece bunların hepsi çalışır. En yaygın kurulum budur ve normal bir site için gayet yeterlidir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Konuşma için web erişiminin veya tarama özelliğinin açık olduğundan emin olun. Bazı kademeler ve bazı modlar yalnızca hafızadan yanıt verir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Kontrol Panelindeki tarama komut istemini yapıştırın ve gönderin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Sitenizde çok sayıda geçersiz kılma varsa, tek bir yanıtın tarayıcı istek zaman aşımını aşmaması için bunları gruplar hâlinde işlemesini isteyin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Kendinden emin tahminlere dikkat edin.</strong> Asistan gerçek dosya içeriklerinden hiç alıntı yapmadan bulgular üretmeye başlıyorsa, sitenize erişemiyor ve bunları uyduruyor demektir. Rapora güvenmek yerine durun ve bağlantısını kontrol edin. <strong>Özellikle Claude.ai için:</strong> &ldquo;Host not in allowlist&rdquo; yanıtını verirse, bu sitenin alan adını <em>Settings &rarr; Capabilities &rarr; Code execution &rarr; Network access</em> bölümüne ekleyin, sonra yeni bir sohbet başlatın &mdash; çalışan sohbet eski izin listesini kullanmaya devam eder."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Özel GPT'ler, Gem'ler ve yapılandırılabilir diğer asistanlar"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Örneğin: Actions özellikli bir özel GPT, bir Gemini Gem'i veya kendi API'nizi tanımlamanıza izin veren herhangi bir asistan"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Platformunuz kendi API eylemlerine sahip bir asistan tanımlamanıza izin veriyorsa, aşağıdaki uç noktaları bir kez kaydedin ve kopyala-yapıştır adımını tamamen atlayın. Birden fazla Joomla sitesine bakıyorsanız en derli toplu seçenek budur, çünkü asistan kurulumu konuşmalar arasında hatırlar."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Yeni bir özel asistan oluşturun ve bu sayfanın altında gösterilen uç nokta URL'sini işaret eden bir API eylemi ekleyin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Kimlik doğrulama başlığı adını <code>X-Joomla-Token</code> olarak ayarlayın ve Joomla API jetonunuzu değer olarak yapıştırın."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Sınıflandırma kurallarını ve rapor biçimini bilmesi için Kontrol Panelindeki tarama komut istemini asistanın yönergelerine yapıştırın."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Yerel ve kendi sunucunuzda barındırılan modeller"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Örneğin: Ollama, LM Studio, llama.cpp veya araç çağırma özelliği olan, kendi barındırdığınız herhangi bir model"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Araç çağırma ve ağ erişimi olan her şey mekanik olarak çalışır ve hiçbir şey kendi altyapınızın dışına çıkmaz; bazı siteler bunu tercih edecektir."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Araç veya işlev çağırmayı etkinleştirin ve modelin bu siteye HTTPS üzerinden erişebildiğini doğrulayın."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Tarama komut istemini sistem komut istemi olarak yapıştırın, ardından başlamasını isteyin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Model boyutu konusunda gerçekçi olun.</strong> Bir geçersiz kılmayı incelemek arama değil, yargı gerektiren bir iştir. Küçük bir yerel model seve seve bir rapor üretir, ancak gerçek bir güvenlik gerilemesini gözden kaçırma ya da olmayan birini uydurma olasılığı çok daha yüksektir. Küçük bir modelden gelen bulguları nihai karar değil, ilk eleme olarak değerlendirin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP istemcileri"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Model Context Protocol konuşan her asistan"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Asistanınız MCP destekliyorsa <strong>MCP for J</strong> ve ücretsiz <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a> eklentisini kurun. Asistanınız geçersiz kılmaları kendi araçlarıyla, kopyala-yapıştır olmadan inceler ve düzeltir. Tarayıcı isteği zaman aşımını önlediği için MCP bağlayıcılarını destekleyen tarayıcı sohbetleri için de daha iyi bir yoldur. İkisi de ayrı ve ücretsiz uzantılardır."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Tek istisna Yöntem 2'dir"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Kontrol Panelindeki <em>Otomatik tarama çalıştır</em> düğmesi, incelemenin tamamını kopyala-yapıştır olmadan sunucu tarafında çalıştırır. <em>Seçenekler</em> altında sağlayıcınızı seçin ve o sağlayıcının API anahtarını kaydedin &mdash; <strong>Anthropic, OpenAI ve Google Gemini'nin hepsi tarama çalıştırabilir</strong>. Hâlâ yalnızca Anthropic ile çalışan tek şey, bir oturumdaki takip sohbetidir: burada düzeltmeleri uygulamasını istersiniz ve dosyaları araç çağrılarıyla düzenler; o döngü Anthropic'in araç çağırma protokolüne göre yazılmıştır. OpenAI veya Gemini seçiliyken raporun tamamını yine alırsınız ve düzeltmeleri, her yapay zekâ ile çalışan Yöntem 1'deki kopyala-yapıştır komut istemini kullanarak kendiniz uygulayabilirsiniz."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s anahtarı kaydedildi &mdash; Yöntem 2 kullanılabilir"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Yapay zekâ sağlayıcınız için kayıtlı API anahtarı yok &mdash; Yöntem 1 yine de çalışır"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Uç nokta ve kimlik doğrulama"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Yönetici arayüzünün yaptığı her şey bu temel URL üzerinden kullanılabilir. Özel bir asistan kaydederken ya da kendi betiğinizi veya ajanınızı yazarken bunu kullanın."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla bu rotalarda <code>Authorization: Bearer</code> kabul etmez.</strong> Jetonu <code>X-Joomla-Token</code> başlığında göndermelisiniz. Bearer biçimli bir başlık 401 Forbidden döndürür."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Tam belgeler"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Eksiksiz uç nokta referansı, rapor biçimi, sorun giderme ve SSS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Belgeleri okuyun"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Yardım alın"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Bu eklenti ücretsizdir ve ücretsiz kalacak"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Pro sürüm, lisans anahtarı ya da geri tutulmuş bir özellik yok. Eklentinin yapabildiği her şey önünüzde. Yine de sizden haber almayı çok isteriz &mdash; şimdiye kadarki her sürümü gerçek sitelerden gelen geri bildirimler şekillendirdi."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Ne beklemelisiniz."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt küçük bir şirkettir ve bu eklenti karşılıksız veriliyor; bu nedenle ücretsiz destek, müşteri işlerinden arta kalan zamanda sunulur. Bu bir savuşturma değil, gerçek bir kısıttır &mdash; tutamayacağımız bir söz verip sizi bekletmektense bunu açıkça söylemeyi tercih ederiz. Hata raporlarına bakılır; ucu açık yapılandırma yardımı sağlanamayabilir."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Nereye göndermeli"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Hata raporları, kafa karıştıran ifadeler, yapay zekânın yanlış değerlendirdiği bir bulgu, eklentinin uymadığı bir iş akışı veya beklenmedik davranan bir asistan &mdash; hepsi işimize yarar."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="GitHub'da bir sorun bildirin"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Belgeleri okuyun"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="Yeniden üretilebilir her şey için en iyi yer GitHub Issues'tır, çünkü herkese açıktır &mdash; aynı sorunu yaşayan bir sonraki kişi tekrar sormak yerine yanıtı bulur."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Nelere yer vermeli"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Teşhis adımını atlamamıza yardım ederseniz daha hızlı yanıt alırsınız:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="Bu sayfadaki <strong>tanılama bloğu</strong> (Joomla, PHP ve eklenti sürümlerinizi tek bir yapıştırmada verir)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Hangi yöntemi</strong> kullandığınız &mdash; kopyala-yapıştır komut istemi, otomatik tarama ya da kendi kodunuz &mdash; ve <strong>hangi yapay zekâ asistanını</strong> kullandığınız."
