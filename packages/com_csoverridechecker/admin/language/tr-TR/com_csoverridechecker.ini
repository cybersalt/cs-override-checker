COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Yöntem 1: Herhangi bir yapay zekâ asistanıyla inceleme yapın"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Eklenti, geçersiz kılma verilerinizi standart bir REST API üzerinden sunar; bu nedenle HTTPS isteği yapabilen <strong>her</strong> yapay zekâ asistanı incelemeyi çalıştırabilir — bu yöntemde belirli bir sağlayıcıya bağlı hiçbir şey yoktur. Aşağıdaki komut istemini zaten kullandığınız asistana kopyalayın; bu sitedeki işaretlenen her geçersiz kılma için bir güvenlik incelemesi üretecek, ardından onayladığınız düzeltmeleri uygulayacaktır. Sizinkinin çalışıp çalışmayacağından emin değil misiniz? Bu sayfanın üst kısmındaki <em>Kurulum kılavuzu</em> düğmesine bakın."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Bir Joomla API jetonu oluşturun (tek seferlik)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="Joomla yöneticisinde: <em>Sistem → Kullanıcılar → Profilim → Joomla API Jetonu</em> sekmesi. Jetonu göstermek için göz simgesine tıklayın ve ardından kopyalayın. <strong>Kalıcı olarak kaydetmek isterseniz</strong>, bu bileşendeki <em>Seçenekler → Anahtarlar ve jetonlar</em> bölümüne gidin, jetonu <em>Joomla API jetonu</em> alanına yapıştırın ve Kaydet'e tıklayın &mdash; aşağıdaki istem jetonla otomatik doldurulur, böylece her taramada yapıştırmanıza gerek kalmaz. Aksi takdirde, jetonu el altında tutun ve 2. adımdaki isteme yapıştırın."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Yapay zekâ asistanınızı açın ve aşağıdaki komut istemini yapıştırın."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Hangi asistanı tercih ediyorsanız onu kullanın — bir terminal veya düzenleyici ajanı (Claude Code, Codex CLI, Cursor, Copilot), bir tarayıcı sohbeti (ChatGPT, Claude.ai, Gemini), özel bir GPT veya Gem ya da yerel bir model. Tek gereksinim, özel bir başlıkla giden HTTPS istekleri yapabilmesidir. <strong>1. adımda jetonu Seçenekler içine kaydetmediyseniz</strong>, köşeli parantezler içindeki yer tutucu metni (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) kopyaladığınız jetonla değiştirin. Site URL'si ve uç noktaları bu site için zaten doldurulmuştur. Asistana özel ipuçları <em>Kurulum kılavuzu</em> sayfasındadır."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Gönderin."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Asistanınız geçersiz kılma listesini çekecek, her biri için geçersiz kılma ve çekirdek kaynağı getirecek ve iletebileceğiniz bir bulgu başına tablo ile sade dilli bir özet üretecektir."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Neyin düzeltileceğini söyleyin — aynı sohbette."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Rapor yayımlandıktan sonra, hangi bulguların düzeltilmesini istediğinizi soracaktır. Onayladığınız bulgularla yanıt verin (ör. <em>“#1 ve #3'ü düzelt, #2'ye dokunma, üçüncü taraf olanı geliştiriciye soracağım”</em>). Yama uygulanmadan önce her dosya yedeklenir, böylece her şey geri alınabilir. <strong>Yalnızca sohbeti kapattıysanız ve daha sonra geri dönmek istiyorsanız aşağıdaki ikinci karta ihtiyacınız olur.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Komut istemi (kopyalayıp yapay zekâ asistanınıza yapıştırın):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Tarama komut istemini kopyala"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Kopyalandı!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Çoğu kullanıcının bu karta ihtiyacı YOKTUR."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Bunu yalnızca önceki bir incelemedeki düzeltmeleri uygulamak için <em>yeni bir sohbet</em> başlatıyorsanız kullanın — örneğin orijinal sohbeti gece kapattıysanız, incelemeyi bir ekip arkadaşına devrediyorsanız veya taramayı bir tarayıcı sohbetinde çalıştırdıysanız ve düzeltmeleri bir terminal ajanında yapmak istiyorsanız. Tarama sohbetiniz hâlâ açıksa, yukarı kaydırın — o sohbette devam etmeniz yeterli."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Yeni bir sohbette önceki bir incelemeye devam edin"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Önceki incelemenizin bağlamını vermek için bu komut istemini yeni bir sohbete yapıştırın — herhangi bir asistanda olabilir, taramayı çalıştıran asistan olması gerekmez. Önceki oturum raporunu getirecek, bulguları listeleyecek ve hangilerini düzelteceğinizi soracaktır. Herhangi bir yama uygulanmadan önce her dosya yedeklenir, böylece her şey geri alınabilir."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Düzeltme komut istemini kopyala"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Oturum günlüğü"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Yapay zekâ asistanınız tarafından gönderilen (veya elle yapıştırılan) raporlar burada oturum olarak kaydedilir. Tam raporu görüntülemek için bir oturuma tıklayın."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Henüz oturum yok. Yukarıdaki komut istemini çalıştırın ve ya asistanınızın raporu otomatik olarak geri POST etmesine izin verin ya da yapıştırmak için 'Yeni oturum' düğmesine tıklayın."
