COM_CSOVERRIDECHECKER_BACKUP_MANUAL_TITLE="Manuel olarak geri yükle (FTP / kendi düzenleyiciniz)"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_INTRO="Eklentinin diske yazmasına izin vermek istemiyorsanız:"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="Yukarıdaki <em>Yedeği indir</em> düğmesine tıklayın (veya Yedek İçeriği bloğunu kopyalayın)."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="FTP istemcinizi, SFTP istemcinizi veya barındırma Dosya Yöneticinizi açın."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="Aşağıdaki hedef yoldaki dosyayı indirilen kopya ile değiştirin."
