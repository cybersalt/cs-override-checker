COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Yöntem 1: Yapay zekâ asistanınızı kullanın"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Hazır bir komut istemini kopyalayın ve kullandığınız yapay zekâ asistanına yapıştırın — ChatGPT, Claude, Gemini, Copilot, Cursor veya yerel bir model. API anahtarı olmadan çalışır. Aşağıdaki komut istemine atlar."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Yöntem 2: Otomatik tarama çalıştırın"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Geçersiz kılma incelemesini, kayıtlı %s API anahtarınızla bu sunucuda çalıştırın. Raporu bir oturum olarak kaydeder. Aşağıdaki çalıştırma düğmesine atlar."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Otomatik taramaları etkinleştirmek için önce Seçenekler panelinde bir yapay zekâ sağlayıcısı seçin ve onun API anahtarını kaydedin. O zamana kadar Yöntem 1'i kullanın."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Etkinleştirilmiş her şablonu yeniden tarayıp geçersiz kılma izleyicisini yeniden oluşturur. Joomla dışında şablon dosyalarını düzenledikten sonra veya Joomla'nın izleyicisi güncel değilse kullanın."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Anahtarlar &amp; jetonlar"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="İsteğe bağlı. Eklentinin taramaları kopyala-yapıştır komut istemine gerek kalmadan otomatik olarak çalıştırabilmesi için burada bir yapay zekâ sağlayıcısı seçin ve onun API anahtarını kaydedin. Kontrol panelindeki kopyala-yapıştır komut istemini zaten kullandığınız yapay zekâ ile kullanmaya devam etmek için boş bırakın."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API anahtarı"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Kişisel Anthropic API anahtarınız (<code>sk-ant-…</code> ile başlar). Bir tane <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a> adresinden alabilirsiniz. Anahtar bu sunucuda saklanır ve yalnızca sizin adınıza api.anthropic.com'u çağırmak için kullanılır. Bir anahtar kayıtlıyken, Kontrol Paneli; geçersiz kılma incelemesini sunucu tarafında Claude'a devreden ve raporu bir oturum olarak geri kaydeden bir <em>Otomatik tarama çalıştır</em> düğmesi sunar — kopyala-yapıştır gerekmez."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Her otomatik tarama, seçtiğiniz sağlayıcıya bir API çağrısı yapar ve seçilen model için o sağlayıcının ücretleriyle faturalandırılır. Çok fazla geçersiz kılması olan siteler çalıştırma başına sınırlandırılır (aşağıdaki <em>Tarama başına geçersiz kılma sayısı</em> ayarına bakın); geri kalanı için yeniden çalıştırın veya sınırsız boyut için kontrol panelindeki kopyala-yapıştır komut istemini kullanın."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Tarama modeli"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Kontrol panelindeki tek seferlik <em>Otomatik tarama çalıştır</em> çağrısı için kullanılan model. Tarama bir sınıflandırma görevidir (her bulgu için alert / review / info). <strong>Varsayılan, en yetenekli modeldir</strong> &mdash; en kapsamlı inceleme ve ince yargı gerektiren bulgular için en güvenli sınıflandırıcı. Daha küçük modeller rutin taramaları maliyetin küçük bir kısmıyla iyi şekilde yürütür ve küçük sitelerde düşük riskli taramalar için uygundur."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Sohbet modeli"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Oturum detay sayfasındaki Claude ile sohbet takibi için kullanılan Claude modeli (Claude'dan düzeltmeleri uygulamasını veya bulguları kapatmasını istediğiniz yer). Araç kullanımı sınıflandırmadan daha zorludur. <strong>Opus varsayılandır</strong> &mdash; en güvenilir araç kullanım davranışı ve yanlış uygulanan düzeltme riski en düşük seçim. Sonnet, düşük riskli takiplerin çok olduğu siteler için iyi bir orta yoldur; Haiku, çok adımlı araç dizilerinde zorlanabilir ve maliyet en yüksek öncelik olmadıkça sohbet modeli için önerilmez."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API jetonu (kontrol paneli komut istemi için)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="İsteğe bağlı. <em>Sistem &rarr; Kullanıcılar &rarr; Profilim &rarr; Joomla API Jetonu</em> bölümünden bir Joomla API jetonu oluşturun ve buraya yapıştırın. Kontrol panelinin tarama / düzeltme komut istemleri jetonu &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo; yer tutucusunun yerine otomatik olarak doldurur, böylece düzenleme yapmadan doğrudan yapay zekâ asistanınıza kopyalayıp yapıştırabilirsiniz.<br><br><strong>Çoklu yönetici uyarısı:</strong> Joomla API jetonları <em>onları oluşturan kullanıcı olarak</em> kimlik doğrular. Bu kontrol panelini birden fazla yönetici kullanıyorsa, komut istemi burada kaydedilen jetonu kullanacaktır &mdash; yani yapay zekâ API'yi o tek kullanıcı olarak çağıracaktır. Her yöneticinin kendi jetonunu kullanım anında yapıştırması için boş bırakın."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Tarama başına geçersiz kılma sayısı"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="<em>Otomatik tarama çalıştır</em> düğmesinin tek bir API çağrısında kaç işaretli şablon geçersiz kılmasını incelediği. Varsayılan <strong>10</strong>. Aralık 1&ndash;100. <strong>Sohbet takibi için daha düşük olan daha güvenlidir:</strong> tarama raporu bulgu sayısıyla birlikte büyür ve sohbet araç kullanımı döngüsü bu raporu konuşma geçmişi olarak korur. Düşük hız sınırı kademelerinde (Anthropic'in Tier 1 kademesi dakikada 10K girdi jetonuna izin verir), 60 geçersiz kılmalı bir tarama artı aynı dakika içinde anında bir sohbet sırası <em>HTTP 429: rate limit exceeded</em> döndürür. Çalıştırma başına 10 geçersiz kılma ile, tarama sonrası sohbet sıralarınız sınırın oldukça altında kalır. Bundan daha fazla geçersiz kılması olan sitelerin her şeyi kapsaması için sadece birkaç yeniden çalıştırmaya ihtiyacı vardır &mdash; her çalıştırmanın raporu kendi oturumu olarak kaydedilir, böylece her biri üzerinde ayrı ayrı çalışabilirsiniz."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — en hızlı ve en ucuz. Küçük sitelerde düşük riskli taramalar için uygundur."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — dengeli. Rutin taramaları Opus maliyetinin küçük bir kısmıyla iyi şekilde yürütür."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — en yetenekli, varsayılan. İnce yargı gerektiren bulgular için en güvenli sınıflandırıcı."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Maliyet farkı hakkında.</strong> <strong>Bu yazının yazıldığı tarihte</strong>, 50 geçersiz kılması olan bir sitede tipik bir tarama yaklaşık 60K girdi jetonu kullanır ve yaklaşık 5K çıktı jetonu üretir. Tarama başına yaklaşık maliyet: <strong>Haiku'da ~$0,08, Sonnet'te ~$0,23, Opus'ta ~$1,13</strong>. Sohbet sıraları çok daha küçüktür (her biri 5K&ndash;10K girdi jetonu), bu nedenle sıra başına maliyet bir taramadan kabaca 10&times; daha azdır. Anthropic'in yayımlanan fiyatlandırması <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> adresinde gerçeğin kaynağıdır &mdash; yukarıdaki rakamlar yaklaşıktır ve zaman içinde değişebilir. Varsayılan Opus'tan daha ucuz bir kademeye geçmeye karar vermeden önce birkaç çalıştırma boyunca kullanımınızı <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> adresinde izleyin."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Bileşen gezintisi"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Yöntem 2: Otomatik tarama çalıştırın (kayıtlı %s API anahtarınızı kullanarak)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Kayıtlı %s API anahtarı yok."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API anahtarı kaydedildi."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Eklenti, kayıtlı API anahtarınızı kullanarak geçersiz kılma incelemesini sunucuda çalıştıracak; kopyala-yapıştır gerekmez. Rapor otomatik olarak yeni bir oturum olarak kaydedilir."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Bir tarama başlatmak için aşağıya tıklayın. Eklenti, bu sitedeki işaretlenen her geçersiz kılmayı getirir, kayıtlı API anahtarınızla yapay zekâ sağlayıcınıza gönderir ve elde edilen raporu yeni bir oturum olarak kaydeder. Tarama tamamlandığında rapora yönlendirileceksiniz."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Tarama başına bir API çağrısı. Geçersiz kılma sayısı %d değerini aşan siteler her çalıştırmada ilk %d geçersiz kılma ile sınırlandırılır (<em>Seçenekler &rarr; Anahtarlar &amp; jetonlar &rarr; Tarama başına geçersiz kılma sayısı</em> bölümünden yapılandırılabilir); bir sonraki grup için yeniden çalıştırın veya sınırsız boyut için Yöntem 1'deki kopyala-yapıştır komut istemini kullanın. Sayfa, yapay zekâ yanıt verirken 30&ndash;90 saniye duraklayabilir &mdash; bu normaldir, sayfadan ayrılmayın."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Bu işlem, kayıtlı anahtarınızla %s API'sini çağıracak ve 30 ile 90 saniye sürebilir. Devam edilsin mi?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Otomatik taramayı şimdi çalıştır"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Bu yöntem incelemenin tamamını sunucu tarafında çalıştırır &mdash; kopyala-yapıştır yok, ikinci pencere yok. Hemen aşağıdaki <em>Seçenekler</em> düğmesine tıklayın, <em>Anahtarlar &amp; jetonlar</em> sekmesinde yapay zekâ sağlayıcınızı seçin, onun API anahtarını yapıştırın ve Kaydet'e tıklayın. Anahtar sitenizin veritabanında kalır; yalnızca bu site onu kullanabilir. Kopyala-yapıştır iş akışını tercih ederseniz yukarıdaki Yöntem 1, API anahtarı olmadan da çalışır."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Otomatik tarama çalışıyor…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="%s API'si çağrılıyor ve geçersiz kılmalarınız analiz ediliyor. Bu işlem genellikle 30 ile 90 saniye sürer. Lütfen bu pencereyi kapatmayın."

