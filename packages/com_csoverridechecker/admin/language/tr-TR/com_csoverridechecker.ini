COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Bu yedek nerede saklanır"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Yedek içerikleri diskte değil, veritabanında saklanır. Spesifik olarak, <code>#__csoverridechecker_backups</code> tablosunda — <code>contents_b64</code> sütunu, dosya içeriklerini base64 ile kodlanmış olarak tutar."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Bu, bir veritabanı yedeğinin de bunları yakaladığı anlamına gelir. Bileşeni kaldırmak, tabloyu ve depolanan tüm yedekleri birlikte siler."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Anthropic API kademeniz hakkında:</strong> hem otomatik tarama hem de sohbet özellikleri Anthropic'in dakika başına jeton sınırına dahil edilir. Anthropic'in varsayılan Tier 1 kademesi (dakikada 10.000 girdi jetonu) küçük bir sitede tek seferlik bir tarama için yeterlidir, ancak çok sıralı sohbet düzeltmeleri sırasında hız sınırına takılırsınız. Tier 2 (dakikada 50.000 jeton, ücretli) gerçek düzeltme oturumlarının çoğu için rahattır. Mevcut kademenizi <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a> adresinde görebilirsiniz."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="İnceleme için geçersiz kılmaları sıfırla"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Geçersiz kılma izleyicisinin hangi şablon(lar) için yeniden oluşturulacağını seçin. Yalnızca diskte bir <code>html/</code> geçersiz kılma klasörü bulunan etkin şablonlar listelenir. Orijinal &ldquo;her şablonu sıfırla&rdquo; davranışı için <em>Tümünü seç</em> kutusunu işaretleyin."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Bu sitedeki hiçbir etkin şablonun <code>html/</code> geçersiz kılma klasörü yok, dolayısıyla sıfırlanacak bir şey de yok. Bir geçersiz kılma ekleyin (veya geçersiz kılmaları olan bir şablonu etkinleştirin) ve bu pencereyi yeniden açın."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SELECT_ALL="Tüm şablonları seç"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_OVERRIDE_COUNT="Şu anda %d satır izleniyor"
