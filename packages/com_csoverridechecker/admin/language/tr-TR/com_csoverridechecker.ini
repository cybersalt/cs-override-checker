COM_CSOVERRIDECHECKER_BACKUP_RESTORE_TITLE="Bu yedeği geri yükle"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_INTRO="Yukarıdaki yoldaki canlı dosyanın üzerine yedeklenen içerikleri yazar. Yazmadan önce, o yoldaki mevcut içerikler yeni bir yedek olarak kaydedilir, böylece bu geri yükleme de geri alınabilir — bir şey ters giderse, yeni geri yükleme öncesi yedeği geri yükleyerek geri alın."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Dosya bu yönetici sayfasından PHP aracılığıyla yazılır; FTP gerekmez. Web kullanıcısının hedef yolda yazma izni olmalıdır. Joomla site kökü sınırdır — geri yükleme bunun dışına yazmayı reddeder."
