COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Yerleşik <em>Otomatik tarama çalıştır</em> düğmesinin hangi yapay zekâ hizmetini çağıracağı. Hangisini seçerseniz seçin kendi anahtarınızı siz sağlarsınız ve anahtar yalnızca bu siteden kullanılır. Bu ayar, kopyala-yapıştır komut istemi iş akışını <strong>etkilemez</strong> &mdash; o iş akışı her yapay zekâ ile çalışır ve hiçbir anahtar gerektirmez."
