COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_TITLE="Bu yedeği %s üzerine geri yükle"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="Kaydedilen yedek, %s konumundaki canlı dosyanın üzerine geri yüklensin mi? Mevcut dosya içerikleri önce yeni bir yedek olarak kaydedilecek, böylece bu geri yükleme de geri alınabilir."
COM_CSOVERRIDECHECKER_FILTER_OPTIONS="Filtre Seçenekleri"
