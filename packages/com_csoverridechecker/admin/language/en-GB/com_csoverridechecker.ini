; Setup guide - "which AI can I use?"
; ---------------------------------------------------------------------------
COM_CSOVERRIDECHECKER_TOOLBAR_DASHBOARD="Dashboard"
COM_CSOVERRIDECHECKER_TOOLBAR_SETUPGUIDE="Setup guide"
COM_CSOVERRIDECHECKER_TOOLBAR_SUPPORT="Get help"
COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Setup guide"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Use whichever AI you already have"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="This extension is not tied to any one AI. Everything it exposes is a plain REST API secured by a standard Joomla API token, so any assistant that can make a web request can run a review &mdash; and so can a script you write yourself. This page covers the practical differences between the options so you can pick one and get going."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="What your assistant actually needs to be able to do"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Rather than list which products work &mdash; plans and features change constantly &mdash; here is the real requirement. Your assistant must be able to:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Make outbound HTTPS requests</strong> to this site, sending a custom request header (<code>X-Joomla-Token</code>). This is the only hard requirement."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Send POST requests with a JSON body</strong>, if you want it to apply fixes rather than only report. A read-only review needs GET alone."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Hold a reasonably long conversation</strong>, since it fetches two files for every flagged override before reaching a verdict."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Not sure whether yours qualifies? Just paste the prompt and see. An assistant that cannot reach your site will say so straight away rather than failing quietly."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="No Joomla API token saved yet."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Whichever assistant you choose, it needs a Joomla API token to read your override files. Generate one at <em>System &rarr; Manage &rarr; Users &rarr; your user &rarr; Joomla API Token</em>, then either paste it into the prompt each time or save it here so the prompt auto-fills."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Recommended"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Most common"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Best for multiple sites"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Works, with caveats"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Advanced"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Terminal and editor agents"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="For example: Claude Code, Codex CLI, Cursor, GitHub Copilot agent mode, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="The smoothest option, and what we would suggest if you have one available. These run on your own machine with unrestricted outbound network access, no sandbox allow-list and no browser request timeout, so a long review runs start to finish without babysitting."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Copy the scan prompt from the Dashboard."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Paste it into your agent and send. No configuration is needed."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="When the report appears, reply in the same session naming the finding numbers you want fixed."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Browser chat assistants"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="For example: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="All of these work, provided the account and mode you are using can genuinely reach the internet. This is the most common setup and perfectly adequate for a normal site."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Make sure web access or browsing is switched on for the conversation. Some tiers and some modes answer from memory only."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Paste the scan prompt from the Dashboard and send."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="If your site has a lot of overrides, ask it to work through them in batches so a single reply does not run past the browser request timeout."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Watch for confident guessing.</strong> If the assistant starts producing findings without ever quoting real file contents, it cannot reach your site and is inventing them. Stop and check its connectivity rather than trusting the report. <strong>Claude.ai specifically:</strong> if it replies &ldquo;Host not in allowlist&rdquo;, add this site's domain under <em>Settings &rarr; Capabilities &rarr; Code execution &rarr; Network access</em>, then start a new chat &mdash; the running one keeps the old allow-list."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Custom GPTs, Gems and other configurable assistants"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="For example: a custom GPT with Actions, a Gemini Gem, or any assistant that lets you register your own API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="If your platform lets you define an assistant with its own API actions, register the endpoints below once and skip the copy-paste step entirely. This is the tidiest option if you look after several Joomla sites, because the assistant remembers the setup between conversations."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Create a new custom assistant and add an API action pointing at the endpoint URL shown further down this page."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Set the authentication header name to <code>X-Joomla-Token</code> and paste your Joomla API token as the value."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Paste the scan prompt from the Dashboard into the assistant's instructions so it knows the classification rules and report format."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Local and self-hosted models"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="For example: Ollama, LM Studio, llama.cpp, or any self-hosted model with tool calling"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Anything with tool calling and network access will work mechanically, and nothing leaves your own infrastructure, which some sites will prefer."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Enable tool or function calling and confirm the model can reach this site over HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Paste the scan prompt as the system prompt, then ask it to begin."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Be realistic about model size.</strong> Reviewing an override is a judgement task, not a lookup. A small local model will happily produce a report, but it is far more likely to miss a genuine security regression or invent one that is not there. Treat findings from a small model as a first pass, not a verdict."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP clients"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Any assistant that speaks the Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="If your assistant supports MCP, install <strong>MCP for J</strong> and its free <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a> add-on. Your assistant then reviews and fixes overrides through its own tools, with no copy-paste step. It's also the better route for browser chats that support MCP connectors, because it avoids the browser request timeout. Both are separate, free extensions."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="The built-in automated scan"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="The Dashboard's <em>Run automated scan</em> button runs the whole review server-side with no copy-paste. Pick your provider under <em>Options</em> and save that provider's API key &mdash; <strong>Anthropic, OpenAI and Google Gemini all run scans</strong>. The one thing that is still Anthropic-only is the follow-up chat on a session, where you ask it to apply fixes and it edits files through tool calls; that loop is written against Anthropic's tool-calling protocol. With OpenAI or Gemini selected you get the full report, and you can apply the fixes yourself using the copy-paste prompt in Method 1, which works with any AI."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s key saved &mdash; Method 2 available"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="No API key saved for your AI provider &mdash; Method 1 still works"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpoint and authentication"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Everything the admin interface does is available on this base URL. Use it when registering a custom assistant, or when writing your own script or agent."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla does not accept <code>Authorization: Bearer</code> on these routes.</strong> You must send the token in the <code>X-Joomla-Token</code> header. A Bearer-formatted header returns 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Full documentation"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Complete endpoint reference, report format, troubleshooting and FAQ."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Read the docs"

