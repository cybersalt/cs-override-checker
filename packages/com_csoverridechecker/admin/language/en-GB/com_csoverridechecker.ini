COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="Reset overrides for review"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Have you (or a previous developer) approved overrides in the past without truly checking them? Click here to bring every override file back into the tracker so you can review each one properly with your AI assistant. Useful after a 'Dismiss All' that happened before this tool was installed."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Walks every enabled template's <code>html/</code> folder and inserts a row in <code>#__template_overrides</code> for any override file that isn't already tracked. Existing rows are left alone. Reset rows reappear as 'Changes found' badges in the Templates admin so you can run the review workflow above against them."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_BUTTON="Reset overrides for review"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="Reset overrides for review? The selected template(s) will have every override file reappear in Joomla's 'Changes found' badges so each can be re-evaluated."

COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Reset overrides for review"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Pick which template(s) to rebuild the override tracker for. Only enabled templates that have an <code>html/</code> override folder on disk are listed. Tick <em>Select all</em> for the original &ldquo;reset every template&rdquo; behavior."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="No enabled template on this site has an <code>html/</code> override folder, so there's nothing to reset. Add an override (or enable a template that has overrides) and reopen this modal."
