COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Revealing in {seconds}s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Hold-to-reveal delay (seconds)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Keys and tokens shown in this extension are blurred by default so a screen share, screencast or over-the-shoulder glance does not leak them. Hold your pointer over a blurred value for this many seconds and it reveals; a countdown tells you the timer is running. Moving away cancels it. Default <strong>3</strong>. Set to <strong>0</strong> to reveal immediately on hover, which removes the protection against a pointer merely passing over the value."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Auto-hide after reveal (seconds)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Once a value has been revealed, blur it again after this many seconds even if the pointer is still over it. Covers the case where you glance at a key and are then interrupted, leaving it exposed on an unattended screen. Default <strong>8</strong>. Set to <strong>0</strong> to keep it visible until you move away."

