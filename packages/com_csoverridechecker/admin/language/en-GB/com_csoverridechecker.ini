COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Get help"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="This extension is free, and stays free"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="There is no Pro version, no licence key and no feature held back. Everything the extension can do is in front of you. We would still very much like to hear from you &mdash; feedback from real sites is what has shaped every release so far."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="What to expect."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt is a small company and this extension is given away for nothing, so free support is offered as time allows around client work. That is a real constraint rather than a brush-off &mdash; we would rather say so plainly than leave you waiting on a promise we cannot keep. Bug reports get looked at; open-ended configuration help may not."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Where to send it"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Bug reports, confusing wording, a finding the AI got wrong, a workflow the extension does not fit, or an assistant that behaved unexpectedly &mdash; all of it is useful."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Report an issue on GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Read the documentation"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues is the best place for anything reproducible, because it is public &mdash; the next person with the same problem finds the answer instead of asking again."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="What to include"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="You will get a faster answer if you help us skip the diagnosis:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="The <strong>diagnostics block</strong> from this page (it has your Joomla, PHP and extension versions in one paste)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Which method</strong> you used &mdash; the copy-paste prompt, the automated scan, or your own code &mdash; and <strong>which AI assistant</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="What you <strong>expected</strong> to happen, and what <strong>actually</strong> happened."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="If the AI got a finding wrong, the <strong>saved session report</strong> &mdash; use <em>Download report</em> on the session page. That gives us the exact findings and reasoning to look at."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Ideas are welcome too"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="If the extension nearly does what you need but not quite, tell us. Several features shipped because one person described a workflow we had not thought of."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnostics"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Copy this into your report so we do not have to ask."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Copy diagnostics"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="This block contains no secrets. It records only whether a key or token is saved, never the value."

