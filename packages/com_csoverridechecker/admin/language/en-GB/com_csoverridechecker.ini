COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="About"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API surfacing the native #__template_overrides tracker so any AI assistant — or any client with a Joomla API token — can review every flagged override, classify it, and apply patches in place. Every patch is auto-backed-up to the database first and reversible from the File backups view."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Version"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Start here."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="This is the only card you need for a normal review. Run the prompt, get the report, then tell your assistant in the same chat which findings to fix."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Method 1: Review using any AI assistant"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="The extension exposes your override data over a standard REST API, so <strong>any</strong> AI assistant that can make an HTTPS request can run the review — there is nothing vendor-specific about this method. Copy the prompt below into the assistant you already use and it will produce a security review of every flagged override on this site, then apply the fixes you confirm. Not sure whether yours will work? See the <em>Setup guide</em> button at the top of this page."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Get a Joomla API token (one-time)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="In the Joomla admin: <em>System → Users → My Profile → Joomla API Token</em> tab. Click the eye icon to reveal the token, then copy it. <strong>If you want to save it permanently</strong>, go to <em>Options → Keys &amp; tokens</em> on this component, paste it into the <em>Joomla API token</em> field, and Save &mdash; the prompt below will then auto-fill with the token, so you don't have to paste it on every scan. Otherwise, keep the token handy and paste it into the prompt in step 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Open your AI assistant and paste the prompt below."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Use whichever assistant you prefer — a terminal or editor agent (Claude Code, Codex CLI, Cursor, Copilot), a browser chat (ChatGPT, Claude.ai, Gemini), a custom GPT or Gem, or a local model. The only requirement is that it can make outbound HTTPS requests with a custom header. <strong>If you did NOT save the token in Options in step 1</strong>, replace the placeholder text in angle brackets (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) with the token you copied. The site URL and endpoints are already filled in for this site. Per-assistant tips are on the <em>Setup guide</em> page."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Send."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Your assistant will pull the list of overrides, fetch the override and core source for each one, and produce a per-finding table plus a plain-language summary you can forward."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Tell it what to fix — in the same chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Once the report is posted, it will ask which findings you want fixed. Reply with the ones you confirm (e.g. <em>“fix #1 and #3, leave #2 alone, the third-party one I’ll ask the developer about”</em>). Every file is backed up before patching, so anything can be rolled back. <strong>You only need the second card below if you closed the chat and want to come back to it later.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (copy and paste into your AI assistant):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Copy scan prompt"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Copied!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Most users do NOT need this card."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Use this only if you're starting a <em>fresh chat</em> to apply fixes from a previous review — for example you closed the original chat overnight, you're handing the review to a teammate, or you ran the scan in a browser chat and want to do the fixes in a terminal agent. If your scan chat is still open, scroll back up — just carry on in that chat."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Continue a previous review in a new chat"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Paste this prompt into a fresh chat — in any assistant, not necessarily the one that ran the scan — to give it the context from your earlier review. It will fetch the previous session report, list the findings, and ask you which to fix. Each file is backed up before any patch lands, so anything is reversible."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Copy fix prompt"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Session log"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Reports submitted by your AI assistant (or pasted in by hand) are saved here as sessions. Click a session to view the full report."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="No sessions yet. Run the prompt above and either let your assistant POST the report back automatically, or click 'New session' to paste it in."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="New session"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="View all sessions"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="After review"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="When you're done acting on the review's recommendations, you'll want to clear the 'Changes found' badges Joomla shows in Templates so they don't keep flagging the overrides you've already handled."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Recommended — per-template review"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Open the Site Templates list. Each template with a 'Changes found' badge can be opened individually so you can dismiss the specific override rows you've handled. Slower, but you keep a per-row audit trail."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Open Site Templates Management"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Bulk — mark every override as reviewed"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Faster path: clear every row in the override tracker in one step. Only do this once you've actually reviewed each finding. Equivalent to using Joomla's own 'Dismiss All' on every template at once."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Mark all as reviewed…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Confirm: mark all overrides as reviewed"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="This clears every row Joomla is currently tracking in the override tracker. The 'Changes found' badges in Templates will disappear, and this site's API endpoint will return zero rows until Joomla's next core update repopulates them. The action cannot be undone except by clicking 'Rebuild override tracker' below to re-scan."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="I confirm I have reviewed every flagged override and I accept responsibility for any unaddressed issues."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="Yes — mark all reviewed"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="%d override row(s) marked as reviewed and cleared from the tracker."
