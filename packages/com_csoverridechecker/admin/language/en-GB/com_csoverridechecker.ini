COM_CSOVERRIDECHECKER="Override Checker"
COM_CSOVERRIDECHECKER_CONFIGURATION="Override Checker: Options"
COM_CSOVERRIDECHECKER_XML_DESCRIPTION="Template-literate Joomla integrity monitor. Surfaces the native #__template_overrides tracker via a Joomla Web Services API so any AI assistant (or other client with a Joomla API token) can review every flagged override, classify it as alert / review / info, and apply patches in place — auto-backed-up and reversible from the admin."

COM_CSOVERRIDECHECKER_DISCLAIMER_TITLE="Before you start"
COM_CSOVERRIDECHECKER_DISCLAIMER_BODY="<p><strong>Please make sure you have a recent backup of your website</strong> before you let this extension change anything. We strongly recommend Akeeba Backup or your host's backup feature.</p><p><strong>What this extension does:</strong> it pairs your Joomla site with the AI assistant of your choice to review every flagged template override, classify each one as a security alert, a cosmetic difference, or a legitimate customisation, and apply the patches you confirm. Every patch is auto-backed-up to the database first, so individual changes are reversible — but a full-site backup is still your safety net for everything else.</p><p><strong>AI can make mistakes.</strong> The AI may misclassify something or propose a patch that breaks a feature. Always read what it proposes before saying “yes, apply it”, and test the site after fixes are applied.</p><p><strong>Not sure?</strong> If you're not comfortable using this tool, email Tim at <a href=\"mailto:tim@cybersalt.com\">tim@cybersalt.com</a> and let's talk — we can walk you through it, or do the review for you.</p>"
COM_CSOVERRIDECHECKER_DISCLAIMER_DONT_SHOW_AGAIN="Don't show this again"
COM_CSOVERRIDECHECKER_DISCLAIMER_CONFIRM_BUTTON="I understand — continue"

COM_CSOVERRIDECHECKER_RUN_SCAN_RATE_LIMITED="Too many automated scans in the past hour (cap: %d). Wait a few minutes before trying again, or use the copy-paste prompt on the dashboard (Method 1)."

