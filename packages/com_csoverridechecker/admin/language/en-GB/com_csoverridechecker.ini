COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Copy a ready-made prompt and paste it into whichever AI assistant you use — ChatGPT, Claude, Gemini, Copilot, Cursor or a local model. Works without an API key. Jumps to the prompt below."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Method 2: Run automated scan"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Run the override review on this server with your saved %s API key. Saves the report as a session. Jumps to the run button below."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Pick an AI provider and save its API key in the Options panel first to enable automated scans. Until then, use Method 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Re-walk every enabled template and rebuild the override tracker. Use after editing template files outside Joomla, or if Joomla's tracker is out of date."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Keys &amp; tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Optional. Pick an AI provider and save its API key here so the extension can run scans automatically, with no copy-paste prompt. Leave it blank to keep using the copy-paste prompt on the dashboard with whatever AI you already use."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API key"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Your personal Anthropic API key (starts with <code>sk-ant-…</code>). Get one from <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. The key is stored on this server and used only to call api.anthropic.com on your behalf. With a key saved, the Dashboard exposes a <em>Run automated scan</em> button that hands the override review off to Claude server-side and saves the report back as a session — no copy-paste needed."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Each automated scan makes one API call to your chosen provider, billed at that provider's rates for the selected model. Sites with very large numbers of overrides are capped per run (see <em>Overrides per scan</em> below); rerun for the rest, or use the copy-paste prompt on the dashboard for unlimited size."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Scan model"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Model used for the one-shot <em>Run automated scan</em> call on the dashboard. The scan is a classification job (alert / review / info per finding). <strong>The most capable model is the default</strong> &mdash; the most thorough review and the safest classifier on findings that need subtle judgement. The smaller models handle routine scans well at a fraction of the cost and are fine for low-stakes scans on small sites."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Chat model"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Claude model used for the chat-with-Claude follow-up on the session detail page (where you ask Claude to apply fixes or dismiss findings). Tool use is more demanding than classification. <strong>Opus is the default</strong> &mdash; the most reliable tool-use behavior and the lowest risk of a misapplied fix. Sonnet is a fine middle ground for sites with many low-stakes follow-ups; Haiku can struggle with multi-step tool sequences and isn't recommended for the chat model unless cost is the top concern."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API token (for the dashboard prompt)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Optional. Generate a Joomla API token at <em>System &rarr; Users &rarr; My Profile &rarr; Joomla API Token</em> and paste it here. The dashboard's scan / fix prompts will then auto-fill the token in place of the &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo; placeholder, so you can copy &amp; paste straight into your AI assistant without editing.<br><br><strong>Multi-admin caveat:</strong> Joomla API tokens authenticate as <em>the user who generated them</em>. If multiple admins use this dashboard, the prompt will use whichever token is saved here &mdash; meaning the AI will call the API authenticating as that one user. Leave blank to make each admin paste their own token at use time."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Overrides per scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="How many flagged template overrides the <em>Run automated scan</em> button reviews in a single API call. Default <strong>10</strong>. Range 1&ndash;100. <strong>Lower is safer for chat follow-up:</strong> the scan report grows with the number of findings, and the chat tool-use loop persists that report as conversation history. On low rate-limit tiers (Anthropic's Tier 1 allows 10K input tokens per minute), a 60-override scan plus an immediate chat turn within the same minute will return <em>HTTP 429: rate limit exceeded</em>. With 10 overrides per run, your post-scan chat turns stay comfortably under the limit. Sites with more overrides than this just need a few reruns to cover everything &mdash; the report from each run saves as its own session, so you can work through each independently."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — fastest and cheapest. Fine for low-stakes scans on small sites."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — balanced. Handles routine scans well at a fraction of the Opus cost."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — most capable, default. The safest classifier on findings that need subtle judgement."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>About the cost difference.</strong> <strong>At the time of writing this</strong>, a typical scan on a 50-override site uses about 60K input tokens and produces about 5K output tokens. Rough cost per scan: <strong>~$0.08 on Haiku, ~$0.23 on Sonnet, ~$1.13 on Opus</strong>. Chat turns are much smaller (5K&ndash;10K input tokens each) so the per-turn cost is roughly 10&times; less than a scan. Anthropic's published pricing is the source of truth at <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; the numbers above are approximate and may drift over time. Watch your usage on <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> for a few runs before deciding whether to step down from the Opus default to a cheaper tier."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Component navigation"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Method 2: Run automated scan (using your saved %s API key)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="No %s API key saved."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>About your Anthropic API tier:</strong> the automated scan and the chat features both count against Anthropic's per-minute token limit. Anthropic's default Tier 1 (10,000 input tokens per minute) is enough for a one-shot scan on a small site but will rate-limit during multi-turn chat fixes. Tier 2 (50,000 tokens per minute, billed) is comfortable for most real fix sessions. See your current tier at <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API key saved."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="The extension will run the override review on the server using your saved API key, no copy-paste required. The report saves as a new session automatically."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Click below to start a scan. The extension fetches every flagged override on this site, sends it to your AI provider with your saved API key, and saves the resulting report as a new session. You'll be redirected to the report when it finishes."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="One API call per scan. Sites with more than %d overrides are capped to the first %d per run (configurable in <em>Options &rarr; Keys &amp; tokens &rarr; Overrides per scan</em>); rerun for the next batch, or use the copy-paste prompt in Method 1 for unlimited size. The page may pause for 30&ndash;90 seconds while the AI responds &mdash; that's normal, don't navigate away."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="This will call the %s API with your saved key and may take 30 to 90 seconds. Continue?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Run automated scan now"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="This method runs the whole review server-side &mdash; no copy-paste, no second window. Click the <em>Options</em> button just below, pick your AI provider under the <em>Keys &amp; tokens</em> tab, paste its API key, and Save. The key stays in your site's database; only this site can use it. Method 1 above still works without an API key if you prefer the copy-paste workflow."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Running automated scan…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Calling the %s API and analyzing your overrides. This usually takes 30 to 90 seconds. Please don't close this window."

