COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="Point d'accès API actif"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Tout utilisateur disposant d'un token API Joomla valide et de l'autorisation core.manage sur ce composant peut lire les données actuelles de surcharge de modèle de ce site."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL du point d'accès"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="À propos"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="API Web Services exposant le suivi natif #__template_overrides afin que n'importe quel assistant IA — ou tout client disposant d'un token API Joomla — puisse examiner chaque surcharge signalée, la classer et appliquer des correctifs sur place. Chaque correctif est d'abord automatiquement sauvegardé dans la base de données et réversible depuis la vue Sauvegardes de fichiers."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Version"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Commencez ici."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="C'est la seule carte dont vous avez besoin pour une révision normale. Exécutez le prompt, obtenez le rapport, puis dites à votre assistant dans le même chat quelles découvertes corriger."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Méthode 1 : Révision avec n'importe quel assistant IA"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="L'extension expose vos données de surcharge via une API REST standard, donc <strong>n'importe quel</strong> assistant IA capable d'effectuer une requête HTTPS peut exécuter la révision — cette méthode n'a rien de propre à un fournisseur. Copiez le prompt ci-dessous dans l'assistant que vous utilisez déjà : il produira une révision de sécurité de chaque surcharge signalée sur ce site, puis appliquera les correctifs que vous confirmez. Vous ne savez pas si le vôtre fonctionnera ? Consultez le bouton <em>Guide de configuration</em> en haut de cette page."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Générer un token API Joomla (une seule fois)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="Dans l'admin Joomla : <em>Système → Utilisateurs → Mon profil → Token API Joomla</em>. Cliquez sur l'icône en forme d'œil pour révéler le token, puis copiez-le. <strong>Si vous souhaitez l'enregistrer de manière permanente</strong>, allez dans <em>Options → Clés &amp; jetons</em> sur ce composant, collez-le dans le champ <em>Token API Joomla</em> et enregistrez &mdash; l'invite ci-dessous se remplira automatiquement avec le token, donc vous n'aurez pas à le coller à chaque analyse. Sinon, gardez le token à portée et collez-le dans l'invite à l'étape 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Ouvrir votre assistant IA et coller le prompt ci-dessous."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Utilisez l'assistant que vous préférez — un agent de terminal ou d'éditeur (Claude Code, Codex CLI, Cursor, Copilot), un chat dans le navigateur (ChatGPT, Claude.ai, Gemini), un GPT personnalisé ou un Gem, ou un modèle local. La seule condition est qu'il puisse effectuer des requêtes HTTPS sortantes avec un en-tête personnalisé. <strong>Si vous n'avez PAS enregistré le token dans les Options à l'étape 1</strong>, remplacez le texte d'espace réservé entre chevrons (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) par le token que vous avez copié. L'URL du site et les points d'accès sont déjà remplis pour ce site. Des conseils par assistant se trouvent sur la page <em>Guide de configuration</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Envoyer."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Votre assistant récupérera la liste des surcharges, récupérera la surcharge et le source du noyau pour chacune, et produira un tableau par découverte plus un résumé en langage simple que vous pouvez transférer."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Dites-lui quoi corriger — dans le même chat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Une fois le rapport posté, il vous demandera quelles découvertes vous voulez corriger. Répondez avec celles que vous confirmez (par ex. <em>« corrige #1 et #3, laisse #2 tranquille, le tiers, je demanderai au développeur »</em>). Chaque fichier est sauvegardé avant d'être patché, donc tout peut être annulé. <strong>Vous n'avez besoin de la deuxième carte ci-dessous que si vous avez fermé le chat et voulez y revenir plus tard.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (copier et coller dans votre assistant IA) :"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Copier le prompt de scan"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Copié !"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="La plupart des utilisateurs n'ont PAS besoin de cette carte."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Utilisez ceci uniquement si vous démarrez un <em>nouveau chat</em> pour appliquer des correctifs d'une révision précédente — par exemple vous avez fermé le chat d'origine pendant la nuit, vous transmettez la révision à un coéquipier, ou vous avez fait le scan dans un chat de navigateur et voulez faire les corrections dans un agent de terminal. Si votre chat de scan est encore ouvert, faites défiler vers le haut — continuez simplement dans ce chat."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Continuer une révision précédente dans un nouveau chat"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Collez ce prompt dans un nouveau chat — dans n'importe quel assistant, pas forcément celui qui a fait le scan — pour lui donner le contexte de votre révision précédente. Il récupérera le rapport de la session précédente, listera les découvertes et vous demandera lesquelles corriger. Chaque fichier est sauvegardé avant tout correctif, donc tout est réversible."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Copier le prompt de correction"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Journal de sessions"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Les rapports soumis par votre assistant IA (ou collés à la main) sont enregistrés ici comme des sessions. Cliquez sur une session pour voir le rapport complet."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Pas encore de sessions. Exécutez le prompt ci-dessus et soit laissez votre assistant renvoyer le rapport automatiquement (POST), soit cliquez sur 'Nouvelle session' pour le coller."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nouvelle session"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Voir toutes les sessions"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Après la révision"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Quand vous avez fini d'agir sur les recommandations de la révision, vous voudrez effacer les badges 'Modifications trouvées' que Joomla affiche dans Modèles afin qu'ils ne continuent pas à signaler les surcharges que vous avez déjà traitées."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Recommandé — révision par modèle"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Ouvrez la liste des modèles du site. Chaque modèle avec un badge 'Modifications trouvées' peut être ouvert individuellement afin que vous puissiez rejeter les lignes de surcharge spécifiques que vous avez traitées. Plus lent, mais vous gardez une piste d'audit par ligne."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Ouvrir la gestion des modèles du site"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="En masse — marquer toutes les surcharges comme révisées"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Voie plus rapide : effacer chaque ligne du suivi des surcharges en une seule étape. Ne faites cela qu'après avoir réellement révisé chaque découverte. Équivalent à utiliser le 'Tout rejeter' de Joomla sur chaque modèle à la fois."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Marquer tout comme révisé…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Confirmer : marquer toutes les surcharges comme révisées"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Ceci efface chaque ligne actuellement suivie par Joomla dans le suivi des surcharges. Les badges 'Modifications trouvées' dans Modèles disparaîtront, et le point d'accès API de ce site renverra zéro ligne jusqu'à ce que la prochaine mise à jour du noyau Joomla les repeuple. L'action ne peut pas être annulée sauf en cliquant sur 'Reconstruire le suivi des surcharges' ci-dessous pour re-scanner."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Je confirme avoir révisé chaque surcharge signalée et j'accepte la responsabilité pour tout problème non traité."
