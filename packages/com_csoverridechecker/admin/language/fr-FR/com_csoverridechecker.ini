COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="Je comprends : restaurer maintenant écrasera le fichier en direct. La copie pré-restauration sera automatiquement enregistrée comme une nouvelle sauvegarde."
