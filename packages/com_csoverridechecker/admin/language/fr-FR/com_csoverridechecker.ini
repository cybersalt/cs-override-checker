COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Voir les données Override Checker"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Permet aux utilisateurs des groupes correspondants de lire les surcharges, les sessions, le journal d'actions et le contenu des sauvegardes (vues admin et points d'accès API en lecture)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Modifier les données Override Checker et les fichiers de surcharge"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Permet aux utilisateurs des groupes correspondants d'appliquer des correctifs, de restaurer des sauvegardes, de rejeter des indicateurs de surcharge, et de créer ou supprimer des sessions. Implique Voir."

