COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Méthode 1 : utiliser votre assistant IA"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Copier un prompt prêt à l'emploi et le coller dans l'assistant IA que vous utilisez — ChatGPT, Claude, Gemini, Copilot, Cursor ou un modèle local. Fonctionne sans clé API. Saute au prompt ci-dessous."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Méthode 2 : exécuter un scan automatique"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Exécute la révision des surcharges sur ce serveur avec votre clé API %s enregistrée. Enregistre le rapport comme une session. Saute au bouton d'exécution ci-dessous."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Choisissez d'abord un fournisseur d'IA et enregistrez sa clé API dans le panneau Options pour activer les scans automatiques. En attendant, utilisez la Méthode 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Re-parcourir tous les modèles activés et reconstruire le suivi des surcharges. Utilisez ceci après avoir édité des fichiers de modèle en dehors de Joomla, ou si le suivi de Joomla est obsolète."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Clés &amp; tokens"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Optionnel. Choisissez un fournisseur d'IA et enregistrez ici sa clé API pour que l'extension puisse exécuter les scans automatiquement, sans prompt à copier-coller. Laissez vide pour continuer à utiliser le prompt à copier-coller du tableau de bord avec l'IA que vous utilisez déjà."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Clé API Anthropic"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Votre clé API Anthropic personnelle (commence par <code>sk-ant-…</code>). Obtenez-en une sur <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. La clé est stockée sur ce serveur et utilisée uniquement pour appeler api.anthropic.com en votre nom. Avec une clé enregistrée, le tableau de bord expose un bouton <em>Exécuter un scan automatique</em> qui transfère la révision des surcharges à Claude côté serveur et enregistre le rapport en tant que session — pas besoin de copier-coller."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Chaque scan automatique effectue un appel API auprès du fournisseur choisi, facturé aux tarifs de ce fournisseur pour le modèle sélectionné. Les sites avec un très grand nombre de surcharges sont limités par exécution (voir <em>Surcharges par scan</em> ci-dessous) ; relancez pour le reste, ou utilisez le prompt à copier-coller du tableau de bord pour une taille illimitée."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Modèle de scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Modèle utilisé pour l'appel unique <em>Exécuter un scan automatique</em> dans le tableau de bord. Le scan est une tâche de classification (alert / review / info par découverte). <strong>Le modèle le plus performant est le choix par défaut</strong> &mdash; la revue la plus approfondie et le classificateur le plus sûr pour les découvertes nécessitant un jugement subtil. Les modèles plus petits gèrent bien les scans de routine à une fraction du coût et conviennent aux scans à faible enjeu sur les petits sites."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Modèle de chat"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Modèle Claude utilisé pour le chat-avec-Claude de suivi sur la page de détail de session (où vous demandez à Claude d'appliquer des correctifs ou de rejeter des découvertes). L'utilisation d'outils est plus exigeante que la classification. <strong>Opus est le choix par défaut</strong> &mdash; le comportement d'utilisation d'outils le plus fiable et le risque le plus faible d'un correctif mal appliqué. Sonnet est un bon compromis pour les sites avec de nombreux suivis à faible enjeu ; Haiku peut avoir du mal avec les séquences d'outils à plusieurs étapes et n'est pas recommandé pour le modèle de chat à moins que le coût ne soit la priorité absolue."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Token API Joomla (pour le prompt du tableau de bord)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Optionnel. Générez un token API Joomla à <em>Système &rarr; Utilisateurs &rarr; Mon profil &rarr; Token API Joomla</em> et collez-le ici. Les prompts de scan/correction du tableau de bord rempliront alors automatiquement le token à la place de l'espace réservé &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, afin que vous puissiez copier &amp; coller directement dans votre assistant IA sans modification.<br><br><strong>Avertissement multi-admins :</strong> les tokens API Joomla s'authentifient en tant que <em>l'utilisateur qui les a générés</em>. Si plusieurs admins utilisent ce tableau de bord, le prompt utilisera le token enregistré ici &mdash; ce qui signifie que l'IA appellera l'API authentifié en tant que cet utilisateur unique. Laissez vide pour que chaque admin colle son propre token au moment de l'utilisation."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Surcharges par scan"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Combien de surcharges de modèle signalées le bouton <em>Exécuter un scan automatique</em> examine en un seul appel API. Par défaut <strong>10</strong>. Plage 1&ndash;100. <strong>Plus bas est plus sûr pour le chat de suivi :</strong> le rapport de scan grandit avec le nombre de découvertes, et la boucle d'utilisation d'outils du chat conserve ce rapport comme historique de conversation. Sur les niveaux de limite de débit bas (le Tier 1 d'Anthropic autorise 10K tokens d'entrée par minute), un scan de 60 surcharges plus un tour de chat immédiat dans la même minute renverra <em>HTTP 429: rate limit exceeded</em>. Avec 10 surcharges par exécution, vos tours de chat post-scan restent confortablement sous la limite. Les sites avec plus de surcharges que cela ont juste besoin de quelques exécutions supplémentaires pour tout couvrir &mdash; le rapport de chaque exécution est enregistré comme sa propre session, donc vous pouvez traiter chacune indépendamment."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — le plus rapide et le moins cher. Convient aux scans à faible enjeu sur les petits sites."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — équilibré. Gère bien les scans de routine pour une fraction du coût d'Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — le plus performant, par défaut. Le classificateur le plus sûr pour les découvertes nécessitant un jugement subtil."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>À propos de la différence de coût.</strong> <strong>Au moment d'écrire ceci</strong>, un scan typique sur un site avec 50 surcharges utilise environ 60K tokens d'entrée et produit environ 5K tokens de sortie. Coût approximatif par scan : <strong>~0,08 $ avec Haiku, ~0,23 $ avec Sonnet, ~1,13 $ avec Opus</strong>. Les tours de chat sont beaucoup plus petits (5K&ndash;10K tokens d'entrée chacun), donc le coût par tour est environ 10&times; inférieur à un scan. La tarification publiée par Anthropic est la source de vérité sur <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; les chiffres ci-dessus sont approximatifs et peuvent évoluer dans le temps. Surveillez votre utilisation sur <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> pendant quelques exécutions avant de décider de descendre depuis le choix par défaut Opus vers un niveau moins cher."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Navigation du composant"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Méthode 2 : exécuter un scan automatique (avec votre clé API %s enregistrée)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Aucune clé API %s enregistrée."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Clé API enregistrée."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="L'extension exécutera la révision des surcharges sur le serveur en utilisant votre clé API enregistrée, sans copier-coller. Le rapport est enregistré automatiquement comme une nouvelle session."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Cliquez ci-dessous pour démarrer un scan. L'extension récupère chaque surcharge signalée sur ce site, l'envoie à votre fournisseur d'IA avec votre clé API enregistrée, et enregistre le rapport résultant comme une nouvelle session. Vous serez redirigé vers le rapport quand il sera terminé."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Un appel API par scan. Les sites avec plus de %d surcharges sont limités aux %d premières par exécution (configurable dans <em>Options &rarr; Clés &amp; tokens &rarr; Surcharges par scan</em>) ; relancez pour le lot suivant, ou utilisez le prompt à copier-coller de la Méthode 1 pour une taille illimitée. La page peut faire une pause de 30&ndash;90 secondes pendant que l'IA répond &mdash; c'est normal, ne quittez pas la page."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Ceci appellera l'API %s avec votre clé enregistrée et peut prendre 30 à 90 secondes. Continuer ?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Exécuter un scan automatique maintenant"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Cette méthode exécute toute la revue côté serveur &mdash; pas de copier-coller, pas de seconde fenêtre. Cliquez sur le bouton <em>Options</em> juste en dessous, choisissez votre fournisseur d'IA dans l'onglet <em>Clés &amp; tokens</em>, collez sa clé API et enregistrez. La clé reste dans la base de données de votre site ; seul ce site peut l'utiliser. La Méthode 1 ci-dessus fonctionne toujours sans clé API si vous préférez le flux copier-coller."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Scan automatique en cours…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Appel à l'API %s et analyse de vos surcharges. Cela prend généralement 30 à 90 secondes. Veuillez ne pas fermer cette fenêtre."

