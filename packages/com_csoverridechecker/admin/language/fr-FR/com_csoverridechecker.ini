COM_CSOVERRIDECHECKER_SESSIONFORM_TITLE="Nouvelle session"
COM_CSOVERRIDECHECKER_SESSIONFORM_HEADING="Coller un rapport de révision IA"
COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Collage manuel pour les utilisateurs d'un chat dans le navigateur.</strong> Si vous avez exécuté le prompt de scan dans un chat de navigateur comme ChatGPT, claude.ai ou Gemini, copiez la réponse de l'IA et collez-la ici pour l'enregistrer comme session. Si vous avez utilisé un agent de terminal ou d'éditeur (Claude Code, Codex, Cursor, etc.), vous n'avez généralement pas besoin de ce formulaire — l'agent renvoie lui-même le rapport au site. La session est nommée par défaut avec l'horodatage d'aujourd'hui ; modifiez-le si vous le souhaitez."
