COM_CSOVERRIDECHECKER_BACKUP_CONTENTS_HELP="Τα ακριβή bytes που αποτυπώθηκαν τη στιγμή του αντιγράφου ασφαλείας. Αλλάξτε το μέγεθος του πλαισίου σύροντας την κάτω δεξιά γωνία του. Χρησιμοποιήστε το παραπάνω κουμπί Λήψη για να αποθηκεύσετε αυτό το περιεχόμενο ως αρχείο."

COM_CSOVERRIDECHECKER_BACKUP_RESTORE_TITLE="Αποκατάσταση αυτού του αντιγράφου ασφαλείας"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_INTRO="Αντικαταστήστε το ζωντανό αρχείο στην παραπάνω διαδρομή με το περιεχόμενο του αντιγράφου ασφαλείας. Πριν την εγγραφή, το τρέχον περιεχόμενο σε αυτή τη διαδρομή αποθηκεύεται ως νέο αντίγραφο ασφαλείας, οπότε αυτή η αποκατάσταση είναι κι αυτή αναστρέψιμη — αν πάει κάτι στραβά, αναιρέστε την αποκαθιστώντας το νέο αντίγραφο ασφαλείας προ της αποκατάστασης."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Το αρχείο γράφεται μέσω PHP από αυτή τη διαχειριστική σελίδα· δεν απαιτείται FTP. Ο χρήστης web πρέπει να έχει δικαίωμα εγγραφής στη διαδρομή προορισμού. Η ρίζα του ιστοτόπου Joomla είναι το όριο — η αποκατάσταση αρνείται να γράψει εκτός αυτής."
