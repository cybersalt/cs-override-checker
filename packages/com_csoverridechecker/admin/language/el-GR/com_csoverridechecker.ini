COM_CSOVERRIDECHECKER_RUN_SCAN_NO_KEY="Δεν έχει αποθηκευτεί κλειδί API για %s. Πατήστε Επιλογές στη γραμμή εργαλείων και προσθέστε ένα στην καρτέλα Κλειδιά &amp; διακριτικά, και έπειτα δοκιμάστε ξανά."
COM_CSOVERRIDECHECKER_RUN_SCAN_SUCCESS="Η αυτοματοποιημένη σάρωση ολοκληρώθηκε: %1$d παράκαμψη(εις) επιθεωρήθηκαν και αποθηκεύτηκαν ως συνεδρία #%2$d."
COM_CSOVERRIDECHECKER_RUN_SCAN_TRUNCATED="Αυτός ο ιστότοπος έχει περισσότερες από %d παρακάμψεις· οι υπόλοιπες θα χρειαστούν επόμενη εκτέλεση. Χρησιμοποιήστε το prompt αντιγραφής-επικόλλησης (Μέθοδος 1) για επιθεωρήσεις απεριόριστου μεγέθους σε μία εκτέλεση."
COM_CSOVERRIDECHECKER_RUN_SCAN_ERROR="Η αυτοματοποιημένη σάρωση απέτυχε: %s"

COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Προβολή δεδομένων Override Checker"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Επιτρέπει σε χρήστες των αντίστοιχων ομάδων να διαβάζουν παρακάμψεις, συνεδρίες, το αρχείο καταγραφής ενεργειών και το περιεχόμενο των αντιγράφων ασφαλείας (διαχειριστικές προβολές και άκρα API ανάγνωσης)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Τροποποίηση δεδομένων Override Checker και αρχείων παράκαμψης"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Επιτρέπει σε χρήστες των αντίστοιχων ομάδων να εφαρμόζουν επιδιορθώσεις, να αποκαθιστούν αντίγραφα ασφαλείας, να απορρίπτουν επισημάνσεις παρακάμψεων και να δημιουργούν ή να διαγράφουν συνεδρίες. Συνεπάγεται την Προβολή."

COM_CSOVERRIDECHECKER_DASHBOARD="Πίνακας ελέγχου"
COM_CSOVERRIDECHECKER_DASHBOARD_TITLE="Cybersalt Override Checker"

COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="Άκρο API ενεργό"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Οποιοσδήποτε χρήστης με έγκυρο διακριτικό Joomla API και δικαίωμα core.manage σε αυτό το στοιχείο μπορεί να διαβάσει τα τρέχοντα δεδομένα παρακάμψεων προτύπων αυτού του ιστοτόπου."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL άκρου"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="Πληροφορίες"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API που εκθέτει τον εγγενή πίνακα παρακολούθησης #__template_overrides ώστε οποιοσδήποτε βοηθός τεχνητής νοημοσύνης — ή οποιοσδήποτε πελάτης με διακριτικό Joomla API — να μπορεί να επιθεωρεί κάθε επισημασμένη παράκαμψη, να την κατατάσσει και να εφαρμόζει επιδιορθώσεις επί τόπου. Κάθε επιδιόρθωση αντιγράφεται αυτόματα στη βάση δεδομένων πρώτα και είναι αναστρέψιμη από την προβολή Αντίγραφα ασφαλείας αρχείων."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Έκδοση"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Ξεκινήστε από εδώ."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Αυτή είναι η μόνη κάρτα που χρειάζεστε για μια κανονική επιθεώρηση. Εκτελέστε το prompt, λάβετε την αναφορά και έπειτα πείτε στον βοηθό σας στην ίδια συνομιλία ποια ευρήματα να επιδιορθώσει."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Μέθοδος 1: Επιθεώρηση με οποιονδήποτε βοηθό τεχνητής νοημοσύνης"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Η επέκταση εκθέτει τα δεδομένα παρακάμψεών σας μέσω ενός τυπικού REST API, οπότε <strong>οποιοσδήποτε</strong> βοηθός τεχνητής νοημοσύνης που μπορεί να πραγματοποιήσει αίτημα HTTPS μπορεί να εκτελέσει την επιθεώρηση — δεν υπάρχει τίποτα δεμένο με συγκεκριμένο πάροχο σε αυτή τη μέθοδο. Αντιγράψτε το παρακάτω prompt στον βοηθό που ήδη χρησιμοποιείτε και θα παραγάγει μια επιθεώρηση ασφαλείας κάθε επισημασμένης παράκαμψης σε αυτόν τον ιστότοπο και έπειτα θα εφαρμόσει τις επιδιορθώσεις που εγκρίνετε. Δεν είστε σίγουροι αν ο δικός σας θα λειτουργήσει; Δείτε το κουμπί <em>Οδηγός ρύθμισης</em> στο πάνω μέρος αυτής της σελίδας."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Δημιουργήστε ένα διακριτικό Joomla API (μία φορά)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="Στη διαχείριση Joomla: <em>Σύστημα → Χρήστες → Το προφίλ μου → καρτέλα Διακριτικό Joomla API</em>. Πατήστε το εικονίδιο ματιού για να εμφανίσετε το διακριτικό και αντιγράψτε το. <strong>Εάν θέλετε να το αποθηκεύσετε μόνιμα</strong>, μεταβείτε στις <em>Επιλογές → Κλειδιά και διακριτικά</em> αυτού του στοιχείου, επικολλήστε το στο πεδίο <em>Διακριτικό Joomla API</em> και Αποθηκεύστε &mdash; το προτρεπτικό παρακάτω θα συμπληρωθεί αυτόματα με το διακριτικό, ώστε να μη χρειάζεται να το επικολλάτε σε κάθε σάρωση. Διαφορετικά, κρατήστε το διακριτικό πρόχειρο και επικολλήστε το στο προτρεπτικό στο βήμα 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Ανοίξτε τον βοηθό τεχνητής νοημοσύνης σας και επικολλήστε το παρακάτω prompt."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Χρησιμοποιήστε όποιον βοηθό προτιμάτε — έναν πράκτορα τερματικού ή επεξεργαστή κώδικα (Claude Code, Codex CLI, Cursor, Copilot), μια συνομιλία σε φυλλομετρητή (ChatGPT, Claude.ai, Gemini), ένα προσαρμοσμένο GPT ή Gem, ή ένα τοπικό μοντέλο. Η μόνη απαίτηση είναι να μπορεί να πραγματοποιεί εξερχόμενα αιτήματα HTTPS με προσαρμοσμένη κεφαλίδα. <strong>Εάν ΔΕΝ αποθηκεύσατε το διακριτικό στις Επιλογές στο βήμα 1</strong>, αντικαταστήστε το κείμενο placeholder σε γωνιακές αγκύλες (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) με το διακριτικό που αντιγράψατε. Η διεύθυνση URL του ιστοτόπου και τα άκρα είναι ήδη συμπληρωμένα για αυτόν τον ιστότοπο. Συμβουλές ανά βοηθό θα βρείτε στη σελίδα <em>Οδηγός ρύθμισης</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Αποστολή."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Ο βοηθός σας θα ανακτήσει τη λίστα των παρακάμψεων, θα φέρει την παράκαμψη και τον πηγαίο κώδικα του πυρήνα για κάθε μία και θα παραγάγει έναν πίνακα ανά εύρημα συν μια περιγραφή σε απλή γλώσσα που μπορείτε να προωθήσετε."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Πείτε του τι να επιδιορθώσει — στην ίδια συνομιλία."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Μόλις δημοσιευτεί η αναφορά, θα σας ρωτήσει ποια ευρήματα θέλετε να επιδιορθωθούν. Απαντήστε με όσα εγκρίνετε (π.χ. <em>«διόρθωσε το #1 και το #3, άσε το #2 ως έχει, για το τρίτο θα ρωτήσω τον προγραμματιστή»</em>). Δημιουργείται αντίγραφο ασφαλείας κάθε αρχείου πριν την επιδιόρθωση, οπότε όλα μπορούν να αναιρεθούν. <strong>Χρειάζεστε τη δεύτερη κάρτα παρακάτω μόνο εάν κλείσατε τη συνομιλία και θέλετε να επανέλθετε αργότερα.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (αντιγράψτε και επικολλήστε στον βοηθό τεχνητής νοημοσύνης σας):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Αντιγραφή prompt σάρωσης"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Αντιγράφηκε!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Οι περισσότεροι χρήστες ΔΕΝ χρειάζονται αυτή την κάρτα."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Χρησιμοποιήστε την μόνο εάν ξεκινάτε μια <em>νέα συνομιλία</em> για να εφαρμόσετε επιδιορθώσεις από προηγούμενη επιθεώρηση — για παράδειγμα κλείσατε την αρχική συνομιλία τη νύχτα, αναθέτετε την επιθεώρηση σε συνεργάτη ή εκτελέσατε τη σάρωση σε μια συνομιλία σε φυλλομετρητή και θέλετε να κάνετε τις επιδιορθώσεις σε έναν πράκτορα τερματικού. Εάν η συνομιλία σάρωσης παραμένει ανοιχτή, μετακινηθείτε προς τα πάνω — απλώς συνεχίστε σε εκείνη τη συνομιλία."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Συνέχιση προηγούμενης επιθεώρησης σε νέα συνομιλία"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Επικολλήστε αυτό το prompt σε μια νέα συνομιλία — σε οποιονδήποτε βοηθό, όχι απαραίτητα σε αυτόν που εκτέλεσε τη σάρωση — για να του δώσετε το πλαίσιο της προηγούμενης επιθεώρησής σας. Θα ανακτήσει την προηγούμενη αναφορά συνεδρίας, θα παραθέσει τα ευρήματα και θα σας ρωτήσει ποια να επιδιορθώσει. Κάθε αρχείο αντιγράφεται πριν εφαρμοστεί οποιαδήποτε επιδιόρθωση, οπότε όλα είναι αναστρέψιμα."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Αντιγραφή prompt επιδιόρθωσης"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Αρχείο συνεδριών"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Οι αναφορές που υποβάλλει ο βοηθός τεχνητής νοημοσύνης σας (ή που επικολλάτε με το χέρι) αποθηκεύονται εδώ ως συνεδρίες. Πατήστε σε μια συνεδρία για να δείτε την πλήρη αναφορά."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Δεν υπάρχουν ακόμη συνεδρίες. Εκτελέστε το παραπάνω prompt και είτε αφήστε τον βοηθό σας να υποβάλει (POST) την αναφορά αυτόματα είτε πατήστε «Νέα συνεδρία» για να την επικολλήσετε."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Νέα συνεδρία"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Προβολή όλων των συνεδριών"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Μετά την επιθεώρηση"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Όταν ολοκληρώσετε τις ενέργειες με βάση τις συστάσεις της επιθεώρησης, θα θελήσετε να εκκαθαρίσετε τις σημάνσεις «Changes found» που εμφανίζει το Joomla στα Πρότυπα ώστε να μην επισημαίνουν συνεχώς τις παρακάμψεις που έχετε ήδη χειριστεί."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Συνιστώμενο — επιθεώρηση ανά πρότυπο"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Ανοίξτε τη λίστα Προτύπων Ιστοτόπου. Κάθε πρότυπο με σήμανση «Changes found» μπορεί να ανοιχτεί ξεχωριστά ώστε να μπορείτε να απορρίψετε τις συγκεκριμένες γραμμές παράκαμψης που έχετε χειριστεί. Πιο αργό, αλλά διατηρείτε ίχνος ελέγχου ανά γραμμή."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Άνοιγμα Διαχείρισης Προτύπων Ιστοτόπου"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Μαζικά — σήμανση κάθε παράκαμψης ως ελεγμένης"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Ταχύτερη διαδρομή: εκκαθαρίστε κάθε γραμμή στον πίνακα παρακολούθησης παρακάμψεων σε ένα βήμα. Κάντε το μόνο εφόσον έχετε όντως επιθεωρήσει κάθε εύρημα. Ισοδύναμο με τη χρήση της λειτουργίας «Dismiss All» του Joomla σε όλα τα πρότυπα ταυτόχρονα."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Σήμανση όλων ως ελεγμένων…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Επιβεβαίωση: σήμανση όλων των παρακάμψεων ως ελεγμένων"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Αυτό εκκαθαρίζει κάθε γραμμή που παρακολουθεί αυτή τη στιγμή το Joomla στον πίνακα παρακάμψεων. Οι σημάνσεις «Changes found» στα Πρότυπα θα εξαφανιστούν και το άκρο API αυτού του ιστοτόπου θα επιστρέφει μηδέν γραμμές μέχρι την επόμενη ενημέρωση πυρήνα του Joomla που θα τις επανασυμπληρώσει. Η ενέργεια δεν μπορεί να αναιρεθεί παρά μόνο με κλικ στο «Ανακατασκευή πίνακα παρακάμψεων» παρακάτω για επανάληψη σάρωσης."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Επιβεβαιώνω ότι έχω επιθεωρήσει κάθε επισημασμένη παράκαμψη και αναλαμβάνω την ευθύνη για τυχόν ζητήματα που δεν αντιμετωπίστηκαν."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="Ναι — σήμανση όλων ως ελεγμένων"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="%d γραμμή(ές) παράκαμψης σημάνθηκαν ως ελεγμένες και εκκαθαρίστηκαν από τον πίνακα παρακολούθησης."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_NONE="Δεν υπήρχαν γραμμές παράκαμψης προς εκκαθάριση."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_ERROR="Δεν ήταν δυνατή η εκκαθάριση του πίνακα παρακολούθησης παρακάμψεων: %s"

COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="Επαναφορά παρακάμψεων για επιθεώρηση"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Έχετε εσείς (ή προηγούμενος προγραμματιστής) εγκρίνει παρακάμψεις στο παρελθόν χωρίς πραγματικό έλεγχο; Πατήστε εδώ για να επιστρέψετε κάθε αρχείο παράκαμψης στον πίνακα παρακολούθησης ώστε να μπορείτε να επιθεωρήσετε σωστά την καθεμία με τον βοηθό τεχνητής νοημοσύνης σας. Χρήσιμο μετά από «Dismiss All» που πραγματοποιήθηκε πριν εγκατασταθεί αυτό το εργαλείο."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Σαρώνει τον φάκελο <code>html/</code> κάθε ενεργοποιημένου προτύπου και εισάγει μια γραμμή στο <code>#__template_overrides</code> για κάθε αρχείο παράκαμψης που δεν παρακολουθείται ήδη. Οι υπάρχουσες γραμμές μένουν αμετάβλητες. Οι επανασημασμένες γραμμές επανεμφανίζονται ως σημάνσεις «Changes found» στη διαχείριση Προτύπων ώστε να μπορείτε να εκτελέσετε τη ροή εργασίας επιθεώρησης παραπάνω."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_BUTTON="Επαναφορά όλων των παρακάμψεων για επιθεώρηση"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="Επαναφορά όλων των παρακάμψεων για επιθεώρηση; Κάθε αρχείο παράκαμψης σε αυτόν τον ιστότοπο θα επανεμφανιστεί στις σημάνσεις «Changes found» των Προτύπων ώστε να επανεκτιμηθεί."

COM_CSOVERRIDECHECKER_RESCAN_SUCCESS="Ο πίνακας παρακολούθησης παρακάμψεων ανακατασκευάστηκε: %1$d γραμμή(ές) εισήχθησαν σε %3$d πρότυπο(α) (%2$d αρχεία σαρώθηκαν)."
COM_CSOVERRIDECHECKER_RESCAN_ERROR="Η ανακατασκευή του πίνακα παρακολούθησης παρακάμψεων απέτυχε: %s"

