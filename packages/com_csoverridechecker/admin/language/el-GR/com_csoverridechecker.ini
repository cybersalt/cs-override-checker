COM_CSOVERRIDECHECKER_APPLY_FIX_REFUSED_UNSAFE="Δεν γράφτηκε τίποτα. Το νέο περιεχόμενο προσθέτει κώδικα που μια διόρθωση δεν επιτρέπεται να προσθέσει σε μια παράκαμψη: %s. Έτσι μοιάζει ο κώδικας που εισάγεται κακόβουλα, γι' αυτό απορρίπτεται ακόμη κι αν το αίτημα φάνηκε λογικό. Αν είστε βέβαιοι ότι η αλλαγή είναι σωστή, ελέγξτε την και κάντε την μόνοι σας στο αρχείο."
COM_CSOVERRIDECHECKER_RESTORE_REFUSED_UNSAFE="Δεν έγινε επαναφορά. Αυτό το αντίγραφο ασφαλείας περιέχει κώδικα που δεν έχει το τρέχον αρχείο: %s. Μπορεί να είναι κερκόπορτα που αφαίρεσε μια διόρθωση, οπότε ένα AI ή μια κλήση API δεν μπορεί να την επαναφέρει. Αν θέλετε αυτή την έκδοση, διαβάστε το αντίγραφο και επαναφέρετέ το από την οθόνη Αντίγραφα ασφαλείας αρχείων."
