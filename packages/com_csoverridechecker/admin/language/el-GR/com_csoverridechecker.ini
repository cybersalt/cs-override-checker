COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_TITLE="Επιβεβαίωση: αποκατάσταση αντιγράφου ασφαλείας"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_BODY="Η αποκατάσταση θα αντικαταστήσει το ζωντανό αρχείο στο %s με το περιεχόμενο του αντιγράφου ασφαλείας που εμφανίζεται παραπάνω. Το τρέχον περιεχόμενο θα αποθηκευτεί πρώτα ως νέο αντίγραφο ασφαλείας, ώστε αυτό να μπορεί να αντιστραφεί."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_AGREE="Κατανοητό: η αποκατάσταση τώρα θα αντικαταστήσει το ζωντανό αρχείο. Το αντίγραφο πριν την αποκατάσταση θα αποθηκευτεί αυτόματα ως νέο αντίγραφο ασφαλείας."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_MODAL_CONFIRM="Ναι — αποκατάσταση"

COM_CSOVERRIDECHECKER_BACKUP_MANUAL_TITLE="Χειροκίνητη αποκατάσταση (FTP / ο επεξεργαστής σας)"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_INTRO="Εάν προτιμάτε να μην αφήσετε την επέκταση να γράψει στον δίσκο:"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="Πατήστε <em>Λήψη αντιγράφου ασφαλείας</em> παραπάνω (ή αντιγράψτε το μπλοκ Περιεχόμενο αντιγράφου ασφαλείας)."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="Ανοίξτε τον πελάτη FTP, τον πελάτη SFTP ή τον Διαχειριστή Αρχείων της φιλοξενίας σας."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="Αντικαταστήστε το αρχείο στην παρακάτω διαδρομή προορισμού με το αντίγραφο που κατεβάσατε."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_DESTINATION="Διαδρομή προορισμού στον διακομιστή"

COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Πού βρίσκεται αυτό το αντίγραφο ασφαλείας"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Το περιεχόμενο των αντιγράφων ασφαλείας αποθηκεύεται στη βάση δεδομένων, όχι στον δίσκο. Συγκεκριμένα, στον πίνακα <code>#__csoverridechecker_backups</code> — η στήλη <code>contents_b64</code> κρατά το περιεχόμενο του αρχείου κωδικοποιημένο σε base64."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="Αυτό σημαίνει ότι ένα αντίγραφο ασφαλείας της βάσης δεδομένων αποτυπώνει επίσης αυτά τα αντίγραφα. Η απεγκατάσταση του στοιχείου διαγράφει τον πίνακα μαζί με όλα τα αποθηκευμένα αντίγραφα ασφαλείας."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>Σχετικά με τη βαθμίδα του Anthropic API σας:</strong> τόσο η αυτοματοποιημένη σάρωση όσο και οι λειτουργίες συνομιλίας προσμετρώνται στο ανά λεπτό όριο tokens της Anthropic. Η προεπιλεγμένη Tier 1 της Anthropic (10.000 input tokens ανά λεπτό) επαρκεί για μία σάρωση μίας εκτέλεσης σε μικρό ιστότοπο, αλλά θα ενεργοποιήσει όριο ρυθμού κατά τις επιδιορθώσεις μέσω συνομιλίας πολλαπλών γύρων. Η Tier 2 (50.000 tokens ανά λεπτό, με χρέωση) είναι άνετη για τις περισσότερες πραγματικές συνεδρίες επιδιορθώσεων. Δείτε την τρέχουσα βαθμίδα σας στο <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Επαναφορά παρακάμψεων για επιθεώρηση"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Επιλέξτε για ποιο ή ποια πρότυπα θα ανακατασκευαστεί ο πίνακας παρακολούθησης παρακάμψεων. Εμφανίζονται μόνο τα ενεργοποιημένα πρότυπα που έχουν φάκελο παρακάμψεων <code>html/</code> στον δίσκο. Τσεκάρετε το <em>Επιλογή όλων</em> για την αρχική συμπεριφορά &ldquo;επαναφορά κάθε προτύπου&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Κανένα ενεργοποιημένο πρότυπο σε αυτόν τον ιστότοπο δεν έχει φάκελο παρακάμψεων <code>html/</code>, οπότε δεν υπάρχει τίποτα προς επαναφορά. Προσθέστε μια παράκαμψη (ή ενεργοποιήστε ένα πρότυπο που έχει παρακάμψεις) και ανοίξτε ξανά αυτό το παράθυρο."
