COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_FINGERPRINT="Αποτύπωμα"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_SAVED="Αποθηκευμένο"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_NOT_SAVED="Μη αποθηκευμένο"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST="Δοκιμή σύνδεσης"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST_INTRO="Στέλνει ένα μικρό δοκιμαστικό αίτημα στον πάροχο %s με χρήση του αποθηκευμένου κλειδιού. Κοστίζει σχεδόν τίποτα — επαληθεύει ότι το κλειδί είναι έγκυρο και προσβάσιμο από αυτόν τον διακομιστή."
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST_BUTTON="Εκτέλεση δοκιμής"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_SYSTEM="Σύστημα"
