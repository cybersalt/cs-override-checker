CS_INTEGRITY_PROBLEMS_TITLE="Η εγκατάσταση δεν ολοκληρώθηκε: λείπουν ή είναι κατεστραμμένα %1$d από %2$d αρχεία."
CS_INTEGRITY_PROBLEMS_BODY="Το %s δεν εγκαταστάθηκε πλήρως, οπότε μέρη του ίσως να μη λειτουργούν. Εγκαταστήστε ξανά το ίδιο πακέτο για να το επιδιορθώσετε. Αν η εγκατάσταση αποτύχει ξανά, ίσως λογισμικό ασφαλείας στον διακομιστή (για παράδειγμα το Imunify360 Proactive Defense) μπλοκάρει το πρόγραμμα εγκατάστασης του Joomla: ελέγξτε το αρχείο καταγραφής περιστατικών του."
