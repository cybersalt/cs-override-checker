COM_CSOVERRIDECHECKER_SESSIONS_TITLE="Cybersalt Override Checker — Συνεδρίες"
COM_CSOVERRIDECHECKER_SESSIONS_INTRO="Κάθε συνεδρία είναι μία επιθεώρηση των επισημασμένων παρακάμψεων αυτού του ιστοτόπου από την τεχνητή νοημοσύνη. Πατήστε σε μια γραμμή για να διαβάσετε την πλήρη αναφορά. Οι συνεδρίες είναι εγγραφές <em>μόνο για ανάγνωση</em> — αποτυπώνουν τι βρήκε η τεχνητή νοημοσύνη, όχι τι κάνατε εσείς (ή η τεχνητή νοημοσύνη) στον ιστότοπο μετά."
