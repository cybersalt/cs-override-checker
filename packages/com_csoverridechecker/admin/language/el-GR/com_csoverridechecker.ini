COM_CSOVERRIDECHECKER_SESSIONFORM_TITLE="Νέα συνεδρία"
COM_CSOVERRIDECHECKER_SESSIONFORM_HEADING="Επικόλληση αναφοράς επιθεώρησης τεχνητής νοημοσύνης"
COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Χειροκίνητη επικόλληση για χρήστες συνομιλίας σε φυλλομετρητή.</strong> Εάν εκτελέσατε το prompt σάρωσης σε μια συνομιλία σε φυλλομετρητή, όπως το ChatGPT, το claude.ai ή το Gemini, αντιγράψτε την απάντηση της τεχνητής νοημοσύνης και επικολλήστε την εδώ για να αποθηκευτεί ως συνεδρία. Εάν χρησιμοποιήσατε έναν πράκτορα τερματικού ή επεξεργαστή κώδικα (Claude Code, Codex, Cursor και παρόμοια), συνήθως δεν χρειάζεστε αυτή τη φόρμα — ο πράκτορας υποβάλλει ο ίδιος την αναφορά στον ιστότοπο. Η συνεδρία ονομάζεται με τη σημερινή χρονοσήμανση από προεπιλογή· αλλάξτε την αν θέλετε."
COM_CSOVERRIDECHECKER_SESSIONFORM_NAME="Όνομα συνεδρίας"
COM_CSOVERRIDECHECKER_SESSIONFORM_NAME_HELP="Από προεπιλογή χρησιμοποιείται η τρέχουσα χρονοσήμανση YYYY-MM-DD-HHMMSS. Χρησιμοποιείται ως η ορατή ετικέτα στο αρχείο συνεδριών."
COM_CSOVERRIDECHECKER_SESSIONFORM_SUMMARY="Περίληψη μίας γραμμής"
COM_CSOVERRIDECHECKER_SESSIONFORM_SUMMARY_PLACEHOLDER="π.χ. 1 εύρημα XSS, 14 στοιχεία απόκλισης θέματος, 1 αισθητικό σφάλμα"
COM_CSOVERRIDECHECKER_SESSIONFORM_REPORT="Αναφορά (Markdown)"
COM_CSOVERRIDECHECKER_SESSIONFORM_REPORT_PLACEHOLDER="Επικολλήστε εδώ την πλήρη αναφορά που παρήγαγε η τεχνητή νοημοσύνη. Θα αποθηκευτεί κατά λέξη και θα εμφανιστεί όταν ανοιχτεί η συνεδρία."
COM_CSOVERRIDECHECKER_SESSIONFORM_SAVE="Αποθήκευση συνεδρίας"

COM_CSOVERRIDECHECKER_ACTIONS_TITLE="Cybersalt Override Checker — Αρχείο καταγραφής ενεργειών"
COM_CSOVERRIDECHECKER_ACTIONS_DESCRIPTION="Κάθε διαχειριστικό συμβάν που άγγιξε τον πίνακα παρακολούθησης παρακάμψεων, το αρχείο συνεδριών ή τα αντίγραφα ασφαλείας αρχείων καταγράφεται εδώ. Μόνο για ανάγνωση."
COM_CSOVERRIDECHECKER_ACTIONS_VS_SESSIONS="Οι <strong>Συνεδρίες</strong> αποθηκεύουν τις αναφορές επιθεώρησης της τεχνητής νοημοσύνης. Το <strong>Αρχείο καταγραφής ενεργειών</strong> είναι το ίχνος ελέγχου των <em>αλλαγών</em> — πότε επαναφέρθηκαν ή εκκαθαρίστηκαν παρακάμψεις, πότε δημιουργήθηκε μια συνεδρία, πότε αποθηκεύτηκε ένα αντίγραφο ασφαλείας πριν από μια επιδιόρθωση. Εάν κάτι πάει στραβά αργότερα σε αυτόν τον ιστότοπο, εδώ θα δείτε τι έγινε και πότε."
COM_CSOVERRIDECHECKER_ACTIONS_EMPTY="Δεν καταγράφηκαν ακόμη ενέργειες."
