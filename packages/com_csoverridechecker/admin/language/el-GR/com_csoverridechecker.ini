COM_CSOVERRIDECHECKER_BACKUPS_VIEW="Προβολή αντιγράφου ασφαλείας"
COM_CSOVERRIDECHECKER_BACKUPS_STORAGE_NOTE="Τα αντίγραφα ασφαλείας αποθηκεύονται στη βάση δεδομένων (πίνακας <code>#__csoverridechecker_backups</code>) ως αντίγραφα του αρχείου κωδικοποιημένα σε base64 τη στιγμή του αντιγράφου ασφαλείας. Κάθε γραμμή κρατά την αρχική διαδρομή, sha256, μέγεθος και πλήρες περιεχόμενο. Δεν εγγράφονται στον δίσκο· κάντε κλικ σε μια γραμμή αντιγράφου ασφαλείας για επιλογές αποκατάστασης ή για να κατεβάσετε το περιεχόμενο."

