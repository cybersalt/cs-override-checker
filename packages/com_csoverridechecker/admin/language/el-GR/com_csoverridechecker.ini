COM_CSOVERRIDECHECKER_BACKUPS_DESCRIPTION="Στιγμιότυπα αρχείων πριν την αλλαγή τους, που η τεχνητή νοημοσύνη (ή εσείς) επρόκειτο να τροποποιήσει. Μόνο για ανάγνωση εδώ· η επέκταση αποθηκεύει αυτόματα ένα στιγμιότυπο πριν από την εφαρμογή κάθε επιδιόρθωσης."
