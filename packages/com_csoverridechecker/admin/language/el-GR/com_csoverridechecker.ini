COM_CSOVERRIDECHECKER_ENABLE_PLUGIN_NEEDS_ADMIN="Η ενεργοποίηση ενός πρόσθετου Joomla είναι αλλαγή που αφορά ολόκληρο τον ιστότοπο, οπότε απαιτεί το δικαίωμα διαχείρισης πρόσθετων του Joomla επιπλέον της πρόσβασης σε αυτό το στοιχείο. Ζητήστε από έναν Υπερχρήστη να ενεργοποιήσει το πρόσθετο ή να παραχωρήσει στην ομάδα σας δικαιώματα Διαχείρισης στα Πρόσθετα."

