COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="Αποκατάσταση του αποθηκευμένου αντιγράφου ασφαλείας πάνω από το ζωντανό αρχείο στο %s; Το τρέχον περιεχόμενο του αρχείου θα αποθηκευτεί πρώτα ως νέο αντίγραφο ασφαλείας, ώστε αυτή η αποκατάσταση να είναι κι αυτή αναστρέψιμη."
