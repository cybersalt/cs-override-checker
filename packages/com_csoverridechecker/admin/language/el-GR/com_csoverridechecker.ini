COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Οδηγός ρύθμισης"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Χρησιμοποιήστε όποια τεχνητή νοημοσύνη έχετε ήδη"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Αυτή η επέκταση δεν είναι δεμένη με μία συγκεκριμένη τεχνητή νοημοσύνη. Ό,τι εκθέτει είναι ένα απλό REST API που προστατεύεται από ένα τυπικό διακριτικό Joomla API, οπότε οποιοσδήποτε βοηθός μπορεί να πραγματοποιήσει ένα αίτημα στο διαδίκτυο είναι σε θέση να εκτελέσει μια επιθεώρηση &mdash; το ίδιο και ένα script που γράφετε εσείς. Αυτή η σελίδα καλύπτει τις πρακτικές διαφορές μεταξύ των επιλογών, ώστε να διαλέξετε μία και να ξεκινήσετε."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Τι πρέπει πράγματι να μπορεί να κάνει ο βοηθός σας"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Αντί να απαριθμήσουμε ποια προϊόντα λειτουργούν &mdash; τα πλάνα και οι δυνατότητες αλλάζουν συνεχώς &mdash; ιδού η πραγματική απαίτηση. Ο βοηθός σας πρέπει να μπορεί να:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Πραγματοποιεί εξερχόμενα αιτήματα HTTPS</strong> προς αυτόν τον ιστότοπο, στέλνοντας μια προσαρμοσμένη κεφαλίδα αιτήματος (<code>X-Joomla-Token</code>). Αυτή είναι η μόνη απαρέγκλιτη απαίτηση."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Στέλνει αιτήματα POST με σώμα JSON</strong>, εάν θέλετε να εφαρμόζει επιδιορθώσεις και όχι μόνο να αναφέρει. Μια επιθεώρηση μόνο για ανάγνωση χρειάζεται μόνο GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Διατηρεί μια αρκετά μεγάλη συνομιλία</strong>, καθώς ανακτά δύο αρχεία για κάθε επισημασμένη παράκαμψη πριν καταλήξει σε ετυμηγορία."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Δεν είστε σίγουροι αν ο δικός σας πληροί τις προϋποθέσεις; Απλώς επικολλήστε το prompt και δείτε. Ένας βοηθός που δεν μπορεί να προσεγγίσει τον ιστότοπό σας θα το πει αμέσως, αντί να αποτύχει σιωπηλά."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Δεν έχει αποθηκευτεί ακόμη διακριτικό Joomla API."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Όποιον βοηθό κι αν επιλέξετε, χρειάζεται ένα διακριτικό Joomla API για να διαβάσει τα αρχεία παρακάμψεών σας. Δημιουργήστε ένα στο <em>Σύστημα &rarr; Διαχείριση &rarr; Χρήστες &rarr; ο χρήστης σας &rarr; Διακριτικό Joomla API</em> και έπειτα είτε επικολλήστε το στο prompt κάθε φορά είτε αποθηκεύστε το εδώ ώστε το prompt να συμπληρώνεται αυτόματα."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Συνιστάται"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Πιο συνηθισμένο"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Ιδανικό για πολλούς ιστοτόπους"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Λειτουργεί, με επιφυλάξεις"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Προχωρημένο"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Πράκτορες τερματικού και επεξεργαστή κώδικα"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Για παράδειγμα: Claude Code, Codex CLI, Cursor, λειτουργία πράκτορα του GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="Η πιο ομαλή επιλογή, και αυτή που θα προτείναμε αν έχετε κάποιον διαθέσιμο. Εκτελούνται στο δικό σας μηχάνημα με απεριόριστη εξερχόμενη πρόσβαση δικτύου, χωρίς λίστα επιτρεπόμενων sandbox και χωρίς χρονικό όριο αιτήματος φυλλομετρητή, οπότε μια μεγάλη επιθεώρηση τρέχει από την αρχή ως το τέλος χωρίς επιτήρηση."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Αντιγράψτε το prompt σάρωσης από τον Πίνακα ελέγχου."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Επικολλήστε το στον πράκτορά σας και στείλτε. Δεν απαιτείται καμία ρύθμιση."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Όταν εμφανιστεί η αναφορά, απαντήστε στην ίδια συνεδρία αναφέροντας τους αριθμούς των ευρημάτων που θέλετε να επιδιορθωθούν."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Βοηθοί συνομιλίας σε φυλλομετρητή"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Για παράδειγμα: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Όλοι αυτοί λειτουργούν, εφόσον ο λογαριασμός και η λειτουργία που χρησιμοποιείτε μπορούν πράγματι να προσεγγίσουν το διαδίκτυο. Αυτή είναι η πιο συνηθισμένη διάταξη και απολύτως επαρκής για έναν κανονικό ιστότοπο."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Βεβαιωθείτε ότι η πρόσβαση στο διαδίκτυο ή η περιήγηση είναι ενεργοποιημένη για τη συνομιλία. Ορισμένες βαθμίδες και ορισμένες λειτουργίες απαντούν μόνο από μνήμη."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Επικολλήστε το prompt σάρωσης από τον Πίνακα ελέγχου και στείλτε."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Εάν ο ιστότοπός σας έχει πολλές παρακάμψεις, ζητήστε του να τις επεξεργαστεί σε παρτίδες, ώστε μία μεμονωμένη απάντηση να μην ξεπεράσει το χρονικό όριο αιτήματος του φυλλομετρητή."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Προσέξτε τις εικασίες που παρουσιάζονται με βεβαιότητα.</strong> Εάν ο βοηθός αρχίσει να παράγει ευρήματα χωρίς ποτέ να παραθέτει πραγματικό περιεχόμενο αρχείων, δεν μπορεί να προσεγγίσει τον ιστότοπό σας και τα επινοεί. Σταματήστε και ελέγξτε τη συνδεσιμότητά του αντί να εμπιστευτείτε την αναφορά. <strong>Ειδικά για το Claude.ai:</strong> εάν απαντήσει &ldquo;Host not in allowlist&rdquo;, προσθέστε τον τομέα αυτού του ιστοτόπου στο <em>Settings &rarr; Capabilities &rarr; Code execution &rarr; Network access</em> και έπειτα ξεκινήστε νέα συνομιλία &mdash; η τρέχουσα διατηρεί την παλιά λίστα επιτρεπόμενων."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Προσαρμοσμένα GPT, Gems και άλλοι παραμετροποιήσιμοι βοηθοί"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Για παράδειγμα: ένα προσαρμοσμένο GPT με Actions, ένα Gemini Gem, ή οποιοσδήποτε βοηθός σας επιτρέπει να δηλώσετε το δικό σας API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Εάν η πλατφόρμα σας επιτρέπει να ορίσετε έναν βοηθό με δικές του ενέργειες API, δηλώστε μία φορά τα άκρα που ακολουθούν και παρακάμψτε εντελώς το βήμα της αντιγραφής-επικόλλησης. Αυτή είναι η πιο τακτοποιημένη επιλογή αν φροντίζετε αρκετούς ιστοτόπους Joomla, επειδή ο βοηθός θυμάται τη ρύθμιση μεταξύ συνομιλιών."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Δημιουργήστε έναν νέο προσαρμοσμένο βοηθό και προσθέστε μια ενέργεια API που δείχνει στη διεύθυνση URL άκρου που εμφανίζεται πιο κάτω σε αυτή τη σελίδα."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Ορίστε το όνομα της κεφαλίδας πιστοποίησης σε <code>X-Joomla-Token</code> και επικολλήστε το διακριτικό Joomla API σας ως τιμή."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Επικολλήστε το prompt σάρωσης από τον Πίνακα ελέγχου στις οδηγίες του βοηθού, ώστε να γνωρίζει τους κανόνες ταξινόμησης και τη μορφή της αναφοράς."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Τοπικά και ιδιοφιλοξενούμενα μοντέλα"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Για παράδειγμα: Ollama, LM Studio, llama.cpp, ή οποιοδήποτε ιδιοφιλοξενούμενο μοντέλο με κλήση εργαλείων"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Οτιδήποτε διαθέτει κλήση εργαλείων και πρόσβαση στο δίκτυο θα λειτουργήσει μηχανικά, και τίποτα δεν φεύγει από τη δική σας υποδομή, κάτι που ορισμένοι ιστότοποι θα προτιμήσουν."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Ενεργοποιήστε την κλήση εργαλείων ή συναρτήσεων και επιβεβαιώστε ότι το μοντέλο μπορεί να προσεγγίσει αυτόν τον ιστότοπο μέσω HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Επικολλήστε το prompt σάρωσης ως system prompt και έπειτα ζητήστε του να ξεκινήσει."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Να είστε ρεαλιστές ως προς το μέγεθος του μοντέλου.</strong> Η επιθεώρηση μιας παράκαμψης είναι εργασία κρίσης, όχι απλής αναζήτησης. Ένα μικρό τοπικό μοντέλο θα παραγάγει ευχαρίστως μια αναφορά, αλλά είναι πολύ πιθανότερο να προσπεράσει μια πραγματική οπισθοδρόμηση ασφαλείας ή να επινοήσει μία που δεν υπάρχει. Αντιμετωπίστε τα ευρήματα ενός μικρού μοντέλου ως πρώτο πέρασμα, όχι ως ετυμηγορία."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="Πελάτες MCP"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Οποιοσδήποτε βοηθός μιλάει το Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Αν ο βοηθός σας υποστηρίζει MCP, εγκαταστήστε το <strong>MCP for J</strong> και το δωρεάν πρόσθετό του <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Ο βοηθός ελέγχει και διορθώνει τότε τις παρακάμψεις με τα δικά του εργαλεία, χωρίς αντιγραφή και επικόλληση. Είναι επίσης η καλύτερη λύση για συνομιλίες σε πρόγραμμα περιήγησης που υποστηρίζουν συνδέσεις MCP, επειδή αποφεύγει το χρονικό όριο των αιτημάτων. Και τα δύο είναι ξεχωριστές, δωρεάν επεκτάσεις."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Η Μέθοδος 2 είναι η μοναδική εξαίρεση"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Το κουμπί <em>Εκτέλεση αυτοματοποιημένης σάρωσης</em> του Πίνακα ελέγχου εκτελεί ολόκληρη την επιθεώρηση από την πλευρά του διακομιστή, χωρίς αντιγραφή-επικόλληση. Επιλέξτε τον πάροχό σας στις <em>Επιλογές</em> και αποθηκεύστε το κλειδί API αυτού του παρόχου &mdash; <strong>σαρώσεις εκτελούν και οι τρεις: Anthropic, OpenAI και Google Gemini</strong>. Το μόνο που παραμένει αποκλειστικά για Anthropic είναι η επακόλουθη συνομιλία σε μια συνεδρία, όπου του ζητάτε να εφαρμόσει επιδιορθώσεις και επεξεργάζεται αρχεία μέσω κλήσεων εργαλείων· αυτός ο βρόχος έχει γραφτεί για το πρωτόκολλο κλήσης εργαλείων της Anthropic. Με επιλεγμένο το OpenAI ή το Gemini λαμβάνετε την πλήρη αναφορά και μπορείτε να εφαρμόσετε τις επιδιορθώσεις μόνοι σας με το prompt αντιγραφής-επικόλλησης της Μεθόδου 1, που λειτουργεί με οποιαδήποτε τεχνητή νοημοσύνη."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="Το κλειδί για %s αποθηκεύτηκε &mdash; η Μέθοδος 2 είναι διαθέσιμη"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Δεν έχει αποθηκευτεί κλειδί API για τον πάροχο τεχνητής νοημοσύνης σας &mdash; η Μέθοδος 1 εξακολουθεί να λειτουργεί"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Άκρο και πιστοποίηση"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Ό,τι κάνει το διαχειριστικό περιβάλλον είναι διαθέσιμο σε αυτή τη βασική διεύθυνση URL. Χρησιμοποιήστε την όταν δηλώνετε έναν προσαρμοσμένο βοηθό ή όταν γράφετε δικό σας script ή πράκτορα."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Το Joomla δεν δέχεται <code>Authorization: Bearer</code> σε αυτές τις διαδρομές.</strong> Πρέπει να στέλνετε το διακριτικό στην κεφαλίδα <code>X-Joomla-Token</code>. Μια κεφαλίδα σε μορφή Bearer επιστρέφει 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Πλήρης τεκμηρίωση"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Πλήρης αναφορά άκρων, μορφή αναφοράς, αντιμετώπιση προβλημάτων και συχνές ερωτήσεις."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Διαβάστε την τεκμηρίωση"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Λήψη βοήθειας"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Αυτή η επέκταση είναι δωρεάν, και παραμένει δωρεάν"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Δεν υπάρχει έκδοση Pro, ούτε κλειδί άδειας, ούτε κάποια δυνατότητα που να κρατείται πίσω. Ό,τι μπορεί να κάνει η επέκταση είναι μπροστά σας. Θα θέλαμε παρ' όλα αυτά πολύ να έχουμε νέα σας &mdash; τα σχόλια από πραγματικούς ιστοτόπους είναι αυτά που έχουν διαμορφώσει κάθε έκδοση μέχρι σήμερα."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Τι να περιμένετε."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Η Cybersalt είναι μια μικρή εταιρεία και αυτή η επέκταση διατίθεται χωρίς χρέωση, οπότε η δωρεάν υποστήριξη προσφέρεται όσο επιτρέπει ο χρόνος γύρω από τη δουλειά με πελάτες. Πρόκειται για πραγματικό περιορισμό και όχι για υπεκφυγή &mdash; προτιμούμε να το πούμε ξεκάθαρα παρά να σας αφήσουμε να περιμένετε μια υπόσχεση που δεν μπορούμε να τηρήσουμε. Οι αναφορές σφαλμάτων εξετάζονται· η ανοιχτού τύπου βοήθεια σε θέματα παραμετροποίησης ενδέχεται όχι."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Πού να τα στείλετε"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Αναφορές σφαλμάτων, μπερδεμένες διατυπώσεις, ένα εύρημα που η τεχνητή νοημοσύνη έκρινε λάθος, μια ροή εργασίας που η επέκταση δεν καλύπτει, ή ένας βοηθός που συμπεριφέρθηκε απροσδόκητα &mdash; όλα είναι χρήσιμα."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Αναφορά ζητήματος στο GitHub"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Διαβάστε την τεκμηρίωση"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="Τα GitHub Issues είναι το καλύτερο μέρος για οτιδήποτε αναπαράγεται, επειδή είναι δημόσια &mdash; ο επόμενος με το ίδιο πρόβλημα βρίσκει την απάντηση αντί να ρωτήσει ξανά."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Τι να περιλάβετε"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Θα λάβετε ταχύτερη απάντηση αν μας βοηθήσετε να παραλείψουμε τη διάγνωση:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="Το <strong>μπλοκ διαγνωστικών</strong> από αυτή τη σελίδα (περιέχει τις εκδόσεις Joomla, PHP και επέκτασης σε μία επικόλληση)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Ποια μέθοδο</strong> χρησιμοποιήσατε &mdash; το prompt αντιγραφής-επικόλλησης, την αυτοματοποιημένη σάρωση ή δικό σας κώδικα &mdash; και <strong>ποιον βοηθό τεχνητής νοημοσύνης</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Τι <strong>περιμένατε</strong> να συμβεί και τι συνέβη <strong>στην πραγματικότητα</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Εάν η τεχνητή νοημοσύνη έκρινε λάθος ένα εύρημα, την <strong>αποθηκευμένη αναφορά συνεδρίας</strong> &mdash; χρησιμοποιήστε τη <em>Λήψη αναφοράς</em> στη σελίδα της συνεδρίας. Αυτό μας δίνει τα ακριβή ευρήματα και το σκεπτικό για να τα εξετάσουμε."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Οι ιδέες είναι επίσης ευπρόσδεκτες"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Εάν η επέκταση σχεδόν κάνει αυτό που χρειάζεστε αλλά όχι ακριβώς, πείτε μας το. Αρκετές δυνατότητες κυκλοφόρησαν επειδή ένας άνθρωπος περιέγραψε μια ροή εργασίας που δεν είχαμε σκεφτεί."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Διαγνωστικά"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Αντιγράψτε το στην αναφορά σας ώστε να μη χρειαστεί να ρωτήσουμε."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Αντιγραφή διαγνωστικών"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Αυτό το μπλοκ δεν περιέχει μυστικά. Καταγράφει μόνο εάν ένα κλειδί ή διακριτικό είναι αποθηκευμένο, ποτέ την τιμή του."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Εμφάνιση σε {seconds}δ"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Καθυστέρηση εμφάνισης με κράτημα (δευτερόλεπτα)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Τα κλειδιά και τα διακριτικά που εμφανίζονται σε αυτή την επέκταση είναι θολωμένα από προεπιλογή, ώστε μια κοινή χρήση οθόνης, μια βιντεοσκόπηση οθόνης ή μια ματιά πάνω από τον ώμο σας να μην τα διαρρεύσει. Κρατήστε τον δείκτη πάνω από μια θολωμένη τιμή για τόσα δευτερόλεπτα και αυτή αποκαλύπτεται· μια αντίστροφη μέτρηση σάς δείχνει ότι ο χρονομετρητής τρέχει. Η απομάκρυνση την ακυρώνει. Προεπιλογή <strong>3</strong>. Ορίστε το σε <strong>0</strong> για άμεση εμφάνιση με τη στάθμευση του δείκτη, κάτι που καταργεί την προστασία από έναν δείκτη που απλώς περνά πάνω από την τιμή."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Αυτόματη απόκρυψη μετά την εμφάνιση (δευτερόλεπτα)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Μόλις μια τιμή αποκαλυφθεί, θολώνεται ξανά μετά από τόσα δευτερόλεπτα, ακόμη κι αν ο δείκτης βρίσκεται ακόμη πάνω της. Καλύπτει την περίπτωση όπου ρίχνετε μια ματιά σε ένα κλειδί και στη συνέχεια διακόπτεστε, αφήνοντάς το εκτεθειμένο σε μια οθόνη χωρίς επιτήρηση. Προεπιλογή <strong>8</strong>. Ορίστε το σε <strong>0</strong> για να παραμένει ορατό μέχρι να απομακρυνθείτε."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Πάροχος τεχνητής νοημοσύνης"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Ποια υπηρεσία τεχνητής νοημοσύνης καλεί το ενσωματωμένο κουμπί <em>Εκτέλεση αυτοματοποιημένης σάρωσης</em>. Παρέχετε το δικό σας κλειδί για όποια επιλέξετε και χρησιμοποιείται μόνο από αυτόν τον ιστότοπο. Αυτή η ρύθμιση <strong>δεν</strong> επηρεάζει τη ροή εργασίας του prompt αντιγραφής-επικόλλησης &mdash; εκείνη λειτουργεί με οποιαδήποτε τεχνητή νοημοσύνη και δεν χρειάζεται κανένα κλειδί."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Και οι τρεις πάροχοι μπορούν να εκτελέσουν σάρωση.</strong> Η επακόλουθη συνομιλία σε μια συνεδρία &mdash; όπου του ζητάτε να εφαρμόσει επιδιορθώσεις και επεξεργάζεται αρχεία μέσω κλήσεων εργαλείων &mdash; είναι προς το παρόν <strong>μόνο για Anthropic</strong>, επειδή αυτός ο βρόχος έχει γραφτεί για το πρωτόκολλο κλήσης εργαλείων της Anthropic. Με επιλεγμένο τον OpenAI ή το Gemini λαμβάνετε και πάλι την πλήρη αναφορά· για να εφαρμοστούν οι επιδιορθώσεις για εσάς, είτε αλλάξτε αυτή τη ρύθμιση σε Anthropic είτε χρησιμοποιήστε τη ροή εργασίας του prompt αντιγραφής-επικόλλησης, που λειτουργεί με οποιαδήποτε τεχνητή νοημοσύνη."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="Κλειδί OpenAI API"
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_DESC="Το προσωπικό σας κλειδί OpenAI API (αρχίζει με <code>sk-</code>). Αποκτήστε ένα από το <a href=\"https://platform.openai.com/api-keys\" target=\"_blank\" rel=\"noopener\">platform.openai.com</a>. Αποθηκεύεται σε αυτόν τον διακομιστή και χρησιμοποιείται μόνο για την κλήση του api.openai.com εκ μέρους σας."
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_LABEL="Κλειδί Google Gemini API"
COM_CSOVERRIDECHECKER_CONFIG_GEMINI_API_KEY_DESC="Το προσωπικό σας κλειδί API του Google AI Studio. Αποκτήστε ένα από το <a href=\"https://aistudio.google.com/apikey\" target=\"_blank\" rel=\"noopener\">aistudio.google.com</a>. Αποθηκεύεται σε αυτόν τον διακομιστή και χρησιμοποιείται μόνο για την κλήση του Gemini API εκ μέρους σας."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5="GPT-5 — πιο ικανό, προεπιλογή."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GPT5_MINI="GPT-5 mini — ταχύτερο και φθηνότερο. Κατάλληλο για σαρώσεις χαμηλής κρισιμότητας."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_PRO="Gemini 2.5 Pro — πιο ικανό, προεπιλογή."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_GEMINI_FLASH="Gemini 2.5 Flash — ταχύτερο και φθηνότερο. Κατάλληλο για σαρώσεις χαμηλής κρισιμότητας."
COM_CSOVERRIDECHECKER_ERROR_NO_KEY_FOR_PROVIDER="Δεν έχει αποθηκευτεί κλειδί API για %s. Προσθέστε ένα στις Επιλογές ή αλλάξτε πάροχο."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_FORBIDDEN="Δεν έχετε δικαίωμα ανάκτησης διακριτικού API. Αυτή η ενέργεια απαιτεί το δικαίωμα εγγραφής του Override Checker."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_USER="Δεν ήταν δυνατός ο εντοπισμός συνδεδεμένου χρήστη, οπότε δεν υπάρχει διακριτικό προς ανάκτηση."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_PLUGIN_DISABLED="Το πρόσθετο <strong>Χρήστης - Διακριτικό Joomla API</strong> είναι απενεργοποιημένο, οπότε το Joomla δεν μπορεί ακόμη να εκδώσει διακριτικό API. Ενεργοποιήστε το και δοκιμάστε ξανά."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_API_AUTH_DISABLED="Το διακριτικό σας εκδόθηκε, αλλά το πρόσθετο <strong>Πιστοποίηση API - Διακριτικό Joomla API</strong> είναι απενεργοποιημένο, οπότε το Joomla θα απορρίπτει το διακριτικό στα εισερχόμενα αιτήματα API μέχρι να ενεργοποιήσετε και αυτό το πρόσθετο."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_GROUP_NOT_ALLOWED="Οι ομάδες χρηστών σας δεν βρίσκονται στη λίστα επιτρεπόμενων του πρόσθετου Χρήστης - Διακριτικό Joomla API, οπότε το Joomla δεν θα σας εκδώσει διακριτικό. Προσθέστε μία από τις ομάδες σας στη ρύθμιση Επιτρεπόμενες Ομάδες Χρηστών αυτού του πρόσθετου."
COM_CSOVERRIDECHECKER_FETCH_TOKEN_NO_SECRET="Αυτός ο ιστότοπος δεν έχει ορισμένο secret στο configuration.php, οπότε δεν είναι δυνατή η παραγωγή διακριτικού API."
