COM_CSOVERRIDECHECKER_FIELD_APIKEY_CLEAR_TITLE="Εκκενώστε αυτό το πεδίο. Η αλλαγή δεν αποθηκεύεται μέχρι να πατήσετε Αποθήκευση στη γραμμή εργαλείων."
COM_CSOVERRIDECHECKER_FIELD_APIKEY_HELP_DEFAULT="Βοήθεια"
COM_CSOVERRIDECHECKER_FIELD_GET_JOOMLA_TOKEN="Λήψη διακριτικού"

COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Μέθοδος 1: Χρήση του βοηθού τεχνητής νοημοσύνης σας"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Αντιγράψτε ένα έτοιμο prompt και επικολλήστε το σε όποιον βοηθό τεχνητής νοημοσύνης χρησιμοποιείτε — ChatGPT, Claude, Gemini, Copilot, Cursor ή ένα τοπικό μοντέλο. Λειτουργεί χωρίς κλειδί API. Μεταβαίνει στο prompt παρακάτω."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Μέθοδος 2: Εκτέλεση αυτοματοποιημένης σάρωσης"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Εκτελέστε την επιθεώρηση των παρακάμψεων σε αυτόν τον διακομιστή με το αποθηκευμένο σας κλειδί API για %s. Αποθηκεύει την αναφορά ως συνεδρία. Μεταβαίνει στο κουμπί εκτέλεσης παρακάτω."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Επιλέξτε πρώτα έναν πάροχο τεχνητής νοημοσύνης και αποθηκεύστε το κλειδί API του στον πίνακα Επιλογών για να ενεργοποιηθούν οι αυτοματοποιημένες σαρώσεις. Έως τότε, χρησιμοποιήστε τη Μέθοδο 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Σαρώστε ξανά κάθε ενεργοποιημένο πρότυπο και ανακατασκευάστε τον πίνακα παρακολούθησης παρακάμψεων. Χρησιμοποιήστε το μετά από επεξεργασία αρχείων προτύπου εκτός Joomla, ή εάν ο πίνακας παρακολούθησης του Joomla δεν είναι ενημερωμένος."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Κλειδιά &amp; διακριτικά"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Προαιρετικό. Επιλέξτε έναν πάροχο τεχνητής νοημοσύνης και αποθηκεύστε εδώ το κλειδί API του ώστε η επέκταση να μπορεί να εκτελεί σαρώσεις αυτόματα, χωρίς prompt αντιγραφής-επικόλλησης. Αφήστε το κενό για να συνεχίσετε να χρησιμοποιείτε το prompt αντιγραφής-επικόλλησης στον πίνακα ελέγχου με όποια τεχνητή νοημοσύνη ήδη χρησιμοποιείτε."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Κλειδί Anthropic API"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Το προσωπικό σας κλειδί Anthropic API (αρχίζει με <code>sk-ant-…</code>). Αποκτήστε ένα από το <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. Το κλειδί αποθηκεύεται σε αυτόν τον διακομιστή και χρησιμοποιείται μόνο για την κλήση του api.anthropic.com εκ μέρους σας. Με αποθηκευμένο κλειδί, ο πίνακας ελέγχου εκθέτει ένα κουμπί <em>Εκτέλεση αυτοματοποιημένης σάρωσης</em> που αναθέτει την επιθεώρηση παρακάμψεων στο Claude από την πλευρά του διακομιστή και αποθηκεύει την αναφορά ως συνεδρία — χωρίς να απαιτείται αντιγραφή-επικόλληση."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Κάθε αυτοματοποιημένη σάρωση πραγματοποιεί μία κλήση API στον πάροχο που έχετε επιλέξει, με χρέωση σύμφωνα με τις τιμές του παρόχου για το επιλεγμένο μοντέλο. Σε ιστοτόπους με πολύ μεγάλο αριθμό παρακάμψεων εφαρμόζεται όριο ανά εκτέλεση (δείτε <em>Παρακάμψεις ανά σάρωση</em> παρακάτω)· εκτελέστε ξανά για τις υπόλοιπες ή χρησιμοποιήστε το prompt αντιγραφής-επικόλλησης στον πίνακα ελέγχου για απεριόριστο μέγεθος."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Μοντέλο σάρωσης"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Μοντέλο που χρησιμοποιείται για την κλήση μίας εκτέλεσης <em>Εκτέλεση αυτοματοποιημένης σάρωσης</em> στον πίνακα ελέγχου. Η σάρωση είναι εργασία ταξινόμησης (ειδοποίηση / προς επανεξέταση / πληροφοριακή ανά εύρημα). <strong>Το πιο ικανό μοντέλο είναι η προεπιλογή</strong> &mdash; η πιο ενδελεχής επανεξέταση και ο ασφαλέστερος ταξινομητής για ευρήματα που απαιτούν λεπτή κρίση. Τα μικρότερα μοντέλα διεκπεραιώνουν ικανοποιητικά τις συνήθεις σαρώσεις με κλάσμα του κόστους και αρκούν για σαρώσεις χαμηλής κρισιμότητας σε μικρούς ιστοτόπους."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Μοντέλο συνομιλίας"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Μοντέλο Claude που χρησιμοποιείται για τη συνομιλία-με-Claude στη σελίδα λεπτομερειών συνεδρίας (όπου ζητάτε από το Claude να εφαρμόσει επιδιορθώσεις ή να απορρίψει ευρήματα). Η χρήση εργαλείων είναι πιο απαιτητική από την ταξινόμηση. <strong>Το Opus είναι η προεπιλογή</strong> &mdash; η πιο αξιόπιστη συμπεριφορά χρήσης εργαλείων και ο χαμηλότερος κίνδυνος εσφαλμένης εφαρμογής επιδιόρθωσης. Το Sonnet είναι ένας καλός μέσος όρος για ιστοτόπους με πολλές επόμενες ενέργειες χαμηλής κρισιμότητας· το Haiku μπορεί να δυσκολευτεί με ακολουθίες πολλαπλών βημάτων εργαλείων και δεν συνιστάται για το μοντέλο συνομιλίας, εκτός αν το κόστος είναι το κορυφαίο κριτήριο."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Διακριτικό Joomla API (για το prompt του πίνακα ελέγχου)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Προαιρετικό. Δημιουργήστε ένα διακριτικό Joomla API στο <em>Σύστημα &rarr; Χρήστες &rarr; Το προφίλ μου &rarr; Διακριτικό Joomla API</em> και επικολλήστε το εδώ. Τα prompts σάρωσης / επιδιόρθωσης του πίνακα ελέγχου θα συμπληρώνουν αυτόματα το διακριτικό στη θέση του placeholder &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, ώστε να μπορείτε να αντιγράφετε &amp; επικολλάτε απευθείας στον βοηθό τεχνητής νοημοσύνης σας χωρίς επεξεργασία.<br><br><strong>Επισήμανση για πολλαπλούς διαχειριστές:</strong> Τα διακριτικά Joomla API πιστοποιούν ως <em>τον χρήστη που τα δημιούργησε</em>. Εάν πολλοί διαχειριστές χρησιμοποιούν αυτόν τον πίνακα ελέγχου, το prompt θα χρησιμοποιεί όποιο διακριτικό είναι αποθηκευμένο εδώ &mdash; που σημαίνει ότι η τεχνητή νοημοσύνη θα καλεί το API πιστοποιώντας ως αυτόν τον έναν χρήστη. Αφήστε το κενό για να επικολλά κάθε διαχειριστής το δικό του διακριτικό κατά τη χρήση."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Παρακάμψεις ανά σάρωση"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Πόσες επισημασμένες παρακάμψεις προτύπου επιθεωρεί το κουμπί <em>Εκτέλεση αυτοματοποιημένης σάρωσης</em> σε μία κλήση API. Προεπιλογή <strong>10</strong>. Εύρος 1&ndash;100. <strong>Χαμηλότερη τιμή είναι ασφαλέστερη για επόμενη συνομιλία:</strong> η αναφορά σάρωσης μεγαλώνει με τον αριθμό των ευρημάτων και ο βρόχος χρήσης εργαλείων στη συνομιλία διατηρεί την αναφορά ως ιστορικό συνομιλίας. Σε χαμηλές βαθμίδες ορίων ρυθμού (η Tier 1 της Anthropic επιτρέπει 10K input tokens ανά λεπτό), μια σάρωση 60 παρακάμψεων συν μια άμεση συνομιλία εντός του ίδιου λεπτού θα επιστρέψει <em>HTTP 429: rate limit exceeded</em>. Με 10 παρακάμψεις ανά εκτέλεση, οι συνομιλίες μετά τη σάρωση παραμένουν άνετα κάτω από το όριο. Σε ιστοτόπους με περισσότερες παρακάμψεις χρειάζονται απλώς λίγες επανεκτελέσεις για να καλυφθούν όλες &mdash; η αναφορά κάθε εκτέλεσης αποθηκεύεται ως ξεχωριστή συνεδρία, οπότε μπορείτε να επεξεργαστείτε την καθεμία ανεξάρτητα."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — το ταχύτερο και φθηνότερο. Κατάλληλο για σαρώσεις χαμηλής κρισιμότητας σε μικρούς ιστοτόπους."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — ισορροπημένο. Διεκπεραιώνει ικανοποιητικά τις συνήθεις σαρώσεις με κλάσμα του κόστους του Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — το πιο ικανό, προεπιλογή. Ο ασφαλέστερος ταξινομητής για ευρήματα που απαιτούν λεπτή κρίση."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>Σχετικά με τη διαφορά κόστους.</strong> <strong>Κατά τη συγγραφή του παρόντος</strong>, μια τυπική σάρωση σε ιστότοπο με 50 παρακάμψεις χρησιμοποιεί περίπου 60K input tokens και παράγει περίπου 5K output tokens. Κατά προσέγγιση κόστος ανά σάρωση: <strong>~$0,08 σε Haiku, ~$0,23 σε Sonnet, ~$1,13 σε Opus</strong>. Οι συνομιλίες είναι πολύ μικρότερες (5K&ndash;10K input tokens η καθεμία), οπότε το κόστος ανά συνομιλία είναι περίπου 10&times; μικρότερο από μια σάρωση. Η δημοσιευμένη τιμολόγηση της Anthropic είναι η αυθεντική πηγή στο <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; οι παραπάνω αριθμοί είναι κατά προσέγγιση και μπορεί να μεταβληθούν με τον χρόνο. Παρακολουθήστε τη χρήση σας στο <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> για μερικές εκτελέσεις πριν αποφασίσετε αν θα υποβαθμίσετε από την προεπιλογή Opus σε φθηνότερη βαθμίδα."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Πλοήγηση στοιχείου"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Μέθοδος 2: Εκτέλεση αυτοματοποιημένης σάρωσης (με χρήση του αποθηκευμένου κλειδιού API για %s)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Δεν έχει αποθηκευτεί κλειδί API για %s."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="Το κλειδί API αποθηκεύτηκε."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Η επέκταση θα εκτελέσει την επιθεώρηση παρακάμψεων στον διακομιστή χρησιμοποιώντας το αποθηκευμένο κλειδί API σας, χωρίς να απαιτείται αντιγραφή-επικόλληση. Η αναφορά αποθηκεύεται αυτόματα ως νέα συνεδρία."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Πατήστε παρακάτω για να ξεκινήσετε μια σάρωση. Η επέκταση ανακτά κάθε επισημασμένη παράκαμψη σε αυτόν τον ιστότοπο, την αποστέλλει στον πάροχο τεχνητής νοημοσύνης σας με το αποθηκευμένο κλειδί API σας και αποθηκεύει την προκύπτουσα αναφορά ως νέα συνεδρία. Θα ανακατευθυνθείτε στην αναφορά όταν ολοκληρωθεί."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Μία κλήση API ανά σάρωση. Σε ιστοτόπους με περισσότερες από %d παρακάμψεις εφαρμόζεται όριο στις πρώτες %d ανά εκτέλεση (διαμορφώσιμο στο <em>Επιλογές &rarr; Κλειδιά &amp; διακριτικά &rarr; Παρακάμψεις ανά σάρωση</em>)· εκτελέστε ξανά για την επόμενη παρτίδα ή χρησιμοποιήστε το prompt αντιγραφής-επικόλλησης της Μεθόδου 1 για απεριόριστο μέγεθος. Η σελίδα μπορεί να κάνει παύση 30&ndash;90 δευτερολέπτων όσο απαντά η τεχνητή νοημοσύνη &mdash; αυτό είναι φυσιολογικό, μην απομακρυνθείτε."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Αυτό θα καλέσει το %s API με το αποθηκευμένο σας κλειδί και μπορεί να διαρκέσει 30 έως 90 δευτερόλεπτα. Συνέχεια;"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Εκτέλεση αυτοματοποιημένης σάρωσης τώρα"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Αυτή η μέθοδος εκτελεί ολόκληρη την ανασκόπηση από την πλευρά του διακομιστή &mdash; χωρίς αντιγραφή-επικόλληση, χωρίς δεύτερο παράθυρο. Πατήστε το κουμπί <em>Επιλογές</em> ακριβώς από κάτω, επιλέξτε τον πάροχο τεχνητής νοημοσύνης σας στην καρτέλα <em>Κλειδιά και διακριτικά</em>, επικολλήστε το κλειδί API του και Αποθηκεύστε. Το κλειδί παραμένει στη βάση δεδομένων του ιστοτόπου σας· μόνο αυτός ο ιστότοπος μπορεί να το χρησιμοποιήσει. Η Μέθοδος 1 παραπάνω εξακολουθεί να λειτουργεί χωρίς κλειδί API εάν προτιμάτε τη ροή εργασίας αντιγραφής-επικόλλησης."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Εκτέλεση αυτοματοποιημένης σάρωσης…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Πραγματοποιείται κλήση στο %s API και ανάλυση των παρακάμψεών σας. Συνήθως διαρκεί 30 έως 90 δευτερόλεπτα. Παρακαλούμε μην κλείσετε αυτό το παράθυρο."

COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_BUTTON="Διαγνωστικά"
COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TITLE="Διαγνωστικά"
