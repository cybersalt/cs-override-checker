COM_CSOVERRIDECHECKER_SESSION_CHAT_TITLE="Pokračovat s Claude"
COM_CSOVERRIDECHECKER_SESSION_CHAT_INTRO="Řekněte Claude, co dělat dál. U nálezů, které jste potvrdili ve zprávě výše, řekněte něco jako <em>&ldquo;oprav #1 a #3, zbytek zamítni&rdquo;</em>. Claude provede práci na straně serveru a do tohoto vlákna doplní, co provedl. Každá aplikace opravy nejprve automaticky zazálohuje původní soubor, takže cokoli lze vrátit zpět ze zobrazení Zálohy souborů."
COM_CSOVERRIDECHECKER_SESSION_CHAT_PLACEHOLDER="Řekněte Claude, co opravit nebo zamítnout…"
COM_CSOVERRIDECHECKER_SESSION_CHAT_SEND="Odeslat Claude"
COM_CSOVERRIDECHECKER_SESSION_CHAT_CALLED="Voláno:"
COM_CSOVERRIDECHECKER_SESSION_CHAT_NOKEY="Pokud chcete chatovat s Claude přímo z této administrace a nechat jej aplikovat opravy za vás, uložte Anthropic API klíč pod tlačítkem <em>Možnosti</em> na nástěnce (záložka Klíče &amp; tokeny). Tento chat funguje pouze přes Anthropic, ať pro skeny používáte kteréhokoli poskytovatele. Jinak použijte prompt ke zkopírování na nástěnce s jakoukoli AI, abyste s touto zprávou pracovali."
COM_CSOVERRIDECHECKER_SESSION_CHAT_LOADING_TITLE="Dotazuji se Claude…"
COM_CSOVERRIDECHECKER_SESSION_CHAT_LOADING_BODY="Claude čte vaši zprávu a může na straně serveru spouštět nástroje pro aplikaci oprav nebo zamítnutí. To může trvat až minutu. Prosím, nezavírejte toto okno."
COM_CSOVERRIDECHECKER_SESSION_CHAT_BAD_ID="Neplatné ID relace."
COM_CSOVERRIDECHECKER_SESSION_CHAT_NOT_FOUND="Relace nenalezena."
COM_CSOVERRIDECHECKER_SESSION_CHAT_EMPTY="Před odesláním napište zprávu."
COM_CSOVERRIDECHECKER_SESSION_CHAT_SUCCESS="Claude odpověděl — viz nejnovější reakci níže."
COM_CSOVERRIDECHECKER_SESSION_CHAT_ERROR="Chat selhal: %s"
COM_CSOVERRIDECHECKER_SESSION_DOWNLOAD_BAD_ID="Neplatné ID relace."
