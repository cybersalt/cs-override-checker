COM_CSOVERRIDECHECKER_FIELD_APIKEY_HELP_DEFAULT="Nápověda"
COM_CSOVERRIDECHECKER_FIELD_GET_JOOMLA_TOKEN="Získat token"

COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL="Metoda 1: Použít vašeho AI asistenta"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_MANUAL_TOOLTIP="Zkopírujte připravený prompt a vložte jej do AI asistenta, kterého používáte — ChatGPT, Claude, Gemini, Copilot, Cursor nebo lokálního modelu. Funguje bez API klíče. Skočí na prompt níže."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN="Metoda 2: Spustit automatizovaný sken"
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_OK="Spustí kontrolu overrides na tomto serveru s vaším uloženým %s API klíčem. Uloží zprávu jako relaci. Skočí na tlačítko spuštění níže."
COM_CSOVERRIDECHECKER_DASHBOARD_ACTION_AUTOSCAN_TOOLTIP_NOKEY="Nejprve v panelu Možnosti vyberte poskytovatele AI a uložte jeho API klíč, abyste umožnili automatizované skeny. Do té doby použijte Metodu 1."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TOOLTIP="Znovu projde každou povolenou šablonu a obnoví sledovač overrides. Použijte po úpravě souborů šablony mimo Joomla, nebo pokud je sledovač Joomly zastaralý."

COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_LABEL="Klíče &amp; tokeny"
COM_CSOVERRIDECHECKER_CONFIG_AI_FIELDSET_DESC="Volitelné. Vyberte poskytovatele AI a uložte sem jeho API klíč, aby rozšíření mohlo spouštět skeny automaticky, bez promptu ke zkopírování. Ponechte prázdné, pokud chcete dále používat prompt ke zkopírování na nástěnce s jakoukoli AI, kterou už používáte."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_LABEL="Anthropic API klíč"
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_DESC="Váš osobní Anthropic API klíč (začíná na <code>sk-ant-…</code>). Získáte jej na <a href=\"https://console.anthropic.com/\" target=\"_blank\" rel=\"noopener\">console.anthropic.com</a>. Klíč je uložen na tomto serveru a používá se pouze pro volání api.anthropic.com vaším jménem. S uloženým klíčem se na nástěnce zobrazí tlačítko <em>Spustit automatizovaný sken</em>, které předá kontrolu overrides Claude na straně serveru a uloží zprávu zpět jako relaci — žádné kopírování není potřeba."
COM_CSOVERRIDECHECKER_CONFIG_ANTHROPIC_API_KEY_NOTE="Každý automatizovaný sken provede jedno volání API u vámi zvoleného poskytovatele, účtované podle jeho cen za vybraný model. Weby s velmi vysokým počtem overrides jsou na jeden běh omezeny (viz <em>Overrides na sken</em> níže); pro zbytek spusťte sken znovu, nebo použijte prompt ke zkopírování na nástěnce pro neomezenou velikost."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_LABEL="Model pro skenování"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MODEL_DESC="Model použitý pro jednorázové volání <em>Spustit automatizovaný sken</em> na nástěnce. Sken je klasifikační úloha (alert / review / info pro každý nález). <strong>Výchozí volbou je nejschopnější model</strong> &mdash; nejdůkladnější přezkum a nejbezpečnější klasifikátor u nálezů vyžadujících jemný úsudek. Menší modely zvládnou běžné skeny dobře za zlomek ceny a pro nenáročné skeny na malých webech postačí."

COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_LABEL="Model pro chat"
COM_CSOVERRIDECHECKER_CONFIG_CHAT_MODEL_DESC="Model Claude použitý pro navazující chat-with-Claude na stránce s detailem relace (kde žádáte Claude o aplikaci oprav nebo zamítnutí nálezů). Použití nástrojů je náročnější než klasifikace. <strong>Opus je výchozí volba</strong> &mdash; nejspolehlivější chování při použití nástrojů a nejnižší riziko chybně aplikované opravy. Sonnet je dobrý kompromis pro weby s mnoha méně rizikovými následnými akcemi; Haiku může mít potíže s vícekrokovými sekvencemi nástrojů a pro chatový model se nedoporučuje, pokud cena není hlavním kritériem."

COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_LABEL="Joomla API token (pro prompt na nástěnce)"
COM_CSOVERRIDECHECKER_CONFIG_JOOMLA_API_TOKEN_DESC="Volitelné. Vygenerujte Joomla API token v <em>Systém &rarr; Uživatelé &rarr; Můj profil &rarr; Joomla API Token</em> a vložte jej sem. Skenovací / opravné prompty na nástěnce pak automaticky vyplní token namísto zástupného textu &ldquo;PASTE YOUR JOOMLA API TOKEN HERE&rdquo;, takže můžete kopírovat &amp; vkládat přímo do svého AI asistenta bez úprav.<br><br><strong>Upozornění pro více administrátorů:</strong> Joomla API tokeny se autentizují jako <em>uživatel, který je vygeneroval</em>. Pokud tuto nástěnku používá více administrátorů, prompt použije ten token, který je zde uložen &mdash; což znamená, že AI bude API volat jménem onoho jediného uživatele. Ponechte prázdné, aby si každý administrátor vložil vlastní token v okamžiku použití."

COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_LABEL="Overrides na sken"
COM_CSOVERRIDECHECKER_CONFIG_SCAN_MAX_OVERRIDES_DESC="Kolik označených overrides šablony zkontroluje tlačítko <em>Spustit automatizovaný sken</em> v jediném volání API. Výchozí <strong>10</strong>. Rozsah 1&ndash;100. <strong>Nižší hodnota je bezpečnější pro navazující chat:</strong> zpráva ze skenu roste s počtem nálezů a smyčka tool-use v chatu si tuto zprávu uchovává jako historii konverzace. Na nízkých rate-limit úrovních (Tier 1 u Anthropicu povoluje 10K vstupních tokenů za minutu) sken se 60 overrides plus okamžitý chat ve stejné minutě vrátí <em>HTTP 429: rate limit exceeded</em>. S 10 overrides na běh zůstanou vaše chatové reakce po skenu pohodlně pod limitem. Weby s více overrides než toto prostě potřebují několik opakovaných spuštění, aby pokryly vše &mdash; zpráva z každého běhu se uloží jako vlastní relace, takže každou můžete zpracovat nezávisle."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_HAIKU="Haiku 4.5 — nejrychlejší a nejlevnější. Vhodný pro nenáročné skeny na malých webech."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_SONNET="Sonnet 5 — vyvážený. Běžné skeny zvládá dobře za zlomek ceny modelu Opus."
COM_CSOVERRIDECHECKER_CONFIG_MODEL_OPUS="Opus 4.8 — nejschopnější, výchozí. Nejbezpečnější klasifikátor u nálezů vyžadujících jemný úsudek."

COM_CSOVERRIDECHECKER_CONFIG_MODEL_COST_WARNING="<strong>O cenovém rozdílu.</strong> <strong>V době psaní tohoto textu</strong> typický sken na webu s 50 overrides spotřebuje asi 60K vstupních tokenů a vyprodukuje asi 5K výstupních tokenů. Přibližná cena za sken: <strong>~$0,08 na Haiku, ~$0,23 na Sonnet, ~$1,13 na Opus</strong>. Chatové reakce jsou mnohem menší (5K&ndash;10K vstupních tokenů na reakci), takže cena za reakci je zhruba 10&times; menší než za sken. Zveřejněný ceník Anthropicu je zdrojem pravdy na <a href=\"https://www.anthropic.com/pricing\" target=\"_blank\" rel=\"noopener\">anthropic.com/pricing</a> &mdash; čísla výše jsou přibližná a mohou se v čase měnit. Sledujte své využití na <a href=\"https://console.anthropic.com/usage\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/usage</a> po několika bězích, než se rozhodnete přejít z výchozího Opus na levnější úroveň."

COM_CSOVERRIDECHECKER_DASHBOARD_QUICKNAV_LABEL="Navigace komponenty"

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TITLE="Metoda 2: Spustit automatizovaný sken (s vaším uloženým %s API klíčem)"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_TITLE="Není uložen žádný %s API klíč."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_TITLE="API klíč uložen."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_AVAILABLE_BODY="Rozšíření spustí kontrolu overrides na serveru pomocí vašeho uloženého API klíče, žádné kopírování není potřeba. Zpráva se automaticky uloží jako nová relace."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_INTRO="Klikněte níže pro spuštění skenu. Rozšíření načte každý označený override na tomto webu, odešle jej vašemu poskytovateli AI s vaším uloženým API klíčem a výslednou zprávu uloží jako novou relaci. Po dokončení budete přesměrováni na zprávu."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOTE="Jedno volání API na sken. Weby s více než %d overrides jsou omezeny na prvních %d na běh (lze konfigurovat v <em>Možnosti &rarr; Klíče &amp; tokeny &rarr; Overrides na sken</em>); pro další dávku spusťte sken znovu, nebo použijte prompt ke zkopírování z Metody 1 pro neomezenou velikost. Stránka se může pozastavit na 30&ndash;90 sekund, zatímco AI odpovídá &mdash; to je normální, neopouštějte ji."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_CONFIRM="Toto zavolá %s API s vaším uloženým klíčem a může trvat 30 až 90 sekund. Pokračovat?"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_BUTTON="Spustit automatizovaný sken nyní"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_NOKEY_BODY="Tato metoda provádí celou kontrolu na straně serveru &mdash; bez kopírování a vkládání, bez druhého okna. Klikněte na tlačítko <em>Možnosti</em> přímo níže, na záložce <em>Klíče a tokeny</em> vyberte svého poskytovatele AI, vložte jeho API klíč a Uložte. Klíč zůstává v databázi vašeho webu; používat jej může pouze tento web. Metoda 1 výše stále funguje i bez API klíče, pokud preferujete pracovní postup kopírovat-vložit."

COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_TITLE="Probíhá automatizovaný sken…"
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_LOADING_BODY="Volá se %s API a analyzují se vaše overrides. Obvykle to trvá 30 až 90 sekund. Prosím, nezavírejte toto okno."

