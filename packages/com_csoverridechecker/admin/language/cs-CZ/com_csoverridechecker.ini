COM_CSOVERRIDECHECKER_BACKUP_MANUAL_INTRO="Pokud raději nechcete, aby rozšíření zapisovalo na disk:"
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP1="Klikněte na <em>Stáhnout zálohu</em> výše (nebo zkopírujte blok Obsah zálohy)."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP2="Otevřete svého FTP klienta, SFTP klienta nebo Správce souborů hostingu."
COM_CSOVERRIDECHECKER_BACKUP_MANUAL_STEP3="Nahraďte soubor na cílové cestě níže staženou kopií."
