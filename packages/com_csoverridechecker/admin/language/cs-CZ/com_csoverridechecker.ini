COM_CSOVERRIDECHECKER_SESSIONFORM_TITLE="Nová relace"
COM_CSOVERRIDECHECKER_SESSIONFORM_HEADING="Vložit zprávu z kontroly AI"
COM_CSOVERRIDECHECKER_SESSIONFORM_INTRO="<strong>Ruční vložení pro uživatele chatu v prohlížeči.</strong> Pokud jste skenovací prompt spustili v chatu v prohlížeči, jako je ChatGPT, claude.ai nebo Gemini, zkopírujte odpověď AI a vložte ji sem, abyste ji uložili jako relaci. Pokud jste použili agenta v terminálu nebo editoru (Claude Code, Codex, Cursor a podobně), tento formulář obvykle nepotřebujete — agent pošle zprávu zpět na web sám. Relace je standardně pojmenována dnešním časovým razítkem; můžete jej změnit, pokud chcete."
COM_CSOVERRIDECHECKER_SESSIONFORM_NAME="Název relace"
COM_CSOVERRIDECHECKER_SESSIONFORM_NAME_HELP="Výchozí je aktuální časové razítko ve formátu YYYY-MM-DD-HHMMSS. Používá se jako viditelný popisek v protokolu relací."
COM_CSOVERRIDECHECKER_SESSIONFORM_SUMMARY="Jednořádkové shrnutí"
COM_CSOVERRIDECHECKER_SESSIONFORM_SUMMARY_PLACEHOLDER="např. 1 nález XSS, 14 položek odchylek od šablony, 1 kosmetická chyba"
COM_CSOVERRIDECHECKER_SESSIONFORM_REPORT="Zpráva (Markdown)"
COM_CSOVERRIDECHECKER_SESSIONFORM_REPORT_PLACEHOLDER="Vložte zde celou zprávu, kterou AI vytvořila. Bude uložena doslovně a zobrazena při otevření relace."
COM_CSOVERRIDECHECKER_SESSIONFORM_SAVE="Uložit relaci"

COM_CSOVERRIDECHECKER_ACTIONS_TITLE="Cybersalt Override Checker — Protokol akcí"
COM_CSOVERRIDECHECKER_ACTIONS_DESCRIPTION="Zde je zaznamenána každá administrátorská událost, která se dotkla sledovače overrides, protokolu relací nebo záloh souborů. Pouze pro čtení."
COM_CSOVERRIDECHECKER_ACTIONS_VS_SESSIONS="<strong>Relace</strong> uchovávají kontrolní zprávy AI. <strong>Protokol akcí</strong> je auditní stopa <em>změn</em> — kdy byly overrides resetovány nebo vyčištěny, kdy byla vytvořena relace, kdy byla uložena záloha před opravou. Pokud se na tomto webu později něco pokazí, zde uvidíte, co a kdy bylo provedeno."
