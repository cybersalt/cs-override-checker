COM_CSOVERRIDECHECKER_DASHBOARD_DIAGNOSTICS_TEST_INTRO="Odešle drobný testovací požadavek poskytovateli %s pomocí uloženého klíče. Stojí téměř nic — ověří, že je klíč platný a z tohoto serveru dosažitelný."
