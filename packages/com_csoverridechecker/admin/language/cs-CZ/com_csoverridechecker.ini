COM_CSOVERRIDECHECKER_ACTION_VIEW_TITLE="Zobrazit data Override Checker"
COM_CSOVERRIDECHECKER_ACTION_VIEW_DESC="Umožňuje uživatelům ve vybraných skupinách číst overrides, relace, protokol akcí a obsah záloh (administrační pohledy a API endpointy pro čtení)."
COM_CSOVERRIDECHECKER_ACTION_WRITE_TITLE="Upravovat data Override Checker a soubory overrides"
COM_CSOVERRIDECHECKER_ACTION_WRITE_DESC="Umožňuje uživatelům ve vybraných skupinách aplikovat opravy, obnovovat zálohy, zamítat příznaky overrides a vytvářet nebo mazat relace. Implikuje oprávnění Zobrazit."

