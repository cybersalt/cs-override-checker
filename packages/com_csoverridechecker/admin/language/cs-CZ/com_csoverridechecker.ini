COM_CSOVERRIDECHECKER_BACKUP_RESTORE_TITLE="Obnovit tuto zálohu"
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_INTRO="Přepíše aktuální soubor na výše uvedené cestě obsahem zálohy. Před zápisem je aktuální obsah na této cestě uložen jako nová záloha, takže i toto obnovení je vratné — pokud se něco pokazí, vraťte to obnovením nové zálohy před obnovením."
COM_CSOVERRIDECHECKER_BACKUP_RESTORE_NOTE="Soubor je zapsán přes PHP z této administrační stránky; FTP není potřeba. Webový uživatel musí mít oprávnění zápisu na cílovou cestu. Hranicí je kořen webu Joomla — obnovení odmítne zápis mimo něj."
