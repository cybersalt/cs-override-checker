COM_CSOVERRIDECHECKER_BACKUP_STORAGE_TITLE="Kde tato záloha leží"
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_INTRO="Obsah zálohy je uložen v databázi, ne na disku. Konkrétně v tabulce <code>#__csoverridechecker_backups</code> — sloupec <code>contents_b64</code> obsahuje obsah souboru zakódovaný v base64."
COM_CSOVERRIDECHECKER_BACKUP_STORAGE_NOTE="To znamená, že databázová záloha je rovněž zachytí. Odinstalace komponenty zruší tabulku spolu se všemi uloženými zálohami."
COM_CSOVERRIDECHECKER_DASHBOARD_AUTOSCAN_TIER_NOTE="<strong>O vaší úrovni Anthropic API:</strong> automatizovaný sken i funkce chatu se obojí započítávají do minutového limitu tokenů Anthropicu. Výchozí Tier 1 od Anthropicu (10 000 vstupních tokenů za minutu) stačí na jednorázový sken malého webu, ale při vícekrokových opravách v chatu narazíte na rate limit. Tier 2 (50 000 tokenů za minutu, placený) je pohodlný pro většinu skutečných opravných relací. Svou aktuální úroveň zjistíte na <a href=\"https://console.anthropic.com/settings/limits\" target=\"_blank\" rel=\"noopener\">console.anthropic.com/settings/limits</a>."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_TITLE="Resetovat overrides ke kontrole"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_INTRO="Vyberte, pro které šablony se má sledovač overrides znovu sestavit. Vypsány jsou pouze povolené šablony, které mají na disku složku overrides <code>html/</code>. Zaškrtněte <em>Vybrat všechny šablony</em> pro původní chování &ldquo;resetovat každou šablonu&rdquo;."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_NO_TEMPLATES="Žádná povolená šablona na tomto webu nemá složku overrides <code>html/</code>, takže není co resetovat. Přidejte override (nebo povolte šablonu, která overrides má) a otevřete toto okno znovu."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SELECT_ALL="Vybrat všechny šablony"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_OVERRIDE_COUNT="aktuálně sledováno %d řádek(ů)"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_MODAL_SUBMIT="Resetovat vybrané"
COM_CSOVERRIDECHECKER_RESCAN_NO_VALID_TEMPLATES="Žádná z vybraných šablon nebyla rozpoznána. Otevřete okno znovu a vyberte šablonu ze seznamu."
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_TITLE="Obnovit tuto zálohu přes %s"
COM_CSOVERRIDECHECKER_BACKUPS_RESTORE_BUTTON_CONFIRM="Obnovit uloženou zálohu přes živý soubor na %s? Aktuální obsah souboru bude nejprve uložen jako nová záloha, takže i toto obnovení je vratné."
COM_CSOVERRIDECHECKER_FILTER_OPTIONS="Možnosti filtrování"
COM_CSOVERRIDECHECKER_FILTER_NO_MATCHES="Těmto filtrům neodpovídají žádné výsledky. Použijte Vymazat pro zobrazení všeho."
COM_CSOVERRIDECHECKER_FILTER_ANY_ACTION="— Jakákoli akce —"
COM_CSOVERRIDECHECKER_FILTER_ANY_SESSION="— Jakákoli relace —"
COM_CSOVERRIDECHECKER_FILTER_SESSION_PLACEHOLDER="ID relace (nebo 'none')"
COM_CSOVERRIDECHECKER_TOOLBAR_DASHBOARD="Nástěnka"
COM_CSOVERRIDECHECKER_TOOLBAR_SETUPGUIDE="Průvodce nastavením"
COM_CSOVERRIDECHECKER_TOOLBAR_SUPPORT="Získat pomoc"
COM_CSOVERRIDECHECKER_SETUPGUIDE_TITLE="Cybersalt Override Checker — Průvodce nastavením"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_HEADING="Použijte tu umělou inteligenci, kterou už máte"
COM_CSOVERRIDECHECKER_SETUPGUIDE_INTRO_BODY="Toto rozšíření není vázáno na žádnou konkrétní umělou inteligenci. Vše, co zpřístupňuje, je běžné REST API zabezpečené standardním Joomla API tokenem, takže kontrolu může spustit jakýkoli asistent, který umí odeslat webový požadavek &mdash; a stejně tak skript, který si napíšete sami. Tato stránka popisuje praktické rozdíly mezi jednotlivými možnostmi, abyste si mohli vybrat a pustit se do práce."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_HEADING="Co váš asistent skutečně musí umět"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_INTRO="Místo výčtu produktů, které fungují &mdash; plány a funkce se neustále mění &mdash; uvádíme skutečný požadavek. Váš asistent musí umět:"
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM1="<strong>Odesílat odchozí HTTPS požadavky</strong> na tento web s vlastní hlavičkou požadavku (<code>X-Joomla-Token</code>). To je jediný nezbytný požadavek."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM2="<strong>Odesílat POST požadavky s tělem ve formátu JSON</strong>, pokud chcete, aby opravy i aplikoval, nejen hlásil. Kontrola pouze pro čtení si vystačí se samotným GET."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_ITEM3="<strong>Udržet přiměřeně dlouhou konverzaci</strong>, protože pro každý označený override načítá dva soubory, než dospěje k závěru."
COM_CSOVERRIDECHECKER_SETUPGUIDE_REQ_OUTRO="Nejste si jisti, zda ten váš vyhovuje? Prostě vložte prompt a uvidíte. Asistent, který se na váš web nedostane, to řekne rovnou, místo aby selhal potichu."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_TITLE="Zatím není uložen žádný Joomla API token."
COM_CSOVERRIDECHECKER_SETUPGUIDE_NOTOKEN_BODY="Ať zvolíte kteréhokoli asistenta, potřebuje Joomla API token, aby mohl číst vaše soubory overrides. Vygenerujte jej v <em>Systém &rarr; Správa &rarr; Uživatelé &rarr; váš uživatel &rarr; Joomla API Token</em> a pak jej buď pokaždé vložte do promptu, nebo jej uložte zde, aby se prompt vyplnil automaticky."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_BEST="Doporučeno"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_COMMON="Nejběžnější"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_MULTISITE="Nejlepší pro více webů"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_CAUTION="Funguje, s výhradami"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BADGE_ADVANCED="Pokročilé"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_HEADING="Agenti v terminálu a editoru"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_EXAMPLES="Například: Claude Code, Codex CLI, Cursor, režim agenta GitHub Copilot, Aider, Windsurf"
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_BODY="Nejhladší varianta a to, co bychom doporučili, pokud nějakého máte k dispozici. Běží na vašem vlastním počítači s neomezeným odchozím přístupem k síti, bez sandboxového allowlistu a bez časového limitu požadavku v prohlížeči, takže i dlouhá kontrola proběhne od začátku do konce bez dohledu."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP1="Zkopírujte skenovací prompt z nástěnky."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP2="Vložte jej do svého agenta a odešlete. Žádné nastavení není potřeba."
COM_CSOVERRIDECHECKER_SETUPGUIDE_AGENTS_STEP3="Až se zpráva objeví, odpovězte ve stejné relaci a uveďte čísla nálezů, které chcete opravit."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_HEADING="Chatoví asistenti v prohlížeči"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_EXAMPLES="Například: ChatGPT, Claude.ai, Google Gemini, Microsoft Copilot"
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_BODY="Všichni fungují za předpokladu, že účet a režim, který používáte, se skutečně dostane na internet. Jde o nejběžnější uspořádání a pro běžný web zcela dostačující."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP1="Ujistěte se, že je pro konverzaci zapnutý přístup k webu nebo prohlížení. Některé úrovně a některé režimy odpovídají jen z paměti."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP2="Vložte skenovací prompt z nástěnky a odešlete."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_STEP3="Pokud má váš web hodně overrides, požádejte jej, aby je zpracoval po dávkách, aby jediná odpověď nepřekročila časový limit požadavku v prohlížeči."
COM_CSOVERRIDECHECKER_SETUPGUIDE_BROWSER_WARN="<strong>Pozor na sebejisté hádání.</strong> Pokud asistent začne produkovat nálezy, aniž by kdy citoval skutečný obsah souborů, znamená to, že se na váš web nedostane a vymýšlí si je. Zastavte se a zkontrolujte jeho připojení, místo abyste zprávě věřili. <strong>Konkrétně pro Claude.ai:</strong> pokud odpoví &ldquo;Host not in allowlist&rdquo;, přidejte doménu tohoto webu v <em>Settings &rarr; Capabilities &rarr; Code execution &rarr; Network access</em> a pak začněte nový chat &mdash; ten běžící si dále drží starý allowlist."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_HEADING="Vlastní GPT, Gems a další konfigurovatelní asistenti"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_EXAMPLES="Například: vlastní GPT s Actions, Gemini Gem nebo jakýkoli asistent, u kterého si můžete zaregistrovat vlastní API"
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_BODY="Pokud vám vaše platforma umožňuje definovat asistenta s vlastními API akcemi, zaregistrujte níže uvedené endpointy jednou a krok s kopírováním a vkládáním zcela odpadne. Je to nejúhlednější varianta, pokud se staráte o několik webů Joomla, protože si asistent nastavení pamatuje mezi konverzacemi."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP1="Vytvořte nového vlastního asistenta a přidejte API akci směřující na URL endpointu uvedenou níže na této stránce."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP2="Nastavte název autentizační hlavičky na <code>X-Joomla-Token</code> a jako hodnotu vložte svůj Joomla API token."
COM_CSOVERRIDECHECKER_SETUPGUIDE_CUSTOM_STEP3="Vložte skenovací prompt z nástěnky do instrukcí asistenta, aby znal klasifikační pravidla a formát zprávy."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_HEADING="Lokální a vlastní hostované modely"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_EXAMPLES="Například: Ollama, LM Studio, llama.cpp nebo jakýkoli vlastní hostovaný model s voláním nástrojů"
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_BODY="Cokoli s voláním nástrojů a přístupem k síti bude technicky fungovat a nic neopustí vaši vlastní infrastrukturu, což některé weby ocení."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP1="Povolte volání nástrojů nebo funkcí a ověřte, že se model dostane na tento web přes HTTPS."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_STEP2="Vložte skenovací prompt jako systémový prompt a poté jej požádejte, aby začal."
COM_CSOVERRIDECHECKER_SETUPGUIDE_LOCAL_WARN="<strong>Buďte realističtí ohledně velikosti modelu.</strong> Kontrola override je úloha na úsudek, ne pouhé vyhledání. Malý lokální model vám zprávu ochotně vytvoří, ale je mnohem pravděpodobnější, že přehlédne skutečnou bezpečnostní regresi nebo si vymyslí takovou, která tam není. Berte nálezy z malého modelu jako první průchod, ne jako verdikt."
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_HEADING="MCP klienti"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_EXAMPLES="Jakýkoli asistent, který mluví Model Context Protocol"
COM_CSOVERRIDECHECKER_SETUPGUIDE_MCP_BODY="Pokud váš asistent podporuje MCP, nainstalujte <strong>MCP for J</strong> a jeho bezplatný doplněk <a href='https://www.cybersalt.com/extensions/mcp-for-override-checker' target='_blank' rel='noopener'><strong>MCP for Override Checker</strong></a>. Asistent pak kontroluje a opravuje přepisy vlastními nástroji, bez kopírování a vkládání. Je to také lepší cesta pro prohlížečové chaty s podporou konektorů MCP, protože se vyhne časovému limitu požadavků v prohlížeči. Obě jsou samostatná, bezplatná rozšíření."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_HEADING="Metoda 2 je jedinou výjimkou"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_BODY="Tlačítko <em>Spustit automatizovaný sken</em> na nástěnce provede celou kontrolu na straně serveru bez kopírování a vkládání. V <em>Možnostech</em> vyberte poskytovatele a uložte jeho API klíč &mdash; <strong>skeny umí spustit Anthropic, OpenAI i Google Gemini</strong>. Jediné, co stále funguje pouze s Anthropicem, je navazující chat nad relací, kde jej požádáte o aplikaci oprav a on upravuje soubory pomocí volání nástrojů; tato smyčka je napsána proti protokolu volání nástrojů Anthropicu. S vybraným OpenAI nebo Gemini dostanete celou zprávu a opravy můžete aplikovat sami pomocí promptu ke zkopírování z Metody 1, který funguje s jakoukoli AI."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_ACTIVE="%s klíč uložen &mdash; Metoda 2 je dostupná"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ANTHROPIC_INACTIVE="Pro vašeho poskytovatele AI není uložen žádný API klíč &mdash; Metoda 1 stále funguje"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_HEADING="Endpoint a autentizace"
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BODY="Vše, co dělá administrační rozhraní, je dostupné na této základní URL. Použijte ji při registraci vlastního asistenta nebo při psaní vlastního skriptu či agenta."
COM_CSOVERRIDECHECKER_SETUPGUIDE_ENDPOINT_BEARER_WARN="<strong>Joomla na těchto trasách nepřijímá <code>Authorization: Bearer</code>.</strong> Token musíte odeslat v hlavičce <code>X-Joomla-Token</code>. Hlavička ve formátu Bearer vrátí 401 Forbidden."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_HEADING="Kompletní dokumentace"
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BODY="Úplný přehled endpointů, formát zprávy, řešení problémů a časté dotazy."
COM_CSOVERRIDECHECKER_SETUPGUIDE_DOCS_BUTTON="Přečíst dokumentaci"
COM_CSOVERRIDECHECKER_SUPPORT_TITLE="Cybersalt Override Checker — Získat pomoc"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_HEADING="Toto rozšíření je zdarma a zdarma zůstane"
COM_CSOVERRIDECHECKER_SUPPORT_FREE_BODY="Neexistuje žádná Pro verze, žádný licenční klíč a žádná zadržená funkce. Vše, co rozšíření umí, máte před sebou. Přesto bychom od vás velmi rádi slyšeli &mdash; zpětná vazba ze skutečných webů utvářela každé dosavadní vydání."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_TITLE="Co očekávat."
COM_CSOVERRIDECHECKER_SUPPORT_EXPECT_BODY="Cybersalt je malá firma a toto rozšíření se rozdává zdarma, takže bezplatná podpora je poskytována podle toho, kolik času zbude vedle klientské práce. Je to skutečné omezení, ne odbytí &mdash; raději to řekneme na rovinu, než abychom vás nechali čekat na slib, který nemůžeme dodržet. Hlášení chyb si prohlédneme; otevřená pomoc s nastavením už nemusí přijít na řadu."
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_HEADING="Kam to poslat"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_INTRO="Hlášení chyb, matoucí formulace, nález, který umělá inteligence vyhodnotila špatně, pracovní postup, do kterého se rozšíření nehodí, nebo asistent, který se choval nečekaně &mdash; všechno je užitečné."
COM_CSOVERRIDECHECKER_SUPPORT_BTN_ISSUES="Nahlásit problém na GitHubu"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_DOCS="Přečíst dokumentaci"
COM_CSOVERRIDECHECKER_SUPPORT_BTN_WEBSITE="cybersalt.com"
COM_CSOVERRIDECHECKER_SUPPORT_WHERE_PUBLIC_NOTE="GitHub Issues je nejlepší místo pro cokoli reprodukovatelného, protože je veřejné &mdash; další člověk se stejným problémem najde odpověď, místo aby se ptal znovu."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_HEADING="Co přiložit"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_INTRO="Odpověď dostanete rychleji, pokud nám pomůžete přeskočit diagnostiku:"
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM1="<strong>Diagnostický blok</strong> z této stránky (obsahuje verze vaší Joomly, PHP a rozšíření v jednom vložení)."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM2="<strong>Kterou metodu</strong> jste použili &mdash; prompt ke zkopírování, automatizovaný sken, nebo vlastní kód &mdash; a <strong>kterého AI asistenta</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM3="Co jste <strong>očekávali</strong>, že se stane, a co se stalo <strong>ve skutečnosti</strong>."
COM_CSOVERRIDECHECKER_SUPPORT_INCLUDE_ITEM4="Pokud umělá inteligence vyhodnotila nález špatně, <strong>uloženou zprávu z relace</strong> &mdash; použijte <em>Stáhnout zprávu</em> na stránce relace. Díky tomu uvidíme přesné nálezy i úvahy."
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_HEADING="Nápady jsou také vítány"
COM_CSOVERRIDECHECKER_SUPPORT_FEEDBACK_BODY="Pokud rozšíření dělá skoro to, co potřebujete, ale ne úplně, dejte nám vědět. Několik funkcí vzniklo proto, že jeden člověk popsal pracovní postup, který nás nenapadl."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_HEADING="Diagnostika"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_INTRO="Zkopírujte to do svého hlášení, ať se nemusíme ptát."
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_COPY="Zkopírovat diagnostiku"
COM_CSOVERRIDECHECKER_SUPPORT_DIAG_NOSECRETS="Tento blok neobsahuje žádné citlivé údaje. Zaznamenává pouze to, zda je klíč nebo token uložen, nikdy jeho hodnotu."
COM_CSOVERRIDECHECKER_SECRET_REVEAL_COUNTDOWN="Zobrazení za {seconds} s"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_LABEL="Prodleva podržení pro zobrazení (sekundy)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_DELAY_DESC="Klíče a tokeny zobrazené v tomto rozšíření jsou standardně rozmazané, aby je neprozradilo sdílení obrazovky, nahrávka obrazovky ani pohled přes rameno. Podržte ukazatel nad rozmazanou hodnotou po tento počet sekund a hodnota se zobrazí; odpočet vám dá vědět, že časovač běží. Odjetím pryč se zruší. Výchozí <strong>3</strong>. Nastavte na <strong>0</strong> pro okamžité zobrazení při najetí, čímž ovšem odstraníte ochranu proti pouhému přejetí ukazatelem přes hodnotu."
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_LABEL="Automatické skrytí po zobrazení (sekundy)"
COM_CSOVERRIDECHECKER_CONFIG_HOVER_REVEAL_HIDE_DESC="Jakmile byla hodnota zobrazena, po tomto počtu sekund se znovu rozmaže, i když je nad ní ukazatel stále. Pokrývá případ, kdy se na klíč podíváte a pak vás někdo vyruší, takže zůstane odhalený na obrazovce bez dozoru. Výchozí <strong>8</strong>. Nastavte na <strong>0</strong>, aby zůstala viditelná, dokud neodjedete pryč."
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_LABEL="Poskytovatel AI"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_DESC="Kterou službu AI volá vestavěné tlačítko <em>Spustit automatizovaný sken</em>. Pro tu, kterou zvolíte, dodáváte vlastní klíč a používá se pouze z tohoto webu. Toto nastavení <strong>neovlivňuje</strong> pracovní postup s kopírováním promptu &mdash; ten funguje s jakoukoli AI a nepotřebuje žádný klíč."
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_ANTHROPIC="Anthropic (Claude)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_OPENAI="OpenAI (GPT)"
COM_CSOVERRIDECHECKER_CONFIG_PROVIDER_GEMINI="Google (Gemini)"
COM_CSOVERRIDECHECKER_CONFIG_AI_PROVIDER_NOTE="<strong>Sken umí spustit všichni tři poskytovatelé.</strong> Navazující chat nad relací &mdash; kde jej požádáte o aplikaci oprav a on upravuje soubory pomocí volání nástrojů &mdash; je aktuálně <strong>pouze pro Anthropic</strong>, protože tato smyčka je napsána proti protokolu volání nástrojů Anthropicu. S vybraným OpenAI nebo Gemini stále dostanete celou zprávu; pokud chcete opravy aplikovat za sebe, buď zde přepněte na Anthropic, nebo použijte pracovní postup s kopírováním promptu, který funguje s jakoukoli AI."
COM_CSOVERRIDECHECKER_CONFIG_OPENAI_API_KEY_LABEL="OpenAI API klíč"
