COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_ACTIVE="API endpoint aktivní"
COM_CSOVERRIDECHECKER_DASHBOARD_STATUS_DESCRIPTION="Jakýkoli uživatel s platným Joomla API tokenem a oprávněním core.manage na tuto komponentu může číst aktuální data o override šablon tohoto webu."

COM_CSOVERRIDECHECKER_DASHBOARD_ENDPOINT_LABEL="URL endpointu"

COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_TITLE="O rozšíření"
COM_CSOVERRIDECHECKER_DASHBOARD_ABOUT_DESCRIPTION="Web Services API zpřístupňující nativní sledovač #__template_overrides, takže jakýkoli AI asistent — nebo jakýkoli klient s Joomla API tokenem — může zkontrolovat každý označený override, klasifikovat jej a aplikovat opravy přímo na místě. Každá oprava je nejprve automaticky zálohována do databáze a lze ji vrátit zpět ze zobrazení Zálohy souborů."
COM_CSOVERRIDECHECKER_DASHBOARD_VERSION_LABEL="Verze"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_TITLE="Začněte zde."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_AUDIENCE_BODY="Toto je jediná karta, kterou potřebujete pro běžnou kontrolu. Spusťte prompt, získejte zprávu a poté ve stejném chatu řekněte asistentovi, které nálezy opravit."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_TITLE="Metoda 1: Kontrola pomocí libovolného AI asistenta"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_INTRO="Rozšíření zpřístupňuje vaše data o overrides přes standardní REST API, takže kontrolu může spustit <strong>jakýkoli</strong> AI asistent, který umí odeslat HTTPS požadavek — na této metodě není nic vázaného na konkrétního dodavatele. Zkopírujte níže uvedený prompt do asistenta, kterého už používáte, a ten vytvoří bezpečnostní kontrolu každého označeného override na tomto webu a poté aplikuje opravy, které potvrdíte. Nejste si jisti, zda ten váš bude fungovat? Podívejte se na tlačítko <em>Průvodce nastavením</em> v horní části této stránky."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_TITLE="Vygenerujte Joomla API token (jednou)."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP1_BODY="V administraci Joomla: záložka <em>Systém → Uživatelé → Můj profil → Joomla API Token</em>. Klikněte na ikonu oka pro zobrazení tokenu a zkopírujte jej. <strong>Pokud jej chcete uložit natrvalo</strong>, přejděte do <em>Možnosti → Klíče a tokeny</em> v této komponentě, vložte jej do pole <em>Joomla API token</em> a Uložte &mdash; výzva níže pak bude automaticky vyplněna tokenem, takže jej nebudete muset vkládat při každém skenu. Jinak mějte token po ruce a vložte jej do výzvy v kroku 2."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_TITLE="Otevřete svého AI asistenta a vložte níže uvedený prompt."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP2_BODY="Použijte asistenta, kterého preferujete — agenta v terminálu nebo editoru (Claude Code, Codex CLI, Cursor, Copilot), chat v prohlížeči (ChatGPT, Claude.ai, Gemini), vlastní GPT nebo Gem, nebo lokální model. Jediným požadavkem je, aby uměl odesílat odchozí HTTPS požadavky s vlastní hlavičkou. <strong>Pokud jste token NEULOŽILI do Možností v kroku 1</strong>, nahraďte zástupný text v ostrých závorkách (<code>&lt;PASTE YOUR JOOMLA API TOKEN HERE&gt;</code>) zkopírovaným tokenem. URL webu a endpointy jsou pro tento web již vyplněny. Tipy pro jednotlivé asistenty najdete na stránce <em>Průvodce nastavením</em>."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_TITLE="Odeslat."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP3_BODY="Váš asistent stáhne seznam overrides, načte zdroj override a core souboru pro každý z nich a vytvoří tabulku jednotlivých nálezů plus shrnutí v běžném jazyce, které můžete přeposlat."

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_TITLE="Řekněte mu, co opravit — ve stejném chatu."
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_STEP4_BODY="Jakmile bude zpráva odeslána, asistent se zeptá, které nálezy chcete opravit. Odpovězte s těmi, které potvrzujete (např. <em>„oprav #1 a #3, #2 nech být, na ten třetí stranou se zeptám vývojáře“</em>). Každý soubor je před opravou zazálohován, takže cokoli lze vrátit zpět. <strong>Druhou kartu níže potřebujete jen tehdy, pokud jste chat zavřeli a chcete se k němu vrátit později.</strong>"

COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_PROMPT_LABEL="Prompt (zkopírujte a vložte do svého AI asistenta):"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPY_BUTTON="Zkopírovat skenovací prompt"
COM_CSOVERRIDECHECKER_DASHBOARD_USAGE_COPIED="Zkopírováno!"

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_TITLE="Většina uživatelů tuto kartu NEpotřebuje."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_AUDIENCE_BODY="Použijte ji jen tehdy, pokud začínáte <em>nový chat</em> pro aplikaci oprav z předchozí kontroly — například jste přes noc zavřeli původní chat, předáváte kontrolu kolegovi, nebo jste sken spustili v chatu v prohlížeči a chcete opravy provést v agentovi v terminálu. Pokud je váš skenovací chat stále otevřený, přejděte nahoru — prostě pokračujte v tomto chatu."

COM_CSOVERRIDECHECKER_DASHBOARD_FIX_TITLE="Pokračovat v předchozí kontrole v novém chatu"
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_INTRO="Vložte tento prompt do nového chatu — v jakémkoli asistentovi, ne nutně v tom, který spustil sken — abyste mu poskytli kontext z vaší dřívější kontroly. Načte zprávu z předchozí relace, vypíše nálezy a zeptá se, které opravit. Každý soubor je před aplikací jakékoli opravy zazálohován, takže cokoli lze vrátit zpět."
COM_CSOVERRIDECHECKER_DASHBOARD_FIX_COPY_BUTTON="Zkopírovat opravný prompt"

COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_TITLE="Protokol relací"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_INTRO="Zprávy odeslané vaším AI asistentem (nebo vložené ručně) jsou zde uloženy jako relace. Klikněte na relaci pro zobrazení celé zprávy."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_EMPTY="Zatím žádné relace. Spusťte výše uvedený prompt a buď nechte asistenta odeslat zprávu zpět automaticky (POST), nebo klikněte na 'Nová relace' a vložte ji."
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_NEW="Nová relace"
COM_CSOVERRIDECHECKER_DASHBOARD_SESSIONS_ALL="Zobrazit všechny relace"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_TITLE="Po kontrole"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_INTRO="Až budete hotovi s reakcí na doporučení z kontroly, budete chtít vyčistit odznaky 'Changes found', které Joomla zobrazuje v Šablonách, aby přestaly označovat overrides, které jste již vyřešili."

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_LABEL="Doporučeno — kontrola po šablonách"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BODY="Otevřete seznam šablon webu. Každou šablonu s odznakem 'Changes found' lze otevřít individuálně, takže můžete zamítnout konkrétní řádky overrides, které jste vyřešili. Pomalejší, ale zachováte si auditní stopu po jednotlivých řádcích."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_A_BUTTON="Otevřít správu šablon webu"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_LABEL="Hromadně — označit každý override jako zkontrolovaný"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BODY="Rychlejší cesta: vyčistit každý řádek ve sledovači overrides v jednom kroku. Udělejte to teprve poté, co jste skutečně zkontrolovali každý nález. Ekvivalent použití vlastního 'Dismiss All' Joomly na všechny šablony najednou."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_OPTION_B_BUTTON="Označit vše jako zkontrolované…"

COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_TITLE="Potvrdit: označit všechny overrides jako zkontrolované"
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_BODY="Tímto se vyčistí každý řádek, který Joomla aktuálně sleduje ve sledovači overrides. Odznaky 'Changes found' v Šablonách zmizí a API endpoint tohoto webu bude vracet nula řádků až do dalšího jádrového updatu Joomly, který je znovu naplní. Akci nelze vrátit zpět, leda kliknutím na 'Obnovit sledovač overrides' níže pro nový sken."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_AGREE="Potvrzuji, že jsem zkontroloval každý označený override, a přijímám odpovědnost za případné nevyřešené problémy."
COM_CSOVERRIDECHECKER_DASHBOARD_REVIEWED_MODAL_CONFIRM="Ano — označit vše jako zkontrolované"

COM_CSOVERRIDECHECKER_MARK_REVIEWED_SUCCESS="%d řádek(ů) overrides označeno jako zkontrolovaných a vyčištěno ze sledovače."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_NONE="Nebyly žádné řádky overrides ke smazání."
COM_CSOVERRIDECHECKER_MARK_REVIEWED_ERROR="Nepodařilo se vyčistit sledovač overrides: %s"

COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_TITLE="Resetovat overrides ke kontrole"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_DESCRIPTION="Schválili jste vy (nebo předchozí vývojář) v minulosti overrides bez skutečné kontroly? Klikněte sem, abyste vrátili každý soubor override zpět do sledovače a mohli jej se svým AI asistentem řádně zkontrolovat. Užitečné po 'Dismiss All', které proběhlo dříve, než byl tento nástroj nainstalován."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_NOTE="Projde složku <code>html/</code> každé povolené šablony a vloží řádek do <code>#__template_overrides</code> pro každý soubor override, který ještě není sledován. Stávající řádky zůstávají beze změny. Resetované řádky se znovu objeví jako odznaky 'Changes found' v administraci Šablon, takže proti nim můžete spustit kontrolní postup výše."
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_BUTTON="Resetovat všechny overrides ke kontrole"
COM_CSOVERRIDECHECKER_DASHBOARD_RESCAN_CONFIRM="Resetovat všechny overrides ke kontrole? Každý soubor override na tomto webu se znovu objeví v odznacích 'Changes found' v Šablonách, takže jej bude možné znovu vyhodnotit."

COM_CSOVERRIDECHECKER_RESCAN_SUCCESS="Sledovač overrides obnoven: vloženo %1$d řádek(ů) napříč %3$d šablonami (skenováno %2$d souborů)."
COM_CSOVERRIDECHECKER_RESCAN_ERROR="Obnovení sledovače overrides selhalo: %s"

